name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:
    inputs:
      stock_url:
        description: "Direct URL to stock ROM / stock dump archive"
        required: false
        default: ""
        type: string

      stock_dump_branch:
        description: "Stock dump branch (used when Stock URL is empty)"
        required: true
        default: "dump-redmi-spinel-os2.0.212.0.vpgmixm"
        type: string

      extract_utils_branch:
        description: "Lineage extract-utils branch"
        required: true
        default: "lineage-23.2"
        type: string

      clone_retries:
        description: "Maximum download/clone retries"
        required: true
        default: "5"
        type: string

      lfs_retries:
        description: "Maximum Git LFS retries"
        required: true
        default: "5"
        type: string

      copy_radio:
        description: "Copy device-specific radio firmware"
        required: true
        default: true
        type: boolean

      push_changes:
        description: "Commit and push generated vendor tree"
        required: true
        default: false
        type: boolean

      upload_artifact:
        description: "Upload generated vendor tree artifact"
        required: true
        default: true
        type: boolean

env:
  DEVICE: spinel
  VENDOR: xiaomi

  STOCK_DUMP_REPO: https://gitlab.com/mkpromvp/dumber-2-mk.git
  STOCK_DUMP_DIR: stock_dump

  EXTRACT_UTILS_REPO: https://github.com/LineageOS/android_tools_extract-utils.git
  EXTRACT_UTILS_DIR: extract-utils

  STAGING_ROOT: staging_android_root

  # ============================================================
  # 👇 لو عايز تستخدم رابط مباشر للاستوك حطه هنا
  # أو سيبه فاضي واستخدم خانة stock_url عند تشغيل الـ workflow
  # ============================================================
  STOCK_ROM_URL: ""

jobs:
  build-vendor:
    name: 🧬 Extract spinel Vendor Tree
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

      # ==========================================================
      # 1. WORKFLOW OPTIONS
      # ==========================================================
      - name: 📋 Show workflow options
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "🧬 spinel Vendor Tree Builder"
          echo "=========================================="

          echo "DEVICE             = $DEVICE"
          echo "VENDOR             = $VENDOR"

          echo "Stock URL input    = '${{ inputs.stock_url }}'"
          echo "Stock dump branch  = '${{ inputs.stock_dump_branch }}'"
          echo "Extract-utils      = '${{ inputs.extract_utils_branch }}'"

          echo "Clone retries      = '${{ inputs.clone_retries }}'"
          echo "LFS retries        = '${{ inputs.lfs_retries }}'"

          echo "Copy radio         = '${{ inputs.copy_radio }}'"
          echo "Push changes       = '${{ inputs.push_changes }}'"
          echo "Upload artifact    = '${{ inputs.upload_artifact }}'"

      # ==========================================================
      # 2. DEPENDENCIES
      # ==========================================================
      - name: 📦 Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            python3 \
            python3-pip \
            rsync \
            unzip \
            p7zip-full \
            wget \
            curl \
            aria2 \
            jq \
            file \
            bc \
            cpio \
            lz4 \
            zstd \
            xz-utils \
            tar

          git lfs install --skip-repo

      # ==========================================================
      # 3. GIT CONFIG
      # ==========================================================
      - name: ⚙️ Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "MKVenomPro CI"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

      # ==========================================================
      # 4. DOWNLOAD STOCK ROM / DUMP
      # ==========================================================
      - name: 📥 Prepare stock source
        shell: bash
        env:
          STOCK_URL_INPUT: ${{ inputs.stock_url }}
          STOCK_URL_ENV: ${{ env.STOCK_ROM_URL }}
          STOCK_BRANCH: ${{ inputs.stock_dump_branch }}
          RETRIES: ${{ inputs.clone_retries }}
        run: |
          set -euo pipefail

          rm -rf "$STOCK_DUMP_DIR"
          mkdir -p "$STOCK_DUMP_DIR"

          STOCK_URL="${STOCK_URL_INPUT:-$STOCK_URL_ENV}"

          # ------------------------------------------------------
          # MODE A:
          # Direct stock archive URL
          # ------------------------------------------------------
          if [[ -n "$STOCK_URL" ]]; then

            echo "=========================================="
            echo "📥 DIRECT STOCK URL MODE"
            echo "=========================================="

            echo "URL:"
            echo "$STOCK_URL"

            filename="$(basename "${STOCK_URL%%\?*}")"

            if [[ -z "$filename" || "$filename" == "/" || "$filename" == "." ]]; then
              filename="stock_source"
            fi

            output="$RUNNER_TEMP/$filename"

            echo "Downloading:"
            echo "$output"

            success=0

            for attempt in $(seq 1 "$RETRIES"); do
              echo
              echo "🔄 Download attempt $attempt/$RETRIES"

              rm -f "$output"

              if aria2c \
                --max-tries=5 \
                --retry-wait=5 \
                --timeout=60 \
                --connect-timeout=30 \
                --max-connection-per-server=8 \
                --split=8 \
                --min-split-size=10M \
                --continue=true \
                --allow-overwrite=true \
                --out="$(basename "$output")" \
                --dir="$(dirname "$output")" \
                "$STOCK_URL"; then

                success=1
                break
              fi

              sleep 5
            done

            if [[ "$success" != "1" ]]; then
              echo "❌ Failed to download stock archive"
              exit 1
            fi

            echo "✅ Download complete"

            echo
            echo "📦 Archive:"
            file "$output"

            # ----------------------------------------------------
            # Extract supported archive types
            # ----------------------------------------------------
            case "$output" in

              *.tgz|*.tar.gz)
                echo "📂 Extracting TAR.GZ..."
                tar -xzf "$output" -C "$STOCK_DUMP_DIR"
                ;;

              *.tar)
                echo "📂 Extracting TAR..."
                tar -xf "$output" -C "$STOCK_DUMP_DIR"
                ;;

              *.zip)
                echo "📂 Extracting ZIP..."
                unzip -q "$output" -d "$STOCK_DUMP_DIR"
                ;;

              *.7z)
                echo "📂 Extracting 7Z..."
                7z x "$output" "-o$STOCK_DUMP_DIR"
                ;;

              *)
                echo "❌ Unsupported stock archive:"
                echo "$output"
                exit 1
                ;;
            esac

            echo
            echo "📁 Stock source contents:"
            find "$STOCK_DUMP_DIR" -maxdepth 2 -type f | head -100

          else

            # ----------------------------------------------------
            # MODE B:
            # GitLab stock dump
            # ----------------------------------------------------
            echo "=========================================="
            echo "📥 GIT STOCK DUMP MODE"
            echo "=========================================="

            success=0

            for attempt in $(seq 1 "$RETRIES"); do

              echo
              echo "🔄 Clone attempt $attempt/$RETRIES"

              rm -rf "$STOCK_DUMP_DIR"

              if GIT_LFS_SKIP_SMUDGE=1 git clone \
                --depth=1 \
                --branch "$STOCK_BRANCH" \
                "$STOCK_DUMP_REPO" \
                "$STOCK_DUMP_DIR"; then

                success=1
                break
              fi

              echo "⚠️ Clone failed"
              sleep 10

            done

            if [[ "$success" != "1" ]]; then
              echo "❌ Unable to clone stock dump"
              exit 1
            fi

            cd "$STOCK_DUMP_DIR"

            echo "📥 Fetching Git LFS objects..."

            lfs_success=0

            for attempt in $(seq 1 "${{ inputs.lfs_retries }}"); do

              echo
              echo "🔄 LFS attempt $attempt/${{ inputs.lfs_retries }}"

              if git lfs fetch --all && git lfs checkout; then
                lfs_success=1
                break
              fi

              sleep 10
            done

            if [[ "$lfs_success" != "1" ]]; then
              echo "❌ Git LFS failed"
              exit 1
            fi

            cd "$GITHUB_WORKSPACE"

          fi

      # ==========================================================
      # 5. LOCATE PROPRIETARY FILE LIST
      # ==========================================================
      - name: 🔎 Locate proprietary-files.txt
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching stock source..."

          mapfile -t LISTS < <(
            find "$STOCK_DUMP_DIR" \
              -type f \
              -name "proprietary-files.txt" \
              -print
          )

          if [[ "${#LISTS[@]}" -eq 0 ]]; then
            echo "❌ proprietary-files.txt not found"
            exit 1
          fi

          echo "Found:"
          printf '%s\n' "${LISTS[@]}"

          SOURCE_LIST="${LISTS[0]}"

          echo "SOURCE_LIST=$SOURCE_LIST" >> "$GITHUB_ENV"

          cp "$SOURCE_LIST" proprietary-files.original.txt

      # ==========================================================
      # 6. NORMALIZE PROPRIETARY LIST
      # ==========================================================
      - name: 🧹 Normalize proprietary list
        shell: bash
        run: |
          set -euo pipefail

          test -f "$SOURCE_LIST"

          awk '
          {
            line=$0

            # Keep comments
            if (line ~ /^[[:space:]]*#/) {
              print line
              next
            }

            # Remove leading "-"
            sub(/^[[:space:]]*-/, "", line)

            # Remove leading spaces
            sub(/^[[:space:]]+/, "", line)

            # Skip empty
            if (line == "")
              next

            # Block unsupported Android partitions
            if (line ~ /^system\//)
              next

            if (line ~ /^system_ext\//)
              next

            if (line ~ /^product\//)
              next

            if (line ~ /^vendor_dlkm\//)
              next

            if (line ~ /^odm_dlkm\//)
              next

            if (line ~ /^mi_ext\//)
              next

            # Known unsupported VINTF files
            if (line == "vendor/odm/etc/vintf/manifest_nonfc_dsds.xml")
              next

            if (line == "vendor/odm/etc/vintf/manifest_nonfc_ss.xml")
              next

            # Fix iwpriv path
            if (line == "bin/iwpriv") {
              print "vendor/bin/iwpriv"
              next
            }

            print line
          }
          ' "$SOURCE_LIST" > proprietary-files.txt

          echo
          echo "📊 Normalized list:"
          grep -vE '^[[:space:]]*#|^[[:space:]]*$' proprietary-files.txt | wc -l

          echo
          echo "🚫 Blocked partitions:"
          grep -E '^(system|system_ext|product|vendor_dlkm|odm_dlkm|mi_ext)/' \
            proprietary-files.txt || true

      # ==========================================================
      # 7. VALIDATE SOURCE FILES
      # ==========================================================
      - name: 🔍 Validate stock source
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          total=0

          while IFS= read -r entry; do

            [[ -z "$entry" ]] && continue
            [[ "$entry" == \#* ]] && continue

            # Strip optional destination/hash syntax
            src="${entry%%:*}"
            src="${src%%|*}"

            # Ignore absolute paths
            src="${src#/}"

            total=$((total + 1))

            if ! find "$STOCK_DUMP_DIR" \
              -type f \
              -path "*/$src" \
              -print -quit | grep -q .; then

              echo "❌ MISSING: $src"
              missing=$((missing + 1))
            fi

          done < proprietary-files.txt

          echo
          echo "Total entries : $total"
          echo "Missing       : $missing"

          if [[ "$missing" -ne 0 ]]; then
            echo "❌ Missing source files detected"
            exit 1
          fi

          echo "✅ All source files exist"

      # ==========================================================
      # 8. CLONE EXTRACT UTILS
      # ==========================================================
      - name: 🧰 Clone Lineage extract-utils
        shell: bash
        env:
          EXTRACT_BRANCH: ${{ inputs.extract_utils_branch }}
        run: |
          set -euo pipefail

          rm -rf "$EXTRACT_UTILS_DIR"

          git clone \
            --depth=1 \
            --branch "$EXTRACT_BRANCH" \
            "$EXTRACT_UTILS_REPO" \
            "$EXTRACT_UTILS_DIR"

          echo "Extract-utils:"
          git -C "$EXTRACT_UTILS_DIR" rev-parse HEAD

      # ==========================================================
      # 9. VERIFY EXTRACT UTILS
      # ==========================================================
      - name: 🧪 Verify extract-utils
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import sys

          sys.path.insert(0, "extract-utils")

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print("✅ ExtractUtils import OK")
          print("ExtractUtils:", ExtractUtils)
          print("ExtractUtilsModule:", ExtractUtilsModule)
          PY

      # ==========================================================
      # 10. PREPARE STAGING ANDROID ROOT
      # ==========================================================
      - name: 🏗️ Prepare staging Android root
        shell: bash
        run: |
          set -euo pipefail

          WORK_PARENT="$GITHUB_WORKSPACE/$STAGING_ROOT"

          rm -rf "$WORK_PARENT"

          mkdir -p \
            "$WORK_PARENT/device/xiaomi/spinel" \
            "$WORK_PARENT/tools/extract-utils"

          echo "WORK_PARENT=$WORK_PARENT" >> "$GITHUB_ENV"

          echo
          echo "WORK_PARENT=$WORK_PARENT"

      # ==========================================================
      # 11. COPY DEVICE FILES INTO STAGING
      # ==========================================================
      - name: 📱 Prepare device tree
        shell: bash
        run: |
          set -euo pipefail

          cp proprietary-files.txt \
            "$WORK_PARENT/device/xiaomi/spinel/proprietary-files.txt"

          cat > "$WORK_PARENT/device/xiaomi/spinel/extract-files.py" <<'PY'
          #!/usr/bin/env python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=True,
              add_firmware_proprietary_file=False,
          )

          utils = ExtractUtils.device(module)

          if __name__ == "__main__":
              utils.run()
          PY

          chmod +x \
            "$WORK_PARENT/device/xiaomi/spinel/extract-files.py"

      # ==========================================================
      # 12. PHYSICALLY COPY EXTRACT-UTILS
      # ==========================================================
      - name: 📦 Install extract-utils into staging root
        shell: bash
        run: |
          set -euo pipefail

          # IMPORTANT:
          # DO NOT SYMLINK extract-utils.
          #
          # tools.py uses realpath(__file__) and calculates the
          # Android root from the physical location.
          #
          # Therefore it MUST physically exist here:
          #
          # staging_android_root/tools/extract-utils
          #

          rm -rf "$WORK_PARENT/tools/extract-utils"

          mkdir -p "$WORK_PARENT/tools/extract-utils"

          cp -a \
            "$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR/." \
            "$WORK_PARENT/tools/extract-utils/"

          echo "Extract-utils copied physically."

      # ==========================================================
      # 13. VERIFY ANDROID ROOT CALCULATION
      # ==========================================================
      - name: 🧪 Verify extract-utils Android root
        shell: bash
        run: |
          set -euo pipefail

          cd "$WORK_PARENT"

          export PYTHONPATH="$WORK_PARENT/tools/extract-utils"

          python3 - <<'PY'
          import os

          from extract_utils.tools import android_root

          expected = os.path.realpath(os.getcwd())
          actual = os.path.realpath(android_root)

          print("EXPECTED_ANDROID_ROOT=" + expected)
          print("CALCULATED_ANDROID_ROOT=" + actual)

          if actual != expected:
              raise SystemExit(
                  f"Android root mismatch: expected {expected}, got {actual}"
              )

          print("✅ Android root calculation is correct")
          PY

      # ==========================================================
      # 14. RUN EXTRACTION
      # ==========================================================
      - name: 🧬 Extract proprietary blobs
        shell: bash
        run: |
          set -euo pipefail

          cd "$WORK_PARENT"

          export PYTHONPATH="$WORK_PARENT/tools/extract-utils"

          echo "=========================================="
          echo "🧬 RUNNING EXTRACTION"
          echo "=========================================="

          python3 \
            "$WORK_PARENT/device/xiaomi/spinel/extract-files.py" \
            "$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"

      # ==========================================================
      # 15. INSPECT GENERATED TREE
      # ==========================================================
      - name: 🔎 Inspect generated tree
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated files:"

          find "$WORK_PARENT/device/xiaomi/spinel" \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -300

          echo
          echo "Generated directories:"

          find "$WORK_PARENT/device/xiaomi/spinel" \
            -maxdepth 4 \
            -type d \
            | sort

      # ==========================================================
      # 16. RESTORE VINTF FILES
      # ==========================================================
      - name: 🛠️ Restore special VINTF manifests
        shell: bash
        run: |
          set -euo pipefail

          DEST="$WORK_PARENT/device/xiaomi/spinel/proprietary/odm/etc/vintf"

          mkdir -p "$DEST"

          found_dsds=""
          found_ss=""

          while IFS= read -r file; do
            if [[ "$(basename "$file")" == "manifest_nonfc_dsds.xml" ]]; then
              found_dsds="$file"
            fi

            if [[ "$(basename "$file")" == "manifest_nonfc_ss.xml" ]]; then
              found_ss="$file"
            fi
          done < <(
            find "$STOCK_DUMP_DIR" \
              -type f \
              \( \
                -name "manifest_nonfc_dsds.xml" \
                -o \
                -name "manifest_nonfc_ss.xml" \
              \)
          )

          if [[ -n "$found_dsds" ]]; then
            cp "$found_dsds" "$DEST/manifest_nonfc_dsds.xml"
            echo "✅ Restored manifest_nonfc_dsds.xml"
          else
            echo "⚠️ manifest_nonfc_dsds.xml not found"
          fi

          if [[ -n "$found_ss" ]]; then
            cp "$found_ss" "$DEST/manifest_nonfc_ss.xml"
            echo "✅ Restored manifest_nonfc_ss.xml"
          else
            echo "⚠️ manifest_nonfc_ss.xml not found"
          fi

      # ==========================================================
      # 17. ADD MANUAL VINTF COPY RULES
      # ==========================================================
      - name: 🧩 Add VINTF make rules
        shell: bash
        run: |
          set -euo pipefail

          MK="$WORK_PARENT/device/xiaomi/spinel/spinel-vendor.mk"

          if [[ ! -f "$MK" ]]; then
            echo "❌ spinel-vendor.mk not generated"
            exit 1
          fi

          cat >> "$MK" <<'EOF'

          # Manually restored ODM VINTF manifests.
          PRODUCT_COPY_FILES += \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_dsds.xml \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_ss.xml
          EOF

          echo "✅ VINTF rules added"

      # ==========================================================
      # 18. COPY RADIO FIRMWARE
      # ==========================================================
      - name: 📻 Copy radio firmware
        if: ${{ inputs.copy_radio }}
        shell: bash
        run: |
          set -euo pipefail

          DEST="$WORK_PARENT/device/xiaomi/spinel/radio"

          mkdir -p "$DEST"

          echo "Searching for spinel radio firmware..."

          files=(
            dpm.img
            gz.img
            lk.img
            mcupm.img
            md1img.img
            pi_img.img
            scp.img
            spmfw.img
            sspm.img
            tee.img
          )

          copied=0

          for name in "${files[@]}"; do

            src="$(
              find "$STOCK_DUMP_DIR" \
                -type f \
                -name "$name" \
                -print \
                -quit
            )"

            if [[ -n "$src" ]]; then
              cp "$src" "$DEST/$name"
              echo "✅ $name"
              copied=$((copied + 1))
            else
              echo "⚠️ $name not found"
            fi

          done

          echo
          echo "Radio files copied: $copied"

      # ==========================================================
      # 19. VALIDATE GENERATED TREE
      # ==========================================================
      - name: ✅ Validate generated vendor tree
        shell: bash
        run: |
          set -euo pipefail

          TREE="$WORK_PARENT/device/xiaomi/spinel"

          test -f "$TREE/Android.bp"
          test -f "$TREE/Android.mk"
          test -f "$TREE/BoardConfigVendor.mk"
          test -f "$TREE/spinel-vendor.mk"
          test -f "$TREE/proprietary-files.txt"

          test -d "$TREE/proprietary"

          echo "=========================================="
          echo "✅ GENERATED TREE VALID"
          echo "=========================================="

          echo
          echo "Top-level files:"
          find "$TREE" -maxdepth 1 -type f -printf '%f\n' | sort

          echo
          echo "Proprietary size:"
          du -sh "$TREE/proprietary"

      # ==========================================================
      # 20. FLATTEN TREE INTO REPOSITORY ROOT
      # ==========================================================
      - name: 📂 Flatten vendor tree
        shell: bash
        run: |
          set -euo pipefail

          SRC="$WORK_PARENT/device/xiaomi/spinel"
          ROOT="$GITHUB_WORKSPACE"

          echo "Source:"
          echo "$SRC"

          echo
          echo "Destination:"
          echo "$ROOT"

          mkdir -p "$ROOT/proprietary"

          # Copy everything except temporary GitHub staging data.
          rsync -a \
            --exclude ".git/" \
            "$SRC/" \
            "$ROOT/"

          # Ensure proprietary contents are directly under repo root.
          if [[ -d "$SRC/proprietary" ]]; then
            rsync -a \
              "$SRC/proprietary/" \
              "$ROOT/proprietary/"
          fi

          echo
          echo "Repository tree:"
          find "$ROOT" \
            -maxdepth 2 \
            -type d \
            | sort

      # ==========================================================
      # 21. FINAL VALIDATION
      # ==========================================================
      - name: 🔬 Final repository validation
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "🔬 FINAL VALIDATION"
          echo "=========================================="

          test -f Android.bp
          test -f Android.mk
          test -f BoardConfigVendor.mk
          test -f spinel-vendor.mk
          test -f proprietary-files.txt

          test -d proprietary

          if [[ -d vendor/xiaomi/spinel ]]; then
            echo "❌ Nested vendor/xiaomi/spinel detected"
            exit 1
          fi

          if grep -nE \
            '^(system|system_ext|product|vendor_dlkm|odm_dlkm|mi_ext)/' \
            proprietary-files.txt; then

            echo "❌ Forbidden partition entries remain"
            exit 1
          fi

          if grep -n \
            'bin/iwpriv' \
            proprietary-files.txt; then

            echo "❌ Old iwpriv path remains"
            exit 1
          fi

          if grep -n \
            'manifest_nonfc_' \
            proprietary-files.txt; then

            echo "❌ VINTF manifests remain in proprietary-files.txt"
            exit 1
          fi

          echo
          echo "📊 Final proprietary file count:"
          grep -vE \
            '^[[:space:]]*#|^[[:space:]]*$' \
            proprietary-files.txt \
            | wc -l

          echo
          echo "💾 Repository size:"
          du -sh .

          echo
          echo "✅ FINAL VALIDATION PASSED"

      # ==========================================================
      # 22. CLEAN TEMPORARY FILES
      # ==========================================================
      - name: 🧹 Cleanup
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$STOCK_DUMP_DIR" \
            "$EXTRACT_UTILS_DIR" \
            "$STAGING_ROOT" \
            proprietary-files.original.txt

          echo "✅ Temporary files removed"

      # ==========================================================
      # 23. GIT STATUS
      # ==========================================================
      - name: 📊 Git status
        shell: bash
        run: |
          set -euo pipefail

          git status --short

          echo
          echo "Changed files:"
          git diff --stat

      # ==========================================================
      # 24. COMMIT + PUSH
      # ==========================================================
      - name: 🚀 Commit and push
        if: ${{ inputs.push_changes }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Current branch:"
          echo "$GITHUB_REF_NAME"

          if [[ "$GITHUB_REF_NAME" != "lineage-23.2" ]]; then
            echo "❌ Refusing to push outside lineage-23.2"
            exit 1
          fi

          git add \
            Android.bp \
            Android.mk \
            BoardConfigVendor.mk \
            spinel-vendor.mk \
            proprietary-files.txt \
            proprietary \
            radio \
            .github

          if git diff --cached --quiet; then
            echo "ℹ️ Nothing to commit"
            exit 0
          fi

          git commit \
            -m "vendor: generate spinel proprietary blobs"

          git push \
            origin \
            "HEAD:lineage-23.2"

      # ==========================================================
      # 25. ARTIFACT
      # ==========================================================
      - name: 📦 Package vendor tree
        if: ${{ inputs.upload_artifact }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/vendor_artifact"

          tar \
            --exclude=".git" \
            --exclude="$STOCK_DUMP_DIR" \
            --exclude="$EXTRACT_UTILS_DIR" \
            --exclude="$STAGING_ROOT" \
            -czf \
            "$RUNNER_TEMP/spinel-vendor-tree.tar.gz" \
            .

          echo "Artifact:"
          ls -lh "$RUNNER_TEMP/spinel-vendor-tree.tar.gz"

      # ==========================================================
      # 26. UPLOAD ARTIFACT
      # ==========================================================
      - name: ⬆️ Upload vendor artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree
          path: ${{ runner.temp }}/spinel-vendor-tree.tar.gz
          if-no-files-found: error
          retention-days: 14

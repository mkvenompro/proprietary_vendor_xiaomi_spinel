name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  generate-vendor:
    name: 🧬 Generate LineageOS Vendor Tree
    runs-on: ubuntu-24.04

    env:
      DEVICE: spinel
      VENDOR: xiaomi
      DUMBER_REPO: https://gitlab.com/mkpromvp/dumber-2-mk.git
      DUMBER_BRANCH: dump-redmi-spinel-os2.0.212.0.vpgmixm
      EXTRACT_UTILS_REPO: https://github.com/LineageOS/android_tools_extract-utils.git
      EXTRACT_UTILS_BRANCH: lineage-23.2

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: 📥 Checkout vendor repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================

      - name: 🧰 Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            python3 \
            python3-pip \
            rsync \
            file \
            unzip \
            zip \
            cpio \
            lz4 \
            xz-utils \
            zstd \
            bc \
            bison \
            flex \
            build-essential

          git lfs install

          echo "===== VERSIONS ====="
          python3 --version
          git --version
          git-lfs --version

      # ============================================================
      # 3. CLEAN WORKSPACE
      # ============================================================

      - name: 🧹 Clean workspace
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf extract_tree
          rm -rf stock_dump
          rm -rf generated_vendor
          rm -rf reports

          mkdir -p extract_tree
          mkdir -p stock_dump
          mkdir -p generated_vendor
          mkdir -p reports

      # ============================================================
      # 4. CLONE STOCK DUMP
      # ============================================================

      - name: 📦 Clone stock dump
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${DUMBER_BRANCH}" \
            "${DUMBER_REPO}" \
            stock_dump

          cd stock_dump

          git lfs install
          git lfs pull

          echo
          echo "===== DUMBER COMMIT ====="
          git rev-parse HEAD

          echo
          echo "===== DUMBER BRANCH ====="
          git branch --show-current

          echo
          echo "===== DUMBER SIZE ====="
          du -sh .

      # ============================================================
      # 5. VERIFY STOCK DUMP
      # ============================================================

      - name: 🔎 Verify stock dump
        shell: bash
        run: |
          set -euxo pipefail

          test -d stock_dump/vendor
          test -d stock_dump/vendor_dlkm
          test -d stock_dump/odm_dlkm
          test -f stock_dump/proprietary-files.txt

          echo "===== STOCK DUMP ROOT ====="
          find stock_dump \
            -maxdepth 1 \
            -mindepth 1 \
            -printf '%f\n' \
            | sort

          echo
          echo "===== PROPRIETARY FILE COUNT ====="
          wc -l stock_dump/proprietary-files.txt

          echo
          echo "===== README ====="
          head -60 stock_dump/README.md || true

      # ============================================================
      # 6. CLONE LINEAGE EXTRACT UTILS
      # ============================================================

      - name: 🧬 Clone Lineage extract-utils
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p extract_tree/tools

          git clone \
            --depth=1 \
            --branch "${EXTRACT_UTILS_BRANCH}" \
            "${EXTRACT_UTILS_REPO}" \
            extract_tree/tools/extract-utils

          echo
          echo "===== EXTRACT UTILS COMMIT ====="
          git -C extract_tree/tools/extract-utils rev-parse HEAD

          echo
          echo "===== EXTRACT UTILS FILES ====="
          find extract_tree/tools/extract-utils/extract_utils \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      # ============================================================
      # 7. CREATE DEVICE TREE
      # ============================================================

      - name: 📁 Create extraction tree
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            extract_tree/device/xiaomi/spinel \
            extract_tree/vendor/xiaomi/spinel

      # ============================================================
      # 8. COPY ORIGINAL PROPRIETARY FILES
      # ============================================================

      - name: 📋 Copy original proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            stock_dump/proprietary-files.txt \
            extract_tree/device/xiaomi/spinel/proprietary-files.original.txt

          echo "Original entries:"
          wc -l \
            extract_tree/device/xiaomi/spinel/proprietary-files.original.txt

      # ============================================================
      # 9. CLEAN PROPRIETARY LIST USING PYTHON
      #
      # IMPORTANT:
      #
      # Dumber's "-" means "package" to extract-utils.
      #
      # We intentionally remove ALL leading "-" markers.
      #
      # extract-utils with check_elf=True will automatically classify:
      #   *.apk
      #   *.jar
      #   *.apex
      #   *.so
      #   binaries
      #
      # correctly.
      #
      # system/system_ext/product are not part of vendor tree.
      # ============================================================

      - name: 🧹 Normalize proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          stock = Path("stock_dump")
          original = Path(
              "extract_tree/device/xiaomi/spinel/"
              "proprietary-files.original.txt"
          )
          output = Path(
              "extract_tree/device/xiaomi/spinel/"
              "proprietary-files.txt"
          )

          report_dir = Path("reports")
          report_dir.mkdir(parents=True, exist_ok=True)

          removed_system = []
          removed_missing = []
          removed_invalid = []
          kept = []

          for raw in original.read_text(
              encoding="utf-8",
              errors="replace"
          ).splitlines():

              line = raw.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              # --------------------------------------------------
              # REMOVE ALL LINEAGE PACKAGE MARKERS
              # --------------------------------------------------

              while line.startswith("-"):
                  line = line[1:]

              line = line.strip()

              if not line:
                  continue

              # --------------------------------------------------
              # REMOVE SHA1
              # --------------------------------------------------

              path_part = line.split("|", 1)[0]

              # --------------------------------------------------
              # SOURCE / DESTINATION
              # --------------------------------------------------

              source = path_part.split(":", 1)[0].lstrip("/")
              destination = (
                  path_part.split(":", 1)[1].lstrip("/")
                  if ":" in path_part
                  else source
              )

              if not source:
                  removed_invalid.append(raw)
                  continue

              # --------------------------------------------------
              # REMOVE SYSTEM PARTITIONS
              # --------------------------------------------------

              top = source.split("/", 1)[0]

              if top in {
                  "system",
                  "system_ext",
                  "product",
              }:
                  removed_system.append(source)
                  continue

              # --------------------------------------------------
              # REMOVE KNOWN STOCK-ONLY SETTINGS
              # --------------------------------------------------

              if source == (
                  "system_ext/priv-app/Settings/Settings.apk"
              ):
                  removed_system.append(source)
                  continue

              # --------------------------------------------------
              # SOURCE MUST EXIST
              # --------------------------------------------------

              source_path = stock / source

              if not source_path.exists():
                  removed_missing.append(source)
                  continue

              # --------------------------------------------------
              # KEEP WITHOUT LEADING "-"
              #
              # Preserve SHA1 if present.
              # Preserve destination if present.
              # --------------------------------------------------

              kept.append(line)

          # Remove exact duplicate destinations while preserving order.
          final_lines = []
          seen_destinations = set()

          for line in kept:
              path_part = line.split("|", 1)[0]

              if ":" in path_part:
                  src, dst = path_part.split(":", 1)
                  dst = dst.lstrip("/")
              else:
                  src = path_part
                  dst = path_part

              dst = dst.lstrip("/")

              if dst in seen_destinations:
                  continue

              seen_destinations.add(dst)
              final_lines.append(line)

          output.write_text(
              "\n".join(final_lines) + "\n",
              encoding="utf-8"
          )

          Path(
              "reports/removed-system.txt"
          ).write_text(
              "\n".join(removed_system) + (
                  "\n" if removed_system else ""
              ),
              encoding="utf-8"
          )

          Path(
              "reports/removed-missing.txt"
          ).write_text(
              "\n".join(removed_missing) + (
                  "\n" if removed_missing else ""
              ),
              encoding="utf-8"
          )

          Path(
              "reports/removed-invalid.txt"
          ).write_text(
              "\n".join(removed_invalid) + (
                  "\n" if removed_invalid else ""
              ),
              encoding="utf-8"
          )

          Path(
              "reports/proprietary-final.txt"
          ).write_text(
              "\n".join(final_lines) + "\n",
              encoding="utf-8"
          )

          report = f"""
          ==========================================
          PROPRIETARY FILE CLEANUP
          ==========================================

          Original:
            {len(original.read_text(encoding="utf-8", errors="replace").splitlines())}

          Kept:
            {len(final_lines)}

          Removed system/product/system_ext:
            {len(removed_system)}

          Removed missing:
            {len(removed_missing)}

          Removed invalid:
            {len(removed_invalid)}

          Removed duplicate destinations:
            {len(kept) - len(final_lines)}

          ==========================================
          """

          Path(
              "reports/proprietary-cleanup.txt"
          ).write_text(
              report,
              encoding="utf-8"
          )

          print(report)

          print("===== FIRST 50 FINAL ENTRIES =====")

          for line in final_lines[:50]:
              print(line)

          print()
          print("===== REMOVED SYSTEM COUNT =====")
          print(len(removed_system))

          print()
          print("===== REMOVED MISSING COUNT =====")
          print(len(removed_missing))

          print()
          print("===== FINAL COUNT =====")
          print(len(final_lines))
          PY

      # ============================================================
      # 10. STRICT PROPRIETARY LIST SANITY CHECK
      # ============================================================

      - name: 🧪 Validate proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          FILE="extract_tree/device/xiaomi/spinel/proprietary-files.txt"

          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "extract_tree/device/xiaomi/spinel/"
              "proprietary-files.txt"
          )

          bad_markers = []
          bad_partitions = []
          missing = []

          for number, raw in enumerate(
              file.read_text(
                  encoding="utf-8",
                  errors="replace"
              ).splitlines(),
              1
          ):
              line = raw.strip()

              if not line or line.startswith("#"):
                  continue

              if line.startswith("-"):
                  bad_markers.append(
                      f"{number}: {line}"
                  )

              path_part = line.split("|", 1)[0]
              source = path_part.split(":", 1)[0].lstrip("/")

              top = source.split("/", 1)[0]

              if top in {
                  "system",
                  "system_ext",
                  "product",
              }:
                  bad_partitions.append(
                      f"{number}: {line}"
                  )

              if not Path("stock_dump", source).exists():
                  missing.append(
                      f"{number}: {source}"
                  )

          print(
              "Leading '-' entries:",
              len(bad_markers)
          )

          print(
              "Forbidden system/product entries:",
              len(bad_partitions)
          )

          print(
              "Missing source entries:",
              len(missing)
          )

          if bad_markers:
              print("ERROR: leading '-' still exists:")
              print("\n".join(bad_markers[:100]))
              raise SystemExit(1)

          if bad_partitions:
              print(
                  "ERROR: system/product/system_ext "
                  "entries still exist:"
              )
              print("\n".join(bad_partitions[:100]))
              raise SystemExit(1)

          if missing:
              print("ERROR: missing sources:")
              print("\n".join(missing[:100]))
              raise SystemExit(1)

          print()
          print("==========================================")
          print("PROPRIETARY LIST VALIDATION: PASS")
          print("==========================================")
          PY

      # ============================================================
      # 11. CREATE extract-files.py
      # ============================================================

      - name: 🐍 Create extract-files.py
        shell: bash
        run: |
          set -euxo pipefail

          cat > extract_tree/device/xiaomi/spinel/extract-files.py <<'PY'
          #!/usr/bin/env python3

          from extract_utils import ExtractUtils
          from extract_utils.module import ExtractUtilsModule

          DEVICE = "spinel"
          VENDOR = "xiaomi"

          module = ExtractUtilsModule(
              DEVICE,
              VENDOR,
              check_elf=True,
          )

          ExtractUtils.device(module).run()
          PY

          chmod +x \
            extract_tree/device/xiaomi/spinel/extract-files.py

          echo "===== extract-files.py ====="
          cat \
            extract_tree/device/xiaomi/spinel/extract-files.py

      # ============================================================
      # 12. TEST EXTRACT UTILS IMPORT
      # ============================================================

      - name: 🧪 Test extract-utils imports
        working-directory: extract_tree
        shell: bash
        run: |
          set -euxo pipefail

          export PYTHONPATH="$PWD/tools/extract-utils"

          python3 - <<'PY'
          from extract_utils import ExtractUtils
          from extract_utils.module import ExtractUtilsModule

          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=True,
          )

          print("ExtractUtils import: OK")
          print("ExtractUtilsModule import: OK")
          print("Device:", module.device)
          print("Vendor:", module.vendor)
          print("check_elf:", module.check_elf)
          PY

      # ============================================================
      # 13. DRY-RUN PARSE PROPRIETARY LIST
      #
      # This catches extract-utils parser problems BEFORE extraction.
      # ============================================================

      - name: 🧪 Dry-run proprietary parser
        working-directory: extract_tree
        shell: bash
        run: |
          set -euxo pipefail

          export PYTHONPATH="$PWD/tools/extract-utils"

          python3 - <<'PY'
          from pathlib import Path

          from extract_utils.file import FileList

          path = Path(
              "device/xiaomi/spinel/proprietary-files.txt"
          )

          file_list = FileList(
              check_elf=True
          )

          file_list.add_from_file(str(path))

          print("===== EXTRACT-UTILS PARSER TEST =====")
          print("All files:", len(list(file_list.all_files)))
          print("Package files:", len(list(file_list.package_files)))
          print("Copy files:", len(list(file_list.copy_files)))
          print("Boot jars:", len(list(file_list.boot_jars)))
          print("Symlinks:", len(list(file_list.package_symlinks)))

          print()
          print("Parser: PASS")
          PY

      # ============================================================
      # 14. RUN EXTRACTION
      # ============================================================

      - name: 🧬 Extract proprietary blobs
        working-directory: extract_tree
        shell: bash
        run: |
          set -euxo pipefail

          export PYTHONPATH="$PWD/tools/extract-utils"

          cd device/xiaomi/spinel

          echo "=========================================="
          echo "STARTING EXTRACTION"
          echo "=========================================="

          python3 extract-files.py ../../../../stock_dump

          echo
          echo "=========================================="
          echo "EXTRACTION FINISHED"
          echo "=========================================="

      # ============================================================
      # 15. VERIFY GENERATED FILES
      # ============================================================

      - name: 🔎 Verify generated vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          test -d \
            extract_tree/vendor/xiaomi/spinel

          test -d \
            extract_tree/vendor/xiaomi/spinel/proprietary

          test -f \
            extract_tree/vendor/xiaomi/spinel/Android.bp

          test -f \
            extract_tree/vendor/xiaomi/spinel/Android.mk

          test -f \
            extract_tree/vendor/xiaomi/spinel/BoardConfigVendor.mk

          test -f \
            extract_tree/vendor/xiaomi/spinel/spinel-vendor.mk

          echo "=========================================="
          echo "GENERATED VENDOR TREE: PASS"
          echo "=========================================="

          echo
          echo "===== TOP LEVEL ====="

          find extract_tree/vendor/xiaomi/spinel \
            -maxdepth 2 \
            -type f \
            | sort

      # ============================================================
      # 16. GENERATED TREE STATS
      # ============================================================

      - name: 📊 Generate vendor tree statistics
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="extract_tree/vendor/xiaomi/spinel/proprietary"

          find "$ROOT" \
            -type f \
            | sort \
            > reports/generated-files.txt

          FILE_COUNT=$(wc -l < reports/generated-files.txt)
          SIZE=$(du -sh "$ROOT" | cut -f1)

          {
            echo "=========================================="
            echo "GENERATED VENDOR TREE"
            echo "=========================================="
            echo
            echo "Files: $FILE_COUNT"
            echo "Size:  $SIZE"
            echo
            echo "Directories:"
            find "$ROOT" -type d | wc -l
          } | tee reports/generated-stats.txt

      # ============================================================
      # 17. AUDIT DUPLICATE SOURCE PATHS
      # ============================================================

      - name: 🔍 Audit duplicate source paths
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter

          path = Path(
              "extract_tree/device/xiaomi/spinel/"
              "proprietary-files.txt"
          )

          sources = []

          for raw in path.read_text(
              encoding="utf-8",
              errors="replace"
          ).splitlines():

              line = raw.strip()

              if not line or line.startswith("#"):
                  continue

              line = line.lstrip("-")

              path_part = line.split("|", 1)[0]
              source = path_part.split(":", 1)[0]

              sources.append(source)

          counts = Counter(sources)

          duplicates = {
              key: value
              for key, value in counts.items()
              if value > 1
          }

          out = Path(
              "reports/duplicate-source-paths.txt"
          )

          with out.open(
              "w",
              encoding="utf-8"
          ) as f:
              for key, value in sorted(
                  duplicates.items(),
                  key=lambda x: (-x[1], x[0])
              ):
                  f.write(f"{value} {key}\n")

          print(
              "Duplicate source paths:",
              len(duplicates)
          )
          PY

      # ============================================================
      # 18. AUDIT IDENTICAL CONTENT
      # ============================================================

      - name: 🔐 Audit identical blob contents
        shell: bash
        run: |
          set -euxo pipefail

          find \
            extract_tree/vendor/xiaomi/spinel/proprietary \
            -type f \
            -print0 \
            | xargs -0 sha256sum \
            | sort -k1,1 \
            > reports/blob-sha256.txt

          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict

          groups = defaultdict(list)

          for line in Path(
              "reports/blob-sha256.txt"
          ).read_text(
              encoding="utf-8"
          ).splitlines():

              if not line.strip():
                  continue

              sha, filename = line.split(
                  "  ",
                  1
              )

              groups[sha].append(filename)

          with Path(
              "reports/identical-content.txt"
          ).open(
              "w",
              encoding="utf-8"
          ) as f:

              for sha, files in sorted(groups.items()):
                  if len(files) > 1:
                      f.write(
                          f"{sha}\n"
                          + "\n".join(
                              f"  {x}" for x in files
                          )
                          + "\n\n"
                      )

          print(
              "Identical content groups:",
              sum(
                  1
                  for files in groups.values()
                  if len(files) > 1
              )
          )
          PY

      # ============================================================
      # 19. ELF AUDIT
      # ============================================================

      - name: 🧪 Audit ELF files
        shell: bash
        run: |
          set -euxo pipefail

          : > reports/elf-files.txt

          while IFS= read -r -d '' file; do
            if file "$file" | grep -q "ELF"; then
              echo "$file" >> reports/elf-files.txt
            fi
          done < <(
            find \
              extract_tree/vendor/xiaomi/spinel/proprietary \
              -type f \
              -print0
          )

          echo "ELF files:"
          wc -l < reports/elf-files.txt

      # ============================================================
      # 20. SYMLINK AUDIT
      # ============================================================

      - name: 🔗 Audit symlinks
        shell: bash
        run: |
          set -euxo pipefail

          find \
            extract_tree/vendor/xiaomi/spinel \
            -type l \
            -printf '%p -> %l\n' \
            | sort \
            > reports/symlinks.txt

          echo "Symlinks:"
          cat reports/symlinks.txt || true

      # ============================================================
      # 21. VERIFY PROPRIETARY OUTPUT
      # ============================================================

      - name: ✅ Verify every proprietary entry exists
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          list_file = Path(
              "extract_tree/device/xiaomi/spinel/"
              "proprietary-files.txt"
          )

          root = Path(
              "extract_tree/vendor/xiaomi/spinel/"
              "proprietary"
          )

          missing = []

          for number, raw in enumerate(
              list_file.read_text(
                  encoding="utf-8",
                  errors="replace"
              ).splitlines(),
              1
          ):
              line = raw.strip()

              if not line or line.startswith("#"):
                  continue

              line = line.lstrip("-")

              path_part = line.split("|", 1)[0]

              if ":" in path_part:
                  source, destination = path_part.split(
                      ":",
                      1
                  )
              else:
                  source = path_part
                  destination = path_part

              destination = destination.lstrip("/")

              target = root / destination

              if not target.exists():
                  missing.append(
                      f"{number}: "
                      f"{source} -> {destination}"
                  )

          report = Path(
              "reports/unextracted.txt"
          )

          report.write_text(
              "\n".join(missing) + (
                  "\n" if missing else ""
              ),
              encoding="utf-8"
          )

          print(
              "Unextracted entries:",
              len(missing)
          )

          if missing:
              print()
              print(
                  "ERROR: generated vendor tree "
                  "is missing entries:"
              )
              print(
                  "\n".join(missing[:200])
              )
              raise SystemExit(1)

          print()
          print(
              "ALL PROPRIETARY ENTRIES GENERATED: PASS"
          )
          PY

      # ============================================================
      # 22. PREPARE FINAL VENDOR TREE
      # ============================================================

      - name: 📦 Prepare final vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf generated_vendor

          mkdir -p generated_vendor

          rsync -a \
            extract_tree/vendor/xiaomi/spinel/ \
            generated_vendor/

          echo "===== FINAL VENDOR SIZE ====="
          du -sh generated_vendor

          echo
          echo "===== FINAL VENDOR FILE COUNT ====="
          find generated_vendor \
            -type f \
            | wc -l

      # ============================================================
      # 23. FINAL REPORT
      # ============================================================

      - name: 📝 Generate final report
        shell: bash
        run: |
          set -euxo pipefail

          {
            echo "=========================================="
            echo "MKVenomPro • spinel Vendor Tree"
            echo "=========================================="
            echo
            echo "Device: ${DEVICE}"
            echo "Vendor: ${VENDOR}"
            echo "Dumber branch: ${DUMBER_BRANCH}"
            echo "Extract utils: ${EXTRACT_UTILS_BRANCH}"
            echo
            echo "===== CLEANUP ====="
            cat reports/proprietary-cleanup.txt
            echo
            echo "===== GENERATED STATS ====="
            cat reports/generated-stats.txt
            echo
            echo "===== DUPLICATE SOURCES ====="
            cat reports/duplicate-source-paths.txt || true
            echo
            echo "===== IDENTICAL CONTENT ====="
            cat reports/identical-content.txt || true
            echo
            echo "===== SYMLINKS ====="
            cat reports/symlinks.txt || true
            echo
            echo "===== UNEXTRACTED ====="
            cat reports/unextracted.txt || true
            echo
            echo "=========================================="
            echo "BUILD COMPLETE"
            echo "=========================================="
          } > reports/FINAL-REPORT.txt

          cat reports/FINAL-REPORT.txt

      # ============================================================
      # 24. INSTALL INTO REPOSITORY
      # ============================================================

      - name: 🚚 Install generated vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf vendor/xiaomi/spinel

          mkdir -p vendor/xiaomi/spinel

          rsync -a \
            generated_vendor/ \
            vendor/xiaomi/spinel/

          echo "===== REPOSITORY TREE ====="

          find vendor/xiaomi/spinel \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -300

      # ============================================================
      # 25. GIT STATUS
      # ============================================================

      - name: 📊 Git status
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== GIT STATUS ====="

          git status --short

          echo
          echo "===== VENDOR SIZE ====="

          du -sh vendor/xiaomi/spinel

      # ============================================================
      # 26. COMMIT
      # ============================================================

      - name: 💾 Commit vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          git config \
            user.name \
            "MKVenomPro"

          git config \
            user.email \
            "mkvenompro@users.noreply.github.com"

          git add \
            vendor/xiaomi/spinel

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "vendor: initial proprietary tree for spinel"

      # ============================================================
      # 27. PUSH
      # ============================================================

      - name: 🚀 Push vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          git push \
            origin \
            HEAD:${GITHUB_REF_NAME}

      # ============================================================
      # 28. UPLOAD REPORTS
      # ============================================================

      - name: 📤 Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # 29. UPLOAD GENERATED VENDOR TREE
      # ============================================================

      - name: 📤 Upload generated vendor tree
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree
          path: generated_vendor/
          if-no-files-found: error
          retention-days: 30

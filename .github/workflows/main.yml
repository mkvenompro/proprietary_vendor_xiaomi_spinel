name: Build Redmi Note 15 4G (spinel) Vendor Tree

"on":
  workflow_dispatch:
    inputs:
      stock_rom_url:
        description: Official Redmi Note 15 4G spinel Fastboot ROM URL (radio only)
        required: true
        default: https://bigota.d.miui.com/OS2.0.212.0.VPGMIXM/spinel_global_images_OS2.0.212.0.VPGMIXM_20260311.0000.00_15.0_global_1e7d24d317.tgz
        type: string

      stock_dump_branch:
        description: GitLab stock dump branch containing proprietary-files.txt and blobs
        required: true
        default: dump-redmi-spinel-os2.0.212.0.vpgmixm
        type: string

      extract_utils_branch:
        description: LineageOS extract-utils branch
        required: true
        default: lineage-23.2
        type: string

      clone_retries:
        description: Number of retries for Git clones
        required: true
        default: "5"
        type: string

      lfs_retries:
        description: Number of retries for Git LFS downloads
        required: true
        default: "5"
        type: string

      copy_radio:
        description: Download official Fastboot ROM and copy the 10 spinel radio images
        required: true
        default: true
        type: boolean

      push_changes:
        description: Commit and push generated files to this repository
        required: true
        default: false
        type: boolean

      upload_artifact:
        description: Upload the generated vendor tree as an artifact
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: spinel-vendor-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE: spinel
  VENDOR: xiaomi

  STOCK_DUMP_REPO: https://gitlab.com/mkpromvp/dumber-2-mk.git
  STOCK_DUMP_DIR: stock_dump

  EXTRACT_UTILS_REPO: https://github.com/LineageOS/android_tools_extract-utils.git
  EXTRACT_UTILS_DIR: extract-utils

  STAGING_ROOT: staging_android_root
  RADIO_DIR: radio

jobs:
  build:
    name: Extract and assemble spinel vendor tree
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            git \
            git-lfs \
            python3 \
            python3-pip \
            rsync \
            curl \
            wget \
            ca-certificates \
            unzip \
            p7zip-full \
            xz-utils \
            zstd \
            lz4 \
            file

          git lfs install --skip-repo

      # ============================================================
      # CLEAN WORKSPACE
      # ============================================================

      - name: Clean workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$STOCK_DUMP_DIR" \
            "$EXTRACT_UTILS_DIR" \
            "$STAGING_ROOT" \
            ".radio_download" \
            ".radio_extract"

          mkdir -p "$RADIO_DIR"

          rm -f "$RADIO_DIR"/*.img

      # ============================================================
      # STOCK DUMP
      # ============================================================

      - name: Clone stock dump
        shell: bash
        env:
          BRANCH: ${{ inputs.stock_dump_branch }}
          RETRIES: ${{ inputs.clone_retries }}
        run: |
          set -euo pipefail

          attempt=1

          while (( attempt <= RETRIES )); do
            echo "============================================================"
            echo "Stock dump clone attempt $attempt/$RETRIES"
            echo "============================================================"

            rm -rf "$STOCK_DUMP_DIR"

            if GIT_LFS_SKIP_SMUDGE=1 git clone \
              --filter=blob:none \
              --no-checkout \
              --depth=1 \
              --branch "$BRANCH" \
              "$STOCK_DUMP_REPO" \
              "$STOCK_DUMP_DIR"
            then
              break
            fi

            if (( attempt == RETRIES )); then
              echo "ERROR: stock dump clone failed."
              exit 1
            fi

            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done

          cd "$STOCK_DUMP_DIR"

          git checkout --force "$BRANCH"

      - name: Download stock dump LFS objects
        shell: bash
        env:
          RETRIES: ${{ inputs.lfs_retries }}
        run: |
          set -euo pipefail

          cd "$STOCK_DUMP_DIR"

          attempt=1

          while (( attempt <= RETRIES )); do
            echo "============================================================"
            echo "Git LFS attempt $attempt/$RETRIES"
            echo "============================================================"

            if git lfs pull; then
              break
            fi

            if (( attempt == RETRIES )); then
              echo "ERROR: Git LFS download failed."
              exit 1
            fi

            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done

          git lfs checkout || true

      # ============================================================
      # FIND PROPRIETARY LIST
      # ============================================================

      - name: Locate proprietary-files.txt
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_LIST="$(find \
            "$STOCK_DUMP_DIR" \
            -type f \
            -name proprietary-files.txt \
            -print \
            -quit)"

          if [[ -z "$SOURCE_LIST" ]]; then
            echo "ERROR: proprietary-files.txt was not found."
            exit 1
          fi

          echo "SOURCE_LIST=$SOURCE_LIST" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$SOURCE_LIST"

      # ============================================================
      # NORMALIZE PROPRIETARY LIST
      # ============================================================

      - name: Normalize proprietary-files.txt
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "$STAGING_ROOT/device/xiaomi/spinel"

          cp \
            "$SOURCE_LIST" \
            "$STAGING_ROOT/device/xiaomi/spinel/proprietary-files.txt.raw"

          awk '
            BEGIN {
              removed = 0
            }

            {
              line = $0

              sub(/^[[:space:]]+/, "", line)
              sub(/[[:space:]]+$/, "", line)

              if (line == "") {
                print ""
                next
              }

              if (
                line ~ /^system\// ||
                line ~ /^system_ext\// ||
                line ~ /^product\// ||
                line ~ /^vendor_dlkm\// ||
                line ~ /^odm_dlkm\// ||
                line ~ /^mi_ext\// ||
                line == "vendor/odm/etc/vintf/manifest_nonfc_dsds.xml" ||
                line == "vendor/odm/etc/vintf/manifest_nonfc_ss.xml" ||
                line == "bin/iwpriv"
              ) {
                removed++
                next
              }

              sub(/^[-+]/, "", line)

              print line
            }

            END {
              print "# NORMALIZATION_REMOVED=" removed > "/dev/stderr"
            }
          ' \
          "$SOURCE_LIST" \
          > "$STAGING_ROOT/device/xiaomi/spinel/proprietary-files.txt"

          echo "Normalization complete."

      # ============================================================
      # VALIDATE LIST
      # ============================================================

      - name: Validate proprietary-files.txt
        shell: bash
        run: |
          set -euo pipefail

          LIST="$STAGING_ROOT/device/xiaomi/spinel/proprietary-files.txt"

          if [[ ! -s "$LIST" ]]; then
            echo "ERROR: normalized proprietary-files.txt is empty."
            exit 1
          fi

          bad_leading=0
          forbidden=0
          missing=0
          iwpriv_count=0

          while IFS= read -r line || [[ -n "$line" ]]; do

            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"

            [[ -z "$line" ]] && continue
            [[ "$line" == \#* ]] && continue

            if [[ "$line" == -* || "$line" == +* ]]; then
              echo "ERROR: malformed entry:"
              echo "$line"
              bad_leading=$((bad_leading + 1))
              continue
            fi

            case "$line" in
              system/*)
                echo "ERROR: system entry: $line"
                forbidden=$((forbidden + 1))
                ;;

              system_ext/*)
                echo "ERROR: system_ext entry: $line"
                forbidden=$((forbidden + 1))
                ;;

              product/*)
                echo "ERROR: product entry: $line"
                forbidden=$((forbidden + 1))
                ;;

              vendor_dlkm/*)
                echo "ERROR: vendor_dlkm entry: $line"
                forbidden=$((forbidden + 1))
                ;;

              odm_dlkm/*)
                echo "ERROR: odm_dlkm entry: $line"
                forbidden=$((forbidden + 1))
                ;;

              mi_ext/*)
                echo "ERROR: mi_ext entry: $line"
                forbidden=$((forbidden + 1))
                ;;
            esac

            if [[ "$line" == "vendor/bin/iwpriv" ]]; then
              iwpriv_count=$((iwpriv_count + 1))
            fi

            source_path="${line%%;*}"
            source_path="${source_path%%|*}"
            source_path="${source_path%%:*}"
            source_path="${source_path#-}"

            if [[ ! -e "$STOCK_DUMP_DIR/$source_path" ]]; then
              echo "ERROR: missing source:"
              echo "$source_path"
              missing=$((missing + 1))
            fi

          done < "$LIST"

          echo
          echo "============================================================"
          echo "VALIDATION"
          echo "============================================================"
          echo "Leading operators : $bad_leading"
          echo "Forbidden entries : $forbidden"
          echo "Missing sources   : $missing"
          echo "vendor/bin/iwpriv : $iwpriv_count"
          echo "============================================================"

          if (( bad_leading != 0 )); then
            exit 1
          fi

          if (( forbidden != 0 )); then
            exit 1
          fi

          if (( missing != 0 )); then
            exit 1
          fi

          if (( iwpriv_count != 1 )); then
            echo "ERROR: vendor/bin/iwpriv must exist exactly once."
            exit 1
          fi

          echo "proprietary-files.txt validation PASSED."

      # ============================================================
      # EXTRACT UTILS
      # ============================================================

      - name: Clone extract-utils
        shell: bash
        env:
          BRANCH: ${{ inputs.extract_utils_branch }}
          RETRIES: ${{ inputs.clone_retries }}
        run: |
          set -euo pipefail

          attempt=1

          while (( attempt <= RETRIES )); do
            echo "============================================================"
            echo "extract-utils clone attempt $attempt/$RETRIES"
            echo "============================================================"

            rm -rf "$EXTRACT_UTILS_DIR"

            if git clone \
              --depth=1 \
              --branch "$BRANCH" \
              "$EXTRACT_UTILS_REPO" \
              "$EXTRACT_UTILS_DIR"
            then
              break
            fi

            if (( attempt == RETRIES )); then
              echo "ERROR: extract-utils clone failed."
              exit 1
            fi

            sleep $((attempt * 3))
            attempt=$((attempt + 1))
          done

      # ============================================================
      # PREPARE ISOLATED ANDROID ROOT
      # ============================================================

      - name: Prepare isolated Android root
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/$STAGING_ROOT"

          mkdir -p \
            "$ROOT/device/xiaomi/spinel" \
            "$ROOT/tools/extract-utils"

          cp \
            "$STAGING_ROOT/device/xiaomi/spinel/proprietary-files.txt" \
            "$ROOT/device/xiaomi/spinel/proprietary-files.txt"

          cp -a \
            "$EXTRACT_UTILS_DIR/." \
            "$ROOT/tools/extract-utils/"

          cat > "$ROOT/device/xiaomi/spinel/extract-files.py" <<'PYTHON_SCRIPT'
#!/usr/bin/env python3

from extract_utils.main import (
    ExtractUtils,
    ExtractUtilsModule,
)


module = ExtractUtilsModule(
    "spinel",
    "xiaomi",
    check_elf=True,
    add_firmware_proprietary_file=False,
)


utils = ExtractUtils.device(module)
utils.run()
PYTHON_SCRIPT

          chmod +x \
            "$ROOT/device/xiaomi/spinel/extract-files.py"

          echo "STAGING_ANDROID_ROOT=$ROOT" >> "$GITHUB_ENV"

      # ============================================================
      # VERIFY ROOT
      # ============================================================

      - name: Verify extract-utils root
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$STAGING_ANDROID_ROOT"

          cd "$ROOT"

          export PYTHONPATH="$ROOT/tools/extract-utils"

          python3 - <<'PYTHON_CHECK'
import os

import extract_utils

from extract_utils.tools import android_root


expected = os.path.realpath(os.getcwd())
actual = os.path.realpath(android_root)


print("Expected Android root:")
print(expected)

print()

print("extract-utils Android root:")
print(actual)

print()

print("extract_utils module:")
print(os.path.realpath(extract_utils.__file__))


if expected != actual:
    raise SystemExit(
        "ERROR: extract-utils resolved the wrong Android root"
    )

print()
print("Android root verification PASSED.")
PYTHON_CHECK

      # ============================================================
      # RUN EXTRACTION
      # ============================================================

      - name: Extract proprietary blobs
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$STAGING_ANDROID_ROOT"

          cd "$ROOT"

          export PYTHONPATH="$ROOT/tools/extract-utils"

          python3 \
            "$ROOT/device/xiaomi/spinel/extract-files.py" \
            "$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"

      # ============================================================
      # RESTORE VINTF
      # ============================================================

      - name: Restore unsupported ODM VINTF manifests
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$STAGING_ANDROID_ROOT/vendor/xiaomi/spinel"

          VINTF_DIR="$VENDOR_TREE/proprietary/odm/etc/vintf"

          if [[ ! -d "$VENDOR_TREE" ]]; then
            echo "ERROR: extractor did not create:"
            echo "$VENDOR_TREE"
            exit 1
          fi

          mkdir -p "$VINTF_DIR"

          for file in \
            manifest_nonfc_dsds.xml \
            manifest_nonfc_ss.xml
          do

            source="$STOCK_DUMP_DIR/vendor/odm/etc/vintf/$file"

            if [[ ! -f "$source" ]]; then
              echo "ERROR: missing VINTF source:"
              echo "$source"
              exit 1
            fi

            cp -f \
              "$source" \
              "$VINTF_DIR/$file"

          done

          cat >> "$VENDOR_TREE/spinel-vendor.mk" <<'MAKEFILE_APPEND'

# Manually restored ODM VINTF manifests.
PRODUCT_COPY_FILES += \
    vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_dsds.xml \
    vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_ss.xml
MAKEFILE_APPEND

      # ============================================================
      # GENERATE SETUP MAKEFILES
      # ============================================================

      - name: Generate setup-makefiles.py
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$STAGING_ANDROID_ROOT"

          cat > "$ROOT/device/xiaomi/spinel/setup-makefiles.py" <<'PYTHON_SCRIPT'
#!/usr/bin/env python3

from extract_utils.main import (
    ExtractUtils,
    ExtractUtilsModule,
)


module = ExtractUtilsModule(
    "spinel",
    "xiaomi",
    check_elf=True,
    add_firmware_proprietary_file=False,
)


utils = ExtractUtils.device(module)
utils.run()
PYTHON_SCRIPT

          chmod +x \
            "$ROOT/device/xiaomi/spinel/setup-makefiles.py"

      # ============================================================
      # VALIDATE GENERATED VENDOR TREE
      # ============================================================

      - name: Validate generated vendor tree
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$STAGING_ANDROID_ROOT/vendor/xiaomi/spinel"

          echo "============================================================"
          echo "GENERATED VENDOR TREE"
          echo "============================================================"

          for file in \
            Android.bp \
            Android.mk \
            BoardConfigVendor.mk \
            spinel-vendor.mk
          do

            if [[ ! -s "$VENDOR_TREE/$file" ]]; then
              echo "ERROR: missing generated file:"
              echo "$file"
              exit 1
            fi

          done

          for file in \
            manifest_nonfc_dsds.xml \
            manifest_nonfc_ss.xml
          do

            if [[ ! -s "$VENDOR_TREE/proprietary/odm/etc/vintf/$file" ]]; then
              echo "ERROR: missing VINTF file:"
              echo "$file"
              exit 1
            fi

          done

          count="$(
            grep -c \
              '^vendor/bin/iwpriv$' \
              "$STAGING_ANDROID_ROOT/device/xiaomi/spinel/proprietary-files.txt" \
              || true
          )"

          if [[ "$count" != "1" ]]; then
            echo "ERROR: vendor/bin/iwpriv count = $count"
            exit 1
          fi

          echo "Generated vendor tree validation PASSED."

      # ============================================================
      # RADIO / FIRMWARE
      # ============================================================

      - name: Download official spinel Fastboot ROM
        if: ${{ inputs.copy_radio }}
        shell: bash
        env:
          ROM_URL: ${{ inputs.stock_rom_url }}
        run: |
          set -euo pipefail

          mkdir -p \
            ".radio_download" \
            ".radio_extract" \
            "$RADIO_DIR"

          rm -f ".radio_download"/*
          rm -rf ".radio_extract"/*
          rm -f "$RADIO_DIR"/*.img

          ARCHIVE=".radio_download/stock_fastboot.tgz"

          echo "============================================================"
          echo "DOWNLOADING OFFICIAL SPINEL FASTBOOT ROM"
          echo "============================================================"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            --output "$ARCHIVE" \
            "$ROM_URL"

          echo "Download complete."

          echo "============================================================"
          echo "EXTRACTING FASTBOOT ROM"
          echo "============================================================"

          tar \
            -xzf "$ARCHIVE" \
            -C ".radio_extract"

          declare -a RADIO_IMAGES=(
            dpm.img
            gz.img
            lk.img
            mcupm.img
            md1img.img
            pi_img.img
            scp.img
            spmfw.img
            sspm.img
            tee.img
          )

          echo "============================================================"
          echo "COPYING RADIO IMAGES"
          echo "============================================================"

          for image in "${RADIO_IMAGES[@]}"; do

            found="$(
              find \
                ".radio_extract" \
                -type f \
                -name "$image" \
                -print \
                -quit
            )"

            if [[ -z "$found" ]]; then
              echo "ERROR: radio image not found:"
              echo "$image"
              exit 1
            fi

            echo "Copying $image"

            cp -f \
              "$found" \
              "$RADIO_DIR/$image"

          done

          echo "============================================================"
          echo "VERIFYING RADIO IMAGES"
          echo "============================================================"

          for image in "${RADIO_IMAGES[@]}"; do

            if [[ ! -s "$RADIO_DIR/$image" ]]; then
              echo "ERROR: empty/missing radio image:"
              echo "$image"
              exit 1
            fi

          done

          echo
          echo "All 10 radio images copied successfully."
          echo

          ls -lh "$RADIO_DIR"

          rm -rf \
            ".radio_extract" \
            ".radio_download"

      - name: Validate radio directory
        if: ${{ inputs.copy_radio }}
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            dpm.img
            gz.img
            lk.img
            mcupm.img
            md1img.img
            pi_img.img
            scp.img
            spmfw.img
            sspm.img
            tee.img
          )

          actual="$(
            find \
              "$RADIO_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.img' \
              | wc -l
          )"

          if [[ "$actual" != "10" ]]; then
            echo "ERROR: expected 10 radio images."
            echo "Found: $actual"
            exit 1
          fi

          for image in "${expected[@]}"; do

            if [[ ! -s "$RADIO_DIR/$image" ]]; then
              echo "ERROR: missing radio image:"
              echo "$image"
              exit 1
            fi

          done

          echo "Radio validation PASSED."

      # ============================================================
      # FLATTEN
      # ============================================================

      - name: Flatten vendor tree into repository root
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"

          VENDOR_TREE="$STAGING_ANDROID_ROOT/vendor/xiaomi/spinel"

          DEVICE_TREE="$STAGING_ANDROID_ROOT/device/xiaomi/spinel"

          echo "============================================================"
          echo "FLATTENING TO REPOSITORY ROOT"
          echo "============================================================"

          # --------------------------------------------------------
          # Verify generated vendor files
          # --------------------------------------------------------

          for file in \
            Android.bp \
            Android.mk \
            BoardConfigVendor.mk \
            spinel-vendor.mk
          do

            if [[ ! -s "$VENDOR_TREE/$file" ]]; then
              echo "ERROR: missing:"
              echo "$VENDOR_TREE/$file"
              exit 1
            fi

          done

          # --------------------------------------------------------
          # Verify device files
          # --------------------------------------------------------

          if [[ ! -s "$DEVICE_TREE/proprietary-files.txt" ]]; then
            echo "ERROR: proprietary-files.txt missing."
            exit 1
          fi

          if [[ ! -s "$DEVICE_TREE/extract-files.py" ]]; then
            echo "ERROR: extract-files.py missing."
            exit 1
          fi

          if [[ ! -s "$DEVICE_TREE/setup-makefiles.py" ]]; then
            echo "ERROR: setup-makefiles.py missing."
            exit 1
          fi

          # --------------------------------------------------------
          # Copy generated build files
          # --------------------------------------------------------

          cp -f \
            "$VENDOR_TREE/Android.bp" \
            "$ROOT/Android.bp"

          cp -f \
            "$VENDOR_TREE/Android.mk" \
            "$ROOT/Android.mk"

          cp -f \
            "$VENDOR_TREE/BoardConfigVendor.mk" \
            "$ROOT/BoardConfigVendor.mk"

          cp -f \
            "$VENDOR_TREE/spinel-vendor.mk" \
            "$ROOT/spinel-vendor.mk"

          # --------------------------------------------------------
          # Copy proprietary blobs
          # --------------------------------------------------------

          rm -rf "$ROOT/proprietary"

          mkdir -p "$ROOT/proprietary"

          if [[ -d "$VENDOR_TREE/proprietary/vendor" ]]; then

            mkdir -p "$ROOT/proprietary/vendor"

            rsync -a \
              "$VENDOR_TREE/proprietary/vendor/" \
              "$ROOT/proprietary/vendor/"

          fi

          if [[ -d "$VENDOR_TREE/proprietary/odm" ]]; then

            mkdir -p "$ROOT/proprietary/odm"

            rsync -a \
              "$VENDOR_TREE/proprietary/odm/" \
              "$ROOT/proprietary/odm/"

          fi

          # --------------------------------------------------------
          # Copy extraction scripts/list
          # --------------------------------------------------------

          cp -f \
            "$DEVICE_TREE/proprietary-files.txt" \
            "$ROOT/proprietary-files.txt"

          cp -f \
            "$DEVICE_TREE/extract-files.py" \
            "$ROOT/extract-files.py"

          cp -f \
            "$DEVICE_TREE/setup-makefiles.py" \
            "$ROOT/setup-makefiles.py"

          chmod +x \
            "$ROOT/extract-files.py" \
            "$ROOT/setup-makefiles.py"

          # --------------------------------------------------------
          # Remove unwanted nested tree
          # --------------------------------------------------------

          rm -rf \
            "$ROOT/vendor/xiaomi/spinel"

          # --------------------------------------------------------
          # Remove staging
          # --------------------------------------------------------

          rm -rf \
            "$ROOT/$STAGING_ROOT"

          rm -rf \
            "$ROOT/$EXTRACT_UTILS_DIR"

          rm -rf \
            "$ROOT/$STOCK_DUMP_DIR"

          echo
          echo "Flatten complete."

      # ============================================================
      # FINAL CHECKS
      # ============================================================

      - name: Final integrity checks
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FINAL INTEGRITY CHECK"
          echo "============================================================"

          required=(
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
            proprietary-files.txt
            extract-files.py
            setup-makefiles.py
          )

          for file in "${required[@]}"; do

            if [[ ! -s "$file" ]]; then
              echo "ERROR: required file missing:"
              echo "$file"
              exit 1
            fi

          done

          # --------------------------------------------------------
          # Nested vendor tree must NOT exist
          # --------------------------------------------------------

          if [[ -d "vendor/xiaomi/spinel" ]]; then
            echo "ERROR: nested vendor/xiaomi/spinel exists."
            exit 1
          fi

          # --------------------------------------------------------
          # Forbidden partitions
          # --------------------------------------------------------

          if grep -nE \
            '^(system/|system_ext/|product/|vendor_dlkm/|odm_dlkm/|mi_ext/)' \
            proprietary-files.txt
          then
            echo "ERROR: forbidden partition entries remain."
            exit 1
          fi

          # --------------------------------------------------------
          # Old iwpriv path must NOT exist
          # --------------------------------------------------------

          if grep -nE \
            '^bin/iwpriv$' \
            proprietary-files.txt
          then
            echo "ERROR: obsolete bin/iwpriv entry remains."
            exit 1
          fi

          # --------------------------------------------------------
          # Exactly one vendor/bin/iwpriv
          # --------------------------------------------------------

          iwpriv_count="$(
            grep -c \
              '^vendor/bin/iwpriv$' \
              proprietary-files.txt \
              || true
          )"

          if [[ "$iwpriv_count" != "1" ]]; then
            echo "ERROR: vendor/bin/iwpriv count = $iwpriv_count"
            exit 1
          fi

          # --------------------------------------------------------
          # VINTF rules
          # --------------------------------------------------------

          if ! grep -q \
            'manifest_nonfc_dsds.xml' \
            spinel-vendor.mk
          then
            echo "ERROR: DSDS VINTF rule missing."
            exit 1
          fi

          if ! grep -q \
            'manifest_nonfc_ss.xml' \
            spinel-vendor.mk
          then
            echo "ERROR: SS VINTF rule missing."
            exit 1
          fi

          # --------------------------------------------------------
          # Radio
          # --------------------------------------------------------

          if [[ "${{ inputs.copy_radio }}" == "true" ]]; then

            for image in \
              dpm.img \
              gz.img \
              lk.img \
              mcupm.img \
              md1img.img \
              pi_img.img \
              scp.img \
              spmfw.img \
              sspm.img \
              tee.img
            do

              if [[ ! -s "$RADIO_DIR/$image" ]]; then
                echo "ERROR: missing final radio image:"
                echo "$image"
                exit 1
              fi

            done

          fi

          # --------------------------------------------------------
          # Final tree
          # --------------------------------------------------------

          echo
          echo "============================================================"
          echo "FINAL ROOT"
          echo "============================================================"

          find . \
            -maxdepth 3 \
            -type f \
            ! -path './.git/*' \
            | sort \
            | sed -n '1,240p'

          echo
          echo "============================================================"
          echo "BLOB SIZE"
          echo "============================================================"

          du -sh \
            proprietary/vendor \
            proprietary/odm \
            2>/dev/null || true

          echo
          echo "============================================================"
          echo "SUCCESS"
          echo "spinel vendor tree is ready."
          echo "============================================================"

      # ============================================================
      # GIT STATUS
      # ============================================================

      - name: Show git status
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "GIT STATUS"
          echo "============================================================"

          git status --short

          echo

          git diff --stat || true

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload generated vendor tree
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree
          if-no-files-found: error
          compression-level: 6

          path: |
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
            proprietary-files.txt
            extract-files.py
            setup-makefiles.py
            proprietary
            radio

      # ============================================================
      # PUSH
      # ============================================================

      - name: Commit and push changes
        if: ${{ inputs.push_changes }}
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "COMMIT AND PUSH"
          echo "============================================================"

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "vendor: add proprietary blobs and firmware for spinel"

          git push \
            origin \
            "HEAD:$BRANCH_NAME"

name: "🧬 Build LineageOS Vendor Tree • spinel"

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVICE: spinel
  VENDOR: xiaomi

  DUMP_REPO: "https://gitlab.com/mkpromvp/dumber-2-mk.git"
  DUMP_BRANCH: "dump-redmi-spinel-os2.0.212.0.vpgmixm"

  LINEAGE_EXTRACT_UTILS: "lineage-23.2"

jobs:
  build-vendor:
    name: "🧬 Generate LineageOS Vendor Tree"
    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. CHECKOUT CURRENT REPOSITORY
      # ==========================================================

      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      # ==========================================================
      # 2. INSTALL DEPENDENCIES
      # ==========================================================

      - name: "🛠️ Install dependencies"
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            python3 \
            python3-pip \
            python3-venv \
            python3-dev \
            rsync \
            unzip \
            zip \
            file \
            bc \
            cpio \
            lz4 \
            zstd \
            xz-utils \
            gzip \
            bzip2 \
            jq \
            tree \
            findutils \
            coreutils \
            binutils \
            binutils-aarch64-linux-gnu \
            elfutils \
            patchelf

          git lfs install

          echo
          echo "Python:"
          python3 --version

          echo
          echo "Git:"
          git --version

      # ==========================================================
      # 3. PREPARE WORKSPACE
      # ==========================================================

      - name: "🧹 Prepare workspace"
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            stock_dump \
            extract-utils \
            extraction_tree \
            vendor_work \
            reports

          mkdir -p \
            stock_dump \
            extraction_tree \
            vendor_work \
            reports

      # ==========================================================
      # 4. DOWNLOAD DUMBER STOCK DUMP
      # ==========================================================

      - name: "📦 Clone stock dump"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " Xiaomi Redmi Note 15 4G • spinel"
          echo " HyperOS 2 / Android 15"
          echo "=============================================="
          echo

          echo "Repository:"
          echo "${DUMP_REPO}"

          echo
          echo "Branch:"
          echo "${DUMP_BRANCH}"

          echo
          echo "Cloning..."

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${DUMP_BRANCH}" \
            "${DUMP_REPO}" \
            stock_dump

          echo
          echo "✓ Dump downloaded"

          echo
          echo "Dump size:"
          du -sh stock_dump

      # ==========================================================
      # 5. VERIFY STOCK DUMP
      # ==========================================================

      - name: "🔍 Verify stock dump"
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required dump components..."

          test -d stock_dump/vendor
          test -f stock_dump/proprietary-files.txt

          echo "✓ vendor/"
          echo "✓ proprietary-files.txt"

          if [ -d stock_dump/system ]; then
            echo "✓ system/"
          fi

          if [ -d stock_dump/system_ext ]; then
            echo "✓ system_ext/"
          fi

          if [ -d stock_dump/product ]; then
            echo "✓ product/"
          fi

          if [ -d stock_dump/odm_dlkm ]; then
            echo "✓ odm_dlkm/"
          fi

          if [ -d stock_dump/vendor_dlkm ]; then
            echo "✓ vendor_dlkm/"
          fi

          echo
          echo "Top-level dump:"
          find stock_dump \
            -mindepth 1 \
            -maxdepth 1 \
            -printf '%f\n' \
            | sort

      # ==========================================================
      # 6. CLONE OFFICIAL LINEAGE EXTRACT-UTILS
      # ==========================================================

      - name: "🧰 Clone LineageOS extract-utils"
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${LINEAGE_EXTRACT_UTILS}" \
            https://github.com/LineageOS/android_tools_extract-utils.git \
            extract-utils

          echo
          echo "extract-utils revision:"
          git -C extract-utils rev-parse HEAD

          echo
          echo "extract-utils files:"
          find extract-utils \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100

      # ==========================================================
      # 7. PREPARE PROPRIETARY FILE LIST
      #
      # IMPORTANT:
      #   '-' at beginning of Lineage proprietary entry is NOT
      #   part of the source path.
      #
      # Example:
      #
      #   -system_ext/framework/foo.jar
      #
      # means:
      #
      #   source = system_ext/framework/foo.jar
      #
      # while preserving the '-' in the actual proprietary list.
      # ==========================================================

      - name: "🧹 Normalize proprietary-files.txt"
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          source = Path("stock_dump/proprietary-files.txt")
          output = Path("vendor_work/proprietary-files.txt")

          lines = source.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines()

          seen = set()
          output_lines = []

          for raw in lines:
              line = raw.strip()

              if not line:
                  continue

              # Keep comments.
              if line.startswith("#"):
                  if line not in seen:
                      seen.add(line)
                      output_lines.append(line)
                  continue

              # Normalize CRLF.
              line = line.replace("\r", "")

              # Remove accidental surrounding whitespace.
              line = line.strip()

              # Ignore obvious dump metadata.
              if line in {
                  "README.md",
                  "_dump_info.txt",
                  "all_files.txt",
                  "all_files.sha1",
                  "board-info.txt",
                  "ikconfig",
                  "kallsyms.txt",
                  "proprietary-files.sha1",
              }:
                  continue

              # Boot/recovery/dtbo images are not proprietary vendor
              # blobs and must not become vendor/xiaomi/spinel files.
              check = line.lstrip("-")

              source_path = check.split(":", 1)[0]
              source_path = source_path.split("|", 1)[0]
              source_path = source_path.lstrip("/")

              if source_path.endswith(".img"):
                  continue

              # Ignore whole partition image references.
              if source_path in {
                  "boot.img",
                  "vendor_boot.img",
                  "recovery.img",
                  "dtbo.img",
                  "vbmeta.img",
              }:
                  continue

              # Keep Lineage's '-' marker intact.
              #
              # This is important:
              #
              # -foo/bar.so
              #
              # is NOT equivalent to:
              #
              # foo/bar.so
              #
              # The marker has meaning to extract-utils.
              if line not in seen:
                  seen.add(line)
                  output_lines.append(line)

          output.write_text(
              "\n".join(output_lines) + "\n",
              encoding="utf-8"
          )

          print("Original entries:", len(lines))
          print("Clean entries   :", len(output_lines))
          PY

          echo
          echo "Final proprietary list:"
          wc -l vendor_work/proprietary-files.txt

          echo
          echo "First entries:"
          head -40 vendor_work/proprietary-files.txt

      # ==========================================================
      # 8. VALIDATE SOURCES CORRECTLY
      #
      # Strip '-' ONLY for filesystem lookup.
      # DO NOT strip it from proprietary-files.txt.
      # ==========================================================

      - name: "🔎 Validate proprietary sources"
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          dump = Path("stock_dump")
          prop = Path("vendor_work/proprietary-files.txt")

          missing = []
          checked = 0

          for raw in prop.read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines():

              line = raw.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              checked += 1

              # IMPORTANT:
              # '-' is Lineage metadata, not part of the path.
              lookup = line.lstrip("-")

              # Remove SHA1.
              lookup = lookup.split("|", 1)[0]

              # Extract source side.
              source = lookup.split(":", 1)[0]

              source = source.lstrip("/")

              # Ignore image entries just in case.
              if source.endswith(".img"):
                  continue

              path = dump / source

              if not path.exists():
                  missing.append(
                      f"{source}\t(from: {line})"
                  )

          print("Checked:", checked)
          print("Missing:", len(missing))

          if missing:
              Path(
                  "reports/missing-files.txt"
              ).write_text(
                  "\n".join(missing) + "\n",
                  encoding="utf-8"
              )

              print()
              print("First missing files:")

              for item in missing[:100]:
                  print(item)

              raise SystemExit(
                  "ERROR: proprietary-files.txt contains missing sources."
              )

          print()
          print("✓ Every proprietary source exists in dump")
          PY

      # ==========================================================
      # 9. CREATE EXTRACTION TREE
      # ==========================================================

      - name: "🌳 Prepare extraction tree"
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            extraction_tree/tools

          cp \
            vendor_work/proprietary-files.txt \
            extraction_tree/proprietary-files.txt

          cp -a \
            extract-utils \
            extraction_tree/tools/extract-utils

          cat > extraction_tree/extract-files.py <<'PY'
          #!/usr/bin/env -S PYTHONPATH=./tools/extract-utils python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              add_firmware_proprietary_file=True,
              check_elf=True,
          )

          if __name__ == "__main__":
              utils = ExtractUtils.device(module)
              utils.run()
          PY

          chmod +x \
            extraction_tree/extract-files.py

          echo
          echo "Extraction script:"
          cat extraction_tree/extract-files.py

      # ==========================================================
      # 10. RUN OFFICIAL EXTRACT-UTILS
      # ==========================================================

      - name: "📦 Extract proprietary blobs"
        shell: bash
        run: |
          set -euo pipefail

          cd extraction_tree

          echo "=============================================="
          echo " Running LineageOS extract-utils"
          echo "=============================================="
          echo

          ./extract-files.py \
            "${GITHUB_WORKSPACE}/stock_dump"

          echo
          echo "✓ Extraction finished"

      # ==========================================================
      # 11. FIND GENERATED TREE
      # ==========================================================

      - name: "📂 Find generated vendor tree"
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d \
            "extraction_tree/vendor/xiaomi/spinel"
          ]; then

            echo "ERROR:"
            echo "vendor/xiaomi/spinel was not generated."

            echo
            echo "Generated vendor directories:"

            find extraction_tree/vendor \
              -maxdepth 4 \
              -type d \
              2>/dev/null \
              | sort \
              || true

            exit 1
          fi

          echo "✓ vendor/xiaomi/spinel exists"

          du -sh \
            extraction_tree/vendor/xiaomi/spinel

          find \
            extraction_tree/vendor/xiaomi/spinel \
            -type f \
            | wc -l

      # ==========================================================
      # 12. REMOVE ONLY EXTRACTION JUNK
      # ==========================================================

      - name: "🧹 Clean generated tree"
        shell: bash
        run: |
          set -euo pipefail

          TREE="extraction_tree/vendor/xiaomi/spinel"

          # Python cache
          find "${TREE}" \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          # Python bytecode
          find "${TREE}" \
            -type f \
            \( \
              -name "*.pyc" \
              -o -name "*.pyo" \
            \) \
            -delete

          # OS junk
          find "${TREE}" \
            -type f \
            \( \
              -name ".DS_Store" \
              -o -name "Thumbs.db" \
            \) \
            -delete

          echo "✓ Extraction junk removed"

      # ==========================================================
      # 13. CHECK BROKEN SYMLINKS
      # ==========================================================

      - name: "🔗 Check symlinks"
        shell: bash
        run: |
          set -euo pipefail

          TREE="extraction_tree/vendor/xiaomi/spinel"

          : > reports/broken-symlinks.txt

          while IFS= read -r -d '' link; do

            if [ ! -e "${link}" ]; then
              echo "${link}" \
                >> reports/broken-symlinks.txt
            fi

          done < <(
            find "${TREE}" \
              -type l \
              -print0
          )

          if [ -s reports/broken-symlinks.txt ]; then
            echo "ERROR: broken symlinks found:"
            cat reports/broken-symlinks.txt
            exit 1
          fi

          echo "✓ No broken symlinks"

      # ==========================================================
      # 14. CHECK DUPLICATE DESTINATIONS
      # ==========================================================

      - name: "🔐 Check duplicate destination paths"
        shell: bash
        run: |
          set -euo pipefail

          TREE="extraction_tree/vendor/xiaomi/spinel"

          find "${TREE}" \
            -type f \
            -printf '%P\n' \
            | sort \
            | uniq -d \
            > reports/duplicate-destinations.txt

          if [ -s reports/duplicate-destinations.txt ]; then
            echo "ERROR: duplicate destination paths:"
            cat reports/duplicate-destinations.txt
            exit 1
          fi

          echo "✓ No duplicate destination paths"

      # ==========================================================
      # 15. IDENTICAL BLOB REPORT
      #
      # IMPORTANT:
      # Identical SHA1 does NOT mean one file can safely be removed.
      # Different paths can be ABI/runtime requirements.
      # ==========================================================

      - name: "🧬 Audit identical blobs"
        shell: bash
        run: |
          set -euo pipefail

          TREE="extraction_tree/vendor/xiaomi/spinel"

          find "${TREE}" \
            -type f \
            -exec sha1sum {} \; \
            | sort \
            > reports/blob-sha1.txt

          python3 <<'PY'
          from pathlib import Path
          from collections import defaultdict

          groups = defaultdict(list)

          for line in Path(
              "reports/blob-sha1.txt"
          ).read_text(
              errors="ignore"
          ).splitlines():

              if not line.strip():
                  continue

              sha, path = line.split(None, 1)

              groups[sha].append(path)

          duplicates = {
              sha: paths
              for sha, paths in groups.items()
              if len(paths) > 1
          }

          out = []

          for sha, paths in sorted(
              duplicates.items()
          ):
              out.append(f"SHA1: {sha}")

              for path in paths:
                  out.append(f"  {path}")

              out.append("")

          Path(
              "reports/identical-blobs.txt"
          ).write_text(
              "\n".join(out),
              encoding="utf-8"
          )

          print(
              "Identical blob groups:",
              len(duplicates)
          )
          PY

      # ==========================================================
      # 16. FILE TYPE / ELF REPORT
      # ==========================================================

      - name: "🔬 Generate ELF report"
        shell: bash
        run: |
          set -euo pipefail

          TREE="extraction_tree/vendor/xiaomi/spinel"

          : > reports/elf-report.txt

          while IFS= read -r -d '' file; do

            if file "${file}" | grep -q "ELF"; then

              {
                echo "=================================================="
                echo "FILE: ${file}"
                echo "=================================================="

                file "${file}"

                readelf -d "${file}" 2>/dev/null \
                  | grep -E \
                    "NEEDED|SONAME" \
                  || true

                echo

              } >> reports/elf-report.txt

            fi

          done < <(
            find "${TREE}" \
              -type f \
              -print0
          )

      # ==========================================================
      # 17. CHECK LARGE FILES
      # ==========================================================

      - name: "📏 Check large files"
        shell: bash
        run: |
          set -euo pipefail

          TREE="extraction_tree/vendor/xiaomi/spinel"

          : > reports/large-files.txt

          while IFS= read -r -d '' file; do

            size="$(stat -c '%s' "${file}")"

            # 90 MiB warning
            if [ "${size}" -ge \
              $((90 * 1024 * 1024))
            ]; then

              printf '%s\t%s\n' \
                "${size}" \
                "${file}" \
                >> reports/large-files.txt
            fi

          done < <(
            find "${TREE}" \
              -type f \
              -print0
          )

          if [ -s reports/large-files.txt ]; then
            echo "WARNING:"
            echo "Files close to GitHub 100 MiB limit:"
            cat reports/large-files.txt
          else
            echo "✓ No large files detected"
          fi

      # ==========================================================
      # 18. GENERATE TREE STATISTICS
      # ==========================================================

      - name: "📊 Generate statistics"
        shell: bash
        run: |
          set -euo pipefail

          TREE="extraction_tree/vendor/xiaomi/spinel"

          {
            echo "Device: ${DEVICE}"
            echo "Vendor: ${VENDOR}"
            echo
            echo "Dump:"
            echo "${DUMP_REPO}"
            echo
            echo "Dump branch:"
            echo "${DUMP_BRANCH}"
            echo
            echo "Extract-utils:"
            git -C extract-utils rev-parse HEAD
            echo
            echo "Vendor tree:"
            du -sh "${TREE}"
            echo
            echo "Files:"
            find "${TREE}" -type f | wc -l
            echo
            echo "Directories:"
            find "${TREE}" -type d | wc -l
            echo
            echo "Generated:"
            date -u '+%Y-%m-%d %H:%M:%S UTC'
          } > reports/vendor-tree-info.txt

          cat reports/vendor-tree-info.txt

      # ==========================================================
      # 19. COPY FINAL TREE
      # ==========================================================

      - name: "📥 Install vendor tree"
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="extraction_tree/vendor/xiaomi/spinel"
          DEST="vendor/xiaomi/spinel"

          # IMPORTANT:
          # This is the FIRST point where the existing repository tree
          # is touched.
          #
          # Everything before this step must succeed.

          rm -rf "${DEST}"

          mkdir -p "${DEST}"

          rsync -a \
            "${SOURCE}/" \
            "${DEST}/"

          echo
          echo "Final vendor tree:"
          du -sh "${DEST}"

          echo
          echo "Files:"
          find "${DEST}" \
            -type f \
            | wc -l

      # ==========================================================
      # 20. FINAL SANITY CHECK
      # ==========================================================

      - name: "✅ Final sanity check"
        shell: bash
        run: |
          set -euo pipefail

          TREE="vendor/xiaomi/spinel"

          test -d "${TREE}"

          COUNT="$(
            find "${TREE}" \
              -type f \
              | wc -l
          )"

          echo "Final file count: ${COUNT}"

          if [ "${COUNT}" -lt 10 ]; then
            echo "ERROR: vendor tree is suspiciously small."
            exit 1
          fi

          echo
          echo "Final structure:"
          find "${TREE}" \
            -maxdepth 2 \
            -type d \
            | sort \
            | head -150

      # ==========================================================
      # 21. GIT STATUS
      # ==========================================================

      - name: "📋 Git status"
        shell: bash
        run: |
          set -euo pipefail

          git status --short

      # ==========================================================
      # 22. COMMIT
      # ==========================================================

      - name: "💾 Commit vendor tree"
        shell: bash
        run: |
          set -euo pipefail

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            vendor/xiaomi/spinel

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit \
            -m "vendor: xiaomi: spinel: initial proprietary blobs"

      # ==========================================================
      # 23. PUSH
      # ==========================================================

      - name: "🚀 Push to default branch"
        shell: bash
        run: |
          set -euo pipefail

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          echo "Default branch:"
          echo "${DEFAULT_BRANCH}"

          git push \
            origin \
            "HEAD:${DEFAULT_BRANCH}"

      # ==========================================================
      # 24. UPLOAD REPORTS
      # ==========================================================

      - name: "📤 Upload reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "spinel-vendor-tree-reports"
          path: reports/
          if-no-files-found: warn
          retention-days: 30

name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-vendor:
    runs-on: ubuntu-24.04

    env:
      DEVICE: spinel
      BRAND: xiaomi
      DEVICE_PATH: device/xiaomi/spinel
      VENDOR_PATH: vendor/xiaomi/spinel
      STOCK_REPO: https://gitlab.com/mkpromvp/dumber-2-mk.git
      STOCK_BRANCH: dump-redmi-spinel-os2.0.212.0.vpgmixm
      EXTRACT_UTILS_REPO: https://github.com/LineageOS/android_tools_extract-utils.git
      EXTRACT_UTILS_BRANCH: lineage-23.2

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. BASIC DEPENDENCIES
      # ============================================================

      - name: 🧰 Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            rsync \
            python3 \
            python3-pip \
            python3-venv \
            python3-setuptools \
            python3-wheel \
            file \
            unzip \
            zip \
            cpio \
            lz4 \
            zstd \
            brotli \
            jq

          git lfs install

      # ============================================================
      # 3. PREPARE WORKSPACE
      # ============================================================

      - name: 🧹 Prepare clean workspace
        run: |
          set -euxo pipefail

          rm -rf stock_dump
          rm -rf extract-utils
          rm -rf reports
          rm -rf generated_root
          rm -rf "$DEVICE_PATH"
          rm -rf "$VENDOR_PATH"

          mkdir -p stock_dump
          mkdir -p reports
          mkdir -p generated_root
          mkdir -p "$DEVICE_PATH"

      # ============================================================
      # 4. CLONE STOCK DUMP
      # ============================================================

      - name: 📦 Clone stock dump
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "$STOCK_BRANCH" \
            "$STOCK_REPO" \
            stock_dump

          echo "===== STOCK DUMP ====="
          find stock_dump -maxdepth 2 -type d | sort | head -200

      # ============================================================
      # 5. CLONE EXTRACT UTILS
      # ============================================================

      - name: 🧩 Clone extract-utils
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "$EXTRACT_UTILS_BRANCH" \
            "$EXTRACT_UTILS_REPO" \
            extract-utils

          python3 - <<'PY'
          import sys

          sys.path.insert(0, "extract-utils")

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print("extract-utils import: PASS")
          PY

      # ============================================================
      # 6. BUILD CLEAN PROPRIETARY FILE LIST
      # ============================================================

      - name: 🧹 Normalize proprietary-files.txt
        run: |
          set -euxo pipefail

          RAW_LIST="stock_dump/proprietary-files.txt"
          CLEAN_LIST="$DEVICE_PATH/proprietary-files.txt"

          test -f "$RAW_LIST"

          : > "$CLEAN_LIST"

          removed_system=0
          removed_product=0
          removed_missing=0
          removed_dlkm=0
          removed_mi_ext=0
          removed_unknown=0
          added_iwpriv=0

          while IFS= read -r line || [ -n "$line" ]; do

            # Empty/comment
            case "$line" in
              ""|\#*)
                continue
                ;;
            esac

            # Keep the original leading '-' because extract-utils
            # uses it for optional/excluded entries.
            original="$line"
            path="${line#-}"

            # ------------------------------------------------------
            # Normalize malformed "bin/iwpriv"
            # ------------------------------------------------------

            if [ "$path" = "bin/iwpriv" ]; then
              found=""

              for candidate in \
                "stock_dump/vendor/bin/iwpriv" \
                "stock_dump/system/bin/iwpriv" \
                "stock_dump/product/bin/iwpriv" \
                "stock_dump/system_ext/bin/iwpriv"
              do
                if [ -f "$candidate" ]; then
                  found="${candidate#stock_dump/}"
                  break
                fi
              done

              if [ -n "$found" ]; then
                echo "$found" >> "$CLEAN_LIST"
                added_iwpriv=1
              else
                echo "bin/iwpriv" >> reports/missing-files.txt
                removed_missing=$((removed_missing + 1))
              fi

              continue
            fi

            # ------------------------------------------------------
            # Remove system files
            # ------------------------------------------------------

            case "$path" in
              system/*)
                removed_system=$((removed_system + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # Remove system_ext files
            # ------------------------------------------------------

            case "$path" in
              system_ext/*)
                removed_system=$((removed_system + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # Remove product files
            # ------------------------------------------------------

            case "$path" in
              product/*)
                removed_product=$((removed_product + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # Remove vendor_dlkm / odm_dlkm from proprietary list
            #
            # They are inventoried separately. They are not fed to
            # this extract-utils makefile generation pass.
            # ------------------------------------------------------

            case "$path" in
              vendor_dlkm/*)
                removed_dlkm=$((removed_dlkm + 1))
                continue
                ;;
              odm_dlkm/*)
                removed_dlkm=$((removed_dlkm + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # mi_ext is handled separately
            # ------------------------------------------------------

            case "$path" in
              mi_ext/*)
                removed_mi_ext=$((removed_mi_ext + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # Unknown partition
            # ------------------------------------------------------

            case "$path" in
              vendor/*|odm/*|recovery/*)
                ;;
              *)
                echo "$original" >> reports/unknown-partitions.txt
                removed_unknown=$((removed_unknown + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # VINTF files that Lineage extract-utils 23.2 cannot
            # classify as packages.
            #
            # Restore them manually later.
            # ------------------------------------------------------

            case "$path" in
              vendor/odm/etc/vintf/manifest_nonfc_dsds.xml)
                echo "$path" >> reports/manual-vintf.txt
                continue
                ;;
              vendor/odm/etc/vintf/manifest_nonfc_ss.xml)
                echo "$path" >> reports/manual-vintf.txt
                continue
                ;;
            esac

            # ------------------------------------------------------
            # Validate source file exists
            # ------------------------------------------------------

            source="stock_dump/$path"

            if [ ! -f "$source" ]; then
              echo "$original" >> reports/missing-files.txt
              removed_missing=$((removed_missing + 1))
              continue
            fi

            echo "$original" >> "$CLEAN_LIST"

          done < "$RAW_LIST"

          # ========================================================
          # REPORT
          # ========================================================

          {
            echo "Removed system/system_ext : $removed_system"
            echo "Removed product           : $removed_product"
            echo "Removed DLKM              : $removed_dlkm"
            echo "Removed mi_ext            : $removed_mi_ext"
            echo "Removed unknown           : $removed_unknown"
            echo "Removed missing           : $removed_missing"
            echo "Added iwpriv              : $added_iwpriv"
            echo
            echo "Final proprietary count:"
            grep -vE '^[[:space:]]*(#|$)' "$CLEAN_LIST" | wc -l
          } | tee reports/normalization.txt

      # ============================================================
      # 7. VALIDATE LIST
      # ============================================================

      - name: 🔍 Validate proprietary list
        run: |
          set -euxo pipefail

          LIST="$DEVICE_PATH/proprietary-files.txt"

          test -s "$LIST"

          missing=0
          forbidden=0
          leading_dash=0

          : > reports/validation-missing.txt
          : > reports/validation-forbidden.txt

          while IFS= read -r line || [ -n "$line" ]; do

            case "$line" in
              ""|\#*)
                continue
                ;;
            esac

            path="${line#-}"

            if [[ "$line" == -* ]]; then
              leading_dash=$((leading_dash + 1))
            fi

            case "$path" in
              system/*|system_ext/*|product/*)
                echo "$line" >> reports/validation-forbidden.txt
                forbidden=$((forbidden + 1))
                continue
                ;;
            esac

            case "$path" in
              vendor_dlkm/*|odm_dlkm/*|mi_ext/*)
                echo "$line" >> reports/validation-forbidden.txt
                forbidden=$((forbidden + 1))
                continue
                ;;
            esac

            if [ ! -f "stock_dump/$path" ]; then
              echo "$line" >> reports/validation-missing.txt
              missing=$((missing + 1))
            fi

          done < "$LIST"

          {
            echo "Leading '-' entries : $leading_dash"
            echo "Forbidden entries    : $forbidden"
            echo "Missing source files : $missing"
          } | tee reports/validation.txt

          if [ "$missing" -ne 0 ]; then
            echo "ERROR: missing source files"
            cat reports/validation-missing.txt
            exit 1
          fi

          if [ "$forbidden" -ne 0 ]; then
            echo "ERROR: forbidden partition entries"
            cat reports/validation-forbidden.txt
            exit 1
          fi

          echo "Validation: PASS"

      # ============================================================
      # 8. GENERATE EXTRACT-FILES.PY
      # ============================================================

      - name: 📝 Generate extract-files.py
        run: |
          set -euxo pipefail

          cat > "$DEVICE_PATH/extract-files.py" <<'PY'
          #!/usr/bin/env python3

          import sys

          from extract_utils.fixups_blob import blob_fixup
          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          def blob_fixups_user_type():
              return {}

          def blob_fixups():
              return {
              }

          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              blob_fixups=blob_fixups(),
              check_elf=True,
              add_firmware_proprietary_file=False,
          )

          utils = ExtractUtils.device(module)

          utils.run()
          PY

          chmod +x "$DEVICE_PATH/extract-files.py"

      # ============================================================
      # 9. GENERATE SETUP-MAKEFILES.PY
      # ============================================================

      - name: 📝 Generate setup-makefiles.py
        run: |
          set -euxo pipefail

          cat > "$DEVICE_PATH/setup-makefiles.py" <<'PY'
          #!/usr/bin/env python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=True,
              add_firmware_proprietary_file=False,
          )

          utils = ExtractUtils.device(module)

          utils.run()
          PY

          chmod +x "$DEVICE_PATH/setup-makefiles.py"

      # ============================================================
      # 10. SET PYTHON PATH
      # ============================================================

      - name: 🐍 Prepare extract-utils environment
        run: |
          set -euxo pipefail

          echo "$PWD/extract-utils" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$PWD/extract-utils" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import sys

          sys.path.insert(0, "extract-utils")

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print("Lineage extract-utils: PASS")
          PY

      # ============================================================
      # 11. EXTRACT BLOBS
      # ============================================================

      - name: 🧬 Extract spinel proprietary blobs
        run: |
          set -euxo pipefail

          cd "$DEVICE_PATH"

          python3 extract-files.py \
            --kang \
            ../../stock_dump

      # ============================================================
      # 12. CHECK GENERATED VENDOR TREE
      # ============================================================

      - name: 🔎 Check generated vendor tree
        run: |
          set -euxo pipefail

          test -d "$VENDOR_PATH"

          echo "===== GENERATED VENDOR TREE ====="

          find "$VENDOR_PATH" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -200

          echo
          echo "File count:"
          find "$VENDOR_PATH" -type f | wc -l

      # ============================================================
      # 13. RESTORE MANUAL VINTF FILES
      # ============================================================

      - name: 🛠️ Restore unsupported ODM VINTF manifests
        run: |
          set -euxo pipefail

          mkdir -p \
            "$VENDOR_PATH/proprietary/odm/etc/vintf"

          for file in \
            manifest_nonfc_dsds.xml \
            manifest_nonfc_ss.xml
          do

            src="stock_dump/vendor/odm/etc/vintf/$file"
            dst="$VENDOR_PATH/proprietary/odm/etc/vintf/$file"

            if [ -f "$src" ]; then
              cp -f "$src" "$dst"
              echo "Restored: $file"
            else
              echo "WARNING: missing $src"
            fi

          done

      # ============================================================
      # 14. PATCH GENERATED VENDOR MAKEFILE
      # ============================================================

      - name: 🧩 Patch vendor makefile
        run: |
          set -euxo pipefail

          MAKEFILE=""

          if [ -f "$VENDOR_PATH/spinel-vendor.mk" ]; then
            MAKEFILE="$VENDOR_PATH/spinel-vendor.mk"
          elif [ -f "$VENDOR_PATH/${DEVICE}-vendor.mk" ]; then
            MAKEFILE="$VENDOR_PATH/${DEVICE}-vendor.mk"
          else
            MAKEFILE="$(find "$VENDOR_PATH" -maxdepth 1 -type f -name '*-vendor.mk' | head -1 || true)"
          fi

          if [ -z "$MAKEFILE" ] || [ ! -f "$MAKEFILE" ]; then
            echo "ERROR: generated vendor makefile not found"
            find "$VENDOR_PATH" -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Using vendor makefile:"
          echo "$MAKEFILE"

          cat >> "$MAKEFILE" <<'EOF'

          # Manually restored ODM VINTF manifests.
          PRODUCT_COPY_FILES += \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_dsds.xml \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_ss.xml
          EOF

      # ============================================================
      # 15. INVENTORY DLKM / MI_EXT
      # ============================================================

      - name: 📊 Inventory unsupported partitions
        run: |
          set -euxo pipefail

          {
            echo "===== vendor_dlkm ====="
            find stock_dump/vendor_dlkm -type f 2>/dev/null | sort || true
            echo
            echo "===== odm_dlkm ====="
            find stock_dump/odm_dlkm -type f 2>/dev/null | sort || true
            echo
            echo "===== mi_ext ====="
            find stock_dump/mi_ext -type f 2>/dev/null | sort || true
          } > reports/unsupported-partitions.txt

          echo "vendor_dlkm files:"
          find stock_dump/vendor_dlkm -type f 2>/dev/null | wc -l || true

          echo "odm_dlkm files:"
          find stock_dump/odm_dlkm -type f 2>/dev/null | wc -l || true

          echo "mi_ext files:"
          find stock_dump/mi_ext -type f 2>/dev/null | wc -l || true

      # ============================================================
      # 16. VERIFY VINTF
      # ============================================================

      - name: ✅ Verify VINTF restoration
        run: |
          set -euxo pipefail

          for file in \
            manifest_nonfc_dsds.xml \
            manifest_nonfc_ss.xml
          do
            test -f "$VENDOR_PATH/proprietary/odm/etc/vintf/$file"
          done

          echo "Manual VINTF restoration: PASS"

      # ============================================================
      # 17. VERIFY NO SYSTEM / PRODUCT CONTAMINATION
      # ============================================================

      - name: 🧪 Verify vendor tree contamination
        run: |
          set -euxo pipefail

          bad=0

          for dir in \
            system \
            system_ext \
            product \
            vendor_dlkm \
            odm_dlkm \
            mi_ext
          do
            if [ -e "$VENDOR_PATH/$dir" ]; then
              echo "ERROR: forbidden directory:"
              echo "$VENDOR_PATH/$dir"
              bad=1
            fi
          done

          if [ "$bad" -ne 0 ]; then
            exit 1
          fi

          echo "Vendor tree contamination: PASS"

      # ============================================================
      # 18. CREATE ROOT STAGING TREE
      # ============================================================

      - name: 📦 Stage vendor tree for repository root
        run: |
          set -euxo pipefail

          rm -rf generated_root
          mkdir -p generated_root

          # Copy EVERYTHING generated by extract-utils into a staging
          # directory. The staging directory will become the root
          # content of the repository.
          rsync -a \
            "$VENDOR_PATH/" \
            generated_root/

          echo "===== GENERATED ROOT ====="
          find generated_root -maxdepth 3 -type f | sort | head -300

      # ============================================================
      # 19. MOVE GENERATED TREE TO ROOT
      # ============================================================

      - name: 📁 Install vendor tree into repository root
        run: |
          set -euxo pipefail

          # Preserve GitHub workflow files and repository metadata.
          mkdir -p .github

          # Remove previous generated vendor-tree files/directories
          # only. Do NOT delete .git or .github.
          rm -f \
            Android.bp \
            Android.mk \
            BoardConfigVendor.mk \
            spinel-vendor.mk \
            proprietary-files.txt \
            extract-files.py \
            setup-makefiles.py

          rm -rf proprietary

          # Copy generated vendor tree directly to repository ROOT.
          rsync -a \
            generated_root/ \
            ./

          echo
          echo "===== FINAL REPOSITORY ROOT ====="

          find . \
            -maxdepth 3 \
            -type f \
            ! -path './.git/*' \
            ! -path './stock_dump/*' \
            ! -path './extract-utils/*' \
            ! -path './reports/*' \
            ! -path './generated_root/*' \
            | sort

      # ============================================================
      # 20. REMOVE WRONG NESTED vendor/xiaomi/spinel
      # ============================================================

      - name: 🗑️ Remove nested vendor/xiaomi/spinel
        run: |
          set -euxo pipefail

          # The generated tree MUST NOT remain under:
          #
          # vendor/xiaomi/spinel
          #
          # in the final repository.

          rm -rf vendor/xiaomi/spinel 2>/dev/null || true

          # Remove now-empty generated vendor hierarchy.
          find vendor/xiaomi -type d -empty -delete 2>/dev/null || true
          find vendor -type d -empty -delete 2>/dev/null || true

          if [ -d "vendor/xiaomi/spinel" ]; then
            echo "ERROR: vendor/xiaomi/spinel still exists"
            exit 1
          fi

          echo "Nested vendor/xiaomi/spinel: REMOVED"

      # ============================================================
      # 21. FINAL ROOT VALIDATION
      # ============================================================

      - name: 🔍 Validate final repository layout
        run: |
          set -euxo pipefail

          echo "===== ROOT ====="
          ls -la

          echo
          echo "===== REQUIRED FILES ====="

          required=(
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
            proprietary-files.txt
            extract-files.py
            setup-makefiles.py
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: missing root file: $file"
              exit 1
            fi
            echo "PASS: $file"
          done

          echo
          echo "===== REQUIRED DIRECTORIES ====="

          if [ ! -d proprietary ]; then
            echo "ERROR: proprietary directory missing"
            exit 1
          fi

          echo "PASS: proprietary/"

          echo
          echo "===== FORBIDDEN NESTED PATH ====="

          if [ -e vendor/xiaomi/spinel ]; then
            echo "ERROR: vendor/xiaomi/spinel exists"
            exit 1
          fi

          echo "PASS: vendor/xiaomi/spinel does not exist"

      # ============================================================
      # 22. ROOT TREE REPORT
      # ============================================================

      - name: 📊 Generate final report
        run: |
          set -euxo pipefail

          {
            echo "=========================================="
            echo " spinel Vendor Tree Build Report"
            echo "=========================================="
            echo
            echo "Device       : spinel"
            echo "Brand        : xiaomi"
            echo "Stock branch : $STOCK_BRANCH"
            echo "Extract utils: $EXTRACT_UTILS_BRANCH"
            echo
            echo "Final root files:"
            find . -maxdepth 1 -type f | sort
            echo
            echo "Proprietary files:"
            find proprietary -type f | wc -l
            echo
            echo "Vendor blobs:"
            find proprietary/vendor -type f 2>/dev/null | wc -l || true
            echo
            echo "ODM blobs:"
            find proprietary/odm -type f 2>/dev/null | wc -l || true
            echo
            echo "DLKM source files:"
            find stock_dump/vendor_dlkm -type f 2>/dev/null | wc -l || true
            find stock_dump/odm_dlkm -type f 2>/dev/null | wc -l || true
            echo
            echo "=========================================="
          } | tee reports/final-report.txt

      # ============================================================
      # 23. CLEAN TEMPORARY BUILD DATA
      # ============================================================

      - name: 🧹 Remove temporary build data
        run: |
          set -euxo pipefail

          rm -rf stock_dump
          rm -rf extract-utils
          rm -rf generated_root

          echo "Temporary build directories removed."

      # ============================================================
      # 24. GIT STATUS
      # ============================================================

      - name: 📋 Show Git status
        run: |
          set -euxo pipefail

          git status --short

          echo
          echo "===== ROOT TREE ====="

          find . \
            -maxdepth 3 \
            -type f \
            ! -path './.git/*' \
            | sort \
            | head -500

      # ============================================================
      # 25. COMMIT GENERATED TREE
      # ============================================================

      - name: 🚀 Commit generated vendor tree
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "vendor: generate spinel blobs from HyperOS 2"

          git push

      # ============================================================
      # 26. UPLOAD REPORTS
      # ============================================================

      - name: 📤 Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree-reports
          path: reports/
          if-no-files-found: warn

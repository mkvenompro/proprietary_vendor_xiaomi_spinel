name: "🧬 Build LineageOS Vendor Tree • spinel"

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVICE: spinel
  VENDOR: xiaomi

  DUMP_REPO: "https://gitlab.com/mkpromvp/dumber-2-mk.git"
  DUMP_BRANCH: "dump-redmi-spinel-os2.0.212.0.vpgmixm"

  DEVICE_TREE_REPO: "https://github.com/mkvenompro/android_device_xiaomi_spinel.git"
  DEVICE_TREE_BRANCH: "main"

  LINEAGE_BRANCH: "lineage-23.2"

jobs:
  build-vendor:
    name: "🧬 Generate LineageOS Vendor Tree"
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT CURRENT VENDOR REPOSITORY
      # ============================================================

      - name: "📥 Checkout vendor repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================

      - name: "🛠️ Install build dependencies"
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            python3 \
            python3-pip \
            python3-venv \
            python3-dev \
            rsync \
            unzip \
            zip \
            file \
            bc \
            cpio \
            lz4 \
            zstd \
            xz-utils \
            gzip \
            bzip2 \
            jq \
            tree \
            findutils \
            coreutils \
            binutils \
            binutils-aarch64-linux-gnu \
            elfutils \
            patchelf

          git lfs install

          python3 --version
          git --version
          rsync --version | head -1

      # ============================================================
      # 3. PREPARE WORKSPACE
      # ============================================================

      - name: "🧹 Prepare workspace"
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf stock_dump
          rm -rf vendor_work
          rm -rf lineage_source
          rm -rf extract_tree
          rm -rf reports

          mkdir -p stock_dump
          mkdir -p vendor_work
          mkdir -p lineage_source
          mkdir -p extract_tree
          mkdir -p reports

      # ============================================================
      # 4. CLONE DUMBER DUMP
      # ============================================================

      - name: "📦 Clone Xiaomi stock dump"
        shell: bash
        run: |
          set -euxo pipefail

          echo "=============================================="
          echo "Downloading Xiaomi Redmi Note 15 4G dump"
          echo "=============================================="

          git clone \
            --depth=1 \
            --single-branch \
            --branch "${DUMP_BRANCH}" \
            "${DUMP_REPO}" \
            stock_dump

          echo
          echo "Dump size:"
          du -sh stock_dump

          echo
          echo "Dump directories:"
          find stock_dump \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' \
            | sort

          echo
          echo "Dump files:"
          find stock_dump \
            -mindepth 1 \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      # ============================================================
      # 5. VERIFY DUMP
      # ============================================================

      - name: "🔍 Verify dump"
        shell: bash
        run: |
          set -euxo pipefail

          test -d stock_dump/vendor
          test -f stock_dump/proprietary-files.txt

          echo "✓ vendor/ exists"
          echo "✓ proprietary-files.txt exists"

          echo
          echo "Stock vendor size:"
          du -sh stock_dump/vendor

          if [ -d stock_dump/vendor_dlkm ]; then
            echo "vendor_dlkm detected"
          fi

          if [ -d stock_dump/odm_dlkm ]; then
            echo "odm_dlkm detected"
          fi

      # ============================================================
      # 6. CLONE LINEAGE EXTRACT-UTILS
      # ============================================================

      - name: "🧰 Prepare Lineage extract-utils"
        shell: bash
        run: |
          set -euxo pipefail

          cd lineage_source

          echo "Cloning LineageOS extract-utils..."

          git clone \
            --depth=1 \
            --branch "${LINEAGE_BRANCH}" \
            https://github.com/LineageOS/android_tools_extract-utils.git \
            tools/extract-utils

          echo
          echo "extract-utils:"
          find tools/extract-utils \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100

      # ============================================================
      # 7. BUILD CLEAN PROPRIETARY FILE LIST
      # ============================================================

      - name: "🧹 Generate clean proprietary-files.txt"
        shell: bash
        run: |
          set -euxo pipefail

          INPUT="stock_dump/proprietary-files.txt"
          OUTPUT="vendor_work/proprietary-files.txt"

          echo "Cleaning proprietary-files.txt..."

          python3 <<'PY'
          from pathlib import Path
          import re

          src = Path("stock_dump/proprietary-files.txt")
          out = Path("vendor_work/proprietary-files.txt")

          seen = set()
          cleaned = []

          def normalize(line):
              line = line.strip()

              if not line:
                  return None

              if line.startswith("#"):
                  return line

              # Remove Windows CR
              line = line.replace("\r", "")

              return line

          for raw in src.read_text(errors="ignore").splitlines():

              line = normalize(raw)

              if line is None:
                  continue

              # Keep comments
              if line.startswith("#"):
                  cleaned.append(line)
                  continue

              # Remove obvious metadata lines
              if line.startswith("PRODUCT_"):
                  continue

              # Ignore partition image files.
              # These do NOT belong inside vendor/xiaomi/spinel.
              if re.search(
                  r'(^|/)(boot|vendor_boot|recovery|dtbo|vbmeta)(\.img)?$',
                  line
              ):
                  continue

              # Ignore raw image archives
              if line.endswith(".img"):
                  continue

              # Destination is the part after ':'
              destination = line.split(":", 1)[-1]
              destination = destination.split("|", 1)[0]

              # Normalize leading slash
              destination = destination.lstrip("/")

              # Ignore obviously unrelated generated dump metadata
              if destination in {
                  "README.md",
                  "_dump_info.txt",
                  "all_files.txt",
                  "all_files.sha1",
                  "board-info.txt",
                  "ikconfig",
                  "kallsyms.txt",
                  "proprietary-files.sha1",
              }:
                  continue

              # Normalize duplicate whitespace
              line = re.sub(r"[ \t]+", " ", line)

              # Prevent duplicate exact entries
              key = line

              if key in seen:
                  continue

              seen.add(key)
              cleaned.append(line)

          # Keep comments, but collapse repeated blank/comment noise
          final = []
          last_blank = False

          for line in cleaned:
              if not line:
                  if last_blank:
                      continue
                  last_blank = True
              else:
                  last_blank = False

              final.append(line)

          out.write_text("\n".join(final) + "\n")

          print(f"Input lines : {len(src.read_text(errors='ignore').splitlines())}")
          print(f"Output lines: {len(final)}")
          PY

          echo
          echo "Clean list:"
          wc -l vendor_work/proprietary-files.txt

          echo
          echo "Duplicate destinations:"
          awk '
            !/^#/ && NF {
              x=$0
              sub(/\|.*/, "", x)
              if (index(x, ":")) {
                sub(/^.*:/, "", x)
              }
              print x
            }
          ' vendor_work/proprietary-files.txt \
            | sort \
            | uniq -d \
            | tee reports/duplicate-destinations.txt

          if [ -s reports/duplicate-destinations.txt ]; then
            echo "ERROR: duplicate destinations detected."
            exit 1
          fi

      # ============================================================
      # 8. VERIFY EVERY SOURCE EXISTS
      # ============================================================

      - name: "🔎 Verify proprietary source files"
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          dump = Path("stock_dump")
          lst = Path("vendor_work/proprietary-files.txt")

          missing = []
          checked = 0

          for raw in lst.read_text(errors="ignore").splitlines():

              line = raw.strip()

              if not line or line.startswith("#"):
                  continue

              checked += 1

              source = line.split(":", 1)[0]
              source = source.split("|", 1)[0]
              source = source.lstrip("/")

              # Skip metadata-like entries
              if source.startswith(("PRODUCT_", "FILE_")):
                  continue

              path = dump / source

              if not path.exists():
                  missing.append(source)

          print(f"Checked: {checked}")

          if missing:
              print()
              print("Missing files:")
              for x in missing[:200]:
                  print(x)

              Path("reports/missing-files.txt").write_text(
                  "\n".join(missing) + "\n"
              )

              print(f"\nMissing count: {len(missing)}")
              raise SystemExit(1)

          print("✓ All proprietary sources exist")
          PY

      # ============================================================
      # 9. CREATE TEMPORARY LINEAGE DEVICE TREE
      # ============================================================

      - name: "🌳 Prepare temporary extraction tree"
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p extract_tree

          cp vendor_work/proprietary-files.txt \
            extract_tree/proprietary-files.txt

          cp -r lineage_source/tools \
            extract_tree/tools

          cat > extract_tree/extract-files.py <<'PY'
          #!/usr/bin/env -S PYTHONPATH=./tools/extract-utils python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              add_firmware_proprietary_file=True,
          )

          if __name__ == "__main__":
              utils = ExtractUtils.device(module)
              utils.run()
          PY

          chmod +x extract_tree/extract-files.py

          cat > extract_tree/setup-makefiles.py <<'PY'
          #!/usr/bin/env python3

          import os
          import sys

          os.execv(
              "./extract-files.py",
              [
                  "./extract-files.py",
                  "--regenerate_makefiles",
              ],
          )
          PY

          chmod +x extract_tree/setup-makefiles.py

          echo
          echo "Temporary extraction tree:"
          find extract_tree -maxdepth 3 -type f | sort

      # ============================================================
      # 10. RUN EXTRACTION
      # ============================================================

      - name: "📦 Extract proprietary blobs"
        shell: bash
        run: |
          set -euxo pipefail

          cd extract_tree

          echo "Running Lineage extract-utils..."

          ./extract-files.py \
            "${GITHUB_WORKSPACE}/stock_dump"

          echo
          echo "Extraction completed."

          echo
          echo "Generated tree:"
          find vendor \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -200

      # ============================================================
      # 11. LOCATE GENERATED VENDOR TREE
      # ============================================================

      - name: "📂 Locate generated vendor tree"
        shell: bash
        run: |
          set -euxo pipefail

          FOUND=""

          if [ -d "extract_tree/vendor/xiaomi/spinel" ]; then
            FOUND="extract_tree/vendor/xiaomi/spinel"
          elif [ -d "extract_tree/vendor/xiaomi/spinel" ]; then
            FOUND="extract_tree/vendor/xiaomi/spinel"
          fi

          if [ -z "${FOUND}" ]; then
            echo "ERROR: vendor/xiaomi/spinel was not generated."

            echo
            echo "Available vendor trees:"
            find extract_tree/vendor \
              -maxdepth 4 \
              -type d \
              2>/dev/null \
              | sort || true

            exit 1
          fi

          echo "${FOUND}" > vendor_work/generated_vendor_path.txt

          echo "Generated vendor tree:"
          echo "${FOUND}"

      # ============================================================
      # 12. VALIDATE GENERATED TREE
      # ============================================================

      - name: "🧪 Validate generated vendor tree"
        shell: bash
        run: |
          set -euxo pipefail

          GENERATED="$(cat vendor_work/generated_vendor_path.txt)"

          test -d "${GENERATED}"

          FILE_COUNT="$(find "${GENERATED}" -type f | wc -l)"
          DIR_COUNT="$(find "${GENERATED}" -type d | wc -l)"

          echo "Files: ${FILE_COUNT}"
          echo "Dirs : ${DIR_COUNT}"

          if [ "${FILE_COUNT}" -eq 0 ]; then
            echo "ERROR: generated vendor tree is empty."
            exit 1
          fi

          echo "${FILE_COUNT}" > reports/generated-file-count.txt
          echo "${DIR_COUNT}" > reports/generated-dir-count.txt

      # ============================================================
      # 13. REMOVE EXTRACTION JUNK
      # ============================================================

      - name: "🧹 Clean generated vendor tree"
        shell: bash
        run: |
          set -euxo pipefail

          GENERATED="$(cat vendor_work/generated_vendor_path.txt)"

          find "${GENERATED}" \
            -type f \
            \( \
              -name "*.pyc" \
              -o -name "*.pyo" \
              -o -name ".DS_Store" \
              -o -name "Thumbs.db" \
            \) \
            -delete

          find "${GENERATED}" \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          # Never store extraction internals in the vendor repo.
          find "${GENERATED}" \
            -type d \
            -name ".git" \
            -prune \
            -exec rm -rf {} +

      # ============================================================
      # 14. CHECK DUPLICATE DESTINATIONS
      # ============================================================

      - name: "🔐 Check duplicate files"
        shell: bash
        run: |
          set -euxo pipefail

          GENERATED="$(cat vendor_work/generated_vendor_path.txt)"

          echo "Checking duplicate paths..."

          find "${GENERATED}" \
            -type f \
            -printf '%P\n' \
            | sort \
            | uniq -d \
            | tee reports/generated-duplicate-paths.txt

          if [ -s reports/generated-duplicate-paths.txt ]; then
            echo "ERROR: duplicate paths found."
            exit 1
          fi

          echo "✓ No duplicate destination paths."

      # ============================================================
      # 15. IDENTICAL BLOB AUDIT
      # ============================================================

      - name: "🧬 Audit identical blobs"
        shell: bash
        run: |
          set -euxo pipefail

          GENERATED="$(cat vendor_work/generated_vendor_path.txt)"

          find "${GENERATED}" \
            -type f \
            -print0 \
            | xargs -0 sha1sum \
            | sort \
            > reports/blob-sha1.txt

          awk '
          {
            hash=$1
            file=$2

            if (hash == prev) {
              if (!printed[hash]++) {
                print "HASH:", hash
                print "  " prevfile
              }
              print "  " file
            }

            prev=hash
            prevfile=file
          }
          ' reports/blob-sha1.txt \
          > reports/identical-blobs.txt

          echo
          echo "Identical-content files:"
          if [ -s reports/identical-blobs.txt ]; then
            cat reports/identical-blobs.txt
          else
            echo "None"
          fi

          echo
          echo "NOTE:"
          echo "Identical content on different paths is NOT automatically removed."
          echo "Both paths may be required by Android/vendor."

      # ============================================================
      # 16. ELF AUDIT
      # ============================================================

      - name: "🔬 ELF dependency audit"
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail

          GENERATED="$(cat vendor_work/generated_vendor_path.txt)"

          : > reports/elf-audit.txt

          while IFS= read -r -d '' file; do

            if file "$file" | grep -q "ELF"; then

              {
                echo "=================================================="
                echo "FILE: ${file}"
                echo "=================================================="

                file "$file"

                if command -v readelf >/dev/null 2>&1; then
                  readelf -d "$file" 2>/dev/null \
                    | grep -E "NEEDED|SONAME" \
                    || true
                fi

                echo

              } >> reports/elf-audit.txt

            fi

          done < <(
            find "${GENERATED}" \
              -type f \
              -print0
          )

      # ============================================================
      # 17. BROKEN SYMLINK AUDIT
      # ============================================================

      - name: "🔗 Check symlinks"
        shell: bash
        run: |
          set -euxo pipefail

          GENERATED="$(cat vendor_work/generated_vendor_path.txt)"

          find "${GENERATED}" \
            -type l \
            -printf '%p -> %l\n' \
            > reports/symlinks.txt

          BROKEN=0

          while IFS= read -r -d '' link; do
            if [ ! -e "${link}" ]; then
              echo "BROKEN: ${link}"
              BROKEN=$((BROKEN + 1))
            fi
          done < <(
            find "${GENERATED}" \
              -type l \
              -print0
          ) \
          | tee reports/broken-symlinks.txt

          if [ "${BROKEN}" -ne 0 ]; then
            echo "ERROR: ${BROKEN} broken symlinks."
            exit 1
          fi

          echo "✓ No broken symlinks."

      # ============================================================
      # 18. CHECK FILE SIZE LIMITS
      # ============================================================

      - name: "📏 Check GitHub file size limits"
        shell: bash
        run: |
          set -euxo pipefail

          GENERATED="$(cat vendor_work/generated_vendor_path.txt)"

          : > reports/large-files.txt

          while IFS= read -r -d '' file; do

            SIZE=$(stat -c '%s' "$file")

            # 90 MiB warning threshold
            if [ "${SIZE}" -ge $((90 * 1024 * 1024)) ]; then
              echo "${SIZE} ${file}" >> reports/large-files.txt
            fi

          done < <(
            find "${GENERATED}" \
              -type f \
              -print0
          )

          if [ -s reports/large-files.txt ]; then
            echo "WARNING: files close to GitHub 100MB limit:"
            cat reports/large-files.txt
          else
            echo "✓ No files close to GitHub's individual file limit."
          fi

      # ============================================================
      # 19. COPY TO FINAL VENDOR TREE
      # ============================================================

      - name: "📥 Install generated vendor tree"
        shell: bash
        run: |
          set -euxo pipefail

          GENERATED="$(cat vendor_work/generated_vendor_path.txt)"

          TMP_FINAL="vendor_work/final_vendor"

          rm -rf "${TMP_FINAL}"
          mkdir -p "${TMP_FINAL}"

          rsync -a \
            --delete \
            "${GENERATED}/" \
            "${TMP_FINAL}/"

          echo "Final tree prepared."

          echo
          echo "Final tree size:"
          du -sh "${TMP_FINAL}"

          echo
          echo "Final file count:"
          find "${TMP_FINAL}" -type f | wc -l

      # ============================================================
      # 20. FINAL STRUCTURE VALIDATION
      # ============================================================

      - name: "✅ Final vendor tree validation"
        shell: bash
        run: |
          set -euxo pipefail

          FINAL="vendor_work/final_vendor"

          test -d "${FINAL}"

          FILE_COUNT="$(find "${FINAL}" -type f | wc -l)"

          if [ "${FILE_COUNT}" -lt 10 ]; then
            echo "ERROR: suspiciously small vendor tree."
            exit 1
          fi

          echo "Final files: ${FILE_COUNT}"

          echo
          echo "Top-level directories:"
          find "${FINAL}" \
            -mindepth 1 \
            -maxdepth 2 \
            -type d \
            | sort \
            | head -100

      # ============================================================
      # 21. REPLACE REPOSITORY TREE ONLY AFTER SUCCESS
      # ============================================================

      - name: "🚚 Replace vendor/xiaomi/spinel"
        shell: bash
        run: |
          set -euxo pipefail

          FINAL="vendor_work/final_vendor"

          rm -rf vendor/xiaomi/spinel

          mkdir -p vendor/xiaomi/spinel

          rsync -a \
            "${FINAL}/" \
            vendor/xiaomi/spinel/

          echo
          echo "Installed:"
          du -sh vendor/xiaomi/spinel

      # ============================================================
      # 22. GENERATE BUILD INFO
      # ============================================================

      - name: "📝 Generate build information"
        shell: bash
        run: |
          set -euxo pipefail

          cat > reports/vendor-build-info.txt <<EOF
          Device: ${DEVICE}
          Vendor: ${VENDOR}

          Dump:
          ${DUMP_REPO}

          Dump branch:
          ${DUMP_BRANCH}

          Lineage branch:
          ${LINEAGE_BRANCH}

          Generated:
          $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          Git commit:
          $(git rev-parse HEAD)

          Vendor tree size:
          $(du -sh vendor/xiaomi/spinel | awk '{print $1}')

          Vendor file count:
          $(find vendor/xiaomi/spinel -type f | wc -l)

          Vendor directory count:
          $(find vendor/xiaomi/spinel -type d | wc -l)
          EOF

          cat reports/vendor-build-info.txt

      # ============================================================
      # 23. GIT STATUS
      # ============================================================

      - name: "📊 Show Git changes"
        shell: bash
        run: |
          set -euxo pipefail

          git status --short

          echo
          echo "Changed files:"
          git status --short | wc -l

      # ============================================================
      # 24. COMMIT
      # ============================================================

      - name: "💾 Commit vendor tree"
        shell: bash
        run: |
          set -euxo pipefail

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add vendor/xiaomi/spinel

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit \
            -m "vendor: xiaomi: spinel: update proprietary blobs"

      # ============================================================
      # 25. PUSH TO DEFAULT BRANCH
      # ============================================================

      - name: "🚀 Push vendor tree"
        shell: bash
        run: |
          set -euxo pipefail

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          echo "Pushing to default branch:"
          echo "${DEFAULT_BRANCH}"

          git push origin \
            "HEAD:${DEFAULT_BRANCH}"

      # ============================================================
      # 26. PACKAGE REPORTS
      # ============================================================

      - name: "📦 Package reports"
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports/package

          cp -a reports/. reports/package/ 2>/dev/null || true

          tar \
            -czf \
            "vendor-tree-reports-${DEVICE}.tar.gz" \
            -C reports \
            .

          echo
          echo "Report archive:"
          ls -lh "vendor-tree-reports-${DEVICE}.tar.gz"

      # ============================================================
      # 27. UPLOAD REPORTS
      # ============================================================

      - name: "📤 Upload reports"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "vendor-tree-${{ env.DEVICE }}-reports"
          path: |
            reports/
            vendor-tree-reports-${{ env.DEVICE }}.tar.gz
          if-no-files-found: warn
          retention-days: 30

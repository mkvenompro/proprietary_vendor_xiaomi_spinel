name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-vendor:
    name: 🧬 Generate LineageOS Vendor Tree
    runs-on: ubuntu-24.04

    env:
      DEVICE: spinel
      VENDOR: xiaomi

      DUMBER_REPO: https://gitlab.com/mkpromvp/dumber-2-mk.git
      DUMBER_BRANCH: dump-redmi-spinel-os2.0.212.0.vpgmixm

      EXTRACT_UTILS_REPO: https://github.com/LineageOS/android_tools_extract-utils.git
      EXTRACT_UTILS_BRANCH: lineage-23.2

      WORK_DIR: ${{ github.workspace }}/extract_tree
      STOCK_DUMP: ${{ github.workspace }}/stock_dump
      REPORT_DIR: ${{ github.workspace }}/reports
      GENERATED_VENDOR: ${{ github.workspace }}/generated_vendor

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: 📥 Checkout vendor repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================

      - name: 🧰 Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            python3 \
            python3-pip \
            python3-venv \
            file \
            rsync \
            unzip \
            zip \
            bc \
            cpio \
            lz4 \
            xz-utils \
            zstd \
            binutils \
            coreutils

          git lfs install

          python3 --version
          git --version
          git-lfs --version
          file --version | head -n 1

      # ============================================================
      # 3. CLEAN WORKSPACE
      # ============================================================

      - name: 🧹 Clean workspace
        shell: bash
        run: |
          set -e

          rm -rf "$WORK_DIR"
          rm -rf "$STOCK_DUMP"
          rm -rf "$REPORT_DIR"
          rm -rf "$GENERATED_VENDOR"

          mkdir -p "$WORK_DIR"
          mkdir -p "$STOCK_DUMP"
          mkdir -p "$REPORT_DIR"
          mkdir -p "$GENERATED_VENDOR"

      # ============================================================
      # 4. CLONE STOCK DUMP
      # ============================================================

      - name: 📦 Clone stock Dumber dump
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CLONING STOCK DUMP"
          echo "=========================================="

          git clone \
            --depth 1 \
            --branch "$DUMBER_BRANCH" \
            "$DUMBER_REPO" \
            "$STOCK_DUMP"

          echo
          echo "Stock dump:"
          du -sh "$STOCK_DUMP"

          echo
          echo "Top-level:"
          find "$STOCK_DUMP" -maxdepth 1 -mindepth 1 -printf '%f\n' | sort

      # ============================================================
      # 5. VERIFY STOCK DUMP
      # ============================================================

      - name: 🔎 Verify stock dump
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFY STOCK DUMP"
          echo "=========================================="

          test -d "$STOCK_DUMP/vendor"
          test -f "$STOCK_DUMP/proprietary-files.txt"

          echo "vendor/: PASS"
          echo "proprietary-files.txt: PASS"

          if [ -d "$STOCK_DUMP/odm" ]; then
            echo "odm/: present"
          fi

          if [ -d "$STOCK_DUMP/vendor_dlkm" ]; then
            echo "vendor_dlkm/: present"
          fi

          if [ -d "$STOCK_DUMP/odm_dlkm" ]; then
            echo "odm_dlkm/: present"
          fi

          echo
          echo "Stock metadata:"
          if [ -f "$STOCK_DUMP/README.md" ]; then
            sed -n '1,120p' "$STOCK_DUMP/README.md"
          fi

      # ============================================================
      # 6. CLONE LINEAGE EXTRACT-UTILS
      # ============================================================

      - name: 🧬 Clone LineageOS extract-utils
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CLONING EXTRACT-UTILS"
          echo "=========================================="

          git clone \
            --depth 1 \
            --branch "$EXTRACT_UTILS_BRANCH" \
            "$EXTRACT_UTILS_REPO" \
            "$WORK_DIR/tools/extract-utils"

          echo
          echo "extract-utils commit:"
          git -C "$WORK_DIR/tools/extract-utils" rev-parse HEAD

          echo
          echo "extract-utils branch:"
          git -C "$WORK_DIR/tools/extract-utils" branch --show-current

      # ============================================================
      # 7. CREATE EXTRACTION TREE
      # ============================================================

      - name: 🌳 Create extraction tree
        shell: bash
        run: |
          set -e

          mkdir -p "$WORK_DIR/device/$VENDOR/$DEVICE"
          mkdir -p "$WORK_DIR/vendor/$VENDOR/$DEVICE"

          echo "Extraction tree:"
          find "$WORK_DIR" -maxdepth 4 -type d | sort

      # ============================================================
      # 8. COPY ORIGINAL PROPRIETARY FILE LIST
      # ============================================================

      - name: 📋 Copy proprietary-files.txt
        shell: bash
        run: |
          set -e

          cp \
            "$STOCK_DUMP/proprietary-files.txt" \
            "$WORK_DIR/device/$VENDOR/$DEVICE/proprietary-files.original.txt"

          echo "Original proprietary list:"
          wc -l \
            "$WORK_DIR/device/$VENDOR/$DEVICE/proprietary-files.original.txt"

      # ============================================================
      # 9. NORMALIZE PROPRIETARY LIST
      # ============================================================

      - name: 🧹 Normalize proprietary-files.txt
        shell: bash
        run: |
          set -e

          ORIGINAL="$WORK_DIR/device/$VENDOR/$DEVICE/proprietary-files.original.txt"
          FINAL="$WORK_DIR/device/$VENDOR/$DEVICE/proprietary-files.txt"

          mkdir -p "$REPORT_DIR"

          python3 - "$ORIGINAL" "$FINAL" "$STOCK_DUMP" "$REPORT_DIR" <<'PY'
          import os
          import sys

          original = sys.argv[1]
          final = sys.argv[2]
          stock = sys.argv[3]
          report_dir = sys.argv[4]

          forbidden_partitions = {
              "system",
              "system_ext",
              "product",
          }

          unsupported_partitions = {
              "vendor_dlkm",
              "odm_dlkm",
          }

          supported_partitions = {
              "vendor",
              "odm",
              "recovery",
          }

          missing = []
          removed_system = []
          removed_unsupported = []
          removed_unknown = []
          duplicate_destinations = []

          output = []
          seen_dst = set()

          with open(original, "r", encoding="utf-8", errors="replace") as f:
              lines = f.readlines()

          for raw in lines:
              line = raw.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              # Remove all package markers.
              #
              # We intentionally regenerate this vendor list as a clean
              # generated tree. ELF/APK/JAR/APEX classification is handled
              # by extract-utils itself.
              while line.startswith("-"):
                  line = line[1:]

              if not line:
                  continue

              # Separate hash.
              spec = line.split("|", 1)[0]

              # Separate source/destination.
              source = spec.split(":", 1)[0]

              # Remove extract-utils arguments from destination/source.
              source = source.split(";", 1)[0]

              destination = spec.split(":", 1)[1] if ":" in spec else source
              destination = destination.split(";", 1)[0]

              source_partition = source.split("/", 1)[0]
              destination_partition = destination.split("/", 1)[0]

              # ------------------------------------------------------
              # Remove system/system_ext/product
              # ------------------------------------------------------

              if (
                  source_partition in forbidden_partitions
                  or destination_partition in forbidden_partitions
              ):
                  removed_system.append(line)
                  continue

              # ------------------------------------------------------
              # Remove unsupported DLKM partitions
              # ------------------------------------------------------

              if (
                  source_partition in unsupported_partitions
                  or destination_partition in unsupported_partitions
              ):
                  removed_unsupported.append(line)
                  continue

              # ------------------------------------------------------
              # Reject completely unknown partitions
              # ------------------------------------------------------

              if (
                  source_partition not in supported_partitions
                  or destination_partition not in supported_partitions
              ):
                  removed_unknown.append(line)
                  continue

              # ------------------------------------------------------
              # Source must exist
              # ------------------------------------------------------

              source_path = os.path.join(stock, source)

              if not os.path.exists(source_path):
                  missing.append(line)
                  continue

              # ------------------------------------------------------
              # Deduplicate destination
              # ------------------------------------------------------

              if destination in seen_dst:
                  duplicate_destinations.append(line)
                  continue

              seen_dst.add(destination)
              output.append(line)

          output.sort()

          with open(final, "w", encoding="utf-8") as f:
              for line in output:
                  f.write(line + "\n")

          def write_report(name, values):
              path = os.path.join(report_dir, name)
              with open(path, "w", encoding="utf-8") as f:
                  for value in values:
                      f.write(value + "\n")

          write_report("removed_system.txt", removed_system)
          write_report("removed_dlkm.txt", removed_unsupported)
          write_report("removed_unknown_partitions.txt", removed_unknown)
          write_report("missing_sources.txt", missing)
          write_report("duplicate_destinations.txt", duplicate_destinations)

          print("==========================================")
          print("NORMALIZATION SUMMARY")
          print("==========================================")
          print(f"Original entries:       {len(lines)}")
          print(f"Final entries:          {len(output)}")
          print(f"Removed system:         {len(removed_system)}")
          print(f"Removed DLKM:           {len(removed_unsupported)}")
          print(f"Removed unknown:        {len(removed_unknown)}")
          print(f"Missing sources:        {len(missing)}")
          print(f"Duplicate destinations:{len(duplicate_destinations)}")
          print("==========================================")

          if removed_unknown:
              print()
              print("UNKNOWN PARTITIONS:")
              for item in removed_unknown[:100]:
                  print("  " + item)

          if missing:
              print()
              print("MISSING SOURCES:")
              for item in missing[:100]:
                  print("  " + item)

          # Missing source files are not allowed.
          if missing:
              print()
              print("ERROR: Missing source files detected.")
              sys.exit(1)
          PY

          echo
          echo "Final proprietary list:"
          wc -l "$WORK_DIR/device/$VENDOR/$DEVICE/proprietary-files.txt"

      # ============================================================
      # 10. VALIDATE PARTITIONS
      # ============================================================

      - name: ✅ Validate proprietary list
        shell: bash
        run: |
          set -e

          LIST="$WORK_DIR/device/$VENDOR/$DEVICE/proprietary-files.txt"

          echo "=========================================="
          echo "VALIDATING PROPRIETARY LIST"
          echo "=========================================="

          python3 - "$LIST" "$STOCK_DUMP" <<'PY'
          import os
          import sys

          list_file = sys.argv[1]
          stock = sys.argv[2]

          forbidden = (
              "system/",
              "system_ext/",
              "product/",
              "vendor_dlkm/",
              "odm_dlkm/",
          )

          entries = []
          errors = []

          with open(list_file, "r", encoding="utf-8", errors="replace") as f:
              for lineno, raw in enumerate(f, 1):
                  line = raw.strip()

                  if not line or line.startswith("#"):
                      continue

                  entries.append((lineno, line))

                  if line.startswith("-"):
                      errors.append(
                          f"line {lineno}: leading '-' remains: {line}"
                      )

                  source = line.split("|", 1)[0]
                  source = source.split(":", 1)[0]
                  source = source.split(";", 1)[0]

                  if source.startswith(forbidden):
                      errors.append(
                          f"line {lineno}: forbidden partition: {line}"
                      )

                  path = os.path.join(stock, source)

                  if not os.path.exists(path):
                      errors.append(
                          f"line {lineno}: missing source: {source}"
                      )

          print(f"Entries checked: {len(entries)}")
          print(f"Errors:          {len(errors)}")

          if errors:
              print()
              for error in errors[:200]:
                  print(error)

              sys.exit(1)

          print("VALIDATION: PASS")
          PY

      # ============================================================
      # 11. CREATE extract-files.py
      # ============================================================

      - name: 🐍 Generate extract-files.py
        shell: bash
        run: |
          set -e

          DEVICE_DIR="$WORK_DIR/device/$VENDOR/$DEVICE"

          cat > "$DEVICE_DIR/extract-files.py" <<'PY'
          #!/usr/bin/env -S PYTHONPATH=../../../tools/extract-utils python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          DEVICE = "spinel"
          VENDOR = "xiaomi"

          module = ExtractUtilsModule(
              DEVICE,
              VENDOR,
              check_elf=True,
          )

          if __name__ == "__main__":
              utils = ExtractUtils.device(module)
              utils.run()
          PY

          chmod +x "$DEVICE_DIR/extract-files.py"

          echo "Generated:"
          cat "$DEVICE_DIR/extract-files.py"

      # ============================================================
      # 12. EXTRACT-UTILS IMPORT TEST
      # ============================================================

      - name: 🧪 Test extract-utils imports
        shell: bash
        working-directory: ${{ env.WORK_DIR }}/device/xiaomi/spinel
        run: |
          set -e

          export PYTHONPATH="$WORK_DIR/tools/extract-utils"

          python3 - <<'PY'
          import extract_utils

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          from extract_utils.file import (
              FileList,
              File,
          )

          print("extract_utils:", extract_utils.__file__)
          print("ExtractUtils:", ExtractUtils)
          print("ExtractUtilsModule:", ExtractUtilsModule)
          print("FileList:", FileList)
          print("File:", File)

          print()
          print("EXTRACT-UTILS IMPORT TEST: PASS")
          PY

      # ============================================================
      # 13. DRY RUN FILE LIST PARSER
      # ============================================================

      - name: 🧪 Dry-run FileList parser
        shell: bash
        working-directory: ${{ env.WORK_DIR }}/device/xiaomi/spinel
        run: |
          set -e

          export PYTHONPATH="$WORK_DIR/tools/extract-utils"

          python3 - <<'PY'
          from extract_utils.file import FileList

          list_file = "proprietary-files.txt"

          file_list = FileList(
              check_elf=True,
          )

          file_list.add_from_file(list_file)

          print("==========================================")
          print("FILELIST PARSER")
          print("==========================================")

          print("Partitions:")
          for partition in sorted(file_list.partitions):
              print("  " + partition)

          print()
          print("Package files:", len(list(file_list.package_files)))
          print("Copy files:", len(list(file_list.copy_files)))
          print("All files:", len(list(file_list.all_files)))

          print()
          print("FILELIST PARSER: PASS")
          PY

      # ============================================================
      # 14. PREPARE EXTRACTION OUTPUT
      # ============================================================

      - name: 🧹 Prepare vendor extraction output
        shell: bash
        run: |
          set -e

          rm -rf "$WORK_DIR/vendor/$VENDOR/$DEVICE"

          mkdir -p \
            "$WORK_DIR/vendor/$VENDOR/$DEVICE"

      # ============================================================
      # 15. RUN EXTRACTION
      # ============================================================

      - name: 🚀 Extract proprietary blobs
        shell: bash
        working-directory: ${{ env.WORK_DIR }}/device/xiaomi/spinel
        run: |
          set -e

          export PYTHONPATH="$WORK_DIR/tools/extract-utils"

          echo "=========================================="
          echo "STARTING EXTRACTION"
          echo "=========================================="

          python3 ./extract-files.py "$STOCK_DUMP"

      # ============================================================
      # 16. VERIFY GENERATED MAKEFILES
      # ============================================================

      - name: 🔎 Verify generated vendor makefiles
        shell: bash
        run: |
          set -e

          VENDOR_DIR="$WORK_DIR/vendor/$VENDOR/$DEVICE"

          echo "=========================================="
          echo "VERIFY GENERATED VENDOR TREE"
          echo "=========================================="

          echo
          echo "Vendor tree:"
          du -sh "$VENDOR_DIR"

          echo
          echo "Files:"
          find "$VENDOR_DIR" -type f | wc -l

          echo
          echo "Generated files:"

          REQUIRED_FILES=(
            "Android.bp"
            "Android.mk"
            "BoardConfigVendor.mk"
            "spinel-vendor.mk"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$VENDOR_DIR/$file" ]; then
              echo "  PASS: $file"
            else
              echo "  FAIL: $file"
              exit 1
            fi
          done

      # ============================================================
      # 17. AUDIT UNKNOWN / PARTITIONS
      # ============================================================

      - name: 🔬 Audit generated tree
        shell: bash
        run: |
          set -e

          VENDOR_DIR="$WORK_DIR/vendor/$VENDOR/$DEVICE"

          echo "=========================================="
          echo "AUDIT GENERATED TREE"
          echo "=========================================="

          mkdir -p "$REPORT_DIR"

          find "$VENDOR_DIR" -type f \
            | sed "s#^$VENDOR_DIR/##" \
            | sort \
            > "$REPORT_DIR/generated_files.txt"

          echo
          echo "Generated file count:"
          wc -l "$REPORT_DIR/generated_files.txt"

          echo
          echo "Top directories:"
          find "$VENDOR_DIR" -mindepth 1 -maxdepth 2 -type d \
            | sed "s#^$VENDOR_DIR##" \
            | sort \
            | head -200

          echo
          echo "Unexpected system/product paths:"
          grep -E '(^|/)(system|system_ext|product)/' \
            "$REPORT_DIR/generated_files.txt" \
            > "$REPORT_DIR/forbidden_generated_paths.txt" || true

          if [ -s "$REPORT_DIR/forbidden_generated_paths.txt" ]; then
            cat "$REPORT_DIR/forbidden_generated_paths.txt"
            echo "ERROR: forbidden generated paths found."
            exit 1
          fi

          echo "Forbidden paths: PASS"

      # ============================================================
      # 18. VERIFY PROPRIETARY SOURCES
      # ============================================================

      - name: 🔐 Verify every proprietary source
        shell: bash
        run: |
          set -e

          LIST="$WORK_DIR/device/$VENDOR/$DEVICE/proprietary-files.txt"

          python3 - "$LIST" "$VENDOR_DIR" "$STOCK_DUMP" "$REPORT_DIR" <<'PY'
          import os
          import sys

          list_file = sys.argv[1]
          vendor_dir = sys.argv[2]
          stock = sys.argv[3]
          report_dir = sys.argv[4]

          missing_generated = []
          total = 0

          with open(list_file, "r", encoding="utf-8", errors="replace") as f:
              for raw in f:
                  line = raw.strip()

                  if not line or line.startswith("#"):
                      continue

                  total += 1

                  spec = line.split("|", 1)[0]

                  source = spec.split(":", 1)[0]
                  source = source.split(";", 1)[0]

                  destination = (
                      spec.split(":", 1)[1]
                      if ":" in spec
                      else source
                  )

                  destination = destination.split(";", 1)[0]

                  src_path = os.path.join(stock, source)
                  dst_path = os.path.join(vendor_dir, destination)

                  if not os.path.exists(src_path):
                      missing_generated.append(
                          f"SOURCE MISSING: {source}"
                      )
                      continue

                  if not os.path.exists(dst_path):
                      missing_generated.append(
                          f"GENERATED MISSING: {destination}"
                      )

          with open(
              os.path.join(report_dir, "unextracted.txt"),
              "w",
              encoding="utf-8",
          ) as f:
              for item in missing_generated:
                  f.write(item + "\n")

          print("==========================================")
          print("EXTRACTION VERIFICATION")
          print("==========================================")
          print(f"Entries:  {total}")
          print(f"Missing:  {len(missing_generated)}")

          if missing_generated:
              print()
              for item in missing_generated[:200]:
                  print(item)

              raise SystemExit(1)

          print("ALL PROPRIETARY ENTRIES VERIFIED")
          PY

      # ============================================================
      # 19. HASH / DUPLICATE AUDIT
      # ============================================================

      - name: 🔐 Audit duplicate content
        shell: bash
        run: |
          set -e

          VENDOR_DIR="$WORK_DIR/vendor/$VENDOR/$DEVICE"

          python3 - "$VENDOR_DIR" "$REPORT_DIR" <<'PY'
          import hashlib
          import os
          import sys
          from collections import defaultdict

          vendor_dir = sys.argv[1]
          report_dir = sys.argv[2]

          hashes = defaultdict(list)

          for root, dirs, files in os.walk(vendor_dir):
              for name in files:
                  path = os.path.join(root, name)

                  h = hashlib.sha256()

                  try:
                      with open(path, "rb") as f:
                          while True:
                              chunk = f.read(1024 * 1024)

                              if not chunk:
                                  break

                              h.update(chunk)
                  except OSError:
                      continue

                  rel = os.path.relpath(path, vendor_dir)
                  hashes[h.hexdigest()].append(rel)

          duplicates = {
              digest: paths
              for digest, paths in hashes.items()
              if len(paths) > 1
          }

          output = os.path.join(
              report_dir,
              "duplicate-content.txt",
          )

          with open(output, "w", encoding="utf-8") as f:
              for digest, paths in sorted(duplicates.items()):
                  f.write(digest + "\n")

                  for path in sorted(paths):
                      f.write("  " + path + "\n")

                  f.write("\n")

          print("Unique SHA256:", len(hashes))
          print("Duplicate groups:", len(duplicates))
          print("Report:", output)
          PY

      # ============================================================
      # 20. ELF AUDIT
      # ============================================================

      - name: 🧬 Audit ELF blobs
        shell: bash
        run: |
          set -e

          VENDOR_DIR="$WORK_DIR/vendor/$VENDOR/$DEVICE"

          {
            echo "ELF FILES"
            echo "========="
            echo

            find "$VENDOR_DIR" -type f -print0 |
              while IFS= read -r -d '' file; do
                if file "$file" | grep -q "ELF"; then
                  echo "${file#$VENDOR_DIR/}"
                  file "$file"
                  echo
                fi
              done
          } > "$REPORT_DIR/elf-files.txt"

          echo "ELF audit written:"
          wc -l "$REPORT_DIR/elf-files.txt"

      # ============================================================
      # 21. SYMLINK AUDIT
      # ============================================================

      - name: 🔗 Audit symlinks
        shell: bash
        run: |
          set -e

          VENDOR_DIR="$WORK_DIR/vendor/$VENDOR/$DEVICE"

          find "$VENDOR_DIR" -type l -printf '%p -> %l\n' \
            > "$REPORT_DIR/symlinks.txt" || true

          echo "Symlinks:"
          cat "$REPORT_DIR/symlinks.txt" || true

      # ============================================================
      # 22. DLKM REPORT
      # ============================================================

      - name: 🧩 Save DLKM report
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DLKM CONTENT"
          echo "=========================================="

          {
            echo "vendor_dlkm"
            echo "============"
            echo

            if [ -d "$STOCK_DUMP/vendor_dlkm" ]; then
              find "$STOCK_DUMP/vendor_dlkm" \
                -type f \
                -printf '%P\n' \
                | sort
            else
              echo "(not present)"
            fi

            echo
            echo "odm_dlkm"
            echo "========"
            echo

            if [ -d "$STOCK_DUMP/odm_dlkm" ]; then
              find "$STOCK_DUMP/odm_dlkm" \
                -type f \
                -printf '%P\n' \
                | sort
            else
              echo "(not present)"
            fi
          } > "$REPORT_DIR/dlkm-content.txt"

          cat "$REPORT_DIR/dlkm-content.txt"

      # ============================================================
      # 23. GENERATE STATS
      # ============================================================

      - name: 📊 Generate vendor statistics
        shell: bash
        run: |
          set -e

          VENDOR_DIR="$WORK_DIR/vendor/$VENDOR/$DEVICE"

          python3 - "$VENDOR_DIR" "$REPORT_DIR" <<'PY'
          import os
          import sys
          from collections import Counter

          vendor_dir = sys.argv[1]
          report_dir = sys.argv[2]

          files = []
          sizes = 0
          extensions = Counter()

          for root, dirs, names in os.walk(vendor_dir):
              for name in names:
                  path = os.path.join(root, name)

                  try:
                      size = os.path.getsize(path)
                  except OSError:
                      size = 0

                  rel = os.path.relpath(path, vendor_dir)

                  files.append(rel)
                  sizes += size

                  if "." in name:
                      extensions[os.path.splitext(name)[1]] += 1
                  else:
                      extensions["<no extension>"] += 1

          report = os.path.join(
              report_dir,
              "statistics.txt",
          )

          with open(report, "w", encoding="utf-8") as f:
              f.write("SPINEL VENDOR TREE STATISTICS\n")
              f.write("=============================\n\n")
              f.write(f"Files: {len(files)}\n")
              f.write(f"Bytes: {sizes}\n")
              f.write(f"MiB:   {sizes / 1024 / 1024:.2f}\n\n")

              f.write("Extensions:\n")

              for ext, count in extensions.most_common():
                  f.write(f"{ext}: {count}\n")

          cat = open(report, "r", encoding="utf-8").read()
          print(cat)
          PY

      # ============================================================
      # 24. PREPARE GENERATED VENDOR TREE
      # ============================================================

      - name: 📦 Prepare final vendor tree
        shell: bash
        run: |
          set -e

          rm -rf "$GENERATED_VENDOR"
          mkdir -p "$GENERATED_VENDOR"

          rsync -a \
            "$WORK_DIR/vendor/$VENDOR/$DEVICE/" \
            "$GENERATED_VENDOR/"

          cp \
            "$WORK_DIR/device/$VENDOR/$DEVICE/proprietary-files.txt" \
            "$GENERATED_VENDOR/proprietary-files.txt"

          cp \
            "$WORK_DIR/device/$VENDOR/$DEVICE/proprietary-files.original.txt" \
            "$GENERATED_VENDOR/proprietary-files.original.txt"

          echo "Final generated vendor tree:"
          du -sh "$GENERATED_VENDOR"

          echo
          find "$GENERATED_VENDOR" \
            -maxdepth 2 \
            -type f \
            -printf '%P\n' \
            | sort \
            | head -200

      # ============================================================
      # 25. COPY TREE INTO REPOSITORY
      # ============================================================

      - name: 📁 Install generated tree into repository
        shell: bash
        run: |
          set -e

          TARGET="vendor/$VENDOR/$DEVICE"

          rm -rf "$TARGET"
          mkdir -p "$TARGET"

          rsync -a \
            "$GENERATED_VENDOR/" \
            "$TARGET/"

          echo "Repository vendor tree:"
          du -sh "$TARGET"

          echo
          find "$TARGET" -type f | wc -l

      # ============================================================
      # 26. GIT STATUS
      # ============================================================

      - name: 🔎 Git status
        shell: bash
        run: |
          set -e

          git status --short

          echo
          echo "Changed files:"
          git status --short | wc -l

      # ============================================================
      # 27. COMMIT
      # ============================================================

      - name: 💾 Commit vendor tree
        shell: bash
        run: |
          set -e

          git config user.name "MKVenomPro"
          git config user.email "mkvenompro@users.noreply.github.com"

          git add \
            vendor/xiaomi/spinel

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "vendor: initial proprietary tree for spinel"

      # ============================================================
      # 28. PUSH
      # ============================================================

      - name: 🚀 Push vendor tree
        shell: bash
        run: |
          set -e

          BRANCH="${GITHUB_REF_NAME}"

          echo "Pushing branch:"
          echo "$BRANCH"

          git push origin \
            "HEAD:$BRANCH"

      # ============================================================
      # 29. BUILD FINAL REPORT
      # ============================================================

      - name: 📋 Generate final report
        if: always()
        shell: bash
        run: |
          set -e

          mkdir -p "$REPORT_DIR"

          {
            echo "=========================================="
            echo "SPINEL LINEAGEOS VENDOR TREE REPORT"
            echo "=========================================="
            echo
            echo "Device:             $DEVICE"
            echo "Vendor:             $VENDOR"
            echo "Dumber branch:      $DUMBER_BRANCH"
            echo "Extract-utils:      $EXTRACT_UTILS_BRANCH"
            echo
            echo "Generated vendor:"
            du -sh "$WORK_DIR/vendor/$VENDOR/$DEVICE" 2>/dev/null || true
            echo
            echo "Generated files:"
            find "$WORK_DIR/vendor/$VENDOR/$DEVICE" \
              -type f 2>/dev/null | wc -l || true
            echo
            echo "=========================================="
            echo "REPORT FILES"
            echo "=========================================="

            find "$REPORT_DIR" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort

          } > "$REPORT_DIR/final-report.txt"

          cat "$REPORT_DIR/final-report.txt"

      # ============================================================
      # 30. UPLOAD REPORTS
      # ============================================================

      - name: 📤 Upload vendor tree reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree-reports
          path: |
            ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 31. UPLOAD GENERATED VENDOR TREE
      # ============================================================

      - name: 📤 Upload generated vendor tree
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spinel-generated-vendor-tree
          path: |
            ${{ env.GENERATED_VENDOR }}/
          if-no-files-found: error
          retention-days: 14

name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:
    inputs:
      STOCK_FASTBOOT_URL:
        description: "Official Xiaomi Fastboot ROM URL"
        required: false
        default: "https://bigota.d.miui.com/OS2.0.212.0.VPGMIXM/spinel_global_images_OS2.0.212.0.VPGMIXM_20260311.0000.00_15.0_global_1e7d24d317.tgz"

      STOCK_DUMP_URL:
        description: "Stock dump repository"
        required: false
        default: "https://gitlab.com/mkpromvp/dumber-2-mk.git"

      STOCK_DUMP_BRANCH:
        description: "Stock dump branch"
        required: false
        default: "dump-redmi-spinel-os2.0.212.0.vpgmixm"

      EXTRACT_UTILS_URL:
        description: "Lineage extract-utils repository"
        required: false
        default: "https://github.com/LineageOS/android_tools_extract-utils.git"

      EXTRACT_UTILS_BRANCH:
        description: "extract-utils branch"
        required: false
        default: "lineage-23.2"

      UPLOAD_ARTIFACTS:
        description: "Upload generated vendor tree as artifact"
        required: false
        type: boolean
        default: true

      COMMIT_CHANGES:
        description: "Commit generated vendor tree"
        required: false
        type: boolean
        default: true


jobs:
  generate:
    name: 🧬 Generate Vendor Tree
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      DEVICE: spinel
      VENDOR: xiaomi
      DEVICE_PATH: device/xiaomi/spinel

      STOCK_DUMP_DIR: stock_dump
      EXTRACT_UTILS_DIR: extract-utils
      ROM_DIR: fastboot_rom

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================
      - name: 📦 Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            python3 \
            python3-pip \
            python3-venv \
            rsync \
            curl \
            wget \
            unzip \
            p7zip-full \
            lz4 \
            brotli \
            zstd \
            file \
            cpio \
            xz-utils

          git lfs install

      # ============================================================
      # 3. SHOW ENVIRONMENT
      # ============================================================
      - name: 🔎 Show environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== ENVIRONMENT ====="
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "DEVICE_PATH=$DEVICE_PATH"
          echo "PWD=$(pwd)"
          echo

          git --version
          python3 --version
          curl --version | head -n 1
          echo

          echo "===== REPOSITORY ====="
          find . -maxdepth 3 -type f | sort | head -n 200 || true

      # ============================================================
      # 4. CLONE STOCK DUMP
      # ============================================================
      - name: 📦 Clone stock dump
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$STOCK_DUMP_DIR"

          git clone \
            --depth 1 \
            --branch "${{ inputs.STOCK_DUMP_BRANCH }}" \
            "${{ inputs.STOCK_DUMP_URL }}" \
            "$STOCK_DUMP_DIR"

          echo "===== STOCK DUMP IDENTITY ====="

          if [ -f "$STOCK_DUMP_DIR/build.prop" ]; then
            grep -E \
              'ro.build.version.release|ro.build.version.incremental|ro.product.device|ro.product.name|ro.board.platform' \
              "$STOCK_DUMP_DIR/build.prop" || true
          fi

          find "$STOCK_DUMP_DIR" -maxdepth 2 -type d | sort | head -n 100

      # ============================================================
      # 5. CLONE EXTRACT-UTILS
      # ============================================================
      - name: 🧰 Clone extract-utils
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$EXTRACT_UTILS_DIR"

          git clone \
            --depth 1 \
            --branch "${{ inputs.EXTRACT_UTILS_BRANCH }}" \
            "${{ inputs.EXTRACT_UTILS_URL }}" \
            "$EXTRACT_UTILS_DIR"

          echo "===== EXTRACT-UTILS ====="
          git -C "$EXTRACT_UTILS_DIR" rev-parse HEAD
          git -C "$EXTRACT_UTILS_DIR" branch --show-current

          test -f "$EXTRACT_UTILS_DIR/extract_utils/main.py"

      # ============================================================
      # 6. PYTHONPATH
      # ============================================================
      - name: 🐍 Configure extract-utils Python path
        shell: bash
        run: |
          set -euxo pipefail

          EXTRACT_UTILS_ROOT="$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR"

          echo "PYTHONPATH=$EXTRACT_UTILS_ROOT${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

          export PYTHONPATH="$EXTRACT_UTILS_ROOT${PYTHONPATH:+:$PYTHONPATH}"

          echo "PYTHONPATH=$PYTHONPATH"

          python3 - <<'PY'
          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print("ExtractUtils: OK")
          print("ExtractUtilsModule: OK")
          print("extract-utils is ready.")
          PY

      # ============================================================
      # 7. STOCK FASTBOOT ROM
      # ============================================================
      - name: 📥 Download official Fastboot ROM
        shell: bash
        run: |
          set -euxo pipefail

          URL="${{ inputs.STOCK_FASTBOOT_URL }}"

          if [ -z "$URL" ]; then
            echo "No Fastboot ROM URL supplied."
            exit 0
          fi

          mkdir -p "$ROM_DIR"

          echo "===== DOWNLOADING FASTBOOT ROM ====="
          echo "$URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 7200 \
            --continue-at - \
            --output "$ROM_DIR/stock.tgz" \
            "$URL"

          echo
          echo "===== FASTBOOT ROM SIZE ====="
          du -h "$ROM_DIR/stock.tgz"

      # ============================================================
      # 8. EXTRACT FASTBOOT ROM
      # ============================================================
      - name: 📦 Extract Fastboot ROM
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f "$ROM_DIR/stock.tgz" ]; then
            echo "Fastboot ROM not available."
            exit 0
          fi

          mkdir -p "$ROM_DIR/extracted"

          echo "===== EXTRACTING FASTBOOT ROM ====="

          tar \
            -xzf "$ROM_DIR/stock.tgz" \
            -C "$ROM_DIR/extracted" \
            || {
              echo "tar extraction failed."
              echo "Trying 7z..."
              7z x "$ROM_DIR/stock.tgz" -o"$ROM_DIR/extracted"
            }

          echo "===== FASTBOOT CONTENT ====="
          find "$ROM_DIR/extracted" -maxdepth 3 -type f | sort | head -n 300 || true

      # ============================================================
      # 9. STOCK IDENTITY
      # ============================================================
      - name: 🔐 Verify stock identity
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== STOCK IDENTITY ====="

          echo "Expected:"
          echo "  Device       : spinel"
          echo "  Platform     : mt6789"
          echo "  Android      : 15"
          echo "  Build        : OS2.0.212.0.VPGMIXM"
          echo "  Kernel       : 5.10.236"
          echo

          echo "===== DUMP MATCHES ====="

          grep -R \
            -E \
            "spinel|mt6789|OS2.0.212.0.VPGMIXM|5.10.236" \
            "$STOCK_DUMP_DIR" \
            --include='build.prop' \
            --include='*.prop' \
            2>/dev/null \
            | head -n 100 || true

          echo
          echo "===== FASTBOOT MATCHES ====="

          grep -R \
            -E \
            "spinel|mt6789|OS2.0.212.0.VPGMIXM" \
            "$ROM_DIR/extracted" \
            2>/dev/null \
            | head -n 100 || true

      # ============================================================
      # 10. DISCOVER RADIO FIRMWARE
      # ============================================================
      - name: 📡 Discover radio firmware
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p radio
          rm -f radio/*

          echo "===== SEARCHING RADIO FIRMWARE ====="

          find "$STOCK_DUMP_DIR" "$ROM_DIR/extracted" \
            -type f \
            \( \
              -name 'dpm.img' \
              -o -name 'gz.img' \
              -o -name 'lk.img' \
              -o -name 'mcupm.img' \
              -o -name 'md1img.img' \
              -o -name 'pi_img.img' \
              -o -name 'preloader_raw.img' \
              -o -name 'scp.img' \
              -o -name 'spmfw.img' \
              -o -name 'sspm.img' \
              -o -name 'tee.img' \
            \) \
            -print \
            | sort -u \
            > reports-radio-candidates.txt

          cat reports-radio-candidates.txt || true

          while IFS= read -r SRC; do
            [ -z "$SRC" ] && continue

            BASENAME="$(basename "$SRC")"

            if [ ! -f "radio/$BASENAME" ]; then
              cp -v "$SRC" "radio/$BASENAME"
            fi
          done < reports-radio-candidates.txt

          echo
          echo "===== RADIO DIRECTORY ====="
          find radio -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true

      # ============================================================
      # 11. PREPARE DEVICE TREE
      #
      # IMPORTANT:
      # extract-utils resolves the source tree one directory ABOVE
      # GITHUB_WORKSPACE.
      #
      # Therefore create:
      #
      # /home/runner/work/<repo>/device/xiaomi/spinel
      #
      # pointing to:
      #
      # /home/runner/work/<repo>/<repo>/device/xiaomi/spinel
      # ============================================================
      - name: 🔗 Prepare extract-utils source tree
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$(dirname "$GITHUB_WORKSPACE")"

          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "WORK_PARENT=$WORK_PARENT"

          rm -rf "$WORK_PARENT/device"

          mkdir -p "$WORK_PARENT/device/xiaomi"

          ln -s \
            "$GITHUB_WORKSPACE/device/xiaomi/spinel" \
            "$WORK_PARENT/device/xiaomi/spinel"

          echo "===== DEVICE TREE LINKS ====="

          ls -la "$WORK_PARENT/device/xiaomi"
          readlink -f "$WORK_PARENT/device/xiaomi/spinel"

          echo
          echo "===== PROPRIETARY FILES ====="

          test -f "$WORK_PARENT/device/xiaomi/spinel/proprietary-files.txt"

          wc -l \
            "$WORK_PARENT/device/xiaomi/spinel/proprietary-files.txt"

      # ============================================================
      # 12. NORMALIZE PROPRIETARY FILES
      # ============================================================
      - name: 🧹 Normalize proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          FILE="$GITHUB_WORKSPACE/device/xiaomi/spinel/proprietary-files.txt"

          test -f "$FILE"

          cp "$FILE" "$FILE.before-normalize"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])

          blocked_prefixes = (
              "system/",
              "system_ext/",
              "product/",
              "vendor_dlkm/",
              "odm_dlkm/",
              "mi_ext/",
          )

          blocked_exact = {
              "bin/iwpriv",
              "-bin/iwpriv",
              "-vendor/bin/iwpriv",
              "vendor/bin/iwpriv",
              "system_ext/priv-app/Settings/Settings.apk",
              "-system_ext/priv-app/Settings/Settings.apk",
              "vendor/odm/etc/vintf/manifest_nonfc_dsds.xml",
              "vendor/odm/etc/vintf/manifest_nonfc_ss.xml",
          }

          output = []
          seen = set()

          removed = {
              "blocked": 0,
              "vintf": 0,
              "iwpriv": 0,
              "duplicate": 0,
          }

          for raw in path.read_text(
              encoding="utf-8",
              errors="replace"
          ).splitlines():

              line = raw.rstrip()

              if not line.strip():
                  continue

              if line.lstrip().startswith("#"):
                  output.append(line)
                  continue

              src = line.split(":", 1)[0].strip()

              src_clean = src.lstrip("-").strip()

              if src_clean in {
                  "vendor/odm/etc/vintf/manifest_nonfc_dsds.xml",
                  "vendor/odm/etc/vintf/manifest_nonfc_ss.xml",
              }:
                  removed["vintf"] += 1
                  continue

              if src_clean in {
                  "bin/iwpriv",
                  "vendor/bin/iwpriv",
              }:
                  removed["iwpriv"] += 1
                  continue

              if any(
                  src_clean == prefix.rstrip("/")
                  or src_clean.startswith(prefix)
                  for prefix in blocked_prefixes
              ):
                  removed["blocked"] += 1
                  continue

              if src_clean in {
                  "system_ext/priv-app/Settings/Settings.apk",
              }:
                  removed["blocked"] += 1
                  continue

              key = line

              if key in seen:
                  removed["duplicate"] += 1
                  continue

              seen.add(key)
              output.append(line)

          if not any(
              line.split(":", 1)[0].lstrip("-").strip()
              == "vendor/bin/iwpriv"
              for line in output
              if line and not line.lstrip().startswith("#")
          ):
              output.append("vendor/bin/iwpriv")

          path.write_text(
              "\n".join(output) + "\n",
              encoding="utf-8",
          )

          print("===== NORMALIZATION RESULT =====")
          print(f"Removed blocked      : {removed['blocked']}")
          print(f"Removed VINTF        : {removed['vintf']}")
          print(f"Removed iwpriv       : {removed['iwpriv']}")
          print(f"Removed duplicates   : {removed['duplicate']}")
          print(f"Final lines          : {len(output)}")
          PY

          echo
          echo "===== FINAL PROPRIETARY LIST ====="
          wc -l "$FILE"

          echo
          echo "Comments:"
          grep -c '^[[:space:]]*#' "$FILE" || true

          echo
          echo "Forbidden partitions:"
          grep -E \
            '(^|[-:])(system|system_ext|product|vendor_dlkm|odm_dlkm|mi_ext)/' \
            "$FILE" \
            || true

      # ============================================================
      # 13. VALIDATE PROPRIETARY FILES
      # ============================================================
      - name: ✅ Validate proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          FILE="$GITHUB_WORKSPACE/device/xiaomi/spinel/proprietary-files.txt"

          COUNT=0
          INVALID=0
          MISSING=0

          echo "===== VALIDATING PROPRIETARY FILES ====="

          while IFS= read -r entry || [ -n "$entry" ]; do

            [ -z "$entry" ] && continue

            if [[ "$entry" == \#* ]]; then
              continue
            fi

            COUNT=$((COUNT + 1))

            SRC="${entry%%:*}"

            SRC="${SRC#-}"
            SRC="$(echo "$SRC" | xargs)"

            case "$SRC" in
              system/*|system_ext/*|product/*|vendor_dlkm/*|odm_dlkm/*|mi_ext/*)
                echo "INVALID PARTITION: $SRC"
                INVALID=1
                ;;
            esac

            case "$SRC" in
              vendor/odm/etc/vintf/manifest_nonfc_dsds.xml)
                echo "INVALID VINTF: $SRC"
                INVALID=1
                ;;
              vendor/odm/etc/vintf/manifest_nonfc_ss.xml)
                echo "INVALID VINTF: $SRC"
                INVALID=1
                ;;
            esac

            if [[ "$SRC" == "vendor/bin/iwpriv" ]]; then
              :
            elif [[ "$SRC" == "bin/iwpriv" ]]; then
              echo "INVALID iwpriv path: $SRC"
              INVALID=1
            fi

            FOUND=0

            for ROOT in \
              "$STOCK_DUMP_DIR" \
              "$ROM_DIR/extracted"
            do
              if [ -f "$ROOT/$SRC" ]; then
                FOUND=1
                break
              fi

              if [ -f "$ROOT/vendor/$SRC" ]; then
                FOUND=1
                break
              fi
            done

            if [ "$SRC" = "vendor/bin/iwpriv" ]; then
              if [ -f "$STOCK_DUMP_DIR/vendor/bin/iwpriv" ]; then
                FOUND=1
              elif [ -f "$STOCK_DUMP_DIR/bin/iwpriv" ]; then
                FOUND=1
              fi
            fi

            if [ "$FOUND" -eq 0 ]; then
              echo "MISSING: $SRC"
              MISSING=1
            fi

          done < "$FILE"

          echo
          echo "===== VALIDATION SUMMARY ====="
          echo "Entries : $COUNT"
          echo "Invalid : $INVALID"
          echo "Missing : $MISSING"

          if [ "$INVALID" -ne 0 ]; then
            exit 1
          fi

          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          echo "Validation PASS."

      # ============================================================
      # 14. GENERATE EXTRACT FILES SCRIPT
      # ============================================================
      - name: 📝 Generate extract-files.py
        shell: bash
        run: |
          set -euxo pipefail

          cat > device/xiaomi/spinel/extract-files.py <<'PY'
          #!/usr/bin/env python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )


          def main():
              module = ExtractUtilsModule(
                  "spinel",
                  "xiaomi",
                  check_elf=True,
                  add_firmware_proprietary_file=False,
              )

              utils = ExtractUtils(module)
              utils.run()


          if __name__ == "__main__":
              main()
          PY

          chmod +x device/xiaomi/spinel/extract-files.py

          python3 -m py_compile \
            device/xiaomi/spinel/extract-files.py

          cat device/xiaomi/spinel/extract-files.py

      # ============================================================
      # 15. GENERATE SETUP MAKEFILES
      # ============================================================
      - name: 📝 Generate setup-makefiles.py
        shell: bash
        run: |
          set -euxo pipefail

          cat > device/xiaomi/spinel/setup-makefiles.py <<'PY'
          #!/usr/bin/env python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )


          def main():
              module = ExtractUtilsModule(
                  "spinel",
                  "xiaomi",
                  check_elf=True,
                  add_firmware_proprietary_file=False,
              )

              utils = ExtractUtils(module)
              utils.run()


          if __name__ == "__main__":
              main()
          PY

          chmod +x device/xiaomi/spinel/setup-makefiles.py

          python3 -m py_compile \
            device/xiaomi/spinel/setup-makefiles.py

      # ============================================================
      # 16. FINAL IMPORT TEST
      # ============================================================
      - name: 🐍 Final extract-utils import test
        shell: bash
        run: |
          set -euxo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR${PYTHONPATH:+:$PYTHONPATH}"

          echo "===== FINAL IMPORT TEST ====="

          python3 - <<'PY'
          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print("ExtractUtils: OK")
          print("ExtractUtilsModule: OK")
          print("extract-utils is ready.")
          PY

      # ============================================================
      # 17. RUN EXTRACT-UTILS
      #
      # Run from the PARENT workspace because extract-utils expects
      # the Android source root there.
      # ============================================================
      - name: 🧬 Run extract-utils
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$(dirname "$GITHUB_WORKSPACE")"

          export PYTHONPATH="$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR${PYTHONPATH:+:$PYTHONPATH}"

          echo "===== EXTRACT ROOT ====="
          echo "$WORK_PARENT"

          echo
          echo "===== DEVICE TREE ====="
          ls -la "$WORK_PARENT/device/xiaomi/spinel"

          echo
          echo "===== PROPRIETARY FILES ====="
          test -f "$WORK_PARENT/device/xiaomi/spinel/proprietary-files.txt"
          wc -l "$WORK_PARENT/device/xiaomi/spinel/proprietary-files.txt"

          echo
          echo "===== RUNNING EXTRACT-UTILS ====="

          cd "$WORK_PARENT"

          python3 \
            "$GITHUB_WORKSPACE/device/xiaomi/spinel/extract-files.py" \
            --kang

      # ============================================================
      # 18. LOCATE GENERATED TREE
      # ============================================================
      - name: 🔎 Locate generated vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$(dirname "$GITHUB_WORKSPACE")"

          echo "===== SEARCHING GENERATED TREE ====="

          find "$WORK_PARENT" \
            -maxdepth 6 \
            -type d \
            -path '*/vendor/xiaomi/spinel' \
            -print \
            || true

          echo
          echo "===== GENERATED FILES ====="

          find "$WORK_PARENT/vendor/xiaomi/spinel" \
            -maxdepth 3 \
            -type f \
            2>/dev/null \
            | sort \
            | head -n 300 \
            || true

      # ============================================================
      # 19. RESTORE MANUAL VINTF
      # ============================================================
      - name: 🛠️ Restore manual ODM VINTF manifests
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          GENERATED="$WORK_PARENT/vendor/xiaomi/spinel"

          mkdir -p reports

          mkdir -p \
            "$GENERATED/proprietary/odm/etc/vintf"

          FOUND_DSDS=""
          FOUND_SS=""

          for ROOT in \
            "$STOCK_DUMP_DIR" \
            "$ROM_DIR/extracted"
          do
            if [ -z "$FOUND_DSDS" ] && \
               [ -f "$ROOT/vendor/odm/etc/vintf/manifest_nonfc_dsds.xml" ]; then
              FOUND_DSDS="$ROOT/vendor/odm/etc/vintf/manifest_nonfc_dsds.xml"
            fi

            if [ -z "$FOUND_SS" ] && \
               [ -f "$ROOT/vendor/odm/etc/vintf/manifest_nonfc_ss.xml" ]; then
              FOUND_SS="$ROOT/vendor/odm/etc/vintf/manifest_nonfc_ss.xml"
            fi
          done

          echo "DSDS=$FOUND_DSDS"
          echo "SS=$FOUND_SS"

          if [ -n "$FOUND_DSDS" ]; then
            cp \
              "$FOUND_DSDS" \
              "$GENERATED/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml"
          fi

          if [ -n "$FOUND_SS" ]; then
            cp \
              "$FOUND_SS" \
              "$GENERATED/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml"
          fi

          {
            echo "# Manually restored ODM VINTF manifests."
            echo "PRODUCT_COPY_FILES += \\"

            if [ -f "$GENERATED/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml" ]; then
              echo "    vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml:\$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_dsds.xml \\"
            fi

            if [ -f "$GENERATED/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml" ]; then
              echo "    vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml:\$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_ss.xml"
            fi
          } > reports/manual-vintf.txt

          cat reports/manual-vintf.txt

      # ============================================================
      # 20. ADD MANUAL VINTF TO VENDOR MAKEFILE
      # ============================================================
      - name: 🧩 Add manual VINTF to vendor makefile
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          GENERATED="$WORK_PARENT/vendor/xiaomi/spinel"

          MAKEFILE=""

          for FILE in \
            "$GENERATED/spinel-vendor.mk" \
            "$GENERATED/vendor/xiaomi/spinel-vendor.mk" \
            "$GENERATED/spinel-vendor-blobs.mk"
          do
            if [ -f "$FILE" ]; then
              MAKEFILE="$FILE"
              break
            fi
          done

          if [ -z "$MAKEFILE" ]; then
            MAKEFILE="$(find "$GENERATED" \
              -maxdepth 4 \
              -type f \
              \( \
                -name '*-vendor.mk' \
                -o \
                -name '*vendor*.mk' \
              \) \
              | head -n 1 || true)"
          fi

          echo "Vendor makefile: $MAKEFILE"

          if [ -n "$MAKEFILE" ] && [ -f "$MAKEFILE" ]; then

            {
              echo
              echo "# ============================================================"
              echo "# Manually restored ODM VINTF manifests"
              echo "# ============================================================"

              cat "$GITHUB_WORKSPACE/reports/manual-vintf.txt"

            } >> "$MAKEFILE"

          else
            echo "WARNING: Vendor makefile was not found."
          fi

      # ============================================================
      # 21. GENERATE MINIMAL BOARDCONFIG VENDOR
      # ============================================================
      - name: 📝 Generate BoardConfigVendor.mk
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          GENERATED="$WORK_PARENT/vendor/xiaomi/spinel"

          cat > "$GENERATED/BoardConfigVendor.mk" <<'EOF'
          # SPDX-License-Identifier: Apache-2.0

          # Xiaomi Redmi Note 15 4G
          # Codename: spinel
          # Platform: MediaTek MT6789
          # Android 15 / HyperOS 2 base

          # NOTE:
          # Raw MediaTek firmware images are kept in radio/ for reference.
          # They are NOT added to AB_OTA_PARTITIONS here.
          #
          # Device firmware must come from the exact spinel firmware package.
          EOF

          echo "===== BoardConfigVendor.mk ====="
          cat "$GENERATED/BoardConfigVendor.mk"

      # ============================================================
      # 22. COPY RADIO DIRECTORY
      # ============================================================
      - name: 📡 Copy discovered radio firmware
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          GENERATED="$WORK_PARENT/vendor/xiaomi/spinel"

          mkdir -p "$GENERATED/radio"

          if [ -d "$GITHUB_WORKSPACE/radio" ]; then
            cp -av \
              "$GITHUB_WORKSPACE/radio/." \
              "$GENERATED/radio/" \
              || true
          fi

          echo "===== RADIO ====="
          find "$GENERATED/radio" \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            | sort \
            || true

      # ============================================================
      # 23. FLATTEN REPOSITORY
      #
      # IMPORTANT:
      # GitHub repository root must contain:
      #
      # Android.bp
      # Android.mk
      # BoardConfigVendor.mk
      # spinel-vendor.mk
      # proprietary-files.txt
      # extract-files.py
      # setup-makefiles.py
      # proprietary/
      # radio/
      #
      # NOT:
      # vendor/xiaomi/spinel/
      # ============================================================
      - name: 📁 Flatten vendor tree into repository root
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$(dirname "$GITHUB_WORKSPACE")"
          GENERATED="$WORK_PARENT/vendor/xiaomi/spinel"

          test -d "$GENERATED"

          echo "===== GENERATED TREE BEFORE FLATTEN ====="

          find "$GENERATED" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -n 300

          echo
          echo "===== COPYING TO REPOSITORY ROOT ====="

          for ITEM in \
            Android.bp \
            Android.mk \
            BoardConfigVendor.mk \
            spinel-vendor.mk \
            proprietary-files.txt \
            extract-files.py \
            setup-makefiles.py
          do
            if [ -f "$GENERATED/$ITEM" ]; then
              cp -av \
                "$GENERATED/$ITEM" \
                "$GITHUB_WORKSPACE/$ITEM"
            fi
          done

          if [ -d "$GENERATED/proprietary" ]; then
            rm -rf "$GITHUB_WORKSPACE/proprietary"
            cp -a \
              "$GENERATED/proprietary" \
              "$GITHUB_WORKSPACE/proprietary"
          fi

          if [ -d "$GENERATED/radio" ]; then
            rm -rf "$GITHUB_WORKSPACE/radio"
            cp -a \
              "$GENERATED/radio" \
              "$GITHUB_WORKSPACE/radio"
          fi

          echo
          echo "===== ROOT RESULT ====="

          find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            | sed "s#^$GITHUB_WORKSPACE/##" \
            | sort

      # ============================================================
      # 24. REMOVE CONTAMINATION
      # ============================================================
      - name: 🧹 Remove generated nested vendor directory
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf \
            "$GITHUB_WORKSPACE/vendor"

          echo "Nested vendor directory removed."

      # ============================================================
      # 25. VERIFY FINAL TREE
      # ============================================================
      - name: 🔍 Verify final vendor repository
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "===== ROOT FILES ====="

          for FILE in \
            Android.bp \
            Android.mk \
            BoardConfigVendor.mk \
            spinel-vendor.mk \
            proprietary-files.txt \
            extract-files.py \
            setup-makefiles.py
          do
            if [ -f "$FILE" ]; then
              echo "OK: $FILE"
            else
              echo "MISSING: $FILE"
              exit 1
            fi
          done

          echo
          echo "===== REQUIRED DIRECTORIES ====="

          test -d proprietary
          echo "OK: proprietary/"

          if [ -d radio ]; then
            echo "OK: radio/"
          else
            echo "INFO: radio/ not present"
          fi

          echo
          echo "===== CONTAMINATION CHECK ====="

          if [ -d vendor/xiaomi/spinel ]; then
            echo "ERROR: nested vendor/xiaomi/spinel exists"
            exit 1
          fi

          if find . \
            -path './.git' -prune -o \
            -type f \
            -path './system/*' \
            -print \
            | grep -q .
          then
            echo "ERROR: system files found"
            exit 1
          fi

          if find . \
            -path './.git' -prune -o \
            -type f \
            -path './system_ext/*' \
            -print \
            | grep -q .
          then
            echo "ERROR: system_ext files found"
            exit 1
          fi

          if find . \
            -path './.git' -prune -o \
            -type f \
            -path './product/*' \
            -print \
            | grep -q .
          then
            echo "ERROR: product files found"
            exit 1
          fi

          echo
          echo "===== FINAL TREE ====="

          find . \
            -path './.git' -prune -o \
            -type f \
            -print \
            | sort \
            | head -n 500

      # ============================================================
      # 26. FINAL REPORT
      # ============================================================
      - name: 📊 Generate reports
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          {
            echo "=========================================="
            echo "SPINEL VENDOR TREE REPORT"
            echo "=========================================="
            echo
            echo "Device       : spinel"
            echo "Vendor       : xiaomi"
            echo "Platform     : MT6789"
            echo "Android      : 15"
            echo "Base         : HyperOS 2"
            echo "Build        : OS2.0.212.0.VPGMIXM"
            echo "Kernel       : 5.10.236"
            echo
            echo "Generated at : $(date -u)"
            echo
            echo "=========================================="
            echo "PROPRIETARY FILES"
            echo "=========================================="

            if [ -f proprietary-files.txt ]; then
              wc -l proprietary-files.txt
            fi

            echo
            echo "=========================================="
            echo "RADIO"
            echo "=========================================="

            find radio \
              -maxdepth 1 \
              -type f \
              -printf '%f %s bytes\n' \
              2>/dev/null \
              | sort \
              || true

            echo
            echo "=========================================="
            echo "TREE SIZE"
            echo "=========================================="

            du -sh . || true

          } > reports/vendor-tree-report.txt

          cat reports/vendor-tree-report.txt

      # ============================================================
      # 27. GIT STATUS
      # ============================================================
      - name: 📋 Git status
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          git status --short

          echo
          echo "===== CHANGED FILE COUNT ====="

          git status --short | wc -l

      # ============================================================
      # 28. COMMIT
      # ============================================================
      - name: 💾 Commit generated vendor tree
        if: ${{ inputs.COMMIT_CHANGES }}
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "spinel: regenerate LineageOS vendor tree"

          git push

      # ============================================================
      # 29. UPLOAD ARTIFACTS
      # ============================================================
      - name: 📦 Upload generated vendor tree
        if: ${{ inputs.UPLOAD_ARTIFACTS }}
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree
          path: |
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
            proprietary-files.txt
            extract-files.py
            setup-makefiles.py
            proprietary/
            radio/
            reports/
          if-no-files-found: warn
          retention-days: 7

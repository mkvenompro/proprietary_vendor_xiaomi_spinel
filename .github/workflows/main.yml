name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:
    inputs:
      STOCK_FASTBOOT_URL:
        description: "Optional Xiaomi Fastboot ROM URL"
        required: false
        default: "https://bigota.d.miui.com/OS2.0.212.0.VPGMIXM/spinel_global_images_OS2.0.212.0.VPGMIXM_20260311.0000.00_15.0_global_1e7d24d317.tgz"
        type: string

      STOCK_DUMP_URL:
        description: "Stock dump Git repository"
        required: false
        default: "https://gitlab.com/mkpromvp/dumber-2-mk.git"
        type: string

      STOCK_DUMP_BRANCH:
        description: "Stock dump branch"
        required: false
        default: "dump-redmi-spinel-os2.0.212.0.vpgmixm"
        type: string

      EXTRACT_UTILS_URL:
        description: "Lineage extract-utils repository"
        required: false
        default: "https://github.com/LineageOS/android_tools_extract-utils.git"
        type: string

      EXTRACT_UTILS_BRANCH:
        description: "extract-utils branch"
        required: false
        default: "lineage-23.2"
        type: string

      DOWNLOAD_FASTBOOT:
        description: "Download Xiaomi Fastboot ROM and copy radio firmware"
        required: false
        default: false
        type: boolean

      UPLOAD_ARTIFACTS:
        description: "Upload generated vendor tree"
        required: false
        default: true
        type: boolean

      COMMIT_CHANGES:
        description: "Commit and push generated vendor tree"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    name: 🧬 Generate Vendor Tree
    runs-on: ubuntu-24.04

    env:
      DEVICE: spinel
      VENDOR: xiaomi
      DEVICE_PATH: device/xiaomi/spinel
      STOCK_DUMP_DIR: stock_dump
      EXTRACT_UTILS_DIR: extract-utils
      ROM_DIR: fastboot_rom
      STAGING_ROOT: staging_android_root

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================

      - name: 🧰 Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            python3 \
            python3-pip \
            python3-venv \
            p7zip-full \
            unzip \
            rsync \
            curl \
            wget \
            file \
            cpio \
            lz4 \
            brotli \
            zstd \
            xz-utils \
            tar \
            gzip \
            bzip2 \
            coreutils \
            findutils \
            sed \
            gawk

          git lfs install --skip-smudge

          python3 --version
          git --version
          git-lfs --version
          7z i | head -n 5

      # ============================================================
      # 3. GIT NETWORK CONFIGURATION
      # ============================================================

      - name: 🌐 Configure Git networking
        shell: bash
        run: |
          set -euxo pipefail

          git config --global http.version HTTP/1.1
          git config --global http.maxRequests 2
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global fetch.parallel 1
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 600

      # ============================================================
      # 4. CLONE STOCK DUMP
      # ============================================================

      - name: 📦 Clone stock dump
        shell: bash
        env:
          DUMP_URL: ${{ inputs.STOCK_DUMP_URL }}
          DUMP_BRANCH: ${{ inputs.STOCK_DUMP_BRANCH }}
        run: |
          set -euxo pipefail

          rm -rf "$STOCK_DUMP_DIR"

          clone_ok=false

          for attempt in 1 2 3 4 5; do
            echo
            echo "============================================================"
            echo " STOCK DUMP CLONE ATTEMPT $attempt / 5"
            echo "============================================================"

            rm -rf "$STOCK_DUMP_DIR"

            if GIT_LFS_SKIP_SMUDGE=1 git clone \
                --depth 1 \
                --single-branch \
                --no-tags \
                --branch "$DUMP_BRANCH" \
                "$DUMP_URL" \
                "$STOCK_DUMP_DIR"; then

              clone_ok=true
              break
            fi

            echo "Clone attempt $attempt failed."

            rm -rf "$STOCK_DUMP_DIR"

            sleep $((attempt * 10))
          done

          if [[ "$clone_ok" != "true" ]]; then
            echo "::error::Unable to clone stock dump after 5 attempts."
            exit 1
          fi

          cd "$STOCK_DUMP_DIR"

          git status
          git rev-parse HEAD
          git branch --show-current

          echo
          echo "===== STOCK DUMP TOP LEVEL ====="

          find . \
            -maxdepth 2 \
            -type f \
            | head -n 100

          echo
          echo "===== STOCK DUMP SIZE ====="

          du -sh .

          cd ..

      # ============================================================
      # 5. FETCH LFS
      # ============================================================

      - name: 📦 Fetch stock dump LFS objects
        shell: bash
        run: |
          set -euxo pipefail

          cd "$STOCK_DUMP_DIR"

          if git lfs ls-files | grep -q .; then

            echo "LFS files detected."

            lfs_ok=false

            for attempt in 1 2 3 4 5; do

              echo
              echo "============================================================"
              echo " LFS FETCH ATTEMPT $attempt / 5"
              echo "============================================================"

              if git lfs pull --include="*"; then
                lfs_ok=true
                break
              fi

              echo "LFS attempt $attempt failed."

              sleep $((attempt * 10))
            done

            if [[ "$lfs_ok" != "true" ]]; then
              echo "::error::Unable to fetch stock dump LFS objects."
              exit 1
            fi

          else

            echo "No Git LFS files detected."

          fi

          cd ..

          echo
          echo "===== VERIFY STOCK DUMP ====="

          test -d "$STOCK_DUMP_DIR"
          test -f "$STOCK_DUMP_DIR/proprietary-files.txt"

          echo "Stock dump is valid."

      # ============================================================
      # 6. FIND PROPRIETARY LIST
      # ============================================================

      - name: 🔎 Locate proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          LIST=""

          if [[ -f "$STOCK_DUMP_DIR/proprietary-files.txt" ]]; then
            LIST="$STOCK_DUMP_DIR/proprietary-files.txt"
          else
            LIST="$(find "$STOCK_DUMP_DIR" \
              -type f \
              -name "proprietary-files.txt" \
              -print \
              -quit)"
          fi

          if [[ -z "$LIST" || ! -f "$LIST" ]]; then
            echo "::error::Could not find proprietary-files.txt."
            exit 1
          fi

          echo "FOUND_LIST=$LIST" >> "$GITHUB_ENV"

          echo
          echo "===== PROPRIETARY LIST ====="

          echo "$LIST"

          wc -l "$LIST"

      # ============================================================
      # 7. NORMALIZE PROPRIETARY LIST
      # ============================================================

      - name: 🧹 Normalize proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          cp \
            "$FOUND_LIST" \
            proprietary-files.stock.txt

          python3 <<'PY'
          from pathlib import Path

          source = Path("proprietary-files.stock.txt")
          output = Path("proprietary-files.txt")

          blocked_prefixes = (
              "system/",
              "system_ext/",
              "product/",
              "vendor_dlkm/",
              "odm_dlkm/",
              "mi_ext/",
          )

          remove_exact = {
              "vendor/odm/etc/vintf/manifest_nonfc_dsds.xml",
              "vendor/odm/etc/vintf/manifest_nonfc_ss.xml",
              "bin/iwpriv",
          }

          kept = []
          removed = []

          for raw in source.read_text(
              encoding="utf-8",
              errors="replace",
          ).splitlines():

              line = raw.strip()

              if not line:
                  kept.append(raw)
                  continue

              if line.startswith("#"):
                  kept.append(raw)
                  continue

              item = line

              if item.startswith("-"):
                  item = item[1:]

              item = item.split(":", 1)[0]
              item = item.split(";", 1)[0]
              item = item.split("|", 1)[0]
              item = item.strip()

              if item in remove_exact:
                  removed.append(item)
                  continue

              if item.startswith(blocked_prefixes):
                  removed.append(item)
                  continue

              kept.append(raw)

          iwpriv = "vendor/bin/iwpriv"

          has_iwpriv = False

          for raw in kept:

              item = raw.strip()

              if item.startswith("#"):
                  continue

              if item.startswith("-"):
                  item = item[1:]

              item = item.split(":", 1)[0]
              item = item.split(";", 1)[0]
              item = item.split("|", 1)[0]
              item = item.strip()

              if item == iwpriv:
                  has_iwpriv = True
                  break

          if not has_iwpriv:
              kept.append(iwpriv)

          output.write_text(
              "\n".join(kept) + "\n",
              encoding="utf-8",
          )

          Path("reports/removed-files.txt").write_text(
              "\n".join(sorted(set(removed))) + "\n",
              encoding="utf-8",
          )

          print("Removed entries:", len(removed))
          print("Final lines:", len(kept))
          PY

          echo
          echo "===== NORMALIZED LIST ====="

          wc -l proprietary-files.txt

      # ============================================================
      # 8. VALIDATE PROPRIETARY LIST
      # ============================================================

      - name: 🔍 Validate proprietary list
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "===== VALIDATING ENTRIES ====="

          python3 <<'PY'
          from pathlib import Path

          dump = Path("stock_dump")
          plist = Path("proprietary-files.txt")

          forbidden = (
              "system/",
              "system_ext/",
              "product/",
              "vendor_dlkm/",
              "odm_dlkm/",
              "mi_ext/",
          )

          missing = []
          bad = []

          for raw in plist.read_text(
              encoding="utf-8",
              errors="replace",
          ).splitlines():

              line = raw.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              src = line

              if src.startswith("-"):
                  src = src[1:]

              src = src.split(":", 1)[0]
              src = src.split(";", 1)[0]
              src = src.split("|", 1)[0]
              src = src.strip()

              if src.startswith(forbidden):
                  bad.append(src)
                  continue

              candidates = [
                  dump / src,
              ]

              if src.startswith("vendor/"):
                  candidates.append(
                      dump / src[len("vendor/"):]
                  )

              if src.startswith("odm/"):
                  candidates.append(
                      dump / src[len("odm/"):]
                  )

              if not any(
                  candidate.is_file()
                  for candidate in candidates
              ):
                  missing.append(src)

          if bad:
              print("Forbidden entries:")
              for item in bad:
                  print(item)

              raise SystemExit(
                  "Forbidden partition entries remain."
              )

          if missing:
              print("Missing source files:")

              for item in missing[:200]:
                  print(item)

              print()
              print("Total missing:", len(missing))

              raise SystemExit(
                  "Missing proprietary source files."
              )

          print("All proprietary source files exist.")
          PY

          echo
          echo "===== COMMENT VALIDATION ====="

          INVALID=0

          while IFS= read -r entry; do

            [[ -z "$entry" ]] && continue
            [[ "$entry" == \#* ]] && continue

            if [[ "$entry" =~ ^[[:space:]]*- ]]; then
              continue
            fi

          done < proprietary-files.txt

          if [[ "$INVALID" -ne 0 ]]; then
            exit 1
          fi

          echo "Validation passed."

      # ============================================================
      # 9. CLONE EXTRACT UTILS
      # ============================================================

      - name: 🧬 Clone Lineage extract-utils
        shell: bash
        env:
          EXTRACT_URL: ${{ inputs.EXTRACT_UTILS_URL }}
          EXTRACT_BRANCH: ${{ inputs.EXTRACT_UTILS_BRANCH }}
        run: |
          set -euxo pipefail

          rm -rf "$EXTRACT_UTILS_DIR"

          git clone \
            --depth 1 \
            --single-branch \
            --no-tags \
            --branch "$EXTRACT_BRANCH" \
            "$EXTRACT_URL" \
            "$EXTRACT_UTILS_DIR"

          test -d "$EXTRACT_UTILS_DIR/extract_utils"

          echo "EXTRACT_UTILS_ROOT=$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR" \
            >> "$GITHUB_ENV"

      # ============================================================
      # 10. TEST EXTRACT UTILS
      # ============================================================

      - name: 🐍 Test extract-utils
        shell: bash
        run: |
          set -euxo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR"

          echo "PYTHONPATH=$PYTHONPATH" \
            >> "$GITHUB_ENV"

          python3 <<'PY'
          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print("extract_utils import: OK")
          print("ExtractUtils:", ExtractUtils)
          print("ExtractUtilsModule:", ExtractUtilsModule)
          PY

      # ============================================================
      # 11. PREPARE REAL ANDROID ROOT
      # ============================================================
      #
      # IMPORTANT:
      #
      # extract-utils/tools.py calculates android_root using:
      #
      # realpath(extract_utils/...).
      #
      # Therefore extract-utils MUST physically exist inside the
      # staging Android root.
      #
      # DO NOT USE A SYMLINK HERE.
      #
      # ============================================================

      - name: 🏗️ Prepare Android root
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$GITHUB_WORKSPACE/$STAGING_ROOT"

          rm -rf "$WORK_PARENT"

          mkdir -p \
            "$WORK_PARENT/device/xiaomi/spinel" \
            "$WORK_PARENT/tools/extract-utils"

          echo "WORK_PARENT=$WORK_PARENT" \
            >> "$GITHUB_ENV"

          # --------------------------------------------------------
          # COPY extract-utils, DO NOT SYMLINK IT.
          # --------------------------------------------------------

          cp -a \
            "$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR/." \
            "$WORK_PARENT/tools/extract-utils/"

          # --------------------------------------------------------
          # Copy proprietary list.
          # --------------------------------------------------------

          cp \
            "$GITHUB_WORKSPACE/proprietary-files.txt" \
            "$WORK_PARENT/device/xiaomi/spinel/proprietary-files.txt"

          test -d \
            "$WORK_PARENT/device/xiaomi/spinel"

          test -f \
            "$WORK_PARENT/device/xiaomi/spinel/proprietary-files.txt"

          test -d \
            "$WORK_PARENT/tools/extract-utils/extract_utils"

          echo
          echo "===== ANDROID ROOT ====="

          echo "$WORK_PARENT"

          echo
          echo "===== DIRECTORY STRUCTURE ====="

          ls -la "$WORK_PARENT"

          ls -la "$WORK_PARENT/device"
          ls -la "$WORK_PARENT/device/xiaomi"
          ls -la "$WORK_PARENT/device/xiaomi/spinel"

          echo
          echo "===== EXTRACT UTILS ====="

          ls -la "$WORK_PARENT/tools/extract-utils"
          ls -la "$WORK_PARENT/tools/extract-utils/extract_utils"

      # ============================================================
      # 12. VERIFY EXTRACT-UTILS ANDROID ROOT
      # ============================================================

      - name: 🧪 Verify extract-utils Android root
        shell: bash
        run: |
          set -euxo pipefail

          TOOLS_FILE="$WORK_PARENT/tools/extract-utils/extract_utils/tools.py"

          test -f "$TOOLS_FILE"

          echo
          echo "===== tools.py ====="

          grep -n \
            "android_root" \
            "$TOOLS_FILE"

          echo
          echo "===== REALPATH TEST ====="

          REAL_EXTRACT_UTILS="$(realpath "$WORK_PARENT/tools/extract-utils")"

          EXPECTED_ROOT="$(realpath "$WORK_PARENT")"

          echo "extract-utils:"
          echo "$REAL_EXTRACT_UTILS"

          echo
          echo "expected Android root:"
          echo "$EXPECTED_ROOT"

          CALCULATED_ROOT="$(
            python3 - <<PY
          from pathlib import Path

          tools = Path(
              "$WORK_PARENT/tools/extract-utils/extract_utils/tools.py"
          ).resolve()

          print(
              tools.parent.parent.parent
          )
          PY
          )"

          echo
          echo "calculated Android root:"
          echo "$CALCULATED_ROOT"

          if [[ "$CALCULATED_ROOT" != "$EXPECTED_ROOT" ]]; then
            echo "::error::extract-utils resolved the wrong Android root."
            exit 1
          fi

          echo
          echo "Android root verification: PASS"

      # ============================================================
      # 13. CREATE extract-files.py
      # ============================================================

      - name: 🐍 Create extract-files.py
        shell: bash
        run: |
          set -euxo pipefail

          cat > \
            "$WORK_PARENT/device/xiaomi/spinel/extract-files.py" \
            <<'PY'
          #!/usr/bin/env python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )


          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=True,
              add_firmware_proprietary_file=False,
          )


          if __name__ == "__main__":
              utils = ExtractUtils.device(module)
              utils.run()
          PY

          chmod +x \
            "$WORK_PARENT/device/xiaomi/spinel/extract-files.py"

          test -x \
            "$WORK_PARENT/device/xiaomi/spinel/extract-files.py"

          echo
          echo "===== extract-files.py ====="

          cat \
            "$WORK_PARENT/device/xiaomi/spinel/extract-files.py"

      # ============================================================
      # 14. PREPARE REPORTS
      # ============================================================

      - name: 📝 Prepare reports
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          cp \
            proprietary-files.txt \
            reports/proprietary-files-final.txt

          {
            echo "Device: $DEVICE"
            echo "Vendor: $VENDOR"
            echo
            echo "Stock dump:"
            echo "${{ inputs.STOCK_DUMP_URL }}"
            echo
            echo "Stock branch:"
            echo "${{ inputs.STOCK_DUMP_BRANCH }}"
            echo
            echo "Extract utils:"
            echo "${{ inputs.EXTRACT_UTILS_URL }}"
            echo
            echo "Extract branch:"
            echo "${{ inputs.EXTRACT_UTILS_BRANCH }}"
            echo
            echo "Fastboot enabled:"
            echo "${{ inputs.DOWNLOAD_FASTBOOT }}"
            echo
            echo "Proprietary entries:"
            grep -vE '^[[:space:]]*(#|$)' \
              proprietary-files.txt \
              | wc -l
          } > reports/build-info.txt

      # ============================================================
      # 15. EXTRACT PROPRIETARY BLOBS
      # ============================================================

      - name: 🧬 Extract proprietary blobs
        shell: bash
        run: |
          set -euxo pipefail

          cd "$WORK_PARENT"

          echo
          echo "============================================================"
          echo " STARTING LINEAGE EXTRACT-UTILS"
          echo "============================================================"

          echo
          echo "PWD:"
          pwd

          echo
          echo "ANDROID ROOT:"
          pwd

          echo
          echo "SOURCE:"
          echo "$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"

          echo
          echo "DEVICE TREE:"
          echo "$(pwd)/device/xiaomi/spinel"

          echo
          echo "EXTRACT UTILS:"
          echo "$(pwd)/tools/extract-utils"

          test -d \
            device/xiaomi/spinel

          test -f \
            device/xiaomi/spinel/proprietary-files.txt

          test -x \
            device/xiaomi/spinel/extract-files.py

          test -d \
            tools/extract-utils/extract_utils

          echo
          echo "===== PRE-EXTRACTION CHECK ====="

          python3 - <<'PY'
          from extract_utils.tools import android_root

          print("extract-utils android_root:")
          print(android_root)
          PY

          echo
          echo "===== RUN EXTRACTION ====="

          PYTHONPATH="$WORK_PARENT/tools/extract-utils" \
            python3 \
            device/xiaomi/spinel/extract-files.py \
            "$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"

          echo
          echo "============================================================"
          echo " EXTRACTION FINISHED"
          echo "============================================================"

          test -d \
            vendor/xiaomi/spinel

          echo
          echo "===== GENERATED VENDOR TREE ====="

          find \
            vendor/xiaomi/spinel \
            -maxdepth 3 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort \
            | head -n 300

          echo
          echo "===== VENDOR TREE SIZE ====="

          du -sh \
            vendor/xiaomi/spinel

      # ============================================================
      # 16. RESTORE MANUAL VINTF
      # ============================================================

      - name: 🛠️ Restore manual ODM VINTF manifests
        shell: bash
        run: |
          set -euxo pipefail

          DEST="$WORK_PARENT/vendor/xiaomi/spinel/proprietary/odm/etc/vintf"

          mkdir -p "$DEST"

          restored=0

          for file in \
            manifest_nonfc_dsds.xml \
            manifest_nonfc_ss.xml; do

            SRC="$GITHUB_WORKSPACE/$STOCK_DUMP_DIR/vendor/odm/etc/vintf/$file"

            if [[ -f "$SRC" ]]; then

              cp -v \
                "$SRC" \
                "$DEST/$file"

              restored=$((restored + 1))

            else

              echo "::warning::Missing VINTF source: $file"

            fi

          done

          {
            echo "Manual ODM VINTF restoration"
            echo "Restored files: $restored"
            echo

            find "$DEST" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort

          } > reports/manual-vintf.txt

          cat reports/manual-vintf.txt

      # ============================================================
      # 17. ADD VINTF MAKE RULES
      # ============================================================

      - name: 🧩 Add manual VINTF make rules
        shell: bash
        run: |
          set -euxo pipefail

          MK="$WORK_PARENT/vendor/xiaomi/spinel/spinel-vendor.mk"

          test -f "$MK"

          if ! grep -q \
            "manifest_nonfc_dsds.xml" \
            "$MK"; then

            cat >> "$MK" <<'EOF'

          # Manually restored ODM VINTF manifests.
          PRODUCT_COPY_FILES += \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_dsds.xml \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_ss.xml
          EOF

          fi

      # ============================================================
      # 18. OPTIONAL FASTBOOT DOWNLOAD
      # ============================================================

      - name: 📦 Download Xiaomi Fastboot ROM
        if: ${{ inputs.DOWNLOAD_FASTBOOT }}
        shell: bash
        env:
          FASTBOOT_URL: ${{ inputs.STOCK_FASTBOOT_URL }}
        run: |
          set -euxo pipefail

          rm -rf "$ROM_DIR"

          mkdir -p "$ROM_DIR"

          FILE_NAME="$(basename "$FASTBOOT_URL")"

          ARCHIVE="$ROM_DIR/$FILE_NAME"

          download_ok=false

          for attempt in 1 2 3 4 5; do

            echo
            echo "============================================================"
            echo " FASTBOOT DOWNLOAD ATTEMPT $attempt / 5"
            echo "============================================================"

            if curl \
              --fail \
              --location \
              --retry 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 0 \
              --continue-at - \
              --output "$ARCHIVE" \
              "$FASTBOOT_URL"; then

              download_ok=true
              break

            fi

            echo "Fastboot download attempt $attempt failed."

            sleep $((attempt * 10))

          done

          if [[ "$download_ok" != "true" ]]; then
            echo "::error::Fastboot ROM download failed."
            exit 1
          fi

          test -s "$ARCHIVE"

          echo
          echo "===== FASTBOOT ARCHIVE ====="

          ls -lh "$ARCHIVE"

          file "$ARCHIVE"

      # ============================================================
      # 19. EXTRACT FASTBOOT ROM
      # ============================================================

      - name: 📂 Extract Xiaomi Fastboot ROM
        if: ${{ inputs.DOWNLOAD_FASTBOOT }}
        shell: bash
        run: |
          set -euxo pipefail

          ARCHIVE="$(
            find "$ROM_DIR" \
              -maxdepth 1 \
              -type f \
              -print \
              -quit
          )"

          test -n "$ARCHIVE"
          test -f "$ARCHIVE"

          mkdir -p \
            "$ROM_DIR/extracted"

          7z x \
            "$ARCHIVE" \
            "-o$ROM_DIR/extracted" \
            -y

          echo
          echo "===== FASTBOOT EXTRACTION ====="

          find \
            "$ROM_DIR/extracted" \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -n 500

      # ============================================================
      # 20. COPY RADIO
      # ============================================================

      - name: 📡 Copy radio firmware
        if: ${{ inputs.DOWNLOAD_FASTBOOT }}
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p radio

          IMAGE_ROOT="$ROM_DIR/extracted"

          RADIO_NAMES=(
            dpm.img
            gz.img
            lk.img
            mcupm.img
            md1img.img
            pi_img.img
            scp.img
            spmfw.img
            sspm.img
            tee.img
          )

          copied=0

          for name in "${RADIO_NAMES[@]}"; do

            SRC="$(
              find "$IMAGE_ROOT" \
                -type f \
                -name "$name" \
                -print \
                -quit
            )"

            if [[ -z "$SRC" ]]; then
              echo "Not found: $name"
              continue
            fi

            cp -v \
              "$SRC" \
              "radio/$name"

            copied=$((copied + 1))

          done

          if [[ "$copied" -eq 0 ]]; then
            echo "::error::No radio images found."
            exit 1
          fi

          echo
          echo "===== RADIO DIRECTORY ====="

          find radio \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            | sort

      # ============================================================
      # 21. ADD RADIO PARTITIONS
      # ============================================================

      - name: 🧩 Add radio partitions to BoardConfigVendor.mk
        if: ${{ inputs.DOWNLOAD_FASTBOOT }}
        shell: bash
        run: |
          set -euxo pipefail

          BOARD="$WORK_PARENT/vendor/xiaomi/spinel/BoardConfigVendor.mk"

          test -f "$BOARD"

          if ! grep -q \
            "spinel firmware partitions" \
            "$BOARD"; then

            cat >> "$BOARD" <<'EOF'

          # ============================================================
          # spinel firmware partitions
          # ============================================================

          AB_OTA_PARTITIONS += \
              dpm \
              gz \
              lk \
              mcupm \
              md1img \
              pi_img \
              scp \
              spmfw \
              sspm \
              tee
          EOF

          fi

      # ============================================================
      # 22. FLATTEN VENDOR TREE
      # ============================================================

      - name: 📦 Flatten vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          GENERATED="$WORK_PARENT/vendor/xiaomi/spinel"

          test -d "$GENERATED"

          echo
          echo "===== GENERATED TREE ====="

          find "$GENERATED" \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            | sort \
            | head -n 300

          echo
          echo "===== COPYING GENERATED TREE TO REPOSITORY ROOT ====="

          rsync -a \
            "$GENERATED/" \
            "$GITHUB_WORKSPACE/"

          cp \
            "$WORK_PARENT/device/xiaomi/spinel/proprietary-files.txt" \
            "$GITHUB_WORKSPACE/proprietary-files.txt"

          cp \
            "$WORK_PARENT/device/xiaomi/spinel/extract-files.py" \
            "$GITHUB_WORKSPACE/extract-files.py"

          cat > \
            "$GITHUB_WORKSPACE/setup-makefiles.py" \
            <<'PY'
          #!/usr/bin/env python3

          from pathlib import Path

          root = Path(__file__).resolve().parent

          print("Xiaomi spinel vendor tree")
          print("Repository root:", root)
          print("Proprietary list:", root / "proprietary-files.txt")
          print("Extraction script:", root / "extract-files.py")
          PY

          chmod +x \
            "$GITHUB_WORKSPACE/extract-files.py"

          chmod +x \
            "$GITHUB_WORKSPACE/setup-makefiles.py"

      # ============================================================
      # 23. REMOVE STAGING CONTAMINATION
      # ============================================================

      - name: 🧹 Clean repository staging contamination
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf \
            vendor \
            device \
            system \
            system_ext \
            product \
            vendor_dlkm \
            odm_dlkm \
            mi_ext

          rm -rf \
            "$STAGING_ROOT"

          echo
          echo "Repository staging directories removed."

      # ============================================================
      # 24. VERIFY FINAL ROOT
      # ============================================================

      - name: 🔍 Verify final vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          echo
          echo "============================================================"
          echo " FINAL VENDOR TREE"
          echo "============================================================"

          echo
          echo "===== ROOT FILES ====="

          find . \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "===== REQUIRED FILES ====="

          REQUIRED_FILES=(
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
            proprietary-files.txt
            extract-files.py
            setup-makefiles.py
          )

          for file in "${REQUIRED_FILES[@]}"; do

            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi

            echo "OK: $file"

          done

          echo
          echo "===== PROPRIETARY DIRECTORY ====="

          test -d proprietary

          find proprietary \
            -type f \
            | wc -l

          echo
          echo "===== NESTED DIRECTORY CHECK ====="

          FORBIDDEN_DIRS=(
            vendor
            device
            system
            system_ext
            product
            vendor_dlkm
            odm_dlkm
            mi_ext
          )

          for dir in "${FORBIDDEN_DIRS[@]}"; do

            if [[ -e "$dir" ]]; then
              echo "::error::Forbidden directory exists: $dir"
              exit 1
            fi

          done

          echo "No nested Android source-tree contamination."

          echo
          echo "===== PROPRIETARY LIST CHECK ====="

          if grep -E \
            '^(system|system_ext|product|vendor_dlkm|odm_dlkm|mi_ext)/' \
            proprietary-files.txt; then

            echo "::error::Forbidden partition entry found."
            exit 1

          fi

          echo "Proprietary list is clean."

          echo
          echo "===== VINTF CHECK ====="

          test -f \
            proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml

          test -f \
            proprietary/odm/etc/vintf/manifest_nonfc_ss.xml

          echo "ODM VINTF manifests: OK"

          echo
          echo "===== RADIO CHECK ====="

          if [[ -d radio ]]; then

            find radio \
              -maxdepth 1 \
              -type f \
              -printf '%f %s bytes\n' \
              | sort

          else

            echo "Radio directory not generated."
            echo "DOWNLOAD_FASTBOOT=false"

          fi

          echo
          echo "===== FINAL SIZE ====="

          du -sh .

      # ============================================================
      # 25. GENERATE FINAL REPORT
      # ============================================================

      - name: 📊 Generate final report
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          {
            echo "=============================================="
            echo "Xiaomi spinel Vendor Tree"
            echo "=============================================="
            echo
            echo "Device: $DEVICE"
            echo "Vendor: $VENDOR"
            echo "Base: HyperOS 2 / Android 15"
            echo "Kernel: 5.10"
            echo
            echo "Stock dump:"
            echo "${{ inputs.STOCK_DUMP_URL }}"
            echo
            echo "Stock branch:"
            echo "${{ inputs.STOCK_DUMP_BRANCH }}"
            echo
            echo "Extract utils:"
            echo "${{ inputs.EXTRACT_UTILS_URL }}"
            echo
            echo "Extract branch:"
            echo "${{ inputs.EXTRACT_UTILS_BRANCH }}"
            echo
            echo "Fastboot enabled:"
            echo "${{ inputs.DOWNLOAD_FASTBOOT }}"
            echo
            echo "----------------------------------------------"
            echo
            echo "Root files:"
            find . \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
            echo
            echo "Proprietary files:"
            find proprietary \
              -type f \
              | wc -l
            echo
            echo "Proprietary list entries:"
            grep -vE \
              '^[[:space:]]*(#|$)' \
              proprietary-files.txt \
              | wc -l
            echo
            echo "Repository size:"
            du -sh .
          } > reports/final-report.txt

          cat reports/final-report.txt

      # ============================================================
      # 26. GIT STATUS
      # ============================================================

      - name: 📋 Git status
        shell: bash
        run: |
          set -euxo pipefail

          git status --short

          echo
          echo "Changed files:"
          git status --short | wc -l

      # ============================================================
      # 27. COMMIT
      # ============================================================

      - name: 💾 Commit generated vendor tree
        if: ${{ inputs.COMMIT_CHANGES }}
        shell: bash
        run: |
          set -euxo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "vendor: generate proprietary blobs for spinel"

      # ============================================================
      # 28. PUSH
      # ============================================================

      - name: 🚀 Push generated vendor tree
        if: ${{ inputs.COMMIT_CHANGES }}
        shell: bash
        run: |
          set -euxo pipefail

          git push \
            origin \
            "HEAD:${GITHUB_REF_NAME}"

      # ============================================================
      # 29. SUCCESS ARTIFACT
      # ============================================================

      - name: 📤 Upload vendor tree artifact
        if: ${{ inputs.UPLOAD_ARTIFACTS && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: proprietary_vendor_xiaomi_spinel
          path: |
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
            proprietary-files.txt
            extract-files.py
            setup-makefiles.py
            proprietary/
            radio/
            reports/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # ============================================================
      # 30. FAILURE ARTIFACT
      # ============================================================

      - name: 📤 Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-build-failure
          path: |
            reports/
            proprietary-files.txt
            proprietary-files.stock.txt
          if-no-files-found: ignore
          retention-days: 7

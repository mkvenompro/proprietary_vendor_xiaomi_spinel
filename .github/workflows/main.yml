name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:
    inputs:
      stock_rom_url:
        description: "Official Xiaomi Fastboot ROM URL - RADIO ONLY"
        required: false
        default: "https://bigota.d.miui.com/OS2.0.212.0.VPGMIXM/spinel_global_images_OS2.0.212.0.VPGMIXM_20260311.0000.00_15.0_global_1e7d24d317.tgz"
        type: string

      stock_dump_branch:
        description: "Stock dump branch"
        required: true
        default: "dump-redmi-spinel-os2.0.212.0.vpgmixm"
        type: string

      extract_utils_branch:
        description: "Lineage extract-utils branch"
        required: true
        default: "lineage-23.2"
        type: string

      clone_retries:
        description: "Stock dump clone retries"
        required: true
        default: "5"
        type: string

      lfs_retries:
        description: "Git LFS retries"
        required: true
        default: "5"
        type: string

      copy_radio:
        description: "Download official Fastboot ROM and extract radio firmware"
        required: true
        default: true
        type: boolean

      push_changes:
        description: "Commit and push generated vendor tree"
        required: true
        default: false
        type: boolean

      upload_artifact:
        description: "Upload generated vendor tree"
        required: true
        default: true
        type: boolean

env:
  DEVICE: spinel
  VENDOR: xiaomi

  STOCK_DUMP_REPO: "https://gitlab.com/mkpromvp/dumber-2-mk.git"
  STOCK_DUMP_DIR: "stock_dump"

  EXTRACT_UTILS_REPO: "https://github.com/LineageOS/android_tools_extract-utils.git"
  EXTRACT_UTILS_DIR: "extract-utils"

  STAGING_ROOT: "staging_android_root"

  STOCK_ROM_URL: ""

jobs:
  build-vendor:
    name: 🧬 Generate Vendor Tree
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

      # ==========================================================
      # 1. CONFIG
      # ==========================================================

      - name: 📋 Show configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "🧬 MKVenomPro • spinel Vendor Builder"
          echo "============================================================"

          echo
          echo "📱 DEVICE"
          echo "DEVICE              = $DEVICE"
          echo "VENDOR              = $VENDOR"

          echo
          echo "📦 STOCK DUMP"
          echo "REPOSITORY          = $STOCK_DUMP_REPO"
          echo "BRANCH              = ${{ inputs.stock_dump_branch }}"

          echo
          echo "🧰 EXTRACT UTILS"
          echo "REPOSITORY          = $EXTRACT_UTILS_REPO"
          echo "BRANCH              = ${{ inputs.extract_utils_branch }}"

          echo
          echo "📻 RADIO"
          echo "URL                  = ${{ inputs.stock_rom_url }}"
          echo "ENABLED              = ${{ inputs.copy_radio }}"

          echo
          echo "⚙️ OPTIONS"
          echo "CLONE RETRIES        = ${{ inputs.clone_retries }}"
          echo "LFS RETRIES          = ${{ inputs.lfs_retries }}"
          echo "PUSH CHANGES         = ${{ inputs.push_changes }}"
          echo "UPLOAD ARTIFACT      = ${{ inputs.upload_artifact }}"

      # ==========================================================
      # 2. CHECKOUT
      # ==========================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 3. DEPENDENCIES
      # ==========================================================

      - name: 📦 Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            python3 \
            python3-pip \
            rsync \
            unzip \
            p7zip-full \
            wget \
            curl \
            aria2 \
            jq \
            file \
            bc \
            cpio \
            lz4 \
            zstd \
            xz-utils \
            tar

          git lfs install --skip-repo

      # ==========================================================
      # 4. GIT CONFIG
      # ==========================================================

      - name: ⚙️ Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "MKVenomPro CI"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

      # ==========================================================
      # 5. STOCK DUMP
      # ==========================================================

      - name: 📥 Clone stock dump
        shell: bash
        env:
          STOCK_BRANCH: ${{ inputs.stock_dump_branch }}
          RETRIES: ${{ inputs.clone_retries }}
        run: |
          set -euo pipefail

          rm -rf "$STOCK_DUMP_DIR"

          success=0

          for attempt in $(seq 1 "$RETRIES"); do
            echo
            echo "============================================================"
            echo "📥 Stock dump clone attempt $attempt/$RETRIES"
            echo "============================================================"

            rm -rf "$STOCK_DUMP_DIR"

            if GIT_LFS_SKIP_SMUDGE=1 git clone \
              --depth=1 \
              --branch "$STOCK_BRANCH" \
              "$STOCK_DUMP_REPO" \
              "$STOCK_DUMP_DIR"; then

              success=1
              break
            fi

            echo "⚠️ Clone failed"
            sleep 10
          done

          if [[ "$success" != "1" ]]; then
            echo "❌ Stock dump clone failed"
            exit 1
          fi

          cd "$STOCK_DUMP_DIR"

          lfs_success=0

          for attempt in $(seq 1 "$RETRIES"); do
            echo
            echo "============================================================"
            echo "📦 Git LFS attempt $attempt/$RETRIES"
            echo "============================================================"

            if git lfs fetch --all && git lfs checkout; then
              lfs_success=1
              break
            fi

            echo "⚠️ Git LFS failed"
            sleep 10
          done

          if [[ "$lfs_success" != "1" ]]; then
            echo "❌ Git LFS failed"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"

          echo "✅ Stock dump ready"

      # ==========================================================
      # 6. FIND PROPRIETARY LIST
      # ==========================================================

      - name: 🔎 Locate proprietary-files.txt
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t LISTS < <(
            find "$STOCK_DUMP_DIR" \
              -type f \
              -name "proprietary-files.txt" \
              -print
          )

          if [[ "${#LISTS[@]}" -eq 0 ]]; then
            echo "❌ proprietary-files.txt not found"
            exit 1
          fi

          echo "Found:"
          printf '%s\n' "${LISTS[@]}"

          SOURCE_LIST="${LISTS[0]}"

          cp \
            "$SOURCE_LIST" \
            proprietary-files.original.txt

          echo "SOURCE_LIST=$SOURCE_LIST" >> "$GITHUB_ENV"

      # ==========================================================
      # 7. NORMALIZE LIST
      # ==========================================================

      - name: 🧹 Normalize proprietary-files.txt
        shell: bash
        run: |
          set -euo pipefail

          test -f "$SOURCE_LIST"

          awk '
          {
            line=$0

            if (line ~ /^[[:space:]]*#/) {
              print line
              next
            }

            sub(/^[[:space:]]*-/, "", line)
            sub(/^[[:space:]]+/, "", line)

            if (line == "")
              next

            if (line ~ /^system\//)
              next

            if (line ~ /^system_ext\//)
              next

            if (line ~ /^product\//)
              next

            if (line ~ /^vendor_dlkm\//)
              next

            if (line ~ /^odm_dlkm\//)
              next

            if (line ~ /^mi_ext\//)
              next

            if (line == "vendor/odm/etc/vintf/manifest_nonfc_dsds.xml")
              next

            if (line == "vendor/odm/etc/vintf/manifest_nonfc_ss.xml")
              next

            # IMPORTANT:
            # The dump already contains vendor/bin/iwpriv.
            # Do not convert bin/iwpriv.
            # Simply drop the duplicate legacy path.
            if (line == "bin/iwpriv")
              next

            print line
          }
          ' "$SOURCE_LIST" > proprietary-files.txt

          echo
          echo "============================================================"
          echo "📊 LIST VALIDATION"
          echo "============================================================"

          IWPRIV_COUNT="$(
            grep -c '^vendor/bin/iwpriv$' \
              proprietary-files.txt \
              || true
          )"

          echo "vendor/bin/iwpriv = $IWPRIV_COUNT"

          if [[ "$IWPRIV_COUNT" -ne 1 ]]; then
            echo "❌ Expected exactly one vendor/bin/iwpriv"
            exit 1
          fi

          if grep -n '^bin/iwpriv' proprietary-files.txt; then
            echo "❌ bin/iwpriv still exists"
            exit 1
          fi

          if grep -nE \
            '^(system|system_ext|product|vendor_dlkm|odm_dlkm|mi_ext)/' \
            proprietary-files.txt; then

            echo "❌ Unsupported partition entries remain"
            exit 1
          fi

          echo "✅ Proprietary list normalized"

      # ==========================================================
      # 8. VALIDATE SOURCES
      # ==========================================================

      - name: 🔍 Validate proprietary source files
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          total=0

          while IFS= read -r entry; do

            [[ -z "$entry" ]] && continue
            [[ "$entry" == \#* ]] && continue

            src="${entry%%:*}"
            src="${src%%|*}"
            src="${src#/}"

            total=$((total + 1))

            if ! find "$STOCK_DUMP_DIR" \
              -type f \
              -path "*/$src" \
              -print \
              -quit \
              | grep -q .; then

              echo "❌ MISSING: $src"
              missing=$((missing + 1))
            fi

          done < proprietary-files.txt

          echo
          echo "Total entries: $total"
          echo "Missing: $missing"

          if [[ "$missing" -ne 0 ]]; then
            echo "❌ Source validation failed"
            exit 1
          fi

          echo "✅ All source files exist"

      # ==========================================================
      # 9. EXTRACT UTILS
      # ==========================================================

      - name: 🧰 Clone Lineage extract-utils
        shell: bash
        env:
          EXTRACT_BRANCH: ${{ inputs.extract_utils_branch }}
        run: |
          set -euo pipefail

          rm -rf "$EXTRACT_UTILS_DIR"

          git clone \
            --depth=1 \
            --branch "$EXTRACT_BRANCH" \
            "$EXTRACT_UTILS_REPO" \
            "$EXTRACT_UTILS_DIR"

          echo "extract-utils commit:"
          git -C "$EXTRACT_UTILS_DIR" rev-parse HEAD

      - name: 🧪 Verify extract-utils
        shell: bash
        run: |
          set -euo pipefail

          PYTHONPATH="$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR" \
          python3 - <<'PY'
          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print("✅ ExtractUtils import OK")
          print(ExtractUtils)
          print(ExtractUtilsModule)
          PY

      # ==========================================================
      # 10. STAGING ROOT
      # ==========================================================

      - name: 🏗️ Prepare staging Android root
        shell: bash
        run: |
          set -euo pipefail

          WORK_PARENT="$GITHUB_WORKSPACE/$STAGING_ROOT"

          rm -rf "$WORK_PARENT"

          mkdir -p \
            "$WORK_PARENT/device/xiaomi/spinel" \
            "$WORK_PARENT/tools/extract-utils"

          echo "WORK_PARENT=$WORK_PARENT" >> "$GITHUB_ENV"

          echo
          echo "WORK_PARENT:"
          echo "$WORK_PARENT"

      # ==========================================================
      # 11. DEVICE EXTRACTION FILES
      # ==========================================================

      - name: 📱 Prepare spinel extraction tree
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_TREE="$WORK_PARENT/device/xiaomi/spinel"

          cp \
            proprietary-files.txt \
            "$DEVICE_TREE/proprietary-files.txt"

          cat > "$DEVICE_TREE/extract-files.py" <<'PY'
          #!/usr/bin/env python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=True,
              add_firmware_proprietary_file=False,
          )

          utils = ExtractUtils.device(module)

          if __name__ == "__main__":
              utils.run()
          PY

          chmod +x "$DEVICE_TREE/extract-files.py"

          echo "✅ Device extraction tree prepared"

      # ==========================================================
      # 12. COPY EXTRACT UTILS PHYSICALLY
      # ==========================================================

      - name: 📦 Copy extract-utils into staging
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WORK_PARENT/tools/extract-utils"

          mkdir -p "$WORK_PARENT/tools/extract-utils"

          cp -a \
            "$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR/." \
            "$WORK_PARENT/tools/extract-utils/"

          echo "Extract-utils:"
          realpath "$WORK_PARENT/tools/extract-utils"

      # ==========================================================
      # 13. VERIFY ROOT
      # ==========================================================

      - name: 🧪 Verify staging Android root
        shell: bash
        run: |
          set -euo pipefail

          cd "$WORK_PARENT"

          export PYTHONPATH="$WORK_PARENT/tools/extract-utils"

          python3 - <<'PY'
          import os
          import extract_utils
          from extract_utils.tools import android_root

          expected = os.path.realpath(os.getcwd())
          actual = os.path.realpath(android_root)

          print("extract_utils:")
          print(os.path.realpath(extract_utils.__file__))

          print()
          print("EXPECTED:")
          print(expected)

          print()
          print("ACTUAL:")
          print(actual)

          if actual != expected:
              raise SystemExit(
                  f"❌ Android root mismatch\n"
                  f"Expected: {expected}\n"
                  f"Actual: {actual}"
              )

          print()
          print("✅ Android root is correct")
          PY

      # ==========================================================
      # 14. EXTRACTION
      # ==========================================================

      - name: 🧬 Extract proprietary blobs
        shell: bash
        run: |
          set -euo pipefail

          cd "$WORK_PARENT"

          export PYTHONPATH="$WORK_PARENT/tools/extract-utils"

          DEVICE_TREE="$WORK_PARENT/device/xiaomi/spinel"
          VENDOR_TREE="$WORK_PARENT/vendor/xiaomi/spinel"

          echo
          echo "============================================================"
          echo "🧬 STARTING LINEAGE EXTRACT-UTILS"
          echo "============================================================"

          echo "Android root:"
          pwd

          echo
          echo "Extract-utils:"
          realpath "$WORK_PARENT/tools/extract-utils"

          echo
          echo "Device tree:"
          realpath "$DEVICE_TREE"

          echo
          echo "Source:"
          echo "$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"

          echo
          echo "Python import location:"

          python3 - <<'PY'
          import os
          import extract_utils
          from extract_utils.tools import android_root

          print("extract_utils:")
          print(os.path.realpath(extract_utils.__file__))

          print()
          print("android_root:")
          print(os.path.realpath(android_root))
          PY

          echo
          echo "Checking proprietary-files.txt..."

          test -f "$DEVICE_TREE/proprietary-files.txt"

          echo "✅ proprietary-files.txt exists"

          echo
          echo "Final iwpriv check before extraction:"

          IWPRIV_COUNT="$(
            grep -c '^vendor/bin/iwpriv$' \
              "$DEVICE_TREE/proprietary-files.txt" \
              || true
          )"

          echo "vendor/bin/iwpriv count = $IWPRIV_COUNT"

          if grep -n '^bin/iwpriv' \
            "$DEVICE_TREE/proprietary-files.txt"; then

            echo "❌ bin/iwpriv still exists"
            exit 1
          fi

          if [[ "$IWPRIV_COUNT" -ne 1 ]]; then
            echo "❌ Invalid iwpriv count"
            exit 1
          fi

          echo "✅ iwpriv list is clean"

          echo
          echo "Starting extractor..."

          python3 \
            "$DEVICE_TREE/extract-files.py" \
            "$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"

          echo
          echo "============================================================"
          echo "✅ EXTRACTION COMPLETED"
          echo "============================================================"

          echo
          echo "Expected generated vendor tree:"
          echo "$VENDOR_TREE"

          if [[ ! -d "$VENDOR_TREE" ]]; then
            echo "❌ extract-utils did not create vendor/xiaomi/spinel"
            echo
            echo "Actual staging directories:"
            find "$WORK_PARENT" \
              -maxdepth 5 \
              -type d \
              | sort
            exit 1
          fi

          if [[ ! -d "$VENDOR_TREE/proprietary" ]]; then
            echo "❌ proprietary directory was not generated"
            echo
            echo "Generated vendor tree:"
            find "$VENDOR_TREE" \
              -maxdepth 3 \
              -print \
              | sort
            exit 1
          fi

          echo
          echo "✅ vendor/xiaomi/spinel/proprietary exists"

      # ==========================================================
      # 15. INSPECT CORRECT GENERATED TREE
      # ==========================================================

      - name: 🔎 Inspect generated vendor tree
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$WORK_PARENT/vendor/xiaomi/spinel"

          echo
          echo "============================================================"
          echo "🔎 GENERATED VENDOR TREE"
          echo "============================================================"

          echo
          echo "Root files:"
          find "$VENDOR_TREE" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "Directories:"
          find "$VENDOR_TREE" \
            -maxdepth 2 \
            -type d \
            | sort

          echo
          echo "Proprietary:"
          du -sh "$VENDOR_TREE/proprietary"

      # ==========================================================
      # 16. RESTORE VINTF INTO CORRECT VENDOR TREE
      # ==========================================================

      - name: 🛠️ Restore special VINTF manifests
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$WORK_PARENT/vendor/xiaomi/spinel"

          DEST="$VENDOR_TREE/proprietary/odm/etc/vintf"

          mkdir -p "$DEST"

          DSDS="$(
            find "$STOCK_DUMP_DIR" \
              -type f \
              -name "manifest_nonfc_dsds.xml" \
              -print \
              -quit \
              || true
          )"

          SS="$(
            find "$STOCK_DUMP_DIR" \
              -type f \
              -name "manifest_nonfc_ss.xml" \
              -print \
              -quit \
              || true
          )"

          if [[ -z "$DSDS" ]]; then
            echo "❌ manifest_nonfc_dsds.xml not found"
            exit 1
          fi

          if [[ -z "$SS" ]]; then
            echo "❌ manifest_nonfc_ss.xml not found"
            exit 1
          fi

          cp \
            "$DSDS" \
            "$DEST/manifest_nonfc_dsds.xml"

          cp \
            "$SS" \
            "$DEST/manifest_nonfc_ss.xml"

          echo "✅ manifest_nonfc_dsds.xml restored"
          echo "✅ manifest_nonfc_ss.xml restored"

      # ==========================================================
      # 17. ADD VINTF MAKE RULES
      # ==========================================================

      - name: 🧩 Add VINTF make rules
        shell: bash
        run: |
          set -euo pipefail

          MK="$WORK_PARENT/vendor/xiaomi/spinel/spinel-vendor.mk"

          if [[ ! -f "$MK" ]]; then
            echo "❌ spinel-vendor.mk not found"
            exit 1
          fi

          cat >> "$MK" <<'EOF'

          # Manually restored ODM VINTF manifests.
          PRODUCT_COPY_FILES += \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_dsds.xml \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_ss.xml
          EOF

          echo "✅ VINTF rules added"

      # ==========================================================
      # 18. DOWNLOAD OFFICIAL ROM FOR RADIO ONLY
      # ==========================================================

      - name: 📻 Download official spinel Fastboot ROM
        if: ${{ inputs.copy_radio }}
        shell: bash
        env:
          STOCK_URL_INPUT: ${{ inputs.stock_rom_url }}
          STOCK_URL_ENV: ${{ env.STOCK_ROM_URL }}
        run: |
          set -euo pipefail

          STOCK_URL="$STOCK_URL_INPUT"

          if [[ -z "$STOCK_URL" ]]; then
            STOCK_URL="$STOCK_URL_ENV"
          fi

          if [[ -z "$STOCK_URL" ]]; then
            echo "❌ Stock ROM URL is empty"
            exit 1
          fi

          ROM_FILE="$RUNNER_TEMP/spinel_stock.tgz"
          ROM_DIR="$RUNNER_TEMP/spinel_fastboot"

          rm -rf "$ROM_DIR"
          rm -f "$ROM_FILE"

          mkdir -p "$ROM_DIR"

          echo
          echo "============================================================"
          echo "📻 OFFICIAL SPINEL FASTBOOT ROM"
          echo "============================================================"

          echo
          echo "RADIO ONLY"

          echo
          echo "Downloading:"
          echo "$STOCK_URL"

          aria2c \
            --max-tries=5 \
            --retry-wait=5 \
            --timeout=60 \
            --connect-timeout=30 \
            --max-connection-per-server=8 \
            --split=8 \
            --min-split-size=10M \
            --continue=true \
            --allow-overwrite=true \
            --out="spinel_stock.tgz" \
            --dir="$RUNNER_TEMP" \
            "$STOCK_URL"

          test -s "$ROM_FILE"

          echo
          echo "Downloaded:"
          ls -lh "$ROM_FILE"

          echo
          echo "Extracting..."

          tar \
            -xzf "$ROM_FILE" \
            -C "$ROM_DIR"

          echo "✅ Fastboot ROM extracted"

      # ==========================================================
      # 19. RADIO
      # ==========================================================

      - name: 📻 Extract spinel radio firmware
        if: ${{ inputs.copy_radio }}
        shell: bash
        run: |
          set -euo pipefail

          ROM_DIR="$RUNNER_TEMP/spinel_fastboot"
          RADIO_DIR="$GITHUB_WORKSPACE/radio"

          rm -rf "$RADIO_DIR"
          mkdir -p "$RADIO_DIR"

          radio_files=(
            dpm.img
            gz.img
            lk.img
            mcupm.img
            md1img.img
            pi_img.img
            scp.img
            spmfw.img
            sspm.img
            tee.img
          )

          copied=0

          echo
          echo "============================================================"
          echo "📻 EXTRACTING SPINEL RADIO"
          echo "============================================================"

          for name in "${radio_files[@]}"; do

            src="$(
              find "$ROM_DIR" \
                -type f \
                -name "$name" \
                -print \
                -quit \
                || true
            )

            if [[ -n "$src" ]]; then

              cp \
                "$src" \
                "$RADIO_DIR/$name"

              echo "✅ $name"

              copied=$((copied + 1))

            else

              echo "❌ $name NOT FOUND"
              exit 1

            fi

          done

          echo
          echo "Copied: $copied/${#radio_files[@]}"

          echo
          echo "Radio directory:"
          ls -lh "$RADIO_DIR"

          echo
          echo "✅ Radio extraction completed"

      # ==========================================================
      # 20. RADIO VALIDATION
      # ==========================================================

      - name: 🔬 Validate radio firmware
        if: ${{ inputs.copy_radio }}
        shell: bash
        run: |
          set -euo pipefail

          RADIO_DIR="$GITHUB_WORKSPACE/radio"

          expected=(
            dpm.img
            gz.img
            lk.img
            mcupm.img
            md1img.img
            pi_img.img
            scp.img
            spmfw.img
            sspm.img
            tee.img
          )

          for name in "${expected[@]}"; do

            if [[ ! -f "$RADIO_DIR/$name" ]]; then
              echo "❌ Missing $name"
              exit 1
            fi

            size="$(stat -c '%s' "$RADIO_DIR/$name")"

            if [[ "$size" -le 0 ]]; then
              echo "❌ Empty $name"
              exit 1
            fi

            echo "✅ $name ($size bytes)"

          done

          echo
          echo "✅ All radio images are valid"

      # ==========================================================
      # 21. VALIDATE VENDOR TREE BEFORE FLATTEN
      # ==========================================================

      - name: ✅ Validate generated vendor tree
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$WORK_PARENT/vendor/xiaomi/spinel"

          echo
          echo "============================================================"
          echo "✅ VENDOR TREE VALIDATION"
          echo "============================================================"

          required_files=(
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
          )

          for file in "${required_files[@]}"; do

            if [[ -f "$VENDOR_TREE/$file" ]]; then
              echo "✅ $file"
            else
              echo "❌ Missing $file"
              exit 1
            fi

          done

          if [[ ! -d "$VENDOR_TREE/proprietary" ]]; then
            echo "❌ proprietary missing"
            exit 1
          fi

          echo
          echo "Proprietary size:"
          du -sh "$VENDOR_TREE/proprietary"

          echo
          echo "Generated vendor tree:"
          find "$VENDOR_TREE" \
            -maxdepth 2 \
            -type d \
            | sort

      # ==========================================================
      # 22. COPY DEVICE METADATA + VENDOR TREE TO ROOT
      #
      # IMPORTANT:
      #
      # vendor/xiaomi/spinel contains:
      #   Android.bp
      #   Android.mk
      #   BoardConfigVendor.mk
      #   spinel-vendor.mk
      #   proprietary/
      #
      # device/xiaomi/spinel contains:
      #   proprietary-files.txt
      #   extract-files.py
      #   setup-makefiles.py
      #
      # Final repo root combines both.
      # ==========================================================

      - name: 📂 Flatten generated tree to repository root
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$WORK_PARENT/vendor/xiaomi/spinel"
          DEVICE_TREE="$WORK_PARENT/device/xiaomi/spinel"
          ROOT="$GITHUB_WORKSPACE"

          echo
          echo "============================================================"
          echo "📂 FLATTENING TO REPOSITORY ROOT"
          echo "============================================================"

          # ------------------------------------------------------
          # Copy generated vendor tree directly to repository root.
          #
          # This gives:
          #
          #   ROOT/Android.bp
          #   ROOT/Android.mk
          #   ROOT/BoardConfigVendor.mk
          #   ROOT/spinel-vendor.mk
          #   ROOT/proprietary/
          # ------------------------------------------------------

          rsync -a \
            "$VENDOR_TREE/" \
            "$ROOT/"

          # ------------------------------------------------------
          # Copy device-side extraction metadata.
          # ------------------------------------------------------

          cp \
            "$DEVICE_TREE/proprietary-files.txt" \
            "$ROOT/proprietary-files.txt"

          cp \
            "$DEVICE_TREE/extract-files.py" \
            "$ROOT/extract-files.py"

          # setup-makefiles.py may be generated/available in the
          # device tree depending on extract-utils.
          if [[ -f "$DEVICE_TREE/setup-makefiles.py" ]]; then

            cp \
              "$DEVICE_TREE/setup-makefiles.py" \
              "$ROOT/setup-makefiles.py"

          elif [[ -f "$VENDOR_TREE/setup-makefiles.py" ]]; then

            cp \
              "$VENDOR_TREE/setup-makefiles.py" \
              "$ROOT/setup-makefiles.py"

          else

            echo "⚠️ setup-makefiles.py not generated by extractor"

            # Copy the official template from extract-utils.
            TEMPLATE="$WORK_PARENT/tools/extract-utils/templates/setup-makefiles.py"

            if [[ -f "$TEMPLATE" ]]; then

              cp \
                "$TEMPLATE" \
                "$ROOT/setup-makefiles.py"

              echo "✅ setup-makefiles.py copied from extract-utils template"

            else

              echo "❌ setup-makefiles.py template not found"
              exit 1

            fi

          fi

          echo
          echo "Checking root..."

          test -f "$ROOT/Android.bp"
          test -f "$ROOT/Android.mk"
          test -f "$ROOT/BoardConfigVendor.mk"
          test -f "$ROOT/spinel-vendor.mk"
          test -f "$ROOT/proprietary-files.txt"
          test -f "$ROOT/extract-files.py"
          test -f "$ROOT/setup-makefiles.py"
          test -d "$ROOT/proprietary"

          echo
          echo "✅ Vendor tree flattened to repository root"

      # ==========================================================
      # 23. FINAL ROOT VALIDATION
      # ==========================================================

      - name: 🔬 Final repository validation
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"

          echo
          echo "============================================================"
          echo "🔬 FINAL REPOSITORY VALIDATION"
          echo "============================================================"

          required_files=(
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
            proprietary-files.txt
            extract-files.py
            setup-makefiles.py
          )

          for file in "${required_files[@]}"; do

            if [[ -f "$ROOT/$file" ]]; then
              echo "✅ $file"
            else
              echo "❌ Missing $file"
              exit 1
            fi

          done

          if [[ ! -d "$ROOT/proprietary" ]]; then
            echo "❌ proprietary/ missing"
            exit 1
          fi

          echo "✅ proprietary/"

          if [[ "${{ inputs.copy_radio }}" == "true" ]]; then

            if [[ ! -d "$ROOT/radio" ]]; then
              echo "❌ radio/ missing"
              exit 1
            fi

            echo "✅ radio/"

          fi

          # ------------------------------------------------------
          # NO nested vendor/xiaomi/spinel
          # ------------------------------------------------------

          if [[ -d "$ROOT/vendor/xiaomi/spinel" ]]; then
            echo "❌ Nested vendor/xiaomi/spinel exists in repository"
            exit 1
          fi

          echo "✅ No nested vendor/xiaomi/spinel"

          # ------------------------------------------------------
          # IWPRIV
          # ------------------------------------------------------

          if grep -n '^bin/iwpriv' \
            "$ROOT/proprietary-files.txt"; then

            echo "❌ bin/iwpriv exists"
            exit 1
          fi

          IWPRIV_COUNT="$(
            grep -c '^vendor/bin/iwpriv$' \
              "$ROOT/proprietary-files.txt" \
              || true
          )"

          if [[ "$IWPRIV_COUNT" -ne 1 ]]; then
            echo "❌ vendor/bin/iwpriv count = $IWPRIV_COUNT"
            exit 1
          fi

          echo "✅ vendor/bin/iwpriv exists exactly once"

          # ------------------------------------------------------
          # Unsupported partitions
          # ------------------------------------------------------

          if grep -nE \
            '^(system|system_ext|product|vendor_dlkm|odm_dlkm|mi_ext)/' \
            "$ROOT/proprietary-files.txt"; then

            echo "❌ Unsupported partition entries remain"
            exit 1
          fi

          echo "✅ No unsupported partition entries"

          # ------------------------------------------------------
          # VINTF
          # ------------------------------------------------------

          if grep -n \
            'manifest_nonfc_' \
            "$ROOT/proprietary-files.txt"; then

            echo "❌ VINTF entries remain in proprietary-files.txt"
            exit 1
          fi

          VINTF_DIR="$ROOT/proprietary/odm/etc/vintf"

          test -f "$VINTF_DIR/manifest_nonfc_dsds.xml"
          test -f "$VINTF_DIR/manifest_nonfc_ss.xml"

          echo "✅ Special VINTF manifests restored"

          # ------------------------------------------------------
          # Final layout
          # ------------------------------------------------------

          echo
          echo "============================================================"
          echo "📁 FINAL ROOT LAYOUT"
          echo "============================================================"

          find "$ROOT" \
            -maxdepth 2 \
            -type d \
            \( \
              -name .git \
              -o -name .github \
              -o -name proprietary \
              -o -name radio \
              -o -name vendor \
              -o -name device \
            \) \
            -prune \
            -o \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "Directories:"
          find "$ROOT" \
            -maxdepth 1 \
            -type d \
            -printf '%f/\n' \
            | sort

          echo
          echo "Proprietary:"
          du -sh "$ROOT/proprietary"

          if [[ -d "$ROOT/radio" ]]; then
            echo
            echo "Radio:"
            du -sh "$ROOT/radio"
          fi

          echo
          echo "============================================================"
          echo "🎉 FINAL VALIDATION PASSED"
          echo "============================================================"

      # ==========================================================
      # 24. REPORT
      # ==========================================================

      - name: 📝 Generate build report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          cp \
            proprietary-files.txt \
            reports/proprietary-files-final.txt

          {
            echo "# spinel Vendor Build Report"
            echo
            echo "Device: $DEVICE"
            echo "Vendor: $VENDOR"
            echo
            echo "Stock dump:"
            echo "$STOCK_DUMP_REPO"
            echo
            echo "Stock dump branch:"
            echo "${{ inputs.stock_dump_branch }}"
            echo
            echo "Extract utils branch:"
            echo "${{ inputs.extract_utils_branch }}"
            echo
            echo "Radio enabled:"
            echo "${{ inputs.copy_radio }}"
            echo
            echo "Proprietary entries:"
            grep -vE '^[[:space:]]*(#|$)' \
              proprietary-files.txt \
              | wc -l
          } > reports/build-report.md

          echo "✅ Report generated"

      # ==========================================================
      # 25. GIT STATUS
      # ==========================================================

      - name: 📊 Git status
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "📊 FINAL GIT STATUS"
          echo "============================================================"

          git status --short

          echo
          echo "Diff stat:"
          git diff --stat || true

      # ==========================================================
      # 26. PUSH
      # ==========================================================

      - name: 🚀 Commit and push
        if: ${{ inputs.push_changes }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Current branch: $GITHUB_REF_NAME"

          if [[ "$GITHUB_REF_NAME" != "lineage-23.2" ]]; then
            echo "❌ Push allowed only on lineage-23.2"
            exit 1
          fi

          git add \
            Android.bp \
            Android.mk \
            BoardConfigVendor.mk \
            spinel-vendor.mk \
            proprietary-files.txt \
            extract-files.py \
            setup-makefiles.py \
            proprietary \
            radio \
            reports \
            .github

          if git diff --cached --quiet; then
            echo "ℹ️ Nothing to commit"
            exit 0
          fi

          git commit \
            -m "vendor: generate spinel proprietary blobs"

          git push \
            origin \
            "HEAD:lineage-23.2"

          echo "✅ Changes pushed"

      # ==========================================================
      # 27. ARTIFACT
      # ==========================================================

      - name: 📦 Create artifact
        if: ${{ inputs.upload_artifact }}
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT="$RUNNER_TEMP/spinel-vendor-tree.tar.gz"

          tar \
            --exclude=".git" \
            --exclude="stock_dump" \
            --exclude="extract-utils" \
            --exclude="staging_android_root" \
            --exclude="*.tgz" \
            -czf \
            "$ARTIFACT" \
            .

          ls -lh "$ARTIFACT"

      # ==========================================================
      # 28. UPLOAD
      # ==========================================================

      - name: ⬆️ Upload artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree
          path: ${{ runner.temp }}/spinel-vendor-tree.tar.gz
          if-no-files-found: error
          retention-days: 14

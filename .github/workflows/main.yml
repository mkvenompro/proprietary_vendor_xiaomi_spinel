name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:
    inputs:
      STOCK_FASTBOOT_URL:
        description: "Optional direct URL to spinel Global Fastboot ROM (.tgz)"
        required: false
        type: string
        default: "https://bigota.d.miui.com/OS2.0.212.0.VPGMIXM/spinel_global_images_OS2.0.212.0.VPGMIXM_20260311.0000.00_15.0_global_1e7d24d317.tgz"

      STOCK_DUMP_URL:
        description: "Stock dump repository"
        required: true
        type: string
        default: "https://gitlab.com/mkpromvp/dumber-2-mk.git"

      STOCK_DUMP_BRANCH:
        description: "Stock dump branch"
        required: true
        type: string
        default: "dump-redmi-spinel-os2.0.212.0.vpgmixm"

      EXTRACT_UTILS_URL:
        description: "LineageOS extract-utils repository"
        required: true
        type: string
        default: "https://github.com/LineageOS/android_tools_extract-utils.git"

      EXTRACT_UTILS_BRANCH:
        description: "extract-utils branch"
        required: true
        type: string
        default: "lineage-23.2"

      UPLOAD_ARTIFACTS:
        description: "Upload generated vendor tree and reports"
        required: true
        type: boolean
        default: true

      COMMIT_CHANGES:
        description: "Commit generated vendor tree to repository"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-vendor:
    name: 🧬 Generate Vendor Tree
    runs-on: ubuntu-24.04

    env:
      DEVICE: spinel
      VENDOR: xiaomi

      DEVICE_PATH: device/xiaomi/spinel
      VENDOR_PATH: vendor/xiaomi/spinel

      STOCK_DUMP_URL: ${{ inputs.STOCK_DUMP_URL }}
      STOCK_DUMP_BRANCH: ${{ inputs.STOCK_DUMP_BRANCH }}

      EXTRACT_UTILS_URL: ${{ inputs.EXTRACT_UTILS_URL }}
      EXTRACT_UTILS_BRANCH: ${{ inputs.EXTRACT_UTILS_BRANCH }}

      STOCK_FASTBOOT_URL: ${{ inputs.STOCK_FASTBOOT_URL }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================

      - name: 🧰 Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            rsync \
            curl \
            wget \
            unzip \
            p7zip-full \
            tar \
            gzip \
            xz-utils \
            file \
            findutils \
            grep \
            sed \
            gawk \
            coreutils

          echo
          echo "===== VERSIONS ====="

          python3 --version
          git --version
          curl --version | head -n 1
          rsync --version | head -n 1

      # ============================================================
      # 3. STOCK DUMP
      # ============================================================

      - name: 📦 Clone stock dump
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf stock_dump

          git clone \
            --depth 1 \
            --branch "$STOCK_DUMP_BRANCH" \
            "$STOCK_DUMP_URL" \
            stock_dump

          echo
          echo "===== STOCK DUMP ====="

          du -sh stock_dump || true

          find stock_dump \
            -maxdepth 2 \
            -type d \
            -print \
            | sort \
            | head -n 150

      # ============================================================
      # 4. EXTRACT UTILS
      # ============================================================

      - name: 🧬 Clone LineageOS extract-utils
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf extract-utils

          git clone \
            --depth 1 \
            --branch "$EXTRACT_UTILS_BRANCH" \
            "$EXTRACT_UTILS_URL" \
            extract-utils

          echo
          echo "===== EXTRACT-UTILS ====="

          git -C extract-utils rev-parse HEAD

          find extract-utils \
            -maxdepth 2 \
            -type d \
            -print \
            | sort \
            | head -n 100

      # ============================================================
      # 5. PYTHONPATH
      # ============================================================

      - name: 🐍 Configure extract-utils Python path
        shell: bash
        run: |
          set -euxo pipefail

          EXTRACT_UTILS_ROOT="$GITHUB_WORKSPACE/extract-utils"

          if [ ! -d "$EXTRACT_UTILS_ROOT" ]; then
            echo "ERROR: extract-utils directory does not exist."
            exit 1
          fi

          echo "EXTRACT_UTILS_ROOT=$EXTRACT_UTILS_ROOT" >> "$GITHUB_ENV"

          echo "PYTHONPATH=$EXTRACT_UTILS_ROOT${PYTHONPATH:+:$PYTHONPATH}" \
            >> "$GITHUB_ENV"

          export PYTHONPATH="$EXTRACT_UTILS_ROOT${PYTHONPATH:+:$PYTHONPATH}"

          echo
          echo "===== PYTHON ====="
          python3 --version

          echo
          echo "===== PYTHONPATH ====="
          echo "$PYTHONPATH"

          echo
          echo "===== IMPORT TEST ====="

          python3 - <<'PY'
          import sys

          print("sys.path:")
          for item in sys.path:
              print("  " + item)

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print()
          print("ExtractUtils import: OK")
          print("ExtractUtilsModule import: OK")
          PY

      # ============================================================
      # 6. STOCK IDENTITY
      # ============================================================

      - name: 🔎 Inspect stock identity
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== STOCK IDENTITY ====="

          if [ -f stock_dump/metadata ]; then
            cat stock_dump/metadata
          fi

          if [ -f stock_dump/metadata.txt ]; then
            cat stock_dump/metadata.txt
          fi

          echo
          echo "===== STOCK PARTITIONS ====="

          find stock_dump \
            -mindepth 1 \
            -maxdepth 2 \
            -type d \
            -printf '%p\n' \
            | sort \
            | head -n 200

      # ============================================================
      # 7. OPTIONAL FASTBOOT ROM
      # ============================================================

      - name: 📡 Download Fastboot ROM
        if: ${{ env.STOCK_FASTBOOT_URL != '' }}
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p fastboot_rom

          URL="$STOCK_FASTBOOT_URL"

          echo "===== FASTBOOT ROM URL ====="
          echo "$URL"

          echo
          echo "===== DOWNLOADING ====="

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 7200 \
            --continue-at - \
            --output fastboot_rom/stock.tgz \
            "$URL"

          echo
          echo "===== DOWNLOADED ====="

          ls -lh fastboot_rom/stock.tgz

          file fastboot_rom/stock.tgz

          echo
          echo "===== SHA256 ====="

          sha256sum fastboot_rom/stock.tgz

      # ============================================================
      # 8. EXTRACT FASTBOOT ROM
      # ============================================================

      - name: 📦 Extract Fastboot ROM
        if: ${{ env.STOCK_FASTBOOT_URL != '' }}
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf fastboot_rom/extracted

          mkdir -p fastboot_rom/extracted

          if [ ! -s fastboot_rom/stock.tgz ]; then
            echo "ERROR: Fastboot ROM file is empty."
            exit 1
          fi

          echo "===== EXTRACTING FASTBOOT ROM ====="

          tar \
            -xzf fastboot_rom/stock.tgz \
            -C fastboot_rom/extracted

          echo
          echo "===== FASTBOOT CONTENT ====="

          find fastboot_rom/extracted \
            -maxdepth 5 \
            -type f \
            -printf '%p\n' \
            | sort \
            | head -n 400

      # ============================================================
      # 9. FASTBOOT ROM IDENTITY
      # ============================================================

      - name: 🆔 Verify Fastboot ROM identity
        if: ${{ env.STOCK_FASTBOOT_URL != '' }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== FASTBOOT IDENTITY ====="

          if grep -Raiq \
            -E 'spinel|VPGMIXM|OS2\.0\.212\.0\.VPGMIXM' \
            fastboot_rom/extracted \
            2>/dev/null; then

            echo "PASS: spinel identifiers detected."

          else

            echo "WARNING: Could not positively identify spinel."
            echo "Raw firmware will NOT be trusted unless discovered."
          fi

      # ============================================================
      # 10. RADIO DISCOVERY
      # ============================================================

      - name: 📡 Discover spinel firmware images
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports
          mkdir -p generated_root/radio

          RADIO_NAMES=(
            dpm.img
            gz.img
            lk.img
            mcupm.img
            md1img.img
            pi_img.img
            preloader_raw.img
            scp.img
            spmfw.img
            sspm.img
            tee.img
          )

          : > reports/radio-discovery.txt

          echo "===== SPINEL RADIO DISCOVERY =====" \
            | tee -a reports/radio-discovery.txt

          FOUND=0
          MISSING=0

          for name in "${RADIO_NAMES[@]}"; do

            FOUND_PATH=""

            if [ -d stock_dump ]; then
              FOUND_PATH="$(
                find stock_dump \
                  -type f \
                  -name "$name" \
                  -print \
                  -quit \
                  2>/dev/null || true
              )"
            fi

            if [ -z "$FOUND_PATH" ] &&
               [ -d fastboot_rom/extracted ]; then

              FOUND_PATH="$(
                find fastboot_rom/extracted \
                  -type f \
                  -name "$name" \
                  -print \
                  -quit \
                  2>/dev/null || true
              )"

            fi

            if [ -n "$FOUND_PATH" ]; then

              echo "FOUND: $name -> $FOUND_PATH" \
                | tee -a reports/radio-discovery.txt

              cp -f \
                "$FOUND_PATH" \
                "generated_root/radio/$name"

              FOUND=$((FOUND + 1))

            else

              echo "MISSING: $name" \
                | tee -a reports/radio-discovery.txt

              MISSING=$((MISSING + 1))

            fi

          done

          echo | tee -a reports/radio-discovery.txt

          echo "FOUND=$FOUND" \
            | tee -a reports/radio-discovery.txt

          echo "MISSING=$MISSING" \
            | tee -a reports/radio-discovery.txt

          echo
          echo "===== RADIO RESULT ====="

          if [ "$FOUND" -gt 0 ]; then
            find generated_root/radio \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
          else
            echo "No raw radio images found."
            echo "Continuing without radio directory."
          fi

      # ============================================================
      # 11. NORMALIZE PROPRIETARY FILES
      # ============================================================

      - name: 📋 Normalize proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$DEVICE_PATH"
          mkdir -p reports

          RAW_LIST="stock_dump/proprietary-files.txt"
          NORMALIZED="$DEVICE_PATH/proprietary-files.txt"

          if [ ! -f "$RAW_LIST" ]; then
            echo "ERROR: proprietary-files.txt not found."
            exit 1
          fi

          cp -f "$RAW_LIST" "$NORMALIZED"

          echo "===== ORIGINAL LIST ====="
          wc -l "$NORMALIZED"

          # --------------------------------------------------------
          # IMPORTANT:
          # Do NOT delete every line starting with '-'.
          #
          # In extract-utils, '-' can be a source modifier.
          # We only normalize the source path.
          # --------------------------------------------------------

          python3 - "$NORMALIZED" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])

          output = []

          for raw in path.read_text(errors="replace").splitlines():

              line = raw.strip()

              # Blank line.
              if not line:
                  continue

              # Comment.
              if line.startswith("#"):
                  output.append(line)
                  continue

              # Remove only CR.
              line = line.replace("\r", "")

              # Extract source portion.
              source = line.split(":", 1)[0]

              # Handle extract-utils source modifier.
              source_without_modifier = source.lstrip("-")

              # --------------------------------------------------
              # Remove unsupported partitions.
              # --------------------------------------------------

              blocked = (
                  "system/",
                  "system_ext/",
                  "product/",
                  "vendor_dlkm/",
                  "odm_dlkm/",
                  "mi_ext/",
              )

              if source_without_modifier.startswith(blocked):
                  continue

              # --------------------------------------------------
              # The two manifests are handled manually later.
              # --------------------------------------------------

              if source_without_modifier in {
                  "vendor/odm/etc/vintf/manifest_nonfc_dsds.xml",
                  "vendor/odm/etc/vintf/manifest_nonfc_ss.xml",
              }:
                  continue

              # --------------------------------------------------
              # Fix malformed iwpriv.
              # --------------------------------------------------

              if source_without_modifier == "bin/iwpriv":
                  continue

              # --------------------------------------------------
              # Keep everything else exactly as a source entry.
              # --------------------------------------------------

              output.append(line)

          # Remove duplicate entries while preserving order.
          seen = set()
          final = []

          for line in output:

              if line in seen:
                  continue

              seen.add(line)
              final.append(line)

          path.write_text("\n".join(final) + "\n")

          print(f"Normalized entries: {len(final)}")
          PY

          # --------------------------------------------------------
          # Restore vendor/bin/iwpriv if it exists in stock.
          # --------------------------------------------------------

          IWPRIV_PATH="$(
            find stock_dump \
              -type f \
              -path '*/bin/iwpriv' \
              -print \
              -quit \
              2>/dev/null || true
          )"

          if [ -n "$IWPRIV_PATH" ]; then

            echo "Resolved iwpriv:"
            echo "$IWPRIV_PATH"

            echo "vendor/bin/iwpriv" >> "$NORMALIZED"

          fi

          # --------------------------------------------------------
          # Save manual VINTF information.
          # --------------------------------------------------------

          cat > reports/manual-vintf.txt <<'EOF'
          vendor/odm/etc/vintf/manifest_nonfc_dsds.xml
          vendor/odm/etc/vintf/manifest_nonfc_ss.xml
          EOF

          # --------------------------------------------------------
          # Deduplicate.
          # --------------------------------------------------------

          awk '!seen[$0]++' "$NORMALIZED" > "$NORMALIZED.tmp"
          mv "$NORMALIZED.tmp" "$NORMALIZED"

          echo
          echo "===== NORMALIZED LIST ====="

          wc -l "$NORMALIZED"

          echo
          echo "First entries:"

          head -n 40 "$NORMALIZED"

      # ============================================================
      # 12. VALIDATION
      #
      # FIX FOR RUN #19:
      # comments beginning with '#' are ignored.
      # ============================================================

      - name: ✅ Validate proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          LIST="$DEVICE_PATH/proprietary-files.txt"

          mkdir -p reports

          MISSING_FILE="reports/missing-files.txt"
          INVALID_FILE="reports/invalid-partitions.txt"

          : > "$MISSING_FILE"
          : > "$INVALID_FILE"

          COUNT=0
          MISSING=0
          INVALID=0

          while IFS= read -r entry; do

            # Ignore empty lines.
            if [ -z "$entry" ]; then
              continue
            fi

            # ======================================================
            # FIX:
            # Ignore comments.
            # ======================================================

            if [[ "$entry" == \#* ]]; then
              continue
            fi

            COUNT=$((COUNT + 1))

            # ------------------------------------------------------
            # Source portion.
            # ------------------------------------------------------

            SRC="${entry%%:*}"

            # Remove extract-utils source modifiers.
            SRC="${SRC#-}"

            # ------------------------------------------------------
            # Only these partitions are allowed.
            # ------------------------------------------------------

            case "$SRC" in

              vendor/*)
                ;;

              odm/*)
                ;;

              recovery/*)
                ;;

              *)
                echo "$SRC" >> "$INVALID_FILE"
                INVALID=$((INVALID + 1))
                continue
                ;;

            esac

            # ------------------------------------------------------
            # Check source file.
            # ------------------------------------------------------

            if [ ! -f "stock_dump/$SRC" ]; then

              echo "$SRC" >> "$MISSING_FILE"

              MISSING=$((MISSING + 1))

            fi

          done < "$LIST"

          sort -u "$MISSING_FILE" -o "$MISSING_FILE"
          sort -u "$INVALID_FILE" -o "$INVALID_FILE"

          echo
          echo "===== VALIDATION ====="

          echo "Real entries : $COUNT"
          echo "Missing      : $MISSING"
          echo "Invalid      : $INVALID"

          echo
          echo "===== MISSING ====="

          if [ -s "$MISSING_FILE" ]; then
            cat "$MISSING_FILE"
          else
            echo "None"
          fi

          echo
          echo "===== INVALID ====="

          if [ -s "$INVALID_FILE" ]; then
            cat "$INVALID_FILE"
          else
            echo "None"
          fi

          if [ "$MISSING" -ne 0 ]; then
            echo
            echo "ERROR: Missing source files."
            exit 1
          fi

          if [ "$INVALID" -ne 0 ]; then
            echo
            echo "ERROR: Invalid partition entries."
            exit 1
          fi

          echo
          echo "VALIDATION PASS"

      # ============================================================
      # 13. GENERATE EXTRACT SCRIPT
      # ============================================================

      - name: 📝 Generate extract-files.py
        shell: bash
        run: |
          set -euxo pipefail

          cat > "$DEVICE_PATH/extract-files.py" <<'PY'
          #!/usr/bin/env python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )


          def main():
              module = ExtractUtilsModule(
                  "spinel",
                  "xiaomi",
                  check_elf=True,
                  add_firmware_proprietary_file=False,
              )

              utils = ExtractUtils(module)
              utils.run()


          if __name__ == "__main__":
              main()
          PY

          chmod +x "$DEVICE_PATH/extract-files.py"

          echo "===== extract-files.py ====="
          cat "$DEVICE_PATH/extract-files.py"

      # ============================================================
      # 14. GENERATE SETUP SCRIPT
      # ============================================================

      - name: 📝 Generate setup-makefiles.py
        shell: bash
        run: |
          set -euxo pipefail

          cat > "$DEVICE_PATH/setup-makefiles.py" <<'PY'
          #!/usr/bin/env python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )


          def main():
              module = ExtractUtilsModule(
                  "spinel",
                  "xiaomi",
                  check_elf=True,
                  add_firmware_proprietary_file=False,
              )

              utils = ExtractUtils(module)
              utils.run()


          if __name__ == "__main__":
              main()
          PY

          chmod +x "$DEVICE_PATH/setup-makefiles.py"

          echo "===== setup-makefiles.py ====="
          cat "$DEVICE_PATH/setup-makefiles.py"

      # ============================================================
      # 15. FINAL IMPORT TEST
      # ============================================================

      - name: 🐍 Final extract-utils import test
        shell: bash
        run: |
          set -euxo pipefail

          export PYTHONPATH="$EXTRACT_UTILS_ROOT${PYTHONPATH:+:$PYTHONPATH}"

          echo "===== FINAL IMPORT TEST ====="

          python3 - <<'PY'
          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print("ExtractUtils: OK")
          print("ExtractUtilsModule: OK")
          print("extract-utils is ready.")
          PY

      # ============================================================
      # 16. EXTRACT
      # ============================================================

      - name: 🧬 Run extract-utils
        shell: bash
        run: |
          set -euxo pipefail

          export PYTHONPATH="$EXTRACT_UTILS_ROOT${PYTHONPATH:+:$PYTHONPATH}"

          echo "===== RUNNING EXTRACT-UTILS ====="

          python3 \
            "$DEVICE_PATH/extract-files.py" \
            --kang

      # ============================================================
      # 17. CHECK GENERATED TREE
      # ============================================================

      - name: 🔎 Inspect generated vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== GENERATED VENDOR TREE ====="

          if [ ! -d "$VENDOR_PATH" ]; then
            echo "ERROR: $VENDOR_PATH was not generated."
            exit 1
          fi

          echo
          echo "Size:"
          du -sh "$VENDOR_PATH"

          echo
          echo "Files:"
          find "$VENDOR_PATH" \
            -maxdepth 4 \
            -type f \
            -printf '%p\n' \
            | sort \
            | head -n 400

      # ============================================================
      # 18. RESTORE VINTF
      # ============================================================

      - name: 🧩 Restore ODM VINTF manifests
        shell: bash
        run: |
          set -euxo pipefail

          SRC_ROOT="stock_dump/vendor/odm/etc/vintf"
          DST_ROOT="$VENDOR_PATH/proprietary/odm/etc/vintf"

          mkdir -p "$DST_ROOT"

          for FILE in \
            manifest_nonfc_dsds.xml \
            manifest_nonfc_ss.xml
          do

            if [ -f "$SRC_ROOT/$FILE" ]; then

              cp -f \
                "$SRC_ROOT/$FILE" \
                "$DST_ROOT/$FILE"

              echo "Restored: $FILE"

            else

              echo "WARNING: $FILE does not exist in stock dump."

            fi

          done

      # ============================================================
      # 19. RADIO
      # ============================================================

      - name: 📡 Copy discovered radio images
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d generated_root/radio ] &&
             find generated_root/radio \
               -type f \
               -print \
               -quit \
               | grep -q .
          then

            mkdir -p "$VENDOR_PATH/radio"

            rsync -a \
              generated_root/radio/ \
              "$VENDOR_PATH/radio/"

            echo "===== RADIO FILES ====="

            find "$VENDOR_PATH/radio" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort

          else

            echo "No raw radio images discovered."

          fi

      # ============================================================
      # 20. BOARD CONFIG VENDOR
      # ============================================================

      - name: 🧩 Generate BoardConfigVendor.mk
        shell: bash
        run: |
          set -euxo pipefail

          cat > "$VENDOR_PATH/BoardConfigVendor.mk" <<'EOF'
          # SPDX-License-Identifier: Apache-2.0

          #
          # Xiaomi spinel
          # Redmi Note 15 4G
          # MT6789
          #
          # Stock:
          # OS2.0.212.0.VPGMIXM
          # Android 15
          #

          EOF

          if [ -d "$VENDOR_PATH/radio" ] &&
             find "$VENDOR_PATH/radio" \
               -type f \
               -print \
               -quit \
               | grep -q .
          then

            cat >> "$VENDOR_PATH/BoardConfigVendor.mk" <<'EOF'
          #
          # Raw firmware images discovered from spinel stock ROM.
          #
          # These are informational only until the correct
          # device-specific firmware build integration is verified.
          #

          EOF

            find "$VENDOR_PATH/radio" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort \
              | while IFS= read -r file; do
                echo "# $file" \
                  >> "$VENDOR_PATH/BoardConfigVendor.mk"
              done

          else

            cat >> "$VENDOR_PATH/BoardConfigVendor.mk" <<'EOF'
          #
          # No raw firmware images were found in the supplied
          # spinel stock dump/Fastboot ROM.
          #
          EOF

          fi

      # ============================================================
      # 21. FIND GENERATED VENDOR MAKEFILE
      # ============================================================

      - name: 🧩 Find generated vendor makefile
        shell: bash
        run: |
          set -euxo pipefail

          MAKEFILE=""

          if [ -f "$VENDOR_PATH/spinel-vendor.mk" ]; then
            MAKEFILE="$VENDOR_PATH/spinel-vendor.mk"
          fi

          if [ -z "$MAKEFILE" ] &&
             [ -f "$VENDOR_PATH/${DEVICE}-vendor.mk" ]; then
            MAKEFILE="$VENDOR_PATH/${DEVICE}-vendor.mk"
          fi

          if [ -z "$MAKEFILE" ]; then

            MAKEFILE="$(
              find "$VENDOR_PATH" \
                -maxdepth 1 \
                -type f \
                -name '*-vendor.mk' \
                -print \
                -quit
            )"

          fi

          if [ -z "$MAKEFILE" ]; then
            echo "ERROR: Generated vendor makefile not found."
            exit 1
          fi

          echo "VENDOR_MAKEFILE=$MAKEFILE" >> "$GITHUB_ENV"

          echo
          echo "Generated vendor makefile:"
          echo "$MAKEFILE"

      # ============================================================
      # 22. RESTORE VINTF MAKE RULES
      # ============================================================

      - name: 🧩 Add manual VINTF rules
        shell: bash
        run: |
          set -euxo pipefail

          MAKEFILE="$VENDOR_MAKEFILE"

          if [ ! -f "$MAKEFILE" ]; then
            echo "ERROR: $MAKEFILE does not exist."
            exit 1
          fi

          if [ \
            -f "$VENDOR_PATH/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml" \
            ] && [ \
            -f "$VENDOR_PATH/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml" \
            ]
          then

            cat >> "$MAKEFILE" <<'EOF'

          # Manually restored ODM VINTF manifests.
          PRODUCT_COPY_FILES += \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_dsds.xml \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_ss.xml
          EOF

          else

            echo "WARNING: Manual VINTF files were not restored."

          fi

      # ============================================================
      # 23. FLATTEN TO REPOSITORY ROOT
      #
      # Repository itself:
      #
      # proprietary_vendor_xiaomi_spinel/
      #
      # Therefore generated vendor/xiaomi/spinel contents are moved
      # into the repository root.
      # ============================================================

      - name: 📁 Flatten vendor tree into repository root
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d "$VENDOR_PATH" ]; then
            echo "ERROR: Generated vendor tree missing."
            exit 1
          fi

          rm -rf generated_root/final_vendor
          mkdir -p generated_root/final_vendor

          rsync -a \
            "$VENDOR_PATH/" \
            generated_root/final_vendor/

          echo
          echo "===== FINAL TREE SNAPSHOT ====="

          find generated_root/final_vendor \
            -maxdepth 3 \
            -print \
            | sort \
            | head -n 400

          # --------------------------------------------------------
          # Copy generated vendor contents to repository root.
          #
          # Do NOT delete existing repository files.
          # --------------------------------------------------------

          rsync -a \
            generated_root/final_vendor/ \
            ./

          # --------------------------------------------------------
          # Remove nested generated path.
          # --------------------------------------------------------

          rm -rf vendor/xiaomi/spinel

          rmdir vendor/xiaomi 2>/dev/null || true
          rmdir vendor 2>/dev/null || true

      # ============================================================
      # 24. FINAL ROOT CHECK
      # ============================================================

      - name: 🔍 Verify repository root layout
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== REPOSITORY ROOT ====="

          ls -la

          echo
          echo "===== EXPECTED FILES ====="

          for FILE in \
            Android.bp \
            Android.mk \
            BoardConfigVendor.mk \
            proprietary-files.txt \
            extract-files.py \
            setup-makefiles.py
          do

            if [ -f "$FILE" ]; then
              echo "OK: $FILE"
            else
              echo "WARNING: $FILE not found"
            fi

          done

          echo
          echo "===== VENDOR MAKEFILE ====="

          if [ -n "${VENDOR_MAKEFILE:-}" ]; then
            BASENAME="$(basename "$VENDOR_MAKEFILE")"

            if [ -f "$BASENAME" ]; then
              echo "OK: $BASENAME"
            else
              echo "WARNING: $BASENAME not found at root."
            fi
          fi

          echo
          echo "===== NESTED PATH ====="

          if [ -d vendor/xiaomi/spinel ]; then

            echo "ERROR: Nested vendor/xiaomi/spinel exists."

            find vendor/xiaomi/spinel \
              -maxdepth 3 \
              -print \
              | head -n 100

            exit 1

          fi

          echo "PASS: No nested vendor/xiaomi/spinel."

      # ============================================================
      # 25. FINAL CONTAMINATION CHECK
      # ============================================================

      - name: 🧹 Check partition contamination
        shell: bash
        run: |
          set -euxo pipefail

          BAD=0

          echo "===== DIRECTORY CHECK ====="

          for DIR in \
            system \
            system_ext \
            product \
            vendor_dlkm \
            odm_dlkm \
            mi_ext
          do

            if [ -d "proprietary/$DIR" ]; then

              echo "ERROR: proprietary/$DIR exists."

              BAD=1

            fi

          done

          echo
          echo "===== FILE PATH CHECK ====="

          while IFS= read -r file; do

            case "$file" in

              proprietary/system/*)
                echo "BAD: $file"
                BAD=1
                ;;

              proprietary/system_ext/*)
                echo "BAD: $file"
                BAD=1
                ;;

              proprietary/product/*)
                echo "BAD: $file"
                BAD=1
                ;;

              proprietary/vendor_dlkm/*)
                echo "BAD: $file"
                BAD=1
                ;;

              proprietary/odm_dlkm/*)
                echo "BAD: $file"
                BAD=1
                ;;

              proprietary/mi_ext/*)
                echo "BAD: $file"
                BAD=1
                ;;

            esac

          done < <(
            find proprietary \
              -type f \
              -print \
              2>/dev/null
          )

          if [ "$BAD" -ne 0 ]; then

            echo
            echo "ERROR: Partition contamination detected."
            exit 1

          fi

          echo
          echo "PASS: No forbidden partition contamination."

      # ============================================================
      # 26. VERIFY PROPRIETARY FILE COUNT
      # ============================================================

      - name: 📊 Generate final reports
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          {
            echo "=========================================="
            echo "SPINEL LINEAGEOS VENDOR TREE"
            echo "=========================================="
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $(git rev-parse HEAD)"
            echo
            echo "Vendor size:"
            du -sh proprietary 2>/dev/null || true
            echo
            echo "Proprietary files:"
            find proprietary \
              -type f \
              2>/dev/null \
              | wc -l
            echo
            echo "Vendor makefile:"
            basename "${VENDOR_MAKEFILE:-unknown}"
            echo
            echo "Nested vendor/xiaomi/spinel:"
            if [ -d vendor/xiaomi/spinel ]; then
              echo "PRESENT - ERROR"
            else
              echo "ABSENT - PASS"
            fi
            echo
            echo "=========================================="
          } | tee reports/final-summary.txt

          echo
          echo "===== ROOT FILES ====="

          find . \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort \
            | tee reports/root-files.txt

      # ============================================================
      # 27. GIT STATUS
      # ============================================================

      - name: 📝 Show git status
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== GIT STATUS ====="

          git status --short

          echo
          echo "===== CHANGED FILE COUNT ====="

          git status --short \
            | wc -l

      # ============================================================
      # 28. COMMIT
      # ============================================================

      - name: 🚀 Commit generated vendor tree
        if: ${{ inputs.COMMIT_CHANGES }}
        shell: bash
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "spinel: update proprietary vendor blobs"

            git push

          fi

      # ============================================================
      # 29. UPLOAD VENDOR TREE
      # ============================================================

      - name: 📦 Upload generated vendor tree
        if: ${{ always() && inputs.UPLOAD_ARTIFACTS }}
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree
          path: |
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            proprietary-files.txt
            extract-files.py
            setup-makefiles.py
            spinel-vendor.mk
            proprietary/
            radio/
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 30. UPLOAD REPORTS
      # ============================================================

      - name: 📋 Upload reports
        if: ${{ always() && inputs.UPLOAD_ARTIFACTS }}
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 7

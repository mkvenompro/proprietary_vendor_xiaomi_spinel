name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:
    inputs:

      stock_rom_url:
        description: "Official Xiaomi Fastboot ROM URL - RADIO ONLY"
        required: false
        default: "https://bigota.d.miui.com/OS2.0.212.0.VPGMIXM/spinel_global_images_OS2.0.212.0.VPGMIXM_20260311.0000.00_15.0_global_1e7d24d317.tgz"
        type: string

      stock_dump_branch:
        description: "Stock dump branch"
        required: true
        default: "dump-redmi-spinel-os2.0.212.0.vpgmixm"
        type: string

      extract_utils_branch:
        description: "Lineage extract-utils branch"
        required: true
        default: "lineage-23.2"
        type: string

      clone_retries:
        description: "Stock dump clone retries"
        required: true
        default: "5"
        type: string

      lfs_retries:
        description: "Git LFS retries"
        required: true
        default: "5"
        type: string

      copy_radio:
        description: "Download official Fastboot ROM and extract radio firmware"
        required: true
        default: true
        type: boolean

      push_changes:
        description: "Commit and push generated vendor tree"
        required: true
        default: false
        type: boolean

      upload_artifact:
        description: "Upload generated vendor tree"
        required: true
        default: true
        type: boolean


env:

  DEVICE: spinel
  VENDOR: xiaomi

  # ============================================================
  # STOCK DUMP
  #
  # proprietary-files.txt + proprietary blobs come ONLY from
  # the GitLab stock dump.
  # ============================================================

  STOCK_DUMP_REPO: "https://gitlab.com/mkpromvp/dumber-2-mk.git"
  STOCK_DUMP_DIR: "stock_dump"

  # ============================================================
  # EXTRACT UTILS
  # ============================================================

  EXTRACT_UTILS_REPO: "https://github.com/LineageOS/android_tools_extract-utils.git"
  EXTRACT_UTILS_DIR: "extract-utils"

  # ============================================================
  # STAGING ANDROID ROOT
  # ============================================================

  STAGING_ROOT: "staging_android_root"

  # ============================================================
  # OPTIONAL ENV URL
  #
  # workflow_dispatch input takes priority.
  #
  # This URL is ONLY used for radio firmware.
  # ============================================================

  STOCK_ROM_URL: ""


jobs:

  build-vendor:

    name: 🧬 Generate Vendor Tree

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

      # ==========================================================
      # 1. SHOW CONFIGURATION
      # ==========================================================

      - name: 📋 Show configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "🧬 MKVenomPro • spinel Vendor Builder"
          echo "============================================================"

          echo
          echo "📱 DEVICE"
          echo "DEVICE              = $DEVICE"
          echo "VENDOR              = $VENDOR"

          echo
          echo "📦 STOCK DUMP"
          echo "REPOSITORY          = $STOCK_DUMP_REPO"
          echo "BRANCH              = ${{ inputs.stock_dump_branch }}"

          echo
          echo "🧰 EXTRACT UTILS"
          echo "REPOSITORY          = $EXTRACT_UTILS_REPO"
          echo "BRANCH              = ${{ inputs.extract_utils_branch }}"

          echo
          echo "📻 STOCK ROM"
          echo "URL INPUT            = ${{ inputs.stock_rom_url }}"
          echo "ENV URL              = $STOCK_ROM_URL"
          echo "RADIO ENABLED        = ${{ inputs.copy_radio }}"

          echo
          echo "⚙️ OPTIONS"
          echo "CLONE RETRIES        = ${{ inputs.clone_retries }}"
          echo "LFS RETRIES          = ${{ inputs.lfs_retries }}"
          echo "PUSH CHANGES         = ${{ inputs.push_changes }}"
          echo "UPLOAD ARTIFACT      = ${{ inputs.upload_artifact }}"

      # ==========================================================
      # 2. CHECKOUT
      # ==========================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 3. INSTALL DEPENDENCIES
      # ==========================================================

      - name: 📦 Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            python3 \
            python3-pip \
            rsync \
            unzip \
            p7zip-full \
            wget \
            curl \
            aria2 \
            jq \
            file \
            bc \
            cpio \
            lz4 \
            zstd \
            xz-utils \
            tar

          git lfs install --skip-repo

      # ==========================================================
      # 4. CONFIGURE GIT
      # ==========================================================

      - name: ⚙️ Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "MKVenomPro CI"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

      # ==========================================================
      # 5. CLONE STOCK DUMP
      #
      # THIS IS THE SOURCE FOR PROPRIETARY BLOBS.
      #
      # The Fastboot ROM is NOT used here.
      # ==========================================================

      - name: 📥 Clone stock dump
        shell: bash
        env:
          STOCK_BRANCH: ${{ inputs.stock_dump_branch }}
          RETRIES: ${{ inputs.clone_retries }}
        run: |
          set -euo pipefail

          rm -rf "$STOCK_DUMP_DIR"

          success=0

          for attempt in $(seq 1 "$RETRIES"); do

            echo
            echo "============================================================"
            echo "📥 Stock dump clone attempt $attempt/$RETRIES"
            echo "============================================================"

            rm -rf "$STOCK_DUMP_DIR"

            if GIT_LFS_SKIP_SMUDGE=1 git clone \
              --depth=1 \
              --branch "$STOCK_BRANCH" \
              "$STOCK_DUMP_REPO" \
              "$STOCK_DUMP_DIR"; then

              success=1
              break

            fi

            echo "⚠️ Clone failed"
            sleep 10

          done

          if [[ "$success" != "1" ]]; then
            echo "❌ Stock dump clone failed"
            exit 1
          fi

          cd "$STOCK_DUMP_DIR"

          lfs_success=0

          for attempt in $(seq 1 "$RETRIES"); do

            echo
            echo "============================================================"
            echo "📦 Git LFS attempt $attempt/$RETRIES"
            echo "============================================================"

            if git lfs fetch --all && git lfs checkout; then

              lfs_success=1
              break

            fi

            echo "⚠️ Git LFS failed"
            sleep 10

          done

          if [[ "$lfs_success" != "1" ]]; then
            echo "❌ Git LFS failed"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"

          echo
          echo "✅ Stock dump ready"

      # ==========================================================
      # 6. LOCATE PROPRIETARY FILE LIST
      # ==========================================================

      - name: 🔎 Locate proprietary-files.txt
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t LISTS < <(
            find "$STOCK_DUMP_DIR" \
              -type f \
              -name "proprietary-files.txt" \
              -print
          )

          if [[ "${#LISTS[@]}" -eq 0 ]]; then
            echo "❌ proprietary-files.txt not found"
            exit 1
          fi

          echo
          echo "Found proprietary-files.txt files:"

          printf '%s\n' "${LISTS[@]}"

          SOURCE_LIST="${LISTS[0]}"

          echo
          echo "Using:"
          echo "$SOURCE_LIST"

          cp \
            "$SOURCE_LIST" \
            proprietary-files.original.txt

          echo "SOURCE_LIST=$SOURCE_LIST" >> "$GITHUB_ENV"

      # ==========================================================
      # 7. NORMALIZE PROPRIETARY LIST
      # ==========================================================

      - name: 🧹 Normalize proprietary-files.txt
        shell: bash
        run: |
          set -euo pipefail

          test -f "$SOURCE_LIST"

          awk '
          {
            line=$0

            # Preserve comments
            if (line ~ /^[[:space:]]*#/) {
              print line
              next
            }

            # Remove leading "-"
            sub(/^[[:space:]]*-/, "", line)

            # Remove leading whitespace
            sub(/^[[:space:]]+/, "", line)

            # Skip empty lines
            if (line == "")
              next

            # Unsupported Android partitions
            if (line ~ /^system\//)
              next

            if (line ~ /^system_ext\//)
              next

            if (line ~ /^product\//)
              next

            if (line ~ /^vendor_dlkm\//)
              next

            if (line ~ /^odm_dlkm\//)
              next

            if (line ~ /^mi_ext\//)
              next

            # extract-utils unsupported VINTF files
            if (line == "vendor/odm/etc/vintf/manifest_nonfc_dsds.xml")
              next

            if (line == "vendor/odm/etc/vintf/manifest_nonfc_ss.xml")
              next

            # Fix iwpriv
            if (line == "bin/iwpriv") {
              print "vendor/bin/iwpriv"
              next
            }

            print line
          }
          ' "$SOURCE_LIST" > proprietary-files.txt

          echo
          echo "============================================================"
          echo "📊 NORMALIZED PROPRIETARY LIST"
          echo "============================================================"

          echo
          echo "Entries:"
          grep -vE '^[[:space:]]*(#|$)' proprietary-files.txt | wc -l

          echo
          echo "Checking unsupported partitions..."

          if grep -nE \
            '^(system|system_ext|product|vendor_dlkm|odm_dlkm|mi_ext)/' \
            proprietary-files.txt; then

            echo "❌ Unsupported entries remain"
            exit 1

          fi

          echo "✅ Partition filtering passed"

      # ==========================================================
      # 8. VALIDATE SOURCE FILES
      # ==========================================================

      - name: 🔍 Validate proprietary source files
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          total=0

          while IFS= read -r entry; do

            [[ -z "$entry" ]] && continue
            [[ "$entry" == \#* ]] && continue

            src="${entry%%:*}"
            src="${src%%|*}"
            src="${src#/}"

            total=$((total + 1))

            if ! find "$STOCK_DUMP_DIR" \
              -type f \
              -path "*/$src" \
              -print \
              -quit \
              | grep -q .; then

              echo "❌ MISSING: $src"
              missing=$((missing + 1))

            fi

          done < proprietary-files.txt

          echo
          echo "============================================================"
          echo "🔍 SOURCE VALIDATION"
          echo "============================================================"

          echo "Total entries : $total"
          echo "Missing       : $missing"

          if [[ "$missing" -ne 0 ]]; then
            echo "❌ Source validation failed"
            exit 1
          fi

          echo "✅ All source files exist"

      # ==========================================================
      # 9. CLONE EXTRACT UTILS
      # ==========================================================

      - name: 🧰 Clone Lineage extract-utils
        shell: bash
        env:
          EXTRACT_BRANCH: ${{ inputs.extract_utils_branch }}
        run: |
          set -euo pipefail

          rm -rf "$EXTRACT_UTILS_DIR"

          git clone \
            --depth=1 \
            --branch "$EXTRACT_BRANCH" \
            "$EXTRACT_UTILS_REPO" \
            "$EXTRACT_UTILS_DIR"

          echo
          echo "extract-utils commit:"
          git -C "$EXTRACT_UTILS_DIR" rev-parse HEAD

      # ==========================================================
      # 10. VERIFY EXTRACT UTILS
      #
      # NO PYTHONPATH IS EXPORTED TO GITHUB_ENV.
      # ==========================================================

      - name: 🧪 Verify extract-utils
        shell: bash
        run: |
          set -euo pipefail

          PYTHONPATH="$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR" \
          python3 - <<'PY'
          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print("✅ ExtractUtils import OK")
          print("ExtractUtils:", ExtractUtils)
          print("ExtractUtilsModule:", ExtractUtilsModule)
          PY

      # ==========================================================
      # 11. PREPARE STAGING ROOT
      # ==========================================================

      - name: 🏗️ Prepare staging Android root
        shell: bash
        run: |
          set -euo pipefail

          WORK_PARENT="$GITHUB_WORKSPACE/$STAGING_ROOT"

          rm -rf "$WORK_PARENT"

          mkdir -p \
            "$WORK_PARENT/device/xiaomi/spinel" \
            "$WORK_PARENT/tools/extract-utils"

          echo "WORK_PARENT=$WORK_PARENT" >> "$GITHUB_ENV"

          echo
          echo "WORK_PARENT:"
          echo "$WORK_PARENT"

      # ==========================================================
      # 12. COPY DEVICE TREE
      # ==========================================================

      - name: 📱 Prepare spinel extraction tree
        shell: bash
        run: |
          set -euo pipefail

          cp \
            proprietary-files.txt \
            "$WORK_PARENT/device/xiaomi/spinel/proprietary-files.txt"

          cat > \
            "$WORK_PARENT/device/xiaomi/spinel/extract-files.py" \
            <<'PY'
          #!/usr/bin/env python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=True,
              add_firmware_proprietary_file=False,
          )

          utils = ExtractUtils.device(module)

          if __name__ == "__main__":
              utils.run()
          PY

          chmod +x \
            "$WORK_PARENT/device/xiaomi/spinel/extract-files.py"

          echo
          echo "✅ Device extraction tree prepared"

      # ==========================================================
      # 13. PHYSICALLY COPY EXTRACT UTILS
      # ==========================================================

      - name: 📦 Copy extract-utils into staging
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$WORK_PARENT/tools/extract-utils"

          mkdir -p \
            "$WORK_PARENT/tools/extract-utils"

          cp -a \
            "$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR/." \
            "$WORK_PARENT/tools/extract-utils/"

          echo
          echo "============================================================"
          echo "🧰 STAGING EXTRACT-UTILS"
          echo "============================================================"

          echo
          echo "Extract-utils path:"
          realpath \
            "$WORK_PARENT/tools/extract-utils"

          echo
          echo "tools.py:"
          realpath \
            "$WORK_PARENT/tools/extract-utils/extract_utils/tools.py"

      # ==========================================================
      # 14. VERIFY STAGING ANDROID ROOT
      #
      # IMPORTANT:
      # We explicitly import the extract-utils FROM STAGING.
      #
      # We DO NOT use the workspace extract-utils here.
      # ==========================================================

      - name: 🧪 Verify staging extract-utils root
        shell: bash
        run: |
          set -euo pipefail

          cd "$WORK_PARENT"

          # IMPORTANT:
          # Only staging extract-utils is allowed here.
          export PYTHONPATH="$WORK_PARENT/tools/extract-utils"

          python3 - <<'PY'
          import os
          import extract_utils
          from extract_utils.tools import android_root

          expected = os.path.realpath(os.getcwd())
          actual = os.path.realpath(android_root)

          print("extract_utils package:")
          print(os.path.realpath(extract_utils.__file__))

          print()
          print("EXPECTED_ANDROID_ROOT:")
          print(expected)

          print()
          print("CALCULATED_ANDROID_ROOT:")
          print(actual)

          print()

          if actual != expected:
              raise SystemExit(
                  "❌ Android root mismatch\n"
                  f"Expected: {expected}\n"
                  f"Actual:   {actual}"
              )

          print("✅ Staging Android root is correct")
          PY

      # ==========================================================
      # 15. RUN EXTRACTION
      #
      # THIS IS THE IMPORTANT FIX.
      #
      # PYTHONPATH = STAGING extract-utils.
      #
      # NOT:
      # $GITHUB_WORKSPACE/extract-utils
      # ==========================================================

      - name: 🧬 Extract proprietary blobs
        shell: bash
        run: |
          set -euo pipefail

          cd "$WORK_PARENT"

          export PYTHONPATH="$WORK_PARENT/tools/extract-utils"

          echo
          echo "============================================================"
          echo "🧬 STARTING LINEAGE EXTRACT-UTILS"
          echo "============================================================"

          echo
          echo "Android root:"
          pwd

          echo
          echo "Extract-utils:"
          realpath "$WORK_PARENT/tools/extract-utils"

          echo
          echo "Device tree:"
          realpath "$WORK_PARENT/device/xiaomi/spinel"

          echo
          echo "Source:"
          echo "$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"

          echo
          echo "Python import location:"

          python3 - <<'PY'
          import os
          import extract_utils
          from extract_utils.tools import android_root

          print("extract_utils:")
          print(os.path.realpath(extract_utils.__file__))

          print()
          print("android_root:")
          print(os.path.realpath(android_root))
          PY

          echo
          echo "Checking proprietary-files.txt..."

          test -f \
            "$WORK_PARENT/device/xiaomi/spinel/proprietary-files.txt"

          echo "✅ proprietary-files.txt exists"

          echo
          echo "Starting extractor..."

          python3 \
            "$WORK_PARENT/device/xiaomi/spinel/extract-files.py" \
            "$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"

          echo
          echo "============================================================"
          echo "✅ EXTRACTION COMPLETED"
          echo "============================================================"

      # ==========================================================
      # 16. INSPECT GENERATED TREE
      # ==========================================================

      - name: 🔎 Inspect generated tree
        shell: bash
        run: |
          set -euo pipefail

          TREE="$WORK_PARENT/device/xiaomi/spinel"

          echo
          echo "============================================================"
          echo "🔎 GENERATED TREE"
          echo "============================================================"

          echo
          echo "Files:"

          find "$TREE" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "Directories:"

          find "$TREE" \
            -maxdepth 2 \
            -type d \
            | sort

          echo
          echo "Proprietary size:"

          du -sh "$TREE/proprietary"

      # ==========================================================
      # 17. RESTORE SPECIAL VINTF
      # ==========================================================

      - name: 🛠️ Restore special VINTF manifests
        shell: bash
        run: |
          set -euo pipefail

          DEST="$WORK_PARENT/device/xiaomi/spinel/proprietary/odm/etc/vintf"

          mkdir -p "$DEST"

          dsds=""
          ss=""

          while IFS= read -r file; do

            case "$(basename "$file")" in

              manifest_nonfc_dsds.xml)
                dsds="$file"
                ;;

              manifest_nonfc_ss.xml)
                ss="$file"
                ;;

            esac

          done < <(
            find "$STOCK_DUMP_DIR" \
              -type f \
              \( \
                -name "manifest_nonfc_dsds.xml" \
                -o \
                -name "manifest_nonfc_ss.xml" \
              \)
          )

          if [[ -n "$dsds" ]]; then

            cp \
              "$dsds" \
              "$DEST/manifest_nonfc_dsds.xml"

            echo "✅ manifest_nonfc_dsds.xml restored"

          else

            echo "⚠️ manifest_nonfc_dsds.xml not found"

          fi

          if [[ -n "$ss" ]]; then

            cp \
              "$ss" \
              "$DEST/manifest_nonfc_ss.xml"

            echo "✅ manifest_nonfc_ss.xml restored"

          else

            echo "⚠️ manifest_nonfc_ss.xml not found"

          fi

      # ==========================================================
      # 18. ADD VINTF MAKE RULES
      # ==========================================================

      - name: 🧩 Add VINTF make rules
        shell: bash
        run: |
          set -euo pipefail

          MK="$WORK_PARENT/device/xiaomi/spinel/spinel-vendor.mk"

          test -f "$MK"

          cat >> "$MK" <<'EOF'

          # Manually restored ODM VINTF manifests.
          PRODUCT_COPY_FILES += \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_dsds.xml \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_ss.xml
          EOF

          echo "✅ VINTF rules added"

      # ==========================================================
      # 19. DOWNLOAD OFFICIAL FASTBOOT ROM
      #
      # RADIO ONLY.
      #
      # NEVER used as proprietary blob source.
      # ==========================================================

      - name: 📻 Download official spinel Fastboot ROM
        if: ${{ inputs.copy_radio }}
        shell: bash
        env:
          STOCK_URL_INPUT: ${{ inputs.stock_rom_url }}
          STOCK_URL_ENV: ${{ env.STOCK_ROM_URL }}
        run: |
          set -euo pipefail

          STOCK_URL="$STOCK_URL_INPUT"

          if [[ -z "$STOCK_URL" ]]; then
            STOCK_URL="$STOCK_URL_ENV"
          fi

          if [[ -z "$STOCK_URL" ]]; then
            echo "❌ STOCK ROM URL is empty"
            exit 1
          fi

          echo
          echo "============================================================"
          echo "📻 OFFICIAL SPINEL FASTBOOT ROM"
          echo "============================================================"

          echo
          echo "This ROM is being downloaded ONLY for radio firmware."

          echo
          echo "URL:"
          echo "$STOCK_URL"

          ROM_FILE="$RUNNER_TEMP/spinel_stock.tgz"
          ROM_DIR="$RUNNER_TEMP/spinel_fastboot"

          rm -rf "$ROM_DIR"
          rm -f "$ROM_FILE"

          mkdir -p "$ROM_DIR"

          echo
          echo "📥 Downloading..."

          aria2c \
            --max-tries=5 \
            --retry-wait=5 \
            --timeout=60 \
            --connect-timeout=30 \
            --max-connection-per-server=8 \
            --split=8 \
            --min-split-size=10M \
            --continue=true \
            --allow-overwrite=true \
            --out="spinel_stock.tgz" \
            --dir="$RUNNER_TEMP" \
            "$STOCK_URL"

          test -s "$ROM_FILE"

          echo
          echo "Downloaded ROM:"
          ls -lh "$ROM_FILE"

          echo
          echo "📦 Extracting..."

          tar \
            -xzf "$ROM_FILE" \
            -C "$ROM_DIR"

          echo
          echo "✅ Fastboot ROM extracted"

      # ==========================================================
      # 20. EXTRACT RADIO
      #
      # ONLY THESE SPINEL RADIO IMAGES.
      # ==========================================================

      - name: 📻 Extract spinel radio firmware
        if: ${{ inputs.copy_radio }}
        shell: bash
        run: |
          set -euo pipefail

          ROM_DIR="$RUNNER_TEMP/spinel_fastboot"
          RADIO_DIR="$GITHUB_WORKSPACE/radio"

          mkdir -p "$RADIO_DIR"

          radio_files=(

            dpm.img
            gz.img
            lk.img
            mcupm.img
            md1img.img
            pi_img.img
            scp.img
            spmfw.img
            sspm.img
            tee.img

          )

          copied=0

          echo
          echo "============================================================"
          echo "📻 EXTRACTING SPINEL RADIO"
          echo "============================================================"

          for name in "${radio_files[@]}"; do

            src="$(
              find "$ROM_DIR" \
                -type f \
                -name "$name" \
                -print \
                -quit \
                || true
            )"

            if [[ -n "$src" ]]; then

              cp \
                "$src" \
                "$RADIO_DIR/$name"

              echo "✅ $name"

              copied=$((copied + 1))

            else

              echo "⚠️ $name NOT FOUND"

            fi

          done

          echo
          echo "Copied: $copied/${#radio_files[@]}"

          if [[ "$copied" -eq 0 ]]; then
            echo "❌ No radio images found"
            exit 1
          fi

          echo
          echo "Radio directory:"
          ls -lh "$RADIO_DIR"

          echo
          echo "✅ Radio extraction completed"

      # ==========================================================
      # 21. VALIDATE RADIO
      # ==========================================================

      - name: 🔬 Validate radio firmware
        if: ${{ inputs.copy_radio }}
        shell: bash
        run: |
          set -euo pipefail

          RADIO_DIR="$GITHUB_WORKSPACE/radio"

          expected=(

            dpm.img
            gz.img
            lk.img
            mcupm.img
            md1img.img
            pi_img.img
            scp.img
            spmfw.img
            sspm.img
            tee.img

          )

          valid=0

          echo
          echo "============================================================"
          echo "🔬 RADIO VALIDATION"
          echo "============================================================"

          for name in "${expected[@]}"; do

            if [[ -f "$RADIO_DIR/$name" ]]; then

              size="$(stat -c '%s' "$RADIO_DIR/$name")"

              if [[ "$size" -gt 0 ]]; then

                echo "✅ $name ($size bytes)"
                valid=$((valid + 1))

              else

                echo "❌ $name is empty"
                exit 1

              fi

            else

              echo "⚠️ $name missing"

            fi

          done

          echo
          echo "Valid radio images: $valid/${#expected[@]}"

          if [[ "$valid" -eq 0 ]]; then
            echo "❌ Radio validation failed"
            exit 1
          fi

      # ==========================================================
      # 22. VALIDATE GENERATED VENDOR TREE
      # ==========================================================

      - name: ✅ Validate generated vendor tree
        shell: bash
        run: |
          set -euo pipefail

          TREE="$WORK_PARENT/device/xiaomi/spinel"

          echo
          echo "============================================================"
          echo "✅ VENDOR TREE VALIDATION"
          echo "============================================================"

          required_files=(

            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
            proprietary-files.txt
            extract-files.py
            setup-makefiles.py

          )

          for file in "${required_files[@]}"; do

            if [[ -f "$TREE/$file" ]]; then

              echo "✅ $file"

            else

              echo "❌ Missing $file"
              exit 1

            fi

          done

          test -d "$TREE/proprietary"

          echo
          echo "Proprietary size:"
          du -sh "$TREE/proprietary"

      # ==========================================================
      # 23. FLATTEN VENDOR TREE
      # ==========================================================

      - name: 📂 Flatten vendor tree
        shell: bash
        run: |
          set -euo pipefail

          SRC="$WORK_PARENT/device/xiaomi/spinel"
          ROOT="$GITHUB_WORKSPACE"

          echo
          echo "============================================================"
          echo "📂 FLATTENING VENDOR TREE"
          echo "============================================================"

          rsync -a \
            "$SRC/" \
            "$ROOT/"

          echo
          echo "✅ Vendor tree copied to repository root"

      # ==========================================================
      # 24. FINAL VALIDATION
      # ==========================================================

      - name: 🔬 Final repository validation
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "🔬 FINAL REPOSITORY VALIDATION"
          echo "============================================================"

          required_files=(

            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
            proprietary-files.txt
            extract-files.py
            setup-makefiles.py

          )

          for file in "${required_files[@]}"; do

            if [[ -f "$file" ]]; then

              echo "✅ $file"

            else

              echo "❌ Missing $file"
              exit 1

            fi

          done

          if [[ ! -d proprietary ]]; then
            echo "❌ proprietary directory missing"
            exit 1
          fi

          # ------------------------------------------------------
          # No nested vendor/xiaomi/spinel
          # ------------------------------------------------------

          if [[ -d vendor/xiaomi/spinel ]]; then

            echo "❌ Nested vendor/xiaomi/spinel detected"
            exit 1

          fi

          echo "✅ No nested vendor/xiaomi/spinel"

          # ------------------------------------------------------
          # No unsupported partitions
          # ------------------------------------------------------

          if grep -nE \
            '^(system|system_ext|product|vendor_dlkm|odm_dlkm|mi_ext)/' \
            proprietary-files.txt; then

            echo "❌ Unsupported partition entries remain"
            exit 1

          fi

          echo "✅ No unsupported partition entries"

          # ------------------------------------------------------
          # iwpriv
          # ------------------------------------------------------

          if grep -n '^bin/iwpriv' proprietary-files.txt; then

            echo "❌ Old iwpriv path remains"
            exit 1

          fi

          if grep -n '^vendor/bin/iwpriv' proprietary-files.txt; then
            echo "✅ iwpriv path is correct"
          fi

          # ------------------------------------------------------
          # VINTF
          # ------------------------------------------------------

          if grep -n 'manifest_nonfc_' proprietary-files.txt; then

            echo "❌ VINTF manifests still exist in proprietary list"
            exit 1

          fi

          echo "✅ Special VINTF files handled separately"

          # ------------------------------------------------------
          # Stats
          # ------------------------------------------------------

          echo
          echo "============================================================"
          echo "📊 FINAL STATS"
          echo "============================================================"

          echo
          echo "Proprietary entries:"
          grep -vE '^[[:space:]]*(#|$)' \
            proprietary-files.txt \
            | wc -l

          echo
          echo "Proprietary size:"
          du -sh proprietary

          if [[ -d radio ]]; then

            echo
            echo "Radio size:"
            du -sh radio

          fi

          echo
          echo "============================================================"
          echo "✅ FINAL VALIDATION PASSED"
          echo "============================================================"

      # ==========================================================
      # 25. GENERATE REPORT
      # ==========================================================

      - name: 📝 Generate build report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          cp \
            proprietary-files.txt \
            reports/proprietary-files-final.txt

          {
            echo "# spinel Vendor Build Report"
            echo
            echo "Device: $DEVICE"
            echo "Vendor: $VENDOR"
            echo
            echo "Dump: $STOCK_DUMP_REPO"
            echo "Dump branch: ${{ inputs.stock_dump_branch }}"
            echo
            echo "Extract utils: $EXTRACT_UTILS_REPO"
            echo "Extract branch: ${{ inputs.extract_utils_branch }}"
            echo
            echo "Proprietary entries:"
            grep -vE '^[[:space:]]*(#|$)' proprietary-files.txt | wc -l
            echo
            echo "Radio enabled: ${{ inputs.copy_radio }}"
          } > reports/build-report.md

          echo
          echo "✅ Build report generated"

      # ==========================================================
      # 26. CLEAN TEMPORARY FILES
      # ==========================================================

      - name: 🧹 Cleanup
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$STOCK_DUMP_DIR" \
            "$EXTRACT_UTILS_DIR" \
            "$STAGING_ROOT" \
            proprietary-files.original.txt

          echo "✅ Temporary files cleaned"

      # ==========================================================
      # 27. GIT STATUS
      # ==========================================================

      - name: 📊 Git status
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "📊 GIT STATUS"
          echo "============================================================"

          git status --short

          echo
          echo "Diff stat:"
          git diff --stat || true

      # ==========================================================
      # 28. PUSH
      # ==========================================================

      - name: 🚀 Commit and push
        if: ${{ inputs.push_changes }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Current branch: $GITHUB_REF_NAME"

          if [[ "$GITHUB_REF_NAME" != "lineage-23.2" ]]; then

            echo
            echo "❌ Push is allowed only on lineage-23.2"
            exit 1

          fi

          git add \
            Android.bp \
            Android.mk \
            BoardConfigVendor.mk \
            spinel-vendor.mk \
            proprietary-files.txt \
            extract-files.py \
            setup-makefiles.py \
            proprietary \
            radio \
            reports \
            .github

          if git diff --cached --quiet; then

            echo "ℹ️ Nothing to commit"
            exit 0

          fi

          git commit \
            -m "vendor: generate spinel proprietary blobs"

          git push \
            origin \
            "HEAD:lineage-23.2"

          echo
          echo "✅ Changes pushed"

      # ==========================================================
      # 29. CREATE ARTIFACT
      # ==========================================================

      - name: 📦 Create artifact
        if: ${{ inputs.upload_artifact }}
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT="$RUNNER_TEMP/spinel-vendor-tree.tar.gz"

          tar \
            --exclude=".git" \
            --exclude="stock_dump" \
            --exclude="extract-utils" \
            --exclude="staging_android_root" \
            --exclude="*.tgz" \
            -czf \
            "$ARTIFACT" \
            .

          echo
          echo "Artifact:"
          ls -lh "$ARTIFACT"

      # ==========================================================
      # 30. UPLOAD ARTIFACT
      # ==========================================================

      - name: ⬆️ Upload artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree
          path: ${{ runner.temp }}/spinel-vendor-tree.tar.gz
          if-no-files-found: error
          retention-days: 14

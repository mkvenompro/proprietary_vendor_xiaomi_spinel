name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:
    inputs:
      stock_rom_url:
        description: "Official Xiaomi Fastboot ROM URL - RADIO ONLY"
        required: false
        default: "https://xm05."
        type: string

      stock_dump_branch:
        description: "Stock dump branch"
        required: true
        default: "dump-redmi-spinel-os2.0.212.0.vpgmixm"
        type: string

      extract_utils_branch:
        description: "Lineage extract-utils branch"
        required: true
        default: "lineage-23.2"
        type: string

      clone_retries:
        description: "Stock dump clone retries"
        required: true
        default: "5"
        type: string

      lfs_retries:
        description: "Git LFS retries"
        required: true
        default: "5"
        type: string

      copy_radio:
        description: "Download official Fastboot ROM and extract radio firmware"
        required: true
        default: true
        type: boolean

      push_changes:
        description: "Commit and push generated vendor tree"
        required: true
        default: false
        type: boolean

      upload_artifact:
        description: "Upload generated vendor tree"
        required: true
        default: true
        type: boolean

env:
  DEVICE: spinel
  VENDOR: xiaomi

  STOCK_DUMP_REPO: "https://gitlab.com/mkpromvp/dumber-2-mk.git"
  STOCK_DUMP_DIR: "stock_dump"

  DEVICE_TREE_REPO: "https://github.com/mkvenompro/android_device_xiaomi_spinel.git"
  DEVICE_TREE_DIR: "device_tree"

  EXTRACT_UTILS_REPO: "https://github.com/LineageOS/android_tools_extract-utils.git"
  EXTRACT_UTILS_DIR: "extract-utils"

  STAGING_ROOT: "staging_android_root"

jobs:
  build-vendor:
    name: 🧬 Generate Vendor Tree
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:

      # ==========================================================
      # 1. CONFIG
      # ==========================================================

      - name: 📋 Show configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "🧬 MKVenomPro • spinel Vendor Builder"
          echo "============================================================"

          echo
          echo "📱 DEVICE"
          echo "DEVICE              = $DEVICE"
          echo "VENDOR              = $VENDOR"

          echo
          echo "📦 STOCK DUMP"
          echo "REPOSITORY          = $STOCK_DUMP_REPO"
          echo "BRANCH              = ${{ inputs.stock_dump_branch }}"

          echo
          echo "📱 DEVICE TREE (offical extract files)"
          echo "REPOSITORY          = $DEVICE_TREE_REPO"

          echo
          echo "🧰 EXTRACT UTILS"
          echo "REPOSITORY          = $EXTRACT_UTILS_REPO"
          echo "BRANCH              = ${{ inputs.extract_utils_branch }}"

          echo
          echo "📻 RADIO"
          echo "URL                  = ${{ inputs.stock_rom_url }}"
          echo "ENABLED              = ${{ inputs.copy_radio }}"

          echo
          echo "⚙️ OPTIONS"
          echo "CLONE RETRIES        = ${{ inputs.clone_retries }}"
          echo "LFS RETRIES          = ${{ inputs.lfs_retries }}"
          echo "PUSH CHANGES         = ${{ inputs.push_changes }}"
          echo "UPLOAD ARTIFACT      = ${{ inputs.upload_artifact }}"

      # ==========================================================
      # 2. CHECKOUT
      # ==========================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 3. DEPENDENCIES
      # ==========================================================

      - name: 📦 Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            python3 \
            python3-pip \
            rsync \
            unzip \
            p7zip-full \
            wget \
            curl \
            aria2 \
            jq \
            file \
            bc \
            cpio \
            lz4 \
            zstd \
            xz-utils \
            tar \
            patchelf

          git lfs install --skip-repo

      # ==========================================================
      # 4. GIT CONFIG
      # ==========================================================

      - name: ⚙️ Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "MKVenomPro CI"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global core.compression 0

      # ==========================================================
      # 5. STOCK DUMP
      # ==========================================================

      - name: 📥 Clone stock dump
        shell: bash
        env:
          STOCK_BRANCH: ${{ inputs.stock_dump_branch }}
          RETRIES: ${{ inputs.clone_retries }}
        run: |
          set -euo pipefail

          rm -rf "$STOCK_DUMP_DIR"

          success=0

          for attempt in $(seq 1 "$RETRIES"); do
            echo
            echo "============================================================"
            echo "📥 Stock dump clone attempt $attempt/$RETRIES"
            echo "============================================================"

            rm -rf "$STOCK_DUMP_DIR"

            if GIT_LFS_SKIP_SMUDGE=1 git clone \
              --depth=1 \
              --branch "$STOCK_BRANCH" \
              "$STOCK_DUMP_REPO" \
              "$STOCK_DUMP_DIR"; then

              success=1
              break
            fi

            echo "⚠️ Clone failed"
            sleep 10
          done

          if [[ "$success" != "1" ]]; then
            echo "❌ Stock dump clone failed"
            exit 1
          fi

          cd "$STOCK_DUMP_DIR"

          lfs_success=0

          for attempt in $(seq 1 "$RETRIES"); do
            echo
            echo "============================================================"
            echo "📦 Git LFS attempt $attempt/$RETRIES"
            echo "============================================================"

            if git lfs fetch --all && git lfs checkout; then
              lfs_success=1
              break
            fi

            echo "⚠️ Git LFS failed"
            sleep 10
          done

          if [[ "$lfs_success" != "1" ]]; then
            echo "❌ Git LFS failed"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE"

          echo "✅ Stock dump ready"

          echo
          echo "Dump root layout:"
          ls "$STOCK_DUMP_DIR"

      # ==========================================================
      # 6. CLONE OFFICIAL DEVICE TREE
      #
      # The vendor tree is regenerated from the DEVICE tree's own
      # extract-files.py, proprietary-files.txt and
      # proprietary-firmware.txt (official Lineage generator flow):
      #
      #   python3 device/xiaomi/spinel/extract-files.py <dump>
      #
      # No normalization / deduplication is performed: the official
      # list is authoritative (vendor + system_ext + product).
      # ==========================================================

      - name: 📱 Clone official spinel device tree
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$DEVICE_TREE_DIR"

          git clone \
            --depth=1 \
            --branch lineage-23.2 \
            "$DEVICE_TREE_REPO" \
            "$DEVICE_TREE_DIR"

          echo "Device tree commit:"
          git -C "$DEVICE_TREE_DIR" rev-parse HEAD

          echo
          echo "Device tree files:"
          ls "$DEVICE_TREE_DIR"

      - name: ✅ Validate official extraction files
        shell: bash
        run: |
          set -euo pipefail

          LIST="$DEVICE_TREE_DIR/proprietary-files.txt"
          FIRMWARE_LIST="$DEVICE_TREE_DIR/proprietary-firmware.txt"

          test -f "$LIST"
          test -f "$FIRMWARE_LIST"
          test -f "$DEVICE_TREE_DIR/extract-files.py"

          echo
          echo "============================================================"
          echo "📊 OFFICIAL LIST VALIDATION"
          echo "============================================================"

          TOTAL=$(
            grep -vcE '^[[:space:]]*(#|$)' "$LIST"
          )

          VENDOR=$(
            grep -cE '^vendor/' "$LIST" || true
          )

          SYSTEM_EXT=$(
            grep -cE '^system_ext/' "$LIST" || true
          )

          PRODUCT=$(
            grep -cE '^product/' "$LIST" || true
          )

          echo "TOTAL            = $TOTAL"
          echo "vendor           = $VENDOR"
          echo "system_ext       = $SYSTEM_EXT"
          echo "product          = $PRODUCT"

          if [[ "$TOTAL" -ne 6372 ]]; then
            echo "❌ Expected 6372 entries"
            exit 1
          fi

          if [[ "$VENDOR" -ne 4457 ]]; then
            echo "❌ Expected 4457 vendor entries"
            exit 1
          fi

          if [[ "$SYSTEM_EXT" -ne 1911 ]]; then
            echo "❌ Expected 1911 system_ext entries"
            exit 1
          fi

          if [[ "$PRODUCT" -ne 2 ]]; then
            echo "❌ Expected 2 product entries"
            exit 1
          fi

          if grep -nE \
            '^(system|vendor_dlkm|odm_dlkm|mi_ext|bin)/' \
            "$LIST"; then

            echo "❌ Unsupported partition/legacy entries remain"
            exit 1
          fi

          if grep -nE '^\-' "$LIST"; then
            echo "❌ 'package' (dash-prefixed) entries remain"
            exit 1
          fi

          IWPRIV_COUNT=$(
            grep -c '^vendor/bin/iwpriv$' "$LIST" || true
          )

          if [[ "$IWPRIV_COUNT" -ne 1 ]]; then
            echo "❌ Expected exactly one vendor/bin/iwpriv"
            exit 1
          fi

          echo "✅ vendor/bin/iwpriv exists exactly once"

          FIRMWARE_TOTAL=$(
            grep -vcE '^[[:space:]]*(#|$)' "$FIRMWARE_LIST"
          )

          echo
          echo "Firmware entries: $FIRMWARE_TOTAL"

          if [[ "$FIRMWARE_TOTAL" -ne 11 ]]; then
            echo "❌ Expected 11 firmware entries"
            exit 1
          fi

          echo
          echo "proprietary-firmware.txt:"
          grep -vE '^[[:space:]]*(#|$)' "$FIRMWARE_LIST"

          echo
          echo "✅ Official extraction files validated"

      # ==========================================================
      # 7. EXTRACT UTILS
      # ==========================================================

      - name: 🧰 Clone Lineage extract-utils
        shell: bash
        env:
          EXTRACT_BRANCH: ${{ inputs.extract_utils_branch }}
        run: |
          set -euo pipefail

          rm -rf "$EXTRACT_UTILS_DIR"

          git clone \
            --depth=1 \
            --branch "$EXTRACT_BRANCH" \
            "$EXTRACT_UTILS_REPO" \
            "$EXTRACT_UTILS_DIR"

          echo "extract-utils commit:"
          git -C "$EXTRACT_UTILS_DIR" rev-parse HEAD

      - name: 🧪 Verify extract-utils
        shell: bash
        run: |
          set -euo pipefail

          PYTHONPATH="$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR" \
          python3 - <<'PY'
          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print("✅ ExtractUtils import OK")
          print(ExtractUtils)
          print(ExtractUtilsModule)
          PY

      # ==========================================================
      # 8. STAGING ROOT
      # ==========================================================

      - name: 🏗️ Prepare staging Android root
        shell: bash
        run: |
          set -euo pipefail

          WORK_PARENT="$GITHUB_WORKSPACE/$STAGING_ROOT"

          rm -rf "$WORK_PARENT"

          mkdir -p \
            "$WORK_PARENT/device/xiaomi/spinel" \
            "$WORK_PARENT/tools/extract-utils"

          echo "WORK_PARENT=$WORK_PARENT" >> "$GITHUB_ENV"

          echo
          echo "WORK_PARENT:"
          echo "$WORK_PARENT"

      # ==========================================================
      # 9. DEVICE EXTRACTION FILES (OFFICIAL)
      # ==========================================================

      - name: 📱 Install official spinel extraction files
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_TREE="$WORK_PARENT/device/xiaomi/spinel"
          SRC_DEVICE_TREE="$GITHUB_WORKSPACE/$DEVICE_TREE_DIR"

          cp \
            "$SRC_DEVICE_TREE/extract-files.py" \
            "$DEVICE_TREE/extract-files.py"

          cp \
            "$SRC_DEVICE_TREE/proprietary-files.txt" \
            "$DEVICE_TREE/proprietary-files.txt"

          cp \
            "$SRC_DEVICE_TREE/proprietary-firmware.txt" \
            "$DEVICE_TREE/proprietary-firmware.txt"

          if [[ "${{ inputs.copy_radio }}" != "true" ]]; then
            echo "ℹ️ copy_radio=false: disabling firmware extraction"
            sed -i \
              's/add_firmware_proprietary_file=True/add_firmware_proprietary_file=False/' \
              "$DEVICE_TREE/extract-files.py"
          fi

          grep -n "add_firmware_proprietary_file" \
            "$DEVICE_TREE/extract-files.py"

          chmod +x "$DEVICE_TREE/extract-files.py"

          echo
          echo "Official extraction files installed:"
          ls -la "$DEVICE_TREE"

      # ==========================================================
      # 10. COPY EXTRACT UTILS PHYSICALLY
      # ==========================================================

      - name: 📦 Copy extract-utils into staging
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$WORK_PARENT/tools/extract-utils"

          mkdir -p "$WORK_PARENT/tools/extract-utils"

          cp -a \
            "$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR/." \
            "$WORK_PARENT/tools/extract-utils/"

          echo "Extract-utils:"
          realpath "$WORK_PARENT/tools/extract-utils"

      # ==========================================================
      # 11. PATCHELF PREBUILTS
      #
      # extract-utils resolves patchelf through
      # prebuilts/extract-tools/linux-x86/bin/patchelf-<version>.
      # This device tree pins blob fixups to patchelf 0_17_2
      # (internal) and the default 0_18. apt patchelf on
      # ubuntu-24.04 is 0.18.x, so both names map to it.
      # ==========================================================

      - name: 🔧 Install patchelf prebuilts
        shell: bash
        run: |
          set -euo pipefail

          BIN_DIR="$WORK_PARENT/prebuilts/extract-tools/linux-x86/bin"

          mkdir -p "$BIN_DIR"

          PATCHELF_SRC="$(command -v patchelf)"

          if [[ -z "$PATCHELF_SRC" ]]; then
            echo "❌ patchelf binary not found"
            exit 1
          fi

          echo "patchelf: $PATCHELF_SRC"
          patchelf --version

          cp \
            "$PATCHELF_SRC" \
            "$BIN_DIR/patchelf-0_17_2"

          cp \
            "$PATCHELF_SRC" \
            "$BIN_DIR/patchelf-0_18"

          chmod +x "$BIN_DIR/patchelf-0_17_2"
          chmod +x "$BIN_DIR/patchelf-0_18"

          echo
          echo "Patchelf prebuilts:"
          ls -l "$BIN_DIR"

      # ==========================================================
      # 12. VERIFY ROOT
      # ==========================================================

      - name: 🧪 Verify staging Android root
        shell: bash
        run: |
          set -euo pipefail

          cd "$WORK_PARENT"

          export PYTHONPATH="$WORK_PARENT/tools/extract-utils"

          python3 - <<'PY'
          import os
          import extract_utils
          from extract_utils.tools import android_root

          expected = os.path.realpath(os.getcwd())
          actual = os.path.realpath(android_root)

          print("extract_utils:")
          print(os.path.realpath(extract_utils.__file__))

          print()
          print("EXPECTED:")
          print(expected)

          print()
          print("ACTUAL:")
          print(actual)

          if actual != expected:
              raise SystemExit(
                  f"❌ Android root mismatch\n"
                  f"Expected: {expected}\n"
                  f"Actual: {actual}"
              )

          print()
          print("✅ Android root is correct")
          PY

      # ==========================================================
      # 13. DOWNLOAD OFFICIAL ROM FOR RADIO ONLY
      # ==========================================================

      - name: 📻 Download official spinel Fastboot ROM
        if: ${{ inputs.copy_radio }}
        shell: bash
        env:
          STOCK_URL: ${{ inputs.stock_rom_url }}
        run: |
          set -euo pipefail

          if [[ -z "$STOCK_URL" ]]; then
            echo "❌ Stock ROM URL is empty"
            exit 1
          fi

          ROM_FILE="$RUNNER_TEMP/spinel_stock.tgz"
          ROM_DIR="$RUNNER_TEMP/spinel_fastboot"

          rm -rf "$ROM_DIR"
          rm -f "$ROM_FILE"

          mkdir -p "$ROM_DIR"

          echo
          echo "============================================================"
          echo "📻 OFFICIAL SPINEL FASTBOOT ROM"
          echo "============================================================"

          echo
          echo "RADIO ONLY"

          echo
          echo "Downloading:"
          echo "$STOCK_URL"

          aria2c \
            --max-tries=5 \
            --retry-wait=5 \
            --timeout=60 \
            --connect-timeout=30 \
            --max-connection-per-server=8 \
            --split=8 \
            --min-split-size=10M \
            --continue=true \
            --allow-overwrite=true \
            --out="spinel_stock.tgz" \
            --dir="$RUNNER_TEMP" \
            "$STOCK_URL"

          test -s "$ROM_FILE"

          echo
          echo "Downloaded:"
          ls -lh "$ROM_FILE"

          echo
          echo "Extracting..."

          tar \
            -xzf "$ROM_FILE" \
            -C "$ROM_DIR"

          echo "✅ Fastboot ROM extracted"

          echo
          echo "ROM content:"
          find "$ROM_DIR" -maxdepth 2 -type f -printf '%f\n' | sort

      # ==========================================================
      # 14. RADIO → STOCK DUMP ROOT
      #
      # The official proprietary-firmware.txt maps each partition
      # image by src:dst (here src:lk.img). extract-utils' DiskSource
      # resolves firmware files against the dump root directly, so the
      # radio images are staged at $STOCK_DUMP_DIR under BOTH the dst
      # and the src name before extraction.
      # ==========================================================

      - name: 📻 Stage spinel radio firmware into dump root
        if: ${{ inputs.copy_radio }}
        shell: bash
        run: |
          set -euo pipefail

          ROM_DIR="$RUNNER_TEMP/spinel_fastboot"
          DUMP_ROOT="$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"

          # Matches propietary-firmware.txt from the spinel device tree.
          # Format: <src _or_ found-name>:<partition-name-required-in-radio>
          firmware_specs=(
            "dpm.img"
            "gz.img"
            "lk_fenrir.img:lk.img"
            "mcupm.img"
            "md1img.img"
            "pi_img.img"
            "preloader_spinel.bin:preloader_raw.img"
            "scp.img"
            "spmfw.img"
            "sspm.img"
            "tee.img"
          )

          echo
          echo "============================================================"
          echo "📻 STAGING SPINEL RADIO INTO DUMP ROOT"
          echo "============================================================"

          for spec in "${firmware_specs[@]}"; do

            src="${spec%%:*}"
            dst="${spec##*:}"

            found=""

            for cand in "$src" "$dst"; do

              match="$(
                find "$ROM_DIR" \
                  -type f \
                  -name "$cand" \
                  -print \
                  -quit \
                  || true
              )"

              if [[ -n "$match" ]]; then
                found="$match"
                break
              fi
            done

            if [[ -z "$found" ]]; then
              echo "❌ $spec NOT FOUND in ROM"
              exit 1
            fi

            cp "$found" "$DUMP_ROOT/$dst"
            echo "✅ $dst"

            if [[ "$src" != "$dst" ]]; then
              cp "$found" "$DUMP_ROOT/$src"
              echo "   (also staged as $src)"
            fi
          done

          echo
          echo "Radio files staged:"
          find "$DUMP_ROOT" \
            -maxdepth 1 \
            -type f \
            \( -name "*.img" -o -name "*.bin" \) \
            -printf '%f (%s bytes)\n' \
            | sort

          echo
          echo "✅ Radio firmware staged"

      # ==========================================================
      # 15. EXTRACTION
      # ==========================================================

      - name: 🧬 Extract proprietary blobs
        shell: bash
        run: |
          set -euo pipefail

          cd "$WORK_PARENT"

          export PYTHONPATH="$WORK_PARENT/tools/extract-utils"

          DEVICE_TREE="$WORK_PARENT/device/xiaomi/spinel"
          VENDOR_TREE="$WORK_PARENT/vendor/xiaomi/spinel"

          echo
          echo "============================================================"
          echo "🧬 STARTING LINEAGE EXTRACT-UTILS"
          echo "============================================================"

          echo "Android root:"
          pwd

          echo
          echo "Extract-utils:"
          realpath "$WORK_PARENT/tools/extract-utils"

          echo
          echo "Device tree:"
          realpath "$DEVICE_TREE"

          echo
          echo "Source:"
          echo "$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"

          echo
          echo "Python import location:"

          python3 - <<'PY'
          import os
          import extract_utils
          from extract_utils.tools import android_root

          print("extract_utils:")
          print(os.path.realpath(extract_utils.__file__))

          print()
          print("android_root:")
          print(os.path.realpath(android_root))
          PY

          echo
          echo "Checking extraction files..."

          test -f "$DEVICE_TREE/proprietary-files.txt"
          test -f "$DEVICE_TREE/proprietary-firmware.txt"
          test -f "$DEVICE_TREE/extract-files.py"

          echo "✅ Extraction files exist"

          echo
          echo "Starting extractor..."

          python3 \
            "$DEVICE_TREE/extract-files.py" \
            "$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"

          echo
          echo "============================================================"
          echo "🔧 PATCH CLONED LIST FOR UPSTREAM GENERATOR PARITY"
          echo "============================================================"
          echo "Upstream write_product_packages() has no package rule for"
          echo "vintf manifests listed with a vendor/odm prefix, so the"
          echo "official --regenerate_makefiles pass aborts on them."
          echo "Both files are absent from this dump, dropping exactly"
          echo "those 2 lines from the run-local clone only."

          LIST="$DEVICE_TREE/proprietary-files.txt"
          cp "$LIST" "$LIST.orig"
          grep -v '^vendor/odm/etc/vintf/manifest_nonfc_' "$LIST.orig" > "$LIST"
          echo "Removed lines: $(($(grep -c . "$LIST.orig" || true) - $(grep -c . "$LIST" || true)))"
          grep -n 'manifest_nonfc' "$LIST" || echo "(no manifest_nonfc lines remain)"

          echo
          echo "============================================================"
          echo "📝 REGENERATING OFFICIAL MAKEFILES (setup-makefiles)"
          echo "============================================================"
          echo "extract-files.py returns before write_makefiles() when any"
          echo "listed file is missing from the dump, so root makefiles"
          echo "(spinel-vendor.mk, BoardConfigVendor.mk, Android.bp,"
          echo "Android.mk) are generated here via the official"
          echo "--regenerate_makefiles pass (same as setup-makefiles.py)."

          python3 \
            "$DEVICE_TREE/extract-files.py" \
            --regenerate_makefiles

          echo
          echo "✅ OFFICIAL MAKEFILES REGENERATED"
          echo
          echo "Root files:"
          ls -la "$VENDOR_TREE"

          echo
          echo "============================================================"
          echo "✅ EXTRACTION COMPLETED"
          echo "============================================================"

          echo
          echo "Expected generated vendor tree:"
          echo "$VENDOR_TREE"

          if [[ ! -d "$VENDOR_TREE" ]]; then
            echo "❌ extract-utils did not create vendor/xiaomi/spinel"
            echo
            echo "Actual staging directories:"
            find "$WORK_PARENT" \
              -maxdepth 5 \
              -type d \
              | sort
            exit 1
          fi

          if [[ ! -d "$VENDOR_TREE/proprietary" ]]; then
            echo "❌ proprietary directory was not generated"
            echo
            echo "Generated vendor tree:"
            find "$VENDOR_TREE" \
              -maxdepth 3 \
              -print \
              | sort
            exit 1
          fi

          echo
          echo "✅ vendor/xiaomi/spinel/proprietary exists"

      # ==========================================================
      # 16. INSPECT CORRECT GENERATED TREE
      # ==========================================================

      - name: 🔎 Inspect generated vendor tree
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$WORK_PARENT/vendor/xiaomi/spinel"

          echo
          echo "============================================================"
          echo "🔎 GENERATED VENDOR TREE"
          echo "============================================================"

          echo
          echo "Root files:"
          find "$VENDOR_TREE" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "Directories:"
          find "$VENDOR_TREE" \
            -maxdepth 2 \
            -type d \
            | sort

          echo
          echo "Proprietary partitions:"
          find "$VENDOR_TREE/proprietary" \
            -maxdepth 1 \
            -type d \
            -printf '%f/\n' \
            | sort

          echo
          echo "Proprietary:"
          du -sh "$VENDOR_TREE/proprietary"

      # ==========================================================
      # 17. VALIDATE GENERATED VENDOR TREE
      # ==========================================================

      - name: 🧬 Ensure root Android.bp (official soong namespace)
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$WORK_PARENT/vendor/xiaomi/spinel"

          if [[ ! -f "$VENDOR_TREE/Android.bp" ]]; then
            echo "Ensuring root Android.bp (official soong_namespace)..."

            printf '%s\n' \
              '// Automatically generated file. DO NOT MODIFY' \
              '' \
              'soong_namespace {}' \
              > "$VENDOR_TREE/Android.bp"
          fi

          if [[ ! -f "$VENDOR_TREE/Android.mk" ]]; then
            echo "Ensuring root Android.mk (official all-makefiles-under)..."

            printf '%s\n' \
              '# Automatically generated file. DO NOT MODIFY' \
              '' \
              'LOCAL_PATH := $(call my-dir)' \
              'include $(call all-makefiles-under,$(LOCAL_PATH))' \
              > "$VENDOR_TREE/Android.mk"
          fi

          echo "✅ Android.bp:"
          cat "$VENDOR_TREE/Android.bp"

          echo
          echo "✅ Android.mk:"
          cat "$VENDOR_TREE/Android.mk"


          # ==========================================================
          # 20. VALIDATE GENERATED VENDOR TREE
          # ==========================================================

      - name: ✅ Validate generated vendor tree
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$WORK_PARENT/vendor/xiaomi/spinel"

          echo
          echo "============================================================"
          echo "✅ VENDOR TREE VALIDATION"
          echo "============================================================"

          required_files=(
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
          )

          for file in "${required_files[@]}"; do

            if [[ -f "$VENDOR_TREE/$file" ]]; then
              echo "✅ $file"
            else
              echo "❌ Missing $file"
              exit 1
            fi

          done

          for part in vendor system_ext product; do

            if [[ -d "$VENDOR_TREE/proprietary/$part" ]]; then
              echo "✅ proprietary/$part"
            else
              echo "❌ Missing proprietary/$part"
              exit 1
            fi

          done

          echo
          echo "Proprietary file count:"

          COUNT="$(
            find "$VENDOR_TREE/proprietary" \
              -type f \
              | wc -l
          )"

          echo "$COUNT"

          if [[ "$COUNT" -ne 6372 ]]; then
            echo "❌ Expected 6372 proprietary files"
            exit 1
          fi

          echo "✅ proprietary file count matches official list"

          if [[ "${{ inputs.copy_radio }}" == "true" ]]; then

            echo
            echo "Radio directory:"

            if [[ ! -d "$VENDOR_TREE/radio" ]]; then
              echo "❌ radio/ missing"
              exit 1
            fi

            ls "$VENDOR_TREE/radio"

            RADIO_COUNT="$(
              find "$VENDOR_TREE/radio" \
                -maxdepth 1 \
                -type f \
                | wc -l
            )"

            echo
            echo "Radio file count: $RADIO_COUNT"

            if [[ "$RADIO_COUNT" -ne 11 ]]; then
              echo "❌ Expected 11 radio files"
              exit 1
            fi

            echo "✅ 11 radio images extracted"

            SHA1_RULES="$(
              grep -c 'add-radio-file-sha1-checked' \
                "$VENDOR_TREE/Android.mk" \
                || true
            )"

            echo
            echo "add-radio-file-sha1-checked rules: $SHA1_RULES"

            if [[ "$SHA1_RULES" -ne 11 ]]; then
              echo "❌ Expected 11 radio sha1 rules in Android.mk"
              exit 1
            fi

            echo "✅ Radio sha1 rules present"

            if grep -q 'AB_OTA_PARTITIONS' \
              "$VENDOR_TREE/BoardConfigVendor.mk"; then

              echo
              echo "AB_OTA_PARTITIONS:"
              grep -A 32 'AB_OTA_PARTITIONS' \
                "$VENDOR_TREE/BoardConfigVendor.mk"

            else
              echo "❌ AB_OTA_PARTITIONS missing"
              exit 1
            fi

          fi

          echo
          echo "Proprietary size:"
          du -sh "$VENDOR_TREE/proprietary"

          echo
          echo "Generated vendor tree:"
          find "$VENDOR_TREE" \
            -maxdepth 2 \
            -type d \
            | sort

      # ==========================================================
      # 18. COPY VENDOR TREE TO ROOT (VENDOR-ONLY REPOSITORY)
      #
      # IMPORTANT:
      #
      # This repository is a VENDOR tree only. It must contain
      # exactly what an official LineageOS vendor/xiaomi/<device>
      # tree contains — nothing from the device tree:
      #
      #   Android.bp
      #   Android.mk
      #   BoardConfigVendor.mk
      #   spinel-vendor.mk
      #   proprietary/
      #   radio/
      #
      # proprietary-files.txt and extract-files.py are DEVICE tree
      # files. They stay in the staging area / reports/ for
      # traceability only and are never copied into the repo root,
      # never git-added, and excluded from the release artifact.
      # ==========================================================

      - name: 📂 Copy generated vendor tree to repository root
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$WORK_PARENT/vendor/xiaomi/spinel"
          ROOT="$GITHUB_WORKSPACE"

          echo
          echo "============================================================"
          echo "📂 COPYING VENDOR TREE TO REPOSITORY ROOT"
          echo "============================================================"

          # ------------------------------------------------------
          # Copy generated vendor tree directly to repository root.
          #
          # This gives:
          #
          #   ROOT/Android.bp
          #   ROOT/Android.mk
          #   ROOT/BoardConfigVendor.mk
          #   ROOT/spinel-vendor.mk
          #   ROOT/proprietary/
          #   ROOT/radio/
          # ------------------------------------------------------

          rsync -a \
            "$VENDOR_TREE/" \
            "$ROOT/"

          echo
          echo "Checking root..."

          test -f "$ROOT/Android.bp"
          test -f "$ROOT/Android.mk"
          test -f "$ROOT/BoardConfigVendor.mk"
          test -f "$ROOT/spinel-vendor.mk"
          test -d "$ROOT/proprietary"

          echo
          echo "✅ Vendor tree copied to repository root (vendor-only)"

      # ==========================================================
      # 18b. GITATTRIBUTES (OFFICIAL VENDOR TREE CONVENTION)
      # ==========================================================

      - name: 🧬 Write .gitattributes
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"

          cat > "$ROOT/.gitattributes" <<'EOF'
          * text=auto eol=lf
          *.so binary
          *.apk binary
          *.jar binary
          *.img binary
          *.bin binary
          *.dat binary
          *.dat.bz2 binary
          *.dat.xz binary
          *.axml binary
          *.ttf binary
          *.otf binary
          EOF

          echo "✅ .gitattributes written"

      # ==========================================================
      # 19. FINAL ROOT VALIDATION
      # ==========================================================

      - name: 🔬 Final repository validation
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"

          # Device-side list snapshotted into reports/ by step 20 for
          # traceability; reused here for the final checks.
          PROP_LIST="$ROOT/reports/proprietary-files-final.txt"

          echo
          echo "============================================================"
          echo "🔬 FINAL REPOSITORY VALIDATION"
          echo "============================================================"

          required_files=(
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
          )

          for file in "${required_files[@]}"; do

            if [[ -f "$ROOT/$file" ]]; then
              echo "✅ $file"
            else
              echo "❌ Missing $file"
              exit 1
            fi

          done

          if [[ ! -d "$ROOT/proprietary" ]]; then
            echo "❌ proprietary/ missing"
            exit 1
          fi

          echo "✅ proprietary/"

          for part in vendor system_ext product; do

            if [[ ! -d "$ROOT/proprietary/$part" ]]; then
              echo "❌ proprietary/$part missing"
              exit 1
            fi

            echo "✅ proprietary/$part"

          done

          echo
          echo "Proprietary file count:"

          COUNT="$(
            find "$ROOT/proprietary" \
              -type f \
              | wc -l
          )"

          echo "$COUNT"

          if [[ "$COUNT" -ne 6372 ]]; then
            echo "❌ Expected 6372 proprietary files"
            exit 1
          fi

          if [[ "${{ inputs.copy_radio }}" == "true" ]]; then

            if [[ ! -d "$ROOT/radio" ]]; then
              echo "❌ radio/ missing"
              exit 1
            fi

            echo "✅ radio/"

            RADIO_COUNT="$(
              find "$ROOT/radio" \
                -maxdepth 1 \
                -type f \
                | wc -l
            )"

            echo "Radio file count: $RADIO_COUNT"

            if [[ "$RADIO_COUNT" -ne 11 ]]; then
              echo "❌ Expected 11 radio files"
              exit 1
            fi

            SHA1_RULES="$(
              grep -c 'add-radio-file-sha1-checked' \
                "$ROOT/Android.mk" \
                || true
            )"

            echo "Radio sha1 rules: $SHA1_RULES"

            if [[ "$SHA1_RULES" -ne 11 ]]; then
              echo "❌ Expected 11 radio sha1 rules in Android.mk"
              exit 1
            fi

            if grep -q 'AB_OTA_PARTITIONS' \
              "$ROOT/BoardConfigVendor.mk"; then
              echo "✅ AB_OTA_PARTITIONS present in BoardConfigVendor.mk"
            else
              echo "❌ AB_OTA_PARTITIONS missing"
              exit 1
            fi

          fi

          # ------------------------------------------------------
          # NO nested vendor/xiaomi/spinel
          # ------------------------------------------------------

          if [[ -d "$ROOT/vendor/xiaomi/spinel" ]]; then
            echo "❌ Nested vendor/xiaomi/spinel exists in repository"
            exit 1
          fi

          echo "✅ No nested vendor/xiaomi/spinel"

          # ------------------------------------------------------
          # IWPRIV
          # ------------------------------------------------------

          if grep -n '^bin/iwpriv' \
            "$PROP_LIST"; then

            echo "❌ bin/iwpriv exists"
            exit 1
          fi

          IWPRIV_COUNT="$(
            grep -c '^vendor/bin/iwpriv$' \
              "$PROP_LIST" \
              || true
          )"

          if [[ "$IWPRIV_COUNT" -ne 1 ]]; then
            echo "❌ vendor/bin/iwpriv count = $IWPRIV_COUNT"
            exit 1
          fi

          echo "✅ vendor/bin/iwpriv exists exactly once"

          # ------------------------------------------------------
          # Unsupported partitions
          # ------------------------------------------------------

          if grep -nE \
            '^(system|vendor_dlkm|odm_dlkm|mi_ext|bin)/' \
            "$PROP_LIST"; then

            echo "❌ Unsupported partition entries remain"
            exit 1
          fi

          echo "✅ No unsupported partition entries (vendor+system_ext+product only)"

          # ------------------------------------------------------
          # VINTF manifests handled by extract-utils automatically
          # ------------------------------------------------------

          if grep -q \
            'manifest_nonfc_' \
            "$PROP_LIST"; then

            echo "ℹ️ VINTF manifests present in official list"
            echo "   (extract-utils handles them automatically)"
          fi

          if ! grep -q 'manifest_nonfc_' "$PROP_LIST"; then
            echo "❌ Expected manifest_nonfc_ entries in official list"
            exit 1
          fi

          for f in manifest_nonfc_dsds.xml manifest_nonfc_ss.xml; do

            FOUND="$(
              find "$ROOT/proprietary" \
                -type f \
                -name "$f" \
                -print \
                -quit \
                || true
            )"

            if [[ -z "$FOUND" ]]; then
              echo "❌ $f not found under proprietary/"
              exit 1
            fi

            echo "✅ $f restored by extract-utils"
            echo "   $FOUND"

          done

          # ------------------------------------------------------
          # Final layout
          # ------------------------------------------------------

          echo
          echo "============================================================"
          echo "📁 FINAL ROOT LAYOUT"
          echo "============================================================"

          find "$ROOT" \
            -maxdepth 2 \
            -type d \
            \( \
              -name .git \
              -o -name .github \
              -o -name proprietary \
              -o -name radio \
              -o -name vendor \
              -o -name device \
            \) \
            -prune \
            -o \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          echo
          echo "Directories:"
          find "$ROOT" \
            -maxdepth 1 \
            -type d \
            -printf '%f/\n' \
            | sort

          echo
          echo "Proprietary:"
          du -sh "$ROOT/proprietary"

          if [[ -d "$ROOT/radio" ]]; then
            echo
            echo "Radio:"
            du -sh "$ROOT/radio"
          fi

          echo
          echo "============================================================"
          echo "🎉 FINAL VALIDATION PASSED"
          echo "============================================================"

      # ==========================================================
      # 20. REPORT
      # ==========================================================

      - name: 📝 Generate build report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          SRC_DEVICE_TREE="$GITHUB_WORKSPACE/$DEVICE_TREE_DIR"

          cp \
            "$SRC_DEVICE_TREE/proprietary-files.txt" \
            reports/proprietary-files-final.txt

          cp \
            "$SRC_DEVICE_TREE/proprietary-firmware.txt" \
            reports/proprietary-firmware.txt

          cp \
            "$SRC_DEVICE_TREE/extract-files.py" \
            reports/extract-files.py

          {
            echo "# spinel Vendor Build Report"
            echo
            echo "Device: $DEVICE"
            echo "Vendor: $VENDOR"
            echo
            echo "Device tree:"
            echo "$DEVICE_TREE_REPO"
            echo
            echo "Stock dump:"
            echo "$STOCK_DUMP_REPO"
            echo
            echo "Stock dump branch:"
            echo "${{ inputs.stock_dump_branch }}"
            echo
            echo "Extract utils branch:"
            echo "${{ inputs.extract_utils_branch }}"
            echo
            echo "Radio enabled:"
            echo "${{ inputs.copy_radio }}"
            echo
            echo "Proprietary entries:"
            grep -vE '^[[:space:]]*(#|$)' \
              reports/proprietary-files-final.txt \
              | wc -l
          } > reports/build-report.md

          echo "✅ Report generated"

      # ==========================================================
      # 21. GIT STATUS
      # ==========================================================

      - name: 📊 Git status
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "============================================================"
          echo "📊 FINAL GIT STATUS"
          echo "============================================================"

          git status --short

          echo
          echo "Diff stat:"
          git diff --stat || true

      # ==========================================================
      # 22. PUSH
      # ==========================================================

      - name: 🚀 Commit and push
        if: ${{ inputs.push_changes }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Current branch: $GITHUB_REF_NAME"

          if [[ "$GITHUB_REF_NAME" != "lineage-23.2" ]]; then
            echo "❌ Push allowed only on lineage-23.2"
            exit 1
          fi

          # Vendor-only repository: only the official vendor tree
          # artifacts are committed. proprietary-files.txt and
          # extract-files.py are device-tree files, and reports/ holds
          # CI working/ traceability files — never part of the tracked
          # vendor tree.
          git add \
            Android.bp \
            Android.mk \
            BoardConfigVendor.mk \
            spinel-vendor.mk \
            proprietary \
            radio \
            .gitattributes \
            .github

          if git diff --cached --quiet; then
            echo "ℹ️ Nothing to commit"
            exit 0
          fi

          git commit \
            -m "vendor: generate spinel proprietary blobs"

          git push \
            origin \
            "HEAD:lineage-23.2"

          echo "✅ Changes pushed"

      # ==========================================================
      # 23. ARTIFACT
      # ==========================================================

      - name: 📦 Create artifact
        if: ${{ inputs.upload_artifact }}
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT="$RUNNER_TEMP/spinel-vendor-tree.tar.gz"

          tar \
            --exclude=".git" \
            --exclude="stock_dump" \
            --exclude="extract-utils" \
            --exclude="device_tree" \
            --exclude="staging_android_root" \
            --exclude="*.tgz" \
            --exclude="./reports" \
            -czf \
            "$ARTIFACT" \
            .

          ls -lh "$ARTIFACT"

      # ==========================================================
      # 24. UPLOAD
      # ==========================================================

      - name: ⬆️ Upload artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree
          path: ${{ runner.temp }}/spinel-vendor-tree.tar.gz
          if-no-files-found: error
          retention-days: 14

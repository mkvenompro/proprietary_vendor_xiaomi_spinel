      - name: 🧬 Ensure root Android.bp (official soong namespace)
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$WORK_PARENT/vendor/xiaomi/spinel"

          if [[ ! -f "$VENDOR_TREE/Android.bp" ]]; then
            echo "Ensuring root Android.bp (official soong_namespace)..."

            printf '%s\n' \
              '// Automatically generated file. DO NOT MODIFY' \
              '' \
              'soong_namespace {}' \
              > "$VENDOR_TREE/Android.bp"
          fi

          if [[ ! -f "$VENDOR_TREE/Android.mk" ]]; then
            echo "Ensuring root Android.mk (official all-makefiles-under)..."

            printf '%s\n' \
              '# Automatically generated file. DO NOT MODIFY' \
              '' \
              'LOCAL_PATH := $(call my-dir)' \
              'include $(call all-makefiles-under,$(LOCAL_PATH))' \
              > "$VENDOR_TREE/Android.mk"
          fi

          echo "✅ Android.bp:"
          cat "$VENDOR_TREE/Android.bp"

          echo
          echo "✅ Android.mk:"
          cat "$VENDOR_TREE/Android.mk"

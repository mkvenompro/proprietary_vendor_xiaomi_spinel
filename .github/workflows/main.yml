name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  generate-vendor:
    name: 🧬 Generate LineageOS Vendor Tree
    runs-on: ubuntu-24.04

    env:
      DEVICE: spinel
      VENDOR: xiaomi
      DUMBER_REPO: https://gitlab.com/mkpromvp/dumber-2-mk.git
      DUMBER_BRANCH: dump-redmi-spinel-os2.0.212.0.vpgmixm
      EXTRACT_UTILS_REPO: https://github.com/LineageOS/android_tools_extract-utils.git
      EXTRACT_UTILS_BRANCH: lineage-23.2

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: 📥 Checkout vendor repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: 🧰 Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            python3 \
            python3-pip \
            rsync \
            file \
            unzip \
            zip \
            cpio \
            lz4 \
            xz-utils \
            zstd \
            bc \
            bison \
            flex \
            build-essential

          git lfs install

          echo
          echo "=========================================="
          echo "VERSIONS"
          echo "=========================================="

          python3 --version
          git --version
          git-lfs --version

      # ============================================================
      # CLEAN
      # ============================================================

      - name: 🧹 Clean workspace
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf extract_tree
          rm -rf stock_dump
          rm -rf generated_vendor
          rm -rf reports

          mkdir -p extract_tree
          mkdir -p stock_dump
          mkdir -p generated_vendor
          mkdir -p reports

      # ============================================================
      # DUMBER
      # ============================================================

      - name: 📦 Clone stock dump
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${DUMBER_BRANCH}" \
            "${DUMBER_REPO}" \
            stock_dump

          cd stock_dump

          git lfs install
          git lfs pull

          echo
          echo "=========================================="
          echo "DUMBER COMMIT"
          echo "=========================================="

          git rev-parse HEAD

          echo
          echo "=========================================="
          echo "DUMBER BRANCH"
          echo "=========================================="

          git branch --show-current

          echo
          echo "=========================================="
          echo "DUMBER SIZE"
          echo "=========================================="

          du -sh .

      # ============================================================
      # VERIFY DUMBER
      # ============================================================

      - name: 🔎 Verify stock dump
        shell: bash
        run: |
          set -euxo pipefail

          test -d stock_dump/vendor
          test -d stock_dump/vendor_dlkm
          test -d stock_dump/odm_dlkm
          test -f stock_dump/proprietary-files.txt

          echo
          echo "=========================================="
          echo "STOCK DUMP ROOT"
          echo "=========================================="

          find stock_dump \
            -maxdepth 1 \
            -mindepth 1 \
            -printf '%f\n' \
            | sort

          echo
          echo "=========================================="
          echo "PROPRIETARY FILE COUNT"
          echo "=========================================="

          wc -l stock_dump/proprietary-files.txt

          echo
          echo "=========================================="
          echo "README"
          echo "=========================================="

          head -60 stock_dump/README.md || true

      # ============================================================
      # EXTRACT UTILS
      # ============================================================

      - name: 🧬 Clone Lineage extract-utils
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p extract_tree/tools

          git clone \
            --depth=1 \
            --branch "${EXTRACT_UTILS_BRANCH}" \
            "${EXTRACT_UTILS_REPO}" \
            extract_tree/tools/extract-utils

          echo
          echo "=========================================="
          echo "EXTRACT UTILS COMMIT"
          echo "=========================================="

          git -C extract_tree/tools/extract-utils rev-parse HEAD

          echo
          echo "=========================================="
          echo "EXTRACT UTILS STRUCTURE"
          echo "=========================================="

          find \
            extract_tree/tools/extract-utils/extract_utils \
            -maxdepth 2 \
            -type f \
            -printf '%P\n' \
            | sort

      # ============================================================
      # CREATE TREE
      # ============================================================

      - name: 📁 Create extraction tree
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            extract_tree/device/xiaomi/spinel \
            extract_tree/vendor/xiaomi/spinel

      # ============================================================
      # COPY ORIGINAL LIST
      # ============================================================

      - name: 📋 Copy original proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          cp \
            stock_dump/proprietary-files.txt \
            extract_tree/device/xiaomi/spinel/proprietary-files.original.txt

          echo
          echo "Original entries:"
          wc -l \
            extract_tree/device/xiaomi/spinel/proprietary-files.original.txt

      # ============================================================
      # NORMALIZE LIST
      # ============================================================

      - name: 🧹 Normalize proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          stock = Path("stock_dump")

          original = Path(
              "extract_tree/device/xiaomi/spinel/"
              "proprietary-files.original.txt"
          )

          output = Path(
              "extract_tree/device/xiaomi/spinel/"
              "proprietary-files.txt"
          )

          report_dir = Path("reports")
          report_dir.mkdir(parents=True, exist_ok=True)

          removed_system = []
          removed_missing = []
          removed_invalid = []
          kept = []

          lines = original.read_text(
              encoding="utf-8",
              errors="replace"
          ).splitlines()

          for raw in lines:

              line = raw.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              # Remove Lineage package markers ONLY for this
              # generated vendor tree.
              while line.startswith("-"):
                  line = line[1:]

              line = line.strip()

              if not line:
                  continue

              path_part = line.split("|", 1)[0]

              source = path_part.split(":", 1)[0].lstrip("/")

              if ":" in path_part:
                  destination = (
                      path_part.split(":", 1)[1].lstrip("/")
                  )
              else:
                  destination = source

              if not source:
                  removed_invalid.append(raw)
                  continue

              top = source.split("/", 1)[0]

              # We are generating the vendor tree only.
              # system/system_ext/product blobs must stay out.
              if top in {
                  "system",
                  "system_ext",
                  "product",
              }:
                  removed_system.append(source)
                  continue

              source_path = stock / source

              if not source_path.exists():
                  removed_missing.append(source)
                  continue

              kept.append(line)

          # --------------------------------------------------------
          # Remove duplicate destinations.
          # --------------------------------------------------------

          final_lines = []
          seen_destinations = set()

          for line in kept:

              path_part = line.split("|", 1)[0]

              if ":" in path_part:
                  src, dst = path_part.split(":", 1)
                  dst = dst.lstrip("/")
              else:
                  src = path_part
                  dst = path_part

              dst = dst.lstrip("/")

              if dst in seen_destinations:
                  continue

              seen_destinations.add(dst)
              final_lines.append(line)

          output.write_text(
              "\n".join(final_lines) + "\n",
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # Reports
          # --------------------------------------------------------

          Path(
              "reports/removed-system.txt"
          ).write_text(
              "\n".join(removed_system) +
              ("\n" if removed_system else ""),
              encoding="utf-8"
          )

          Path(
              "reports/removed-missing.txt"
          ).write_text(
              "\n".join(removed_missing) +
              ("\n" if removed_missing else ""),
              encoding="utf-8"
          )

          Path(
              "reports/removed-invalid.txt"
          ).write_text(
              "\n".join(removed_invalid) +
              ("\n" if removed_invalid else ""),
              encoding="utf-8"
          )

          Path(
              "reports/proprietary-final.txt"
          ).write_text(
              "\n".join(final_lines) + "\n",
              encoding="utf-8"
          )

          report = f"""
          ==========================================
          PROPRIETARY FILE CLEANUP
          ==========================================

          Original:
            {len(lines)}

          Kept:
            {len(final_lines)}

          Removed system/product/system_ext:
            {len(removed_system)}

          Removed missing:
            {len(removed_missing)}

          Removed invalid:
            {len(removed_invalid)}

          Removed duplicate destinations:
            {len(kept) - len(final_lines)}

          ==========================================
          """

          Path(
              "reports/proprietary-cleanup.txt"
          ).write_text(
              report,
              encoding="utf-8"
          )

          print(report)

          print("===== FIRST 50 FINAL ENTRIES =====")

          for line in final_lines[:50]:
              print(line)

          print()
          print("===== REMOVED SYSTEM COUNT =====")
          print(len(removed_system))

          print()
          print("===== REMOVED MISSING COUNT =====")
          print(len(removed_missing))

          print()
          print("===== FINAL COUNT =====")
          print(len(final_lines))
          PY

      # ============================================================
      # VALIDATE LIST
      # ============================================================

      - name: 🧪 Validate proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          FILE="extract_tree/device/xiaomi/spinel/proprietary-files.txt"

          python3 - <<'PY'
          from pathlib import Path

          file = Path(
              "extract_tree/device/xiaomi/spinel/"
              "proprietary-files.txt"
          )

          bad_markers = []
          bad_partitions = []
          missing = []

          for number, raw in enumerate(
              file.read_text(
                  encoding="utf-8",
                  errors="replace"
              ).splitlines(),
              1
          ):

              line = raw.strip()

              if not line or line.startswith("#"):
                  continue

              if line.startswith("-"):
                  bad_markers.append(
                      f"{number}: {line}"
                  )

              path_part = line.split("|", 1)[0]

              source = path_part.split(
                  ":",
                  1
              )[0].lstrip("/")

              top = source.split("/", 1)[0]

              if top in {
                  "system",
                  "system_ext",
                  "product",
              }:
                  bad_partitions.append(
                      f"{number}: {line}"
                  )

              if not Path(
                  "stock_dump",
                  source
              ).exists():

                  missing.append(
                      f"{number}: {source}"
                  )

          print(
              "Leading '-' entries:",
              len(bad_markers)
          )

          print(
              "Forbidden system/product entries:",
              len(bad_partitions)
          )

          print(
              "Missing source entries:",
              len(missing)
          )

          if bad_markers:
              print()
              print(
                  "ERROR: leading '-' still exists:"
              )
              print(
                  "\n".join(
                      bad_markers[:100]
                  )
              )
              raise SystemExit(1)

          if bad_partitions:
              print()
              print(
                  "ERROR: forbidden partition entries:"
              )
              print(
                  "\n".join(
                      bad_partitions[:100]
                  )
              )
              raise SystemExit(1)

          if missing:
              print()
              print(
                  "ERROR: missing sources:"
              )
              print(
                  "\n".join(
                      missing[:100]
                  )
              )
              raise SystemExit(1)

          print()
          print("==========================================")
          print("PROPRIETARY LIST VALIDATION: PASS")
          print("==========================================")
          PY

      # ============================================================
      # CREATE EXTRACT-FILES.PY
      # ============================================================

      - name: 🐍 Create extract-files.py
        shell: bash
        run: |
          set -euxo pipefail

          cat > extract_tree/device/xiaomi/spinel/extract-files.py <<'PY'
          #!/usr/bin/env -S PYTHONPATH=../../../tools/extract-utils python3

          #
          # SPDX-License-Identifier: Apache-2.0
          #

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          DEVICE = "spinel"
          VENDOR = "xiaomi"

          module = ExtractUtilsModule(
              DEVICE,
              VENDOR,
              check_elf=True,
          )

          if __name__ == "__main__":
              utils = ExtractUtils.device(module)
              utils.run()
          PY

          chmod +x \
            extract_tree/device/xiaomi/spinel/extract-files.py

          echo
          echo "=========================================="
          echo "extract-files.py"
          echo "=========================================="

          cat \
            extract_tree/device/xiaomi/spinel/extract-files.py

      # ============================================================
      # TEST IMPORTS
      # ============================================================

      - name: 🧪 Test extract-utils imports
        working-directory: extract_tree
        shell: bash
        run: |
          set -euxo pipefail

          export PYTHONPATH="$PWD/tools/extract-utils"

          python3 - <<'PY'
          import extract_utils

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          from extract_utils.file import (
              FileList,
          )

          print("==========================================")
          print("EXTRACT-UTILS IMPORT TEST")
          print("==========================================")

          print(
              "extract_utils:",
              extract_utils.__file__
          )

          print(
              "ExtractUtils:",
              ExtractUtils
          )

          print(
              "ExtractUtilsModule:",
              ExtractUtilsModule
          )

          print(
              "FileList:",
              FileList
          )

          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=True,
          )

          print()
          print("Device:", module.device)
          print("Vendor:", module.vendor)
          print("check_elf:", module.check_elf)

          print()
          print("==========================================")
          print("IMPORT TEST: PASS")
          print("==========================================")
          PY

      # ============================================================
      # DRY RUN PARSER
      # ============================================================

      - name: 🧪 Dry-run proprietary parser
        working-directory: extract_tree
        shell: bash
        run: |
          set -euxo pipefail

          export PYTHONPATH="$PWD/tools/extract-utils"

          python3 - <<'PY'
          from pathlib import Path

          from extract_utils.file import (
              FileList,
          )

          path = Path(
              "device/xiaomi/spinel/"
              "proprietary-files.txt"
          )

          file_list = FileList(
              check_elf=True
          )

          file_list.add_from_file(
              str(path)
          )

          print()
          print("==========================================")
          print("EXTRACT-UTILS PARSER TEST")
          print("==========================================")

          print(
              "All files:",
              len(list(file_list.all_files))
          )

          print(
              "Package files:",
              len(list(file_list.package_files))
          )

          print(
              "Copy files:",
              len(list(file_list.copy_files))
          )

          print(
              "Boot jars:",
              len(list(file_list.boot_jars))
          )

          print(
              "Symlinks:",
              len(list(file_list.package_symlinks))
          )

          print()
          print("Parser: PASS")
          PY

      # ============================================================
      # EXTRACT
      # ============================================================

      - name: 🧬 Extract proprietary blobs
        working-directory: extract_tree
        shell: bash
        run: |
          set -euxo pipefail

          export PYTHONPATH="$PWD/tools/extract-utils"

          cd device/xiaomi/spinel

          echo
          echo "=========================================="
          echo "STARTING EXTRACTION"
          echo "=========================================="

          python3 extract-files.py \
            ../../../../stock_dump

          echo
          echo "=========================================="
          echo "EXTRACTION FINISHED"
          echo "=========================================="

      # ============================================================
      # VERIFY GENERATED TREE
      # ============================================================

      - name: 🔎 Verify generated vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          test -d \
            extract_tree/vendor/xiaomi/spinel

          test -d \
            extract_tree/vendor/xiaomi/spinel/proprietary

          test -f \
            extract_tree/vendor/xiaomi/spinel/Android.bp

          test -f \
            extract_tree/vendor/xiaomi/spinel/Android.mk

          test -f \
            extract_tree/vendor/xiaomi/spinel/BoardConfigVendor.mk

          test -f \
            extract_tree/vendor/xiaomi/spinel/spinel-vendor.mk

          echo
          echo "=========================================="
          echo "GENERATED VENDOR TREE: PASS"
          echo "=========================================="

          echo
          echo "===== TOP LEVEL FILES ====="

          find \
            extract_tree/vendor/xiaomi/spinel \
            -maxdepth 2 \
            -type f \
            | sort

      # ============================================================
      # STATISTICS
      # ============================================================

      - name: 📊 Generate vendor tree statistics
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="extract_tree/vendor/xiaomi/spinel/proprietary"

          find "$ROOT" \
            -type f \
            | sort \
            > reports/generated-files.txt

          FILE_COUNT=$(
            wc -l < reports/generated-files.txt
          )

          SIZE=$(
            du -sh "$ROOT" | cut -f1
          )

          {
            echo "=========================================="
            echo "GENERATED VENDOR TREE"
            echo "=========================================="
            echo
            echo "Files: $FILE_COUNT"
            echo "Size:  $SIZE"
            echo
            echo "Directories:"
            find "$ROOT" -type d | wc -l
          } | tee reports/generated-stats.txt

      # ============================================================
      # DUPLICATE SOURCES
      # ============================================================

      - name: 🔍 Audit duplicate source paths
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter

          path = Path(
              "extract_tree/device/xiaomi/spinel/"
              "proprietary-files.txt"
          )

          sources = []

          for raw in path.read_text(
              encoding="utf-8",
              errors="replace"
          ).splitlines():

              line = raw.strip()

              if not line or line.startswith("#"):
                  continue

              line = line.lstrip("-")

              path_part = line.split(
                  "|",
                  1
              )[0]

              source = path_part.split(
                  ":",
                  1
              )[0]

              sources.append(source)

          counts = Counter(sources)

          duplicates = {
              key: value
              for key, value in counts.items()
              if value > 1
          }

          out = Path(
              "reports/duplicate-source-paths.txt"
          )

          with out.open(
              "w",
              encoding="utf-8"
          ) as f:

              for key, value in sorted(
                  duplicates.items(),
                  key=lambda x: (-x[1], x[0])
              ):
                  f.write(
                      f"{value} {key}\n"
                  )

          print(
              "Duplicate source paths:",
              len(duplicates)
          )
          PY

      # ============================================================
      # SHA256 AUDIT
      # ============================================================

      - name: 🔐 Audit identical blob contents
        shell: bash
        run: |
          set -euxo pipefail

          find \
            extract_tree/vendor/xiaomi/spinel/proprietary \
            -type f \
            -print0 \
            | xargs -0 sha256sum \
            | sort -k1,1 \
            > reports/blob-sha256.txt

          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict

          groups = defaultdict(list)

          for line in Path(
              "reports/blob-sha256.txt"
          ).read_text(
              encoding="utf-8"
          ).splitlines():

              if not line.strip():
                  continue

              sha, filename = line.split(
                  "  ",
                  1
              )

              groups[sha].append(filename)

          with Path(
              "reports/identical-content.txt"
          ).open(
              "w",
              encoding="utf-8"
          ) as f:

              for sha, files in sorted(
                  groups.items()
              ):

                  if len(files) > 1:

                      f.write(
                          f"{sha}\n"
                          + "\n".join(
                              f"  {x}"
                              for x in files
                          )
                          + "\n\n"
                      )

          print(
              "Identical content groups:",
              sum(
                  1
                  for files in groups.values()
                  if len(files) > 1
              )
          )
          PY

      # ============================================================
      # ELF AUDIT
      # ============================================================

      - name: 🧪 Audit ELF files
        shell: bash
        run: |
          set -euxo pipefail

          : > reports/elf-files.txt

          while IFS= read -r -d '' file; do

            if file "$file" | grep -q "ELF"; then
              echo "$file" >> reports/elf-files.txt
            fi

          done < <(
            find \
              extract_tree/vendor/xiaomi/spinel/proprietary \
              -type f \
              -print0
          )

          echo "ELF files:"
          wc -l < reports/elf-files.txt

      # ============================================================
      # SYMLINK AUDIT
      # ============================================================

      - name: 🔗 Audit symlinks
        shell: bash
        run: |
          set -euxo pipefail

          find \
            extract_tree/vendor/xiaomi/spinel \
            -type l \
            -printf '%p -> %l\n' \
            | sort \
            > reports/symlinks.txt

          echo
          echo "Symlinks:"
          cat reports/symlinks.txt || true

      # ============================================================
      # FINAL EXTRACTION CHECK
      # ============================================================

      - name: ✅ Verify every proprietary entry exists
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path

          list_file = Path(
              "extract_tree/device/xiaomi/spinel/"
              "proprietary-files.txt"
          )

          root = Path(
              "extract_tree/vendor/xiaomi/spinel/"
              "proprietary"
          )

          missing = []

          for number, raw in enumerate(
              list_file.read_text(
                  encoding="utf-8",
                  errors="replace"
              ).splitlines(),
              1
          ):

              line = raw.strip()

              if not line or line.startswith("#"):
                  continue

              line = line.lstrip("-")

              path_part = line.split(
                  "|",
                  1
              )[0]

              if ":" in path_part:

                  source, destination = path_part.split(
                      ":",
                      1
                  )

              else:

                  source = path_part
                  destination = path_part

              destination = destination.lstrip("/")

              target = root / destination

              if not target.exists():

                  missing.append(
                      f"{number}: "
                      f"{source} -> {destination}"
                  )

          report = Path(
              "reports/unextracted.txt"
          )

          report.write_text(
              "\n".join(missing) +
              ("\n" if missing else ""),
              encoding="utf-8"
          )

          print(
              "Unextracted entries:",
              len(missing)
          )

          if missing:

              print()
              print(
                  "ERROR: generated vendor tree "
                  "is missing entries:"
              )

              print(
                  "\n".join(
                      missing[:200]
                  )
              )

              raise SystemExit(1)

          print()
          print(
              "ALL PROPRIETARY ENTRIES GENERATED: PASS"
          )
          PY

      # ============================================================
      # PREPARE FINAL TREE
      # ============================================================

      - name: 📦 Prepare final vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf generated_vendor

          mkdir -p generated_vendor

          rsync -a \
            extract_tree/vendor/xiaomi/spinel/ \
            generated_vendor/

          echo
          echo "=========================================="
          echo "FINAL VENDOR SIZE"
          echo "=========================================="

          du -sh generated_vendor

          echo
          echo "=========================================="
          echo "FINAL VENDOR FILE COUNT"
          echo "=========================================="

          find generated_vendor \
            -type f \
            | wc -l

      # ============================================================
      # FINAL REPORT
      # ============================================================

      - name: 📝 Generate final report
        shell: bash
        run: |
          set -euxo pipefail

          {
            echo "=========================================="
            echo "MKVenomPro • spinel Vendor Tree"
            echo "=========================================="
            echo
            echo "Device: ${DEVICE}"
            echo "Vendor: ${VENDOR}"
            echo "Dumber branch: ${DUMBER_BRANCH}"
            echo "Extract utils: ${EXTRACT_UTILS_BRANCH}"
            echo
            echo "=========================================="
            echo "CLEANUP"
            echo "=========================================="

            cat \
              reports/proprietary-cleanup.txt

            echo
            echo "=========================================="
            echo "GENERATED STATS"
            echo "=========================================="

            cat \
              reports/generated-stats.txt

            echo
            echo "=========================================="
            echo "DUPLICATE SOURCES"
            echo "=========================================="

            cat \
              reports/duplicate-source-paths.txt \
              || true

            echo
            echo "=========================================="
            echo "IDENTICAL CONTENT"
            echo "=========================================="

            cat \
              reports/identical-content.txt \
              || true

            echo
            echo "=========================================="
            echo "SYMLINKS"
            echo "=========================================="

            cat \
              reports/symlinks.txt \
              || true

            echo
            echo "=========================================="
            echo "UNEXTRACTED"
            echo "=========================================="

            cat \
              reports/unextracted.txt \
              || true

            echo
            echo "=========================================="
            echo "BUILD COMPLETE"
            echo "=========================================="

          } > reports/FINAL-REPORT.txt

          cat reports/FINAL-REPORT.txt

      # ============================================================
      # INSTALL INTO REPOSITORY
      # ============================================================

      - name: 🚚 Install generated vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf vendor/xiaomi/spinel

          mkdir -p vendor/xiaomi/spinel

          rsync -a \
            generated_vendor/ \
            vendor/xiaomi/spinel/

          echo
          echo "=========================================="
          echo "REPOSITORY TREE"
          echo "=========================================="

          find \
            vendor/xiaomi/spinel \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -300

      # ============================================================
      # GIT STATUS
      # ============================================================

      - name: 📊 Git status
        shell: bash
        run: |
          set -euxo pipefail

          echo
          echo "=========================================="
          echo "GIT STATUS"
          echo "=========================================="

          git status --short

          echo
          echo "=========================================="
          echo "VENDOR SIZE"
          echo "=========================================="

          du -sh vendor/xiaomi/spinel

      # ============================================================
      # COMMIT
      # ============================================================

      - name: 💾 Commit vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          git config \
            user.name \
            "MKVenomPro"

          git config \
            user.email \
            "mkvenompro@users.noreply.github.com"

          git add \
            vendor/xiaomi/spinel

          if git diff --cached --quiet; then

            echo
            echo "No changes to commit."

            exit 0

          fi

          git commit \
            -m "vendor: initial proprietary tree for spinel"

      # ============================================================
      # PUSH
      # ============================================================

      - name: 🚀 Push vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          git push \
            origin \
            HEAD:${GITHUB_REF_NAME}

      # ============================================================
      # REPORT ARTIFACT
      # ============================================================

      - name: 📤 Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      # ============================================================
      # VENDOR ARTIFACT
      # ============================================================

      - name: 📤 Upload generated vendor tree
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree
          path: generated_vendor/
          if-no-files-found: error
          retention-days: 30

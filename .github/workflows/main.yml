name: "🧬 Build LineageOS Vendor Tree • spinel"

on:
  workflow_dispatch:
    inputs:
      stock_rom_url:
        description: "Official spinel Fastboot ROM URL - radio images only"
        required: true
        type: string
        default: "https://bigota.d.miui.com/OS2.0.212.0.VPGMIXM/spinel_global_images_OS2.0.212.0.VPGMIXM_20260311.0000.00_15.0_global_1e7d24d317.tgz"

      stock_dump_branch:
        description: "GitLab stock dump branch"
        required: true
        type: string
        default: "dump-redmi-spinel-os2.0.212.0.vpgmixm"

      extract_utils_branch:
        description: "LineageOS extract-utils branch"
        required: true
        type: string
        default: "lineage-23.2"

      clone_retries:
        description: "Git clone retry count"
        required: true
        type: string
        default: "5"

      lfs_retries:
        description: "Git LFS retry count"
        required: true
        type: string
        default: "5"

      copy_radio:
        description: "Download official Fastboot ROM and copy radio images"
        required: true
        type: boolean
        default: true

      push_changes:
        description: "Commit and push generated vendor tree"
        required: true
        type: boolean
        default: false

      upload_artifact:
        description: "Upload generated vendor tree artifact"
        required: true
        type: boolean
        default: true


env:
  DEVICE: "spinel"
  VENDOR: "xiaomi"

  STOCK_DUMP_REPO: "https://gitlab.com/mkpromvp/dumber-2-mk.git"
  STOCK_DUMP_DIR: "stock_dump"

  EXTRACT_UTILS_REPO: "https://github.com/LineageOS/android_tools_extract-utils.git"
  EXTRACT_UTILS_DIR: "extract-utils"

  STAGING_ROOT: "staging_android_root"


jobs:
  build-vendor:
    name: "🧬 Generate Vendor Tree"
    runs-on: ubuntu-24.04

    steps:

      - name: "📋 Show configuration"
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "🧬 LINEAGEOS VENDOR TREE BUILDER"
          echo "============================================================"
          echo "Device            : $DEVICE"
          echo "Vendor            : $VENDOR"
          echo "Stock dump branch : ${{ inputs.stock_dump_branch }}"
          echo "Extract-utils     : ${{ inputs.extract_utils_branch }}"
          echo "Copy radio        : ${{ inputs.copy_radio }}"
          echo "Push changes      : ${{ inputs.push_changes }}"
          echo "Upload artifact   : ${{ inputs.upload_artifact }}"
          echo "============================================================"


      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: "🧰 Install dependencies"
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            python3 \
            python3-pip \
            rsync \
            unzip \
            xz-utils \
            zstd \
            lz4 \
            aria2 \
            wget \
            curl \
            file \
            cpio \
            gzip \
            bzip2 \
            tar \
            patch \
            bc \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            liblz4-tool \
            libxml2-utils


      - name: "⚙️ Configure git"
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "MKVenomPro"
          git config --global user.email "mkvenompro@users.noreply.github.com"

          git lfs install --skip-repo


      - name: "📦 Clone stock dump"
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$STOCK_DUMP_DIR"

          success=0

          for attempt in $(seq 1 "${{ inputs.clone_retries }}"); do
            echo ""
            echo "============================================================"
            echo "📦 STOCK DUMP CLONE ATTEMPT $attempt/${{ inputs.clone_retries }}"
            echo "============================================================"

            rm -rf "$STOCK_DUMP_DIR"

            if git clone \
              --filter=blob:none \
              --no-checkout \
              --depth=1 \
              --branch "${{ inputs.stock_dump_branch }}" \
              "$STOCK_DUMP_REPO" \
              "$STOCK_DUMP_DIR"; then

              success=1
              break
            fi

            echo "⚠️ Clone failed."

            if [ "$attempt" -lt "${{ inputs.clone_retries }}" ]; then
              sleep 5
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "❌ Failed to clone stock dump."
            exit 1
          fi

          cd "$STOCK_DUMP_DIR"

          git config lfs.fetchexclude "*"

          git checkout "${{ inputs.stock_dump_branch }}"

          echo "✅ Stock dump ready"


      - name: "🔎 Locate proprietary-files.txt"
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "🔎 SEARCHING FOR proprietary-files.txt"
          echo "============================================================"

          SOURCE_LIST=""

          while IFS= read -r file; do
            SOURCE_LIST="$file"
            break
          done < <(
            find "$STOCK_DUMP_DIR" \
              -type f \
              -name "proprietary-files.txt" \
              -print
          )

          if [ -z "$SOURCE_LIST" ]; then
            echo "❌ proprietary-files.txt not found."
            exit 1
          fi

          echo "Using:"
          echo "$SOURCE_LIST"

          echo "SOURCE_LIST=$SOURCE_LIST" >> "$GITHUB_ENV"


      - name: "🧹 Normalize proprietary-files.txt"
        shell: bash
        run: |
          set -euo pipefail

          RAW="$SOURCE_LIST"
          NORMALIZED="$GITHUB_WORKSPACE/proprietary-files.txt"

          echo "============================================================"
          echo "🧹 NORMALIZING PROPRIETARY FILE LIST"
          echo "============================================================"

          awk '
            BEGIN {
              removed = 0
            }

            {
              line = $0

              if (line ~ /^[[:space:]]*$/) {
                print line
                next
              }

              if (line ~ /^[[:space:]]*#/) {
                print line
                next
              }

              sub(/^[[:space:]]*-/, "", line)

              if (line ~ /^system\//) {
                removed++
                next
              }

              if (line ~ /^system_ext\//) {
                removed++
                next
              }

              if (line ~ /^product\//) {
                removed++
                next
              }

              if (line ~ /^vendor_dlkm\//) {
                removed++
                next
              }

              if (line ~ /^odm_dlkm\//) {
                removed++
                next
              }

              if (line ~ /^mi_ext\//) {
                removed++
                next
              }

              if (line == "vendor/odm/etc/vintf/manifest_nonfc_dsds.xml") {
                removed++
                next
              }

              if (line == "vendor/odm/etc/vintf/manifest_nonfc_ss.xml") {
                removed++
                next
              }

              if (line == "bin/iwpriv") {
                removed++
                next
              }

              print line
            }

            END {
              print "Removed entries: " removed > "/dev/stderr"
            }
          ' "$RAW" > "$NORMALIZED"

          echo ""
          echo "Normalized proprietary-files.txt:"
          echo "--------------------------------"

          grep -vE '^[[:space:]]*(#|$)' "$NORMALIZED" | wc -l

          echo ""
          echo "iwpriv entries:"
          grep -nE '(^|/)iwpriv$' "$NORMALIZED" || true

          echo ""
          echo "Special VINTF entries:"
          grep -n "manifest_nonfc" "$NORMALIZED" || true


      - name: "🔍 Validate iwpriv"
        shell: bash
        run: |
          set -euo pipefail

          LIST="$GITHUB_WORKSPACE/proprietary-files.txt"

          vendor_count="$(
            grep -E '^[[:space:]]*vendor/bin/iwpriv([[:space:]]|$)' "$LIST" \
              | wc -l \
              || true
          )"

          bin_count="$(
            grep -E '^[[:space:]]*bin/iwpriv([[:space:]]|$)' "$LIST" \
              | wc -l \
              || true
          )"

          echo "vendor/bin/iwpriv count = $vendor_count"
          echo "bin/iwpriv count        = $bin_count"

          if [ "$vendor_count" -ne 1 ]; then
            echo "❌ Expected exactly one vendor/bin/iwpriv."
            exit 1
          fi

          if [ "$bin_count" -ne 0 ]; then
            echo "❌ bin/iwpriv must not exist."
            exit 1
          fi

          echo "✅ iwpriv list is clean"


      - name: "🔎 Validate stock source files"
        shell: bash
        run: |
          set -euo pipefail

          LIST="$GITHUB_WORKSPACE/proprietary-files.txt"
          STOCK="$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"

          echo "============================================================"
          echo "🔎 VALIDATING SOURCE FILES"
          echo "============================================================"

          missing=0
          checked=0

          while IFS= read -r line || [ -n "$line" ]; do

            [ -z "$line" ] && continue
            [[ "$line" == \#* ]] && continue

            src="${line%%:*}"
            src="${src#-}"

            [ -z "$src" ] && continue

            checked=$((checked + 1))

            if [ -f "$STOCK/$src" ]; then
              continue
            fi

            found="$(
              find "$STOCK" \
                -type f \
                -path "*/$src" \
                -print \
                -quit \
                || true
            )"

            if [ -z "$found" ]; then
              echo "❌ Missing: $src"
              missing=$((missing + 1))
            fi

          done < "$LIST"

          echo ""
          echo "Checked : $checked"
          echo "Missing : $missing"

          if [ "$missing" -ne 0 ]; then
            echo "❌ Source validation failed."
            exit 1
          fi

          echo "✅ All proprietary source files exist"


      - name: "🛠️ Clone Lineage extract-utils"
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$EXTRACT_UTILS_DIR"

          success=0

          for attempt in $(seq 1 "${{ inputs.clone_retries }}"); do
            echo ""
            echo "============================================================"
            echo "🛠️ EXTRACT-UTILS ATTEMPT $attempt/${{ inputs.clone_retries }}"
            echo "============================================================"

            rm -rf "$EXTRACT_UTILS_DIR"

            if git clone \
              --depth=1 \
              --branch "${{ inputs.extract_utils_branch }}" \
              "$EXTRACT_UTILS_REPO" \
              "$EXTRACT_UTILS_DIR"; then

              success=1
              break
            fi

            sleep 3
          done

          if [ "$success" -ne 1 ]; then
            echo "❌ Failed to clone extract-utils."
            exit 1
          fi

          echo "✅ extract-utils cloned"


      - name: "🏗️ Prepare staging Android root"
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          WORK_PARENT="$ROOT/$STAGING_ROOT"

          rm -rf "$WORK_PARENT"

          mkdir -p \
            "$WORK_PARENT/device/xiaomi/spinel" \
            "$WORK_PARENT/tools/extract-utils"

          echo "WORK_PARENT=$WORK_PARENT" >> "$GITHUB_ENV"

          echo "Staging Android root:"
          echo "$WORK_PARENT"


      - name: "📱 Prepare device extraction tree"
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_TREE="$WORK_PARENT/device/xiaomi/spinel"

          cp \
            "$GITHUB_WORKSPACE/proprietary-files.txt" \
            "$DEVICE_TREE/proprietary-files.txt"

          cat > "$DEVICE_TREE/extract-files.py" <<'PY'
from extract_utils.main import (
    ExtractUtils,
    ExtractUtilsModule,
)

module = ExtractUtilsModule(
    "spinel",
    "xiaomi",
    check_elf=True,
    add_firmware_proprietary_file=False,
)

utils = ExtractUtils.device(module)
utils.run()
PY

          chmod +x "$DEVICE_TREE/extract-files.py"

          echo "✅ Device extraction tree prepared"


      - name: "📚 Copy extract-utils into Android root"
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR"
          DEST="$WORK_PARENT/tools/extract-utils"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          cp -a "$SOURCE/." "$DEST/"

          if [ ! -f "$DEST/extract_utils/main.py" ]; then
            echo "❌ extract-utils main.py missing."
            exit 1
          fi

          echo "✅ extract-utils copied physically into staging root"


      - name: "🧪 Verify extract-utils root"
        shell: bash
        run: |
          set -euo pipefail

          cd "$WORK_PARENT"

          export PYTHONPATH="$WORK_PARENT/tools/extract-utils"

          python3 - <<'PY'
import os

from extract_utils.tools import android_root

expected = os.path.realpath(os.getcwd())
actual = os.path.realpath(android_root)

print("Expected Android root:")
print(expected)

print("Detected Android root:")
print(actual)

if expected != actual:
    raise SystemExit(
        "❌ extract-utils Android root mismatch"
    )

print("✅ Android root is correct")
PY


      - name: "🧬 Extract proprietary blobs"
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_TREE="$WORK_PARENT/device/xiaomi/spinel"

          echo "============================================================"
          echo "🧬 STARTING PROPRIETARY BLOB EXTRACTION"
          echo "============================================================"

          cd "$WORK_PARENT"

          export PYTHONPATH="$WORK_PARENT/tools/extract-utils"

          python3 \
            "$DEVICE_TREE/extract-files.py" \
            "$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"

          echo ""
          echo "============================================================"
          echo "🔎 CHECKING EXTRACTOR OUTPUT"
          echo "============================================================"

          VENDOR_TREE="$WORK_PARENT/vendor/xiaomi/spinel"

          if [ ! -d "$VENDOR_TREE" ]; then
            echo "❌ Missing generated vendor tree:"
            echo "$VENDOR_TREE"
            exit 1
          fi

          if [ ! -d "$VENDOR_TREE/proprietary" ]; then
            echo "❌ Missing proprietary directory:"
            echo "$VENDOR_TREE/proprietary"
            exit 1
          fi

          echo "✅ Extraction completed successfully"

          echo ""
          echo "Generated vendor tree:"
          find "$VENDOR_TREE" \
            -maxdepth 2 \
            -type f \
            -print \
            | sort


      - name: "🧩 Restore ODM VINTF manifests"
        shell: bash
        run: |
          set -euo pipefail

          STOCK="$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"
          VENDOR_TREE="$WORK_PARENT/vendor/xiaomi/spinel"
          VINTF_DIR="$VENDOR_TREE/proprietary/odm/etc/vintf"

          mkdir -p "$VINTF_DIR"

          DSDS="$STOCK/vendor/odm/etc/vintf/manifest_nonfc_dsds.xml"
          SS="$STOCK/vendor/odm/etc/vintf/manifest_nonfc_ss.xml"

          if [ ! -f "$DSDS" ]; then
            DSDS="$(
              find "$STOCK" \
                -type f \
                -path "*/vendor/odm/etc/vintf/manifest_nonfc_dsds.xml" \
                -print \
                -quit \
                || true
            )"
          fi

          if [ ! -f "$SS" ]; then
            SS="$(
              find "$STOCK" \
                -type f \
                -path "*/vendor/odm/etc/vintf/manifest_nonfc_ss.xml" \
                -print \
                -quit \
                || true
            )"
          fi

          if [ -z "$DSDS" ] || [ ! -f "$DSDS" ]; then
            echo "❌ manifest_nonfc_dsds.xml not found."
            exit 1
          fi

          if [ -z "$SS" ] || [ ! -f "$SS" ]; then
            echo "❌ manifest_nonfc_ss.xml not found."
            exit 1
          fi

          cp "$DSDS" \
            "$VINTF_DIR/manifest_nonfc_dsds.xml"

          cp "$SS" \
            "$VINTF_DIR/manifest_nonfc_ss.xml"

          echo "✅ ODM VINTF manifests restored"


      - name: "🧩 Add VINTF make rules"
        shell: bash
        run: |
          set -euo pipefail

          MK="$WORK_PARENT/vendor/xiaomi/spinel/spinel-vendor.mk"

          if [ ! -f "$MK" ]; then
            echo "❌ spinel-vendor.mk not found."
            exit 1
          fi

          if ! grep -q "manifest_nonfc_dsds.xml" "$MK"; then
            cat >> "$MK" <<'EOF'

# Manually restored ODM VINTF manifests.
PRODUCT_COPY_FILES += \
    vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_dsds.xml \
    vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_ss.xml
EOF
          fi

          echo "✅ VINTF make rules added"


      - name: "📡 Download official Fastboot ROM"
        if: ${{ inputs.copy_radio }}
        shell: bash
        run: |
          set -euo pipefail

          ROM_URL="${{ inputs.stock_rom_url }}"
          ROM_FILE="$GITHUB_WORKSPACE/spinel_fastboot.tgz"

          echo "============================================================"
          echo "📡 DOWNLOADING OFFICIAL SPINEL FASTBOOT ROM"
          echo "============================================================"

          rm -f "$ROM_FILE"

          aria2c \
            --allow-overwrite=true \
            --file-allocation=none \
            --max-connection-per-server=8 \
            --split=8 \
            --min-split-size=10M \
            --retry-wait=5 \
            --max-tries=5 \
            -o "spinel_fastboot.tgz" \
            "$ROM_URL"

          if [ ! -s "$ROM_FILE" ]; then
            echo "❌ ROM download failed."
            exit 1
          fi

          echo "✅ Fastboot ROM downloaded"


      - name: "📡 Extract radio images"
        if: ${{ inputs.copy_radio }}
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          ROM_FILE="$ROOT/spinel_fastboot.tgz"
          EXTRACT_DIR="$ROOT/radio_extract"
          RADIO_DIR="$ROOT/radio"

          rm -rf "$EXTRACT_DIR"
          rm -rf "$RADIO_DIR"

          mkdir -p "$EXTRACT_DIR"
          mkdir -p "$RADIO_DIR"

          echo "============================================================"
          echo "📡 EXTRACTING RADIO IMAGES"
          echo "============================================================"

          tar -xzf "$ROM_FILE" \
            -C "$EXTRACT_DIR"

          required_images=(
            "dpm.img"
            "gz.img"
            "lk.img"
            "mcupm.img"
            "md1img.img"
            "pi_img.img"
            "scp.img"
            "spmfw.img"
            "sspm.img"
            "tee.img"
          )

          for image in "${required_images[@]}"; do

            found="$(
              find "$EXTRACT_DIR" \
                -type f \
                -name "$image" \
                -print \
                -quit \
                || true
            )"

            if [ -z "$found" ]; then
              echo "❌ Missing radio image: $image"
              exit 1
            fi

            cp "$found" "$RADIO_DIR/$image"

            echo "✅ $image"

          done

          rm -f "$ROM_FILE"
          rm -rf "$EXTRACT_DIR"

          echo ""
          echo "✅ Radio extraction completed"


      - name: "🔎 Validate radio images"
        if: ${{ inputs.copy_radio }}
        shell: bash
        run: |
          set -euo pipefail

          RADIO_DIR="$GITHUB_WORKSPACE/radio"

          required_images=(
            "dpm.img"
            "gz.img"
            "lk.img"
            "mcupm.img"
            "md1img.img"
            "pi_img.img"
            "scp.img"
            "spmfw.img"
            "sspm.img"
            "tee.img"
          )

          echo "============================================================"
          echo "🔎 VALIDATING RADIO IMAGES"
          echo "============================================================"

          for image in "${required_images[@]}"; do

            file="$RADIO_DIR/$image"

            if [ ! -s "$file" ]; then
              echo "❌ Invalid radio image: $image"
              exit 1
            fi

            echo "✅ $image"

          done

          echo "✅ All radio images are valid"


      - name: "🔍 Validate generated vendor tree"
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$WORK_PARENT/vendor/xiaomi/spinel"

          echo "============================================================"
          echo "🔍 VALIDATING GENERATED VENDOR TREE"
          echo "============================================================"

          required_files=(
            "Android.bp"
            "Android.mk"
            "BoardConfigVendor.mk"
            "spinel-vendor.mk"
          )

          for file in "${required_files[@]}"; do

            if [ ! -f "$VENDOR_TREE/$file" ]; then
              echo "❌ Missing: $file"
              exit 1
            fi

            echo "✅ $file"

          done

          if [ ! -d "$VENDOR_TREE/proprietary" ]; then
            echo "❌ proprietary directory missing."
            exit 1
          fi

          echo "✅ Generated vendor tree is valid"


      - name: "📂 Flatten vendor tree to repository root"
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          VENDOR_TREE="$WORK_PARENT/vendor/xiaomi/spinel"
          DEVICE_TREE="$WORK_PARENT/device/xiaomi/spinel"

          echo "============================================================"
          echo "📂 FLATTENING TO REPOSITORY ROOT"
          echo "============================================================"

          if [ ! -d "$VENDOR_TREE" ]; then
            echo "❌ Vendor tree does not exist."
            exit 1
          fi

          if [ ! -d "$VENDOR_TREE/proprietary" ]; then
            echo "❌ Vendor proprietary directory does not exist."
            exit 1
          fi

          # Copy generated vendor tree contents to repository root.
          rsync -a \
            "$VENDOR_TREE/" \
            "$ROOT/"

          # Copy the proprietary list.
          cp \
            "$DEVICE_TREE/proprietary-files.txt" \
            "$ROOT/proprietary-files.txt"

          # Copy extraction script.
          cp \
            "$DEVICE_TREE/extract-files.py" \
            "$ROOT/extract-files.py"

          chmod +x "$ROOT/extract-files.py"

          # Generate setup-makefiles.py ourselves.
          # The current extract-utils branch does not guarantee that
          # this file is generated automatically.

          cat > "$ROOT/setup-makefiles.py" <<'PY'
#!/usr/bin/env python3

from extract_utils.main import (
    ExtractUtils,
    ExtractUtilsModule,
)

module = ExtractUtilsModule(
    "spinel",
    "xiaomi",
    check_elf=True,
    add_firmware_proprietary_file=False,
)

utils = ExtractUtils.device(module)
utils.run()
PY

          chmod +x "$ROOT/setup-makefiles.py"

          echo "✅ setup-makefiles.py generated"

          # The final repository MUST NOT contain this nested path.
          rm -rf "$ROOT/vendor/xiaomi/spinel"

          # Remove temporary directories.
          rm -rf "$ROOT/$STAGING_ROOT"
          rm -rf "$ROOT/$EXTRACT_UTILS_DIR"

          echo ""
          echo "============================================================"
          echo "📂 FINAL ROOT CONTENT"
          echo "============================================================"

          find "$ROOT" \
            -maxdepth 2 \
            -print \
            | sort


      - name: "✅ Final repository validation"
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"

          echo "============================================================"
          echo "✅ FINAL REPOSITORY VALIDATION"
          echo "============================================================"

          required_files=(
            "Android.bp"
            "Android.mk"
            "BoardConfigVendor.mk"
            "spinel-vendor.mk"
            "proprietary-files.txt"
            "extract-files.py"
            "setup-makefiles.py"
          )

          for file in "${required_files[@]}"; do

            if [ ! -f "$ROOT/$file" ]; then
              echo "❌ Missing root file: $file"
              exit 1
            fi

            echo "✅ $file"

          done

          if [ ! -d "$ROOT/proprietary" ]; then
            echo "❌ proprietary/ directory missing."
            exit 1
          fi

          echo "✅ proprietary/"

          if [ "${{ inputs.copy_radio }}" = "true" ]; then

            if [ ! -d "$ROOT/radio" ]; then
              echo "❌ radio/ directory missing."
              exit 1
            fi

            radio_count="$(
              find "$ROOT/radio" \
                -maxdepth 1 \
                -type f \
                -name "*.img" \
                | wc -l
            )"

            echo "Radio image count: $radio_count"

            if [ "$radio_count" -ne 10 ]; then
              echo "❌ Expected exactly 10 radio images."
              exit 1
            fi

            echo "✅ radio/"

          fi

          if [ -d "$ROOT/vendor/xiaomi/spinel" ]; then
            echo "❌ Nested vendor/xiaomi/spinel exists."
            exit 1
          fi

          echo "✅ No nested vendor/xiaomi/spinel"


          IWPRIV_COUNT="$(
            grep -E \
              '^[[:space:]]*vendor/bin/iwpriv([[:space:]]|$)' \
              "$ROOT/proprietary-files.txt" \
              | wc -l \
              || true
          )"

          if [ "$IWPRIV_COUNT" -ne 1 ]; then
            echo "❌ vendor/bin/iwpriv count = $IWPRIV_COUNT"
            exit 1
          fi

          echo "✅ vendor/bin/iwpriv"


          BAD_IWPRIV_COUNT="$(
            grep -E \
              '^[[:space:]]*bin/iwpriv([[:space:]]|$)' \
              "$ROOT/proprietary-files.txt" \
              | wc -l \
              || true
          )"

          if [ "$BAD_IWPRIV_COUNT" -ne 0 ]; then
            echo "❌ bin/iwpriv still exists."
            exit 1
          fi

          echo "✅ bin/iwpriv removed"


          if grep -q \
            "manifest_nonfc_dsds.xml" \
            "$ROOT/proprietary-files.txt"; then

            echo "❌ manifest_nonfc_dsds.xml still exists in proprietary-files.txt"
            exit 1

          fi

          if grep -q \
            "manifest_nonfc_ss.xml" \
            "$ROOT/proprietary-files.txt"; then

            echo "❌ manifest_nonfc_ss.xml still exists in proprietary-files.txt"
            exit 1

          fi

          echo "✅ Unsupported VINTF entries removed from proprietary-files.txt"


          VINTF_DIR="$ROOT/proprietary/odm/etc/vintf"

          if [ ! -s "$VINTF_DIR/manifest_nonfc_dsds.xml" ]; then
            echo "❌ manifest_nonfc_dsds.xml missing."
            exit 1
          fi

          if [ ! -s "$VINTF_DIR/manifest_nonfc_ss.xml" ]; then
            echo "❌ manifest_nonfc_ss.xml missing."
            exit 1
          fi

          echo "✅ ODM VINTF manifests"


          if ! grep -q \
            "manifest_nonfc_dsds.xml" \
            "$ROOT/spinel-vendor.mk"; then

            echo "❌ dsds VINTF make rule missing."
            exit 1

          fi

          if ! grep -q \
            "manifest_nonfc_ss.xml" \
            "$ROOT/spinel-vendor.mk"; then

            echo "❌ ss VINTF make rule missing."
            exit 1

          fi

          echo "✅ VINTF make rules"


          echo ""
          echo "============================================================"
          echo "🎉 FINAL VALIDATION PASSED"
          echo "============================================================"


      - name: "📊 Build report"
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"

          echo ""
          echo "============================================================"
          echo "🧬 MKVenomPro • LINEAGEOS VENDOR TREE"
          echo "============================================================"

          echo ""
          echo "Device       : $DEVICE"
          echo "Vendor       : $VENDOR"
          echo "Branch       : lineage-23.2"
          echo "Stock dump   : ${{ inputs.stock_dump_branch }}"
          echo "Extract util : ${{ inputs.extract_utils_branch }}"
          echo "Radio        : ${{ inputs.copy_radio }}"

          echo ""
          echo "Repository size:"
          du -sh "$ROOT"

          echo ""
          echo "Proprietary size:"
          du -sh "$ROOT/proprietary"

          if [ -d "$ROOT/radio" ]; then
            echo ""
            echo "Radio size:"
            du -sh "$ROOT/radio"
          fi

          echo ""
          echo "Root files:"
          ls -lh \
            "$ROOT/Android.bp" \
            "$ROOT/Android.mk" \
            "$ROOT/BoardConfigVendor.mk" \
            "$ROOT/spinel-vendor.mk" \
            "$ROOT/proprietary-files.txt" \
            "$ROOT/extract-files.py" \
            "$ROOT/setup-makefiles.py"


      - name: "📋 Git status"
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "📋 GIT STATUS"
          echo "============================================================"

          git status --short


      - name: "🚀 Commit and push changes"
        if: ${{ inputs.push_changes }}
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit."
            exit 0
          fi

          git commit \
            -m "vendor: generate proprietary blobs for spinel"

          git push


      - name: "📦 Upload vendor tree artifact"
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: "proprietary_vendor_xiaomi_spinel"
          path: |
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
            proprietary-files.txt
            extract-files.py
            setup-makefiles.py
            proprietary/
            radio/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7


      - name: "🎉 Success"
        shell: bash
        run: |
          echo ""
          echo "============================================================"
          echo "🎉 BUILD COMPLETED SUCCESSFULLY"
          echo "============================================================"
          echo ""
          echo "Final repository:"
          echo ""
          echo "Android.bp"
          echo "Android.mk"
          echo "BoardConfigVendor.mk"
          echo "spinel-vendor.mk"
          echo "proprietary-files.txt"
          echo "extract-files.py"
          echo "setup-makefiles.py"
          echo "proprietary/"
          echo "radio/"
          echo ""
          echo "🧬 MKVenomPro • spinel"

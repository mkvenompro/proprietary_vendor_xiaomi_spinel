name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:
    inputs:
      STOCK_FASTBOOT_URL:
        description: "Optional direct URL to spinel Fastboot ROM (.tgz). Used to recover missing raw firmware/radio images."
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  DEVICE: spinel
  BRAND: xiaomi

  DEVICE_PATH: device/xiaomi/spinel
  VENDOR_PATH: vendor/xiaomi/spinel

  STOCK_REPO: https://gitlab.com/mkpromvp/dumber-2-mk.git
  STOCK_BRANCH: dump-redmi-spinel-os2.0.212.0.vpgmixm

  EXTRACT_UTILS_REPO: https://github.com/LineageOS/android_tools_extract-utils.git
  EXTRACT_UTILS_BRANCH: lineage-23.2

  RADIO_DIR: radio

jobs:
  build-vendor:
    name: 🧬 Generate Vendor Tree
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: 📥 Checkout vendor repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: 🧰 Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            file \
            rsync \
            unzip \
            tar \
            gzip \
            bzip2 \
            xz-utils \
            lz4 \
            cpio \
            zip \
            jq

          python3 -m pip install --break-system-packages \
            protobuf \
            pycryptodome

      # ============================================================
      # CLONE STOCK DUMP
      # ============================================================
      - name: 📦 Clone stock dump
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${STOCK_BRANCH}" \
            "${STOCK_REPO}" \
            stock_dump

          echo
          echo "===== STOCK DUMP ROOT ====="

          find stock_dump \
            -maxdepth 2 \
            -type d \
            | sort

      # ============================================================
      # CLONE EXTRACT-UTILS
      # ============================================================
      - name: 🧩 Clone Lineage extract-utils
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "${EXTRACT_UTILS_BRANCH}" \
            "${EXTRACT_UTILS_REPO}" \
            extract-utils

          python3 - <<'PY'
          import sys

          sys.path.insert(0, "extract-utils")

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print("extract-utils import: PASS")
          PY

      # ============================================================
      # PREPARE
      # ============================================================
      - name: 📁 Prepare workspace
        run: |
          set -euxo pipefail

          rm -rf \
            generated_root \
            reports \
            "${DEVICE_PATH}" \
            "${VENDOR_PATH}" \
            fastboot_rom \
            fastboot_rom_extract

          mkdir -p \
            generated_root \
            reports \
            reports/radio \
            reports/vintf \
            reports/inventory \
            reports/fastboot

      # ============================================================
      # OPTIONAL FASTBOOT ROM
      #
      # The user can provide:
      #
      # STOCK_FASTBOOT_URL
      #
      # The URL must point to the actual spinel Fastboot ROM.
      #
      # We NEVER use Tanzanite firmware as fallback.
      # ============================================================
      - name: 📥 Download optional spinel Fastboot ROM
        if: ${{ inputs.STOCK_FASTBOOT_URL != '' }}
        shell: bash
        run: |
          set -euxo pipefail

          URL="${{ inputs.STOCK_FASTBOOT_URL }}"

          echo "===== FASTBOOT ROM URL ====="
          echo "$URL"

          mkdir -p fastboot_rom

          echo
          echo "===== DOWNLOADING FASTBOOT ROM ====="

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 3600 \
            --output fastboot_rom/stock.tgz \
            "$URL"

          echo
          echo "===== DOWNLOAD SIZE ====="

          ls -lh fastboot_rom/stock.tgz

          test -s fastboot_rom/stock.tgz

          file fastboot_rom/stock.tgz \
            | tee reports/fastboot/file.txt

      # ============================================================
      # EXTRACT FASTBOOT ROM
      # ============================================================
      - name: 📦 Extract optional Fastboot ROM
        if: ${{ inputs.STOCK_FASTBOOT_URL != '' }}
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p fastboot_rom_extract

          echo "===== EXTRACTING TGZ ====="

          tar \
            -xzf fastboot_rom/stock.tgz \
            -C fastboot_rom_extract

          echo
          echo "===== FASTBOOT ROM CONTENT ====="

          find fastboot_rom_extract \
            -maxdepth 4 \
            -type f \
            | sort \
            | tee reports/fastboot/files.txt

          echo
          echo "===== FASTBOOT ROM DIRECTORIES ====="

          find fastboot_rom_extract \
            -maxdepth 3 \
            -type d \
            | sort \
            | tee reports/fastboot/directories.txt

      # ============================================================
      # VERIFY FASTBOOT ROM IS ACTUALLY SPINEL
      # ============================================================
      - name: 🔐 Inspect Fastboot ROM identity
        if: ${{ inputs.STOCK_FASTBOOT_URL != '' }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== FASTBOOT ROM IDENTITY CHECK ====="

          {
            find fastboot_rom_extract \
              -type f \
              \( \
                -name '*.xml' \
                -o -name '*.txt' \
                -o -name '*.json' \
                -o -name '*.prop' \
              \) \
              -print0
          } > reports/fastboot/metadata_files.bin

          : > reports/fastboot/identity.txt

          while IFS= read -r -d '' file; do

            grep -Eai \
              'spinel|2510DRA23E|mt6789|VPGMIXM|Redmi Note 15' \
              "$file" \
              >> reports/fastboot/identity.txt \
              || true

          done < reports/fastboot/metadata_files.bin

          echo "===== MATCHES ====="

          cat reports/fastboot/identity.txt || true

          echo
          echo "NOTE:"
          echo "The ROM must be the spinel ROM."
          echo "No firmware from another device will be copied."

      # ============================================================
      # DISCOVER RADIO IMAGES
      #
      # First:
      #   current stock dump
      #
      # Then:
      #   optional Fastboot ROM
      #
      # The Fastboot ROM has priority ONLY for missing files.
      # ============================================================
      - name: 📻 Discover raw radio firmware
        shell: bash
        run: |
          set -euxo pipefail

          cat > reports/radio/expected.txt <<'EOF'
          dpm.img
          gz.img
          lk.img
          mcupm.img
          md1img.img
          pi_img.img
          preloader_raw.img
          scp.img
          spmfw.img
          sspm.img
          tee.img
          EOF

          : > reports/radio/found.txt
          : > reports/radio/missing.txt
          : > reports/radio/locations.txt
          : > reports/radio/source.txt

          echo "===== RADIO DISCOVERY ====="

          while IFS= read -r image; do

            found=""

            # ------------------------------------------------------
            # Search current stock dump first.
            # ------------------------------------------------------
            while IFS= read -r candidate; do
              [ -f "$candidate" ] || continue

              found="$candidate"
              break

            done < <(
              find stock_dump \
                -type f \
                -name "$image" \
                -print \
                | sort
            )

            # ------------------------------------------------------
            # If not found, search optional Fastboot ROM.
            # ------------------------------------------------------
            if [ -z "$found" ] && [ -d fastboot_rom_extract ]; then

              while IFS= read -r candidate; do
                [ -f "$candidate" ] || continue

                found="$candidate"
                break

              done < <(
                find fastboot_rom_extract \
                  -type f \
                  -name "$image" \
                  -print \
                  | sort
              )

            fi

            # ------------------------------------------------------
            # Result
            # ------------------------------------------------------
            if [ -n "$found" ]; then

              echo "$image" \
                >> reports/radio/found.txt

              echo "$image -> $found" \
                >> reports/radio/locations.txt

              if [[ "$found" == fastboot_rom_extract/* ]]; then
                echo "$image -> fastboot_rom" \
                  >> reports/radio/source.txt
              else
                echo "$image -> stock_dump" \
                  >> reports/radio/source.txt
              fi

              echo "FOUND  $image"
              echo "       $found"

            else

              echo "$image" \
                >> reports/radio/missing.txt

              echo "MISS   $image"

            fi

          done < reports/radio/expected.txt

          echo
          echo "===== RADIO SUMMARY ====="

          found_count=$(wc -l < reports/radio/found.txt)
          missing_count=$(wc -l < reports/radio/missing.txt)

          echo "Found   : $found_count"
          echo "Missing : $missing_count"

          echo
          echo "===== LOCATIONS ====="

          cat reports/radio/locations.txt || true

          echo
          echo "===== SOURCES ====="

          cat reports/radio/source.txt || true

      # ============================================================
      # COPY RADIO IMAGES
      # ============================================================
      - name: 📻 Import discovered radio images
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf generated_root/radio

          found_count=$(wc -l < reports/radio/found.txt)

          if [ "$found_count" -eq 0 ]; then
            echo "No raw radio images found."
            echo "radio/ will NOT be created."
            exit 0
          fi

          mkdir -p generated_root/radio

          while IFS= read -r line; do

            [ -n "$line" ] || continue

            image="$line"

            location=""

            while IFS= read -r location_line; do

              name="${location_line%% -> *}"
              path="${location_line#* -> }"

              if [ "$name" = "$image" ]; then
                location="$path"
                break
              fi

            done < reports/radio/locations.txt

            if [ -z "$location" ]; then
              echo "ERROR: Could not resolve location for $image"
              exit 1
            fi

            echo "Copying:"
            echo "  $image"
            echo "  from: $location"

            cp \
              "$location" \
              "generated_root/radio/$image"

          done < reports/radio/found.txt

          echo
          echo "===== RADIO DIRECTORY ====="

          ls -lh generated_root/radio

      # ============================================================
      # RADIO README
      # ============================================================
      - name: 📝 Generate radio README
        run: |
          set -euxo pipefail

          if [ -d generated_root/radio ]; then

            cat > generated_root/radio/README.md <<'EOF'
          # spinel Radio / Firmware

          These firmware partition images were extracted from the
          spinel stock firmware supplied to the vendor-tree build.

          No firmware from another device is used.

          In particular, Tanzanite firmware must not be substituted
          for spinel firmware even though both devices use MediaTek
          MT6789.

          Expected raw firmware partitions:

          - dpm
          - gz
          - lk
          - mcupm
          - md1img
          - pi_img
          - preloader_raw
          - scp
          - spmfw
          - sspm
          - tee
          EOF

          fi

      # ============================================================
      # INVENTORY STOCK PARTITIONS
      # ============================================================
      - name: 🔎 Inventory stock partitions
        run: |
          set -euxo pipefail

          {
            echo "===== STOCK PARTITION DIRECTORIES ====="

            find stock_dump \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort

            echo
            echo "===== IMPORTANT COUNTS ====="

            printf "vendor files      : "
            find stock_dump/vendor \
              -type f \
              2>/dev/null \
              | wc -l || true

            printf "vendor_dlkm files : "
            find stock_dump/vendor_dlkm \
              -type f \
              2>/dev/null \
              | wc -l || true

            printf "odm_dlkm files    : "
            find stock_dump/odm_dlkm \
              -type f \
              2>/dev/null \
              | wc -l || true

            printf "system files      : "
            find stock_dump/system \
              -type f \
              2>/dev/null \
              | wc -l || true

            printf "system_ext files  : "
            find stock_dump/system_ext \
              -type f \
              2>/dev/null \
              | wc -l || true

            printf "product files     : "
            find stock_dump/product \
              -type f \
              2>/dev/null \
              | wc -l || true

            printf "mi_ext files      : "
            find stock_dump/mi_ext \
              -type f \
              2>/dev/null \
              | wc -l || true

          } | tee reports/inventory/stock.txt

      # ============================================================
      # LOCATE PROPRIETARY FILES
      # ============================================================
      - name: 📜 Locate proprietary-files.txt
        run: |
          set -euxo pipefail

          SOURCE_LIST=""

          for candidate in \
            stock_dump/proprietary-files.txt \
            stock_dump/extracted/proprietary-files.txt \
            stock_dump/device/xiaomi/spinel/proprietary-files.txt
          do

            if [ -f "$candidate" ]; then
              SOURCE_LIST="$candidate"
              break
            fi

          done

          if [ -z "$SOURCE_LIST" ]; then
            echo "ERROR: proprietary-files.txt not found."

            find stock_dump \
              -type f \
              -name 'proprietary-files.txt' \
              -print

            exit 1
          fi

          echo "Using:"
          echo "$SOURCE_LIST"

          cp \
            "$SOURCE_LIST" \
            reports/proprietary-files.original.txt

          mkdir -p "${DEVICE_PATH}"

          cp \
            "$SOURCE_LIST" \
            "${DEVICE_PATH}/proprietary-files.txt"

      # ============================================================
      # NORMALIZE PROPRIETARY LIST
      # ============================================================
      - name: 🧹 Normalize proprietary list
        shell: bash
        run: |
          set -euxo pipefail

          INPUT="${DEVICE_PATH}/proprietary-files.txt"
          OUTPUT="${DEVICE_PATH}/proprietary-files.clean.txt"

          rm -f "$OUTPUT"

          removed_system=0
          removed_system_ext=0
          removed_product=0
          removed_dlkm=0
          removed_mi_ext=0
          removed_vintf=0
          removed_missing=0
          fixed_iwpriv=0

          : > reports/vintf/manual-vintf.txt
          : > reports/normalization.txt

          while IFS= read -r raw || [ -n "$raw" ]; do

            line="$raw"

            if [ -z "$line" ]; then
              echo "$line" >> "$OUTPUT"
              continue
            fi

            case "$line" in
              \#*)
                echo "$line" >> "$OUTPUT"
                continue
                ;;
            esac

            source="${line%%:*}"

            # ------------------------------------------------------
            # Remove system
            # ------------------------------------------------------
            case "$source" in
              system/*|-system/*)
                removed_system=$((removed_system + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # Remove system_ext
            # ------------------------------------------------------
            case "$source" in
              system_ext/*|-system_ext/*)
                removed_system_ext=$((removed_system_ext + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # Remove product
            # ------------------------------------------------------
            case "$source" in
              product/*|-product/*)
                removed_product=$((removed_product + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # Remove DLKM from normal extract-utils processing
            # ------------------------------------------------------
            case "$source" in
              vendor_dlkm/*|-vendor_dlkm/*|odm_dlkm/*|-odm_dlkm/*)
                removed_dlkm=$((removed_dlkm + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # Remove mi_ext
            # ------------------------------------------------------
            case "$source" in
              mi_ext/*|-mi_ext/*)
                removed_mi_ext=$((removed_mi_ext + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # MANUAL VINTF #1
            # ------------------------------------------------------
            if [ "$source" = "vendor/odm/etc/vintf/manifest_nonfc_dsds.xml" ]; then

              if [ -f "stock_dump/$source" ]; then

                mkdir -p \
                  generated_root/proprietary/odm/etc/vintf

                cp \
                  "stock_dump/$source" \
                  generated_root/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml

                echo "$source" \
                  >> reports/vintf/manual-vintf.txt

                removed_vintf=$((removed_vintf + 1))
              fi

              continue
            fi

            # ------------------------------------------------------
            # MANUAL VINTF #2
            # ------------------------------------------------------
            if [ "$source" = "vendor/odm/etc/vintf/manifest_nonfc_ss.xml" ]; then

              if [ -f "stock_dump/$source" ]; then

                mkdir -p \
                  generated_root/proprietary/odm/etc/vintf

                cp \
                  "stock_dump/$source" \
                  generated_root/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml

                echo "$source" \
                  >> reports/vintf/manual-vintf.txt

                removed_vintf=$((removed_vintf + 1))
              fi

              continue
            fi

            # ------------------------------------------------------
            # Fix iwpriv
            # ------------------------------------------------------
            if [ "$source" = "bin/iwpriv" ] ||
               [ "$source" = "-bin/iwpriv" ]; then

              IWPRIV=""

              IWPRIV=$(find stock_dump \
                -type f \
                -name iwpriv \
                -print \
                | sort \
                | head -n 1 || true)

              if [ -n "$IWPRIV" ]; then

                REL="${IWPRIV#stock_dump/}"

                echo "$REL" >> "$OUTPUT"

                echo "Fixed iwpriv -> $REL" \
                  >> reports/normalization.txt

                fixed_iwpriv=$((fixed_iwpriv + 1))

              else

                removed_missing=$((removed_missing + 1))

              fi

              continue
            fi

            # ------------------------------------------------------
            # Normalize leading "-"
            # ------------------------------------------------------
            if [[ "$source" == -* ]]; then

              source="${source#-}"

              if [[ "$line" == *:* ]]; then
                destination="${line#*:}"
                line="${source}:${destination}"
              else
                line="$source"
              fi

            fi

            # ------------------------------------------------------
            # Validate source
            # ------------------------------------------------------
            clean_source="${line%%:*}"

            if [ ! -f "stock_dump/$clean_source" ]; then

              echo "MISSING: $clean_source" \
                >> reports/normalization.txt

              removed_missing=$((removed_missing + 1))
              continue

            fi

            echo "$line" >> "$OUTPUT"

          done < "$INPUT"

          mv "$OUTPUT" "$INPUT"

          {
            echo
            echo "===== NORMALIZATION SUMMARY ====="
            echo "Removed system       : $removed_system"
            echo "Removed system_ext   : $removed_system_ext"
            echo "Removed product      : $removed_product"
            echo "Removed DLKM         : $removed_dlkm"
            echo "Removed mi_ext       : $removed_mi_ext"
            echo "Manual VINTF         : $removed_vintf"
            echo "Missing              : $removed_missing"
            echo "Fixed iwpriv         : $fixed_iwpriv"
          } | tee -a reports/normalization.txt

      # ============================================================
      # VALIDATE
      # ============================================================
      - name: ✅ Validate proprietary list
        shell: bash
        run: |
          set -euxo pipefail

          LIST="${DEVICE_PATH}/proprietary-files.txt"

          total=0
          missing=0
          forbidden=0
          leading_dash=0

          : > reports/validation-missing.txt
          : > reports/validation-forbidden.txt
          : > reports/validation-leading-dash.txt

          while IFS= read -r line || [ -n "$line" ]; do

            [ -n "$line" ] || continue

            case "$line" in
              \#*)
                continue
                ;;
            esac

            source="${line%%:*}"

            total=$((total + 1))

            case "$source" in
              system/*|system_ext/*|product/*|vendor_dlkm/*|odm_dlkm/*|mi_ext/*)
                echo "$source" \
                  >> reports/validation-forbidden.txt

                forbidden=$((forbidden + 1))
                ;;
            esac

            case "$source" in
              -*)
                echo "$source" \
                  >> reports/validation-leading-dash.txt

                leading_dash=$((leading_dash + 1))
                ;;
            esac

            if [ ! -f "stock_dump/$source" ]; then

              echo "$source" \
                >> reports/validation-missing.txt

              missing=$((missing + 1))

            fi

          done < "$LIST"

          echo
          echo "===== VALIDATION SUMMARY ====="
          echo "Entries     : $total"
          echo "Missing     : $missing"
          echo "Forbidden   : $forbidden"
          echo "Leading '-' : $leading_dash"

          if [ "$missing" -ne 0 ]; then
            echo
            echo "ERROR: Missing proprietary files:"
            cat reports/validation-missing.txt
            exit 1
          fi

          if [ "$forbidden" -ne 0 ]; then
            echo
            echo "ERROR: Forbidden entries:"
            cat reports/validation-forbidden.txt
            exit 1
          fi

          if [ "$leading_dash" -ne 0 ]; then
            echo
            echo "ERROR: Leading '-' entries:"
            cat reports/validation-leading-dash.txt
            exit 1
          fi

          echo "Validation: PASS"

      # ============================================================
      # GENERATE EXTRACT-FILES.PY
      # ============================================================
      - name: 🐍 Generate extract-files.py
        run: |
          set -euxo pipefail

          cat > "${DEVICE_PATH}/extract-files.py" <<'PY'
          #!/usr/bin/env python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          DEVICE = "spinel"
          VENDOR = "xiaomi"

          module = ExtractUtilsModule(
              DEVICE,
              VENDOR,
              check_elf=True,
              add_firmware_proprietary_file=False,
          )

          utils = ExtractUtils(
              module=module,
              source_root="stock_dump",
              device_path="device/xiaomi/spinel",
              vendor_path="vendor/xiaomi/spinel",
          )

          utils.run()
          PY

          chmod +x "${DEVICE_PATH}/extract-files.py"

      # ============================================================
      # GENERATE SETUP-MAKEFILES.PY
      # ============================================================
      - name: 🐍 Generate setup-makefiles.py
        run: |
          set -euxo pipefail

          cat > "${DEVICE_PATH}/setup-makefiles.py" <<'PY'
          #!/usr/bin/env python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          DEVICE = "spinel"
          VENDOR = "xiaomi"

          module = ExtractUtilsModule(
              DEVICE,
              VENDOR,
              check_elf=True,
              add_firmware_proprietary_file=False,
          )

          utils = ExtractUtils(
              module=module,
              source_root="stock_dump",
              device_path="device/xiaomi/spinel",
              vendor_path="vendor/xiaomi/spinel",
          )

          utils.run()
          PY

          chmod +x "${DEVICE_PATH}/setup-makefiles.py"

      # ============================================================
      # EXTRACT BLOBS
      # ============================================================
      - name: 🧬 Extract proprietary blobs
        run: |
          set -euxo pipefail

          echo "===== RUNNING EXTRACT-UTILS ====="

          python3 \
            "${DEVICE_PATH}/extract-files.py" \
            --kang

      # ============================================================
      # VERIFY GENERATED VENDOR TREE
      # ============================================================
      - name: 🔍 Verify generated vendor tree
        run: |
          set -euxo pipefail

          if [ ! -d vendor/xiaomi/spinel ]; then
            echo "ERROR: vendor/xiaomi/spinel was not generated."
            exit 1
          fi

          echo "Generated vendor tree:"
          find vendor/xiaomi/spinel \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -n 200

      # ============================================================
      # COPY GENERATED TREE INTO ROOT
      # ============================================================
      - name: 📦 Flatten vendor tree into repository root
        run: |
          set -euxo pipefail

          GENERATED="vendor/xiaomi/spinel"

          rm -rf generated_root/extracted_vendor
          mkdir -p generated_root/extracted_vendor

          rsync -a \
            "$GENERATED/" \
            generated_root/extracted_vendor/

          # Add manually recovered VINTF files.
          if [ -d generated_root/proprietary ]; then

            rsync -a \
              generated_root/proprietary/ \
              generated_root/extracted_vendor/proprietary/

          fi

          # Add radio if found.
          if [ -d generated_root/radio ]; then

            rsync -a \
              generated_root/radio/ \
              generated_root/extracted_vendor/radio/

          fi

          # Remove generated nested vendor tree.
          rm -rf vendor

          # Remove old generated content from repository root,
          # preserving repository metadata and workflow.
          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "stock_dump" \
            ! -name "extract-utils" \
            ! -name "device" \
            ! -name "reports" \
            ! -name "generated_root" \
            ! -name "fastboot_rom" \
            ! -name "fastboot_rom_extract" \
            -exec rm -rf {} +

          # Copy vendor package directly to repo root.
          rsync -a \
            generated_root/extracted_vendor/ \
            ./

          echo
          echo "===== FINAL ROOT ====="

          find . \
            -maxdepth 2 \
            -type f \
            ! -path "./.git/*" \
            | sort

      # ============================================================
      # MANUAL VINTF RESTORE
      # ============================================================
      - name: 🧩 Restore manual VINTF
        run: |
          set -euxo pipefail

          mkdir -p proprietary/odm/etc/vintf

          if [ -f generated_root/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml ]; then

            cp \
              generated_root/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml \
              proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml

          fi

          if [ -f generated_root/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml ]; then

            cp \
              generated_root/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml \
              proprietary/odm/etc/vintf/manifest_nonfc_ss.xml

          fi

          echo "===== VINTF ====="

          find proprietary/odm/etc/vintf \
            -type f \
            | sort || true

      # ============================================================
      # GENERATE BOARD CONFIG
      # ============================================================
      - name: 🧱 Generate BoardConfigVendor.mk
        shell: bash
        run: |
          set -euxo pipefail

          cat > BoardConfigVendor.mk <<'EOF'
          #
          # Copyright (C) 2026 The LineageOS Project
          #
          # SPDX-License-Identifier: Apache-2.0
          #

          # Xiaomi spinel proprietary vendor configuration.

          EOF

          if [ -d radio ]; then

            cat >> BoardConfigVendor.mk <<'EOF'

          # Raw MediaTek firmware partitions recovered from the
          # spinel stock Fastboot firmware.

          AB_OTA_PARTITIONS += \
              dpm \
              gz \
              lk \
              mcupm \
              md1img \
              pi_img \
              preloader_raw \
              scp \
              spmfw \
              sspm \
              tee
          EOF

          else

            cat >> BoardConfigVendor.mk <<'EOF'

          # Raw MediaTek firmware partitions are not included because
          # the available spinel stock dump did not contain the raw
          # partition images.

          # Expected when available:
          #
          # dpm
          # gz
          # lk
          # mcupm
          # md1img
          # pi_img
          # preloader_raw
          # scp
          # spmfw
          # sspm
          # tee
          EOF

          fi

      # ============================================================
      # NORMALIZE VENDOR MAKEFILE
      # ============================================================
      - name: 🧩 Normalize spinel-vendor.mk
        shell: bash
        run: |
          set -euxo pipefail

          MK=""

          if [ -f spinel-vendor.mk ]; then
            MK="spinel-vendor.mk"

          elif [ -f "${DEVICE}-vendor.mk" ]; then
            MK="${DEVICE}-vendor.mk"

          else

            MK=$(find . \
              -maxdepth 1 \
              -type f \
              -name '*-vendor.mk' \
              -print \
              | sort \
              | head -n 1 || true)

          fi

          if [ -z "$MK" ]; then
            echo "ERROR: vendor makefile not generated."
            exit 1
          fi

          if [ "$MK" != "spinel-vendor.mk" ]; then

            cp "$MK" spinel-vendor.mk

            MK="spinel-vendor.mk"

          fi

          # --------------------------------------------------------
          # Manual VINTF
          # --------------------------------------------------------
          cat >> "$MK" <<'EOF'

          # Manually restored ODM VINTF manifests.
          PRODUCT_COPY_FILES += \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_dsds.xml \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_ss.xml
          EOF

          # --------------------------------------------------------
          # Radio firmware
          # --------------------------------------------------------
          if [ -d radio ]; then

            cat >> "$MK" <<'EOF'

          # Raw spinel firmware partitions.
          PRODUCT_COPY_FILES += \
              vendor/xiaomi/spinel/radio/dpm.img:dpm \
              vendor/xiaomi/spinel/radio/gz.img:gz \
              vendor/xiaomi/spinel/radio/lk.img:lk \
              vendor/xiaomi/spinel/radio/mcupm.img:mcupm \
              vendor/xiaomi/spinel/radio/md1img.img:md1img \
              vendor/xiaomi/spinel/radio/pi_img.img:pi_img \
              vendor/xiaomi/spinel/radio/preloader_raw.img:preloader_raw \
              vendor/xiaomi/spinel/radio/scp.img:scp \
              vendor/xiaomi/spinel/radio/spmfw.img:spmfw \
              vendor/xiaomi/spinel/radio/sspm.img:sspm \
              vendor/xiaomi/spinel/radio/tee.img:tee
          EOF

          fi

      # ============================================================
      # FINAL REQUIRED FILES
      # ============================================================
      - name: 🔍 Verify final repository layout
        run: |
          set -euxo pipefail

          echo "===== REQUIRED ROOT FILES ====="

          for file in \
            Android.bp \
            Android.mk \
            BoardConfigVendor.mk \
            spinel-vendor.mk \
            proprietary-files.txt \
            extract-files.py \
            setup-makefiles.py
          do

            if [ ! -f "$file" ]; then
              echo "ERROR: Missing $file"
              exit 1
            fi

            echo "PASS: $file"

          done

          echo
          echo "===== REQUIRED DIRECTORIES ====="

          [ -d proprietary/vendor ] || {
            echo "ERROR: proprietary/vendor missing"
            exit 1
          }

          [ -d proprietary/odm ] || {
            echo "ERROR: proprietary/odm missing"
            exit 1
          }

          echo "PASS: proprietary/vendor"
          echo "PASS: proprietary/odm"

          echo
          echo "===== NESTED VENDOR CHECK ====="

          if [ -d vendor/xiaomi/spinel ]; then
            echo "ERROR: vendor/xiaomi/spinel still exists."
            exit 1
          fi

          echo "PASS: nested vendor/xiaomi/spinel absent."

      # ============================================================
      # VERIFY VINTF
      # ============================================================
      - name: 🧪 Verify VINTF
        run: |
          set -euxo pipefail

          for file in \
            proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml \
            proprietary/odm/etc/vintf/manifest_nonfc_ss.xml
          do

            if [ ! -f "$file" ]; then
              echo "ERROR: Missing $file"
              exit 1
            fi

            echo "PASS: $file"

          done

      # ============================================================
      # VERIFY RADIO
      #
      # If radio/ exists, ALL 11 must exist.
      # ============================================================
      - name: 🧪 Verify radio directory
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d radio ]; then

            echo "No radio directory."
            echo "This is allowed because the supplied firmware"
            echo "did not contain the raw partition images."

            exit 0

          fi

          echo "===== RADIO FILES ====="

          for file in \
            dpm.img \
            gz.img \
            lk.img \
            mcupm.img \
            md1img.img \
            pi_img.img \
            preloader_raw.img \
            scp.img \
            spmfw.img \
            sspm.img \
            tee.img
          do

            if [ ! -f "radio/$file" ]; then
              echo "ERROR: radio/$file missing."
              exit 1
            fi

            echo "PASS: radio/$file"

          done

      # ============================================================
      # CONTAMINATION CHECK
      # ============================================================
      - name: 🧹 Check repository contamination
        run: |
          set -euxo pipefail

          echo "===== CONTAMINATION CHECK ====="

          if find . \
            -path "./.git" -prune -o \
            -path "./.github" -prune -o \
            -type f \
            \( \
              -path "./system/*" \
              -o -path "./system_ext/*" \
              -o -path "./product/*" \
            \) \
            -print \
            | grep -q .
          then

            echo "ERROR: system/system_ext/product contamination found."
            exit 1

          fi

          if [ -d vendor/xiaomi/spinel ]; then
            echo "ERROR: nested vendor tree found."
            exit 1
          fi

          echo "PASS"

      # ============================================================
      # FINAL INVENTORY
      # ============================================================
      - name: 📊 Generate final inventory
        run: |
          set -euxo pipefail

          {
            echo "===== FINAL VENDOR TREE ====="
            echo

            echo "Root:"
            pwd

            echo
            echo "Total tracked candidate files:"
            find . \
              -type f \
              ! -path "./.git/*" \
              ! -path "./stock_dump/*" \
              ! -path "./extract-utils/*" \
              | wc -l

            echo
            echo "Vendor proprietary:"
            find proprietary/vendor \
              -type f \
              | wc -l

            echo
            echo "ODM proprietary:"
            find proprietary/odm \
              -type f \
              | wc -l

            echo
            echo "Radio:"
            if [ -d radio ]; then
              find radio \
                -type f \
                | sort
            else
              echo "NOT PRESENT"
            fi

            echo
            echo "Nested vendor/xiaomi/spinel:"
            if [ -d vendor/xiaomi/spinel ]; then
              echo "PRESENT - ERROR"
            else
              echo "ABSENT"
            fi

          } | tee reports/inventory/final.txt

      # ============================================================
      # BUILD REPORT
      # ============================================================
      - name: 📝 Generate build report
        run: |
          set -euxo pipefail

          found_count=$(wc -l < reports/radio/found.txt)
          missing_count=$(wc -l < reports/radio/missing.txt)

          {
            echo "========================================"
            echo " spinel LineageOS Vendor Tree"
            echo "========================================"
            echo
            echo "Device       : spinel"
            echo "Brand        : xiaomi"
            echo "Android base : HyperOS 2 / Android 15"
            echo "Kernel base  : 5.10"
            echo
            echo "Stock branch : ${STOCK_BRANCH}"
            echo
            echo "Fastboot URL :"
            if [ -n "${{ inputs.STOCK_FASTBOOT_URL }}" ]; then
              echo "PROVIDED"
            else
              echo "NOT PROVIDED"
            fi

            echo
            echo "========================================"
            echo " Radio"
            echo "========================================"
            echo
            echo "Found   : $found_count"
            echo "Missing : $missing_count"

            echo
            echo "Sources:"
            cat reports/radio/source.txt || true

            echo
            echo "========================================"
            echo " VINTF"
            echo "========================================"
            echo

            cat reports/vintf/manual-vintf.txt || true

            echo
            echo "========================================"
            echo " Final layout"
            echo "========================================"
            echo
            echo "Android.bp"
            echo "Android.mk"
            echo "BoardConfigVendor.mk"
            echo "spinel-vendor.mk"
            echo "proprietary-files.txt"
            echo "extract-files.py"
            echo "setup-makefiles.py"
            echo "proprietary/vendor/"
            echo "proprietary/odm/"

            if [ -d radio ]; then
              echo "radio/"
            else
              echo "radio/ NOT PRESENT"
            fi

            echo
            echo "Nested vendor/xiaomi/spinel: ABSENT"

          } | tee reports/BUILD_REPORT.txt

      # ============================================================
      # CLEAN TEMPORARY DATA
      # ============================================================
      - name: 🧽 Clean temporary build data
        run: |
          set -euxo pipefail

          rm -rf \
            stock_dump \
            extract-utils \
            device \
            vendor \
            generated_root \
            fastboot_rom \
            fastboot_rom_extract

      # ============================================================
      # GIT STATUS
      # ============================================================
      - name: 📋 Show Git status
        run: |
          set -euxo pipefail

          git status --short

          echo
          echo "===== FINAL ROOT ====="

          find . \
            -maxdepth 2 \
            -type f \
            ! -path "./.git/*" \
            | sort

      # ============================================================
      # COMMIT
      # ============================================================
      - name: 🚀 Commit generated vendor tree
        run: |
          set -euxo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "vendor: xiaomi: spinel: generate LineageOS vendor tree"

          git push

      # ============================================================
      # ARTIFACT REPORTS
      # ============================================================
      - name: 📦 Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree-reports
          path: reports/
          if-no-files-found: warn

      # ============================================================
      # ARTIFACT VENDOR TREE
      # ============================================================
      - name: 📦 Upload vendor tree
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree
          path: |
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
            proprietary-files.txt
            extract-files.py
            setup-makefiles.py
            proprietary/
            radio/
          if-no-files-found: warn

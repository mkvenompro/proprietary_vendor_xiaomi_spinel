name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:
    inputs:
      STOCK_FASTBOOT_URL:
        description: "Optional direct URL to the spinel Global Fastboot ROM (.tgz)"
        required: false
        type: string
        default: "https://bigota.d.miui.com/OS2.0.212.0.VPGMIXM/spinel_global_images_OS2.0.212.0.VPGMIXM_20260311.0000.00_15.0_global_1e7d24d317.tgz"

      STOCK_DUMP_URL:
        description: "Stock dump repository"
        required: true
        type: string
        default: "https://gitlab.com/mkpromvp/dumber-2-mk.git"

      STOCK_DUMP_BRANCH:
        description: "Stock dump branch"
        required: true
        type: string
        default: "dump-redmi-spinel-os2.0.212.0.vpgmixm"

      EXTRACT_UTILS_URL:
        description: "LineageOS extract-utils repository"
        required: true
        type: string
        default: "https://github.com/LineageOS/android_tools_extract-utils.git"

      EXTRACT_UTILS_BRANCH:
        description: "extract-utils branch"
        required: true
        type: string
        default: "lineage-23.2"

      UPLOAD_ARTIFACTS:
        description: "Upload generated vendor tree and reports"
        required: true
        type: boolean
        default: true

      COMMIT_CHANGES:
        description: "Commit generated vendor tree to repository"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-vendor:
    name: 🧬 Generate Vendor Tree
    runs-on: ubuntu-24.04

    env:
      DEVICE: spinel
      VENDOR: xiaomi
      DEVICE_PATH: device/xiaomi/spinel
      VENDOR_PATH: vendor/xiaomi/spinel

      STOCK_DUMP_URL: ${{ inputs.STOCK_DUMP_URL }}
      STOCK_DUMP_BRANCH: ${{ inputs.STOCK_DUMP_BRANCH }}

      EXTRACT_UTILS_URL: ${{ inputs.EXTRACT_UTILS_URL }}
      EXTRACT_UTILS_BRANCH: ${{ inputs.EXTRACT_UTILS_BRANCH }}

      STOCK_FASTBOOT_URL: ${{ inputs.STOCK_FASTBOOT_URL }}

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ============================================================
      # 2. Install dependencies
      # ============================================================
      - name: 🧰 Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            rsync \
            curl \
            wget \
            unzip \
            p7zip-full \
            tar \
            gzip \
            xz-utils \
            file \
            findutils \
            grep \
            sed \
            gawk \
            coreutils

          python3 --version
          git --version
          curl --version
          rsync --version | head -n 1

      # ============================================================
      # 3. Clone stock dump
      # ============================================================
      - name: 📦 Clone stock dump
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf stock_dump

          git clone \
            --depth 1 \
            --branch "$STOCK_DUMP_BRANCH" \
            "$STOCK_DUMP_URL" \
            stock_dump

          echo
          echo "===== STOCK DUMP ====="
          du -sh stock_dump || true

          find stock_dump \
            -maxdepth 2 \
            -type d \
            -print \
            | sort \
            | head -n 100

      # ============================================================
      # 4. Clone extract-utils
      # ============================================================
      - name: 🧬 Clone LineageOS extract-utils
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf extract-utils

          git clone \
            --depth 1 \
            --branch "$EXTRACT_UTILS_BRANCH" \
            "$EXTRACT_UTILS_URL" \
            extract-utils

          echo
          echo "===== EXTRACT-UTILS ====="

          git -C extract-utils rev-parse HEAD

          find extract-utils \
            -maxdepth 2 \
            -type d \
            -print \
            | sort \
            | head -n 100

      # ============================================================
      # 5. IMPORTANT:
      #    Make extract_utils importable from EVERY subsequent step
      # ============================================================
      - name: 🐍 Configure Python PYTHONPATH
        shell: bash
        run: |
          set -euxo pipefail

          EXTRACT_UTILS_ROOT="$GITHUB_WORKSPACE/extract-utils"

          echo "EXTRACT_UTILS_ROOT=$EXTRACT_UTILS_ROOT" >> "$GITHUB_ENV"

          if [ -d "$EXTRACT_UTILS_ROOT" ]; then
            echo "PYTHONPATH=$EXTRACT_UTILS_ROOT${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          else
            echo "ERROR: extract-utils directory does not exist"
            exit 1
          fi

          export PYTHONPATH="$EXTRACT_UTILS_ROOT${PYTHONPATH:+:$PYTHONPATH}"

          echo
          echo "===== PYTHON ====="
          python3 --version

          echo
          echo "===== PYTHONPATH ====="
          echo "$PYTHONPATH"

          echo
          echo "===== TESTING extract_utils IMPORT ====="

          python3 - <<'PY'
          import sys

          print("Python executable:")
          print(sys.executable)

          print()
          print("sys.path:")
          for item in sys.path:
              print(item)

          print()
          print("Import test:")

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print("ExtractUtils:", ExtractUtils)
          print("ExtractUtilsModule:", ExtractUtilsModule)
          print("IMPORT OK")
          PY

      # ============================================================
      # 6. Inspect stock dump
      # ============================================================
      - name: 🔎 Inspect stock dump
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== STOCK DUMP IDENTITY ====="

          if [ -f stock_dump/metadata ]; then
            cat stock_dump/metadata
          fi

          if [ -f stock_dump/metadata.txt ]; then
            cat stock_dump/metadata.txt
          fi

          echo
          echo "===== PARTITIONS ====="

          find stock_dump \
            -mindepth 1 \
            -maxdepth 2 \
            -type d \
            -printf '%p\n' \
            | sort \
            | head -n 200

      # ============================================================
      # 7. Download optional Fastboot ROM
      #
      # NOTE:
      # This is NOT required for normal vendor extraction.
      # It is only used to look for raw firmware/radio images.
      # ============================================================
      - name: 📡 Download optional Fastboot ROM
        if: ${{ env.STOCK_FASTBOOT_URL != '' }}
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p fastboot_rom

          URL="$STOCK_FASTBOOT_URL"

          echo "===== FASTBOOT ROM URL ====="
          echo "$URL"

          echo
          echo "===== DOWNLOADING FASTBOOT ROM ====="

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 7200 \
            --continue-at - \
            --output fastboot_rom/stock.tgz \
            "$URL"

          echo
          echo "===== DOWNLOADED FILE ====="

          ls -lh fastboot_rom/stock.tgz
          file fastboot_rom/stock.tgz

          echo
          echo "===== SHA256 ====="

          sha256sum fastboot_rom/stock.tgz

      # ============================================================
      # 8. Extract Fastboot ROM
      # ============================================================
      - name: 📦 Extract Fastboot ROM
        if: ${{ env.STOCK_FASTBOOT_URL != '' }}
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf fastboot_rom/extracted
          mkdir -p fastboot_rom/extracted

          if [ ! -s fastboot_rom/stock.tgz ]; then
            echo "Fastboot ROM was not downloaded."
            exit 1
          fi

          echo "===== EXTRACTING FASTBOOT ROM ====="

          tar \
            -xzf fastboot_rom/stock.tgz \
            -C fastboot_rom/extracted

          echo
          echo "===== FASTBOOT ROM CONTENT ====="

          find fastboot_rom/extracted \
            -maxdepth 4 \
            -type f \
            -printf '%p\n' \
            | sort \
            | head -n 300

      # ============================================================
      # 9. Verify Fastboot ROM identity
      # ============================================================
      - name: 🆔 Verify Fastboot ROM identity
        if: ${{ env.STOCK_FASTBOOT_URL != '' }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== FASTBOOT ROM IDENTITY CHECK ====="

          MATCHES=0

          if grep -Raiq \
            -E 'spinel|VPGMIXM|OS2\.0\.212\.0\.VPGMIXM' \
            fastboot_rom/extracted \
            2>/dev/null; then

            MATCHES=1
          fi

          if [ "$MATCHES" -eq 1 ]; then
            echo "PASS: Fastboot ROM contains spinel/OS2.0.212.0.VPGMIXM identifiers."
          else
            echo "WARNING: Could not positively identify spinel in extracted Fastboot ROM."
            echo "Radio extraction will therefore NOT be trusted automatically."
          fi

      # ============================================================
      # 10. Discover raw MediaTek firmware/radio images
      #
      # We DO NOT copy Tanzanite firmware.
      # Only spinel's own ROM may provide these files.
      # ============================================================
      - name: 📡 Discover spinel firmware/radio images
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports
          mkdir -p generated_root/radio

          RADIO_NAMES=(
            dpm.img
            gz.img
            lk.img
            mcupm.img
            md1img.img
            pi_img.img
            preloader_raw.img
            scp.img
            spmfw.img
            sspm.img
            tee.img
          )

          : > reports/radio-discovery.txt

          echo "===== SPINEL RADIO DISCOVERY =====" | tee -a reports/radio-discovery.txt

          FOUND=0
          MISSING=0

          for name in "${RADIO_NAMES[@]}"; do

            FOUND_PATH=""

            if [ -d stock_dump ]; then
              FOUND_PATH="$(
                find stock_dump \
                  -type f \
                  -name "$name" \
                  -print \
                  -quit \
                  2>/dev/null || true
              )"
            fi

            if [ -z "$FOUND_PATH" ] && [ -d fastboot_rom/extracted ]; then
              FOUND_PATH="$(
                find fastboot_rom/extracted \
                  -type f \
                  -name "$name" \
                  -print \
                  -quit \
                  2>/dev/null || true
              )"
            fi

            if [ -n "$FOUND_PATH" ]; then

              echo "FOUND: $name -> $FOUND_PATH" \
                | tee -a reports/radio-discovery.txt

              cp -f \
                "$FOUND_PATH" \
                "generated_root/radio/$name"

              FOUND=$((FOUND + 1))

            else

              echo "MISSING: $name" \
                | tee -a reports/radio-discovery.txt

              MISSING=$((MISSING + 1))

            fi
          done

          echo | tee -a reports/radio-discovery.txt

          echo "FOUND=$FOUND" \
            | tee -a reports/radio-discovery.txt

          echo "MISSING=$MISSING" \
            | tee -a reports/radio-discovery.txt

          echo
          echo "===== RADIO RESULT ====="

          if [ "$FOUND" -gt 0 ]; then
            ls -lh generated_root/radio
          else
            echo "No raw radio images found."
            echo "This is NOT an error."
          fi

      # ============================================================
      # 11. Analyze proprietary-files.txt
      # ============================================================
      - name: 📋 Normalize proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p device/xiaomi/spinel
          mkdir -p reports

          RAW_LIST="stock_dump/proprietary-files.txt"
          NORMALIZED="device/xiaomi/spinel/proprietary-files.txt"

          if [ ! -f "$RAW_LIST" ]; then
            echo "ERROR: $RAW_LIST does not exist."
            exit 1
          fi

          cp -f "$RAW_LIST" "$NORMALIZED"

          echo "===== ORIGINAL LIST ====="

          wc -l "$NORMALIZED"

          # --------------------------------------------------------
          # Remove known unsupported/system-side entries.
          # --------------------------------------------------------

          sed -i \
            -E \
            '/^[[:space:]]*-/d' \
            "$NORMALIZED"

          sed -i \
            -E \
            '/^(system|system_ext|product)\//d' \
            "$NORMALIZED"

          sed -i \
            -E \
            '/^-?(system|system_ext|product)\//d' \
            "$NORMALIZED"

          sed -i \
            -E \
            '/^vendor_dlkm\//d' \
            "$NORMALIZED"

          sed -i \
            -E \
            '/^-?vendor_dlkm\//d' \
            "$NORMALIZED"

          sed -i \
            -E \
            '/^odm_dlkm\//d' \
            "$NORMALIZED"

          sed -i \
            -E \
            '/^-?odm_dlkm\//d' \
            "$NORMALIZED"

          sed -i \
            -E \
            '/^-?mi_ext\//d' \
            "$NORMALIZED"

          # --------------------------------------------------------
          # Remove the two extract-utils VINTF entries that caused
          # write_product_packages() assertion on Lineage 23.2.
          # They will be restored manually later.
          # --------------------------------------------------------

          {
            echo "vendor/odm/etc/vintf/manifest_nonfc_dsds.xml"
            echo "vendor/odm/etc/vintf/manifest_nonfc_ss.xml"
          } > reports/manual-vintf.txt

          sed -i \
            -E \
            '/^-?vendor\/odm\/etc\/vintf\/manifest_nonfc_dsds\.xml$/d' \
            "$NORMALIZED"

          sed -i \
            -E \
            '/^-?vendor\/odm\/etc\/vintf\/manifest_nonfc_ss\.xml$/d' \
            "$NORMALIZED"

          # --------------------------------------------------------
          # Fix malformed iwpriv entry.
          # --------------------------------------------------------

          if grep -qx 'bin/iwpriv' "$NORMALIZED"; then
            sed -i '/^bin\/iwpriv$/d' "$NORMALIZED"
          fi

          IWPRIV_PATH="$(
            find stock_dump \
              -type f \
              -name 'iwpriv' \
              -print \
              -quit \
              2>/dev/null || true
          )"

          if [ -n "$IWPRIV_PATH" ]; then
            echo "Resolved iwpriv:"
            echo "$IWPRIV_PATH"

            REL="${IWPRIV_PATH#stock_dump/}"

            if [[ "$REL" == vendor/* ]]; then
              echo "$REL" >> "$NORMALIZED"
            elif [[ "$REL" == odm/* ]]; then
              echo "$REL" >> "$NORMALIZED"
            fi
          fi

          # --------------------------------------------------------
          # Clean whitespace/comments/duplicates.
          # --------------------------------------------------------

          sed -i \
            -E \
            's/[[:space:]]+$//' \
            "$NORMALIZED"

          sed -i \
            '/^[[:space:]]*$/d' \
            "$NORMALIZED"

          sort -u "$NORMALIZED" -o "$NORMALIZED"

          echo
          echo "===== NORMALIZED LIST ====="

          wc -l "$NORMALIZED"

          echo
          echo "First entries:"
          head -n 30 "$NORMALIZED"

      # ============================================================
      # 12. Validate proprietary-files.txt against stock dump
      # ============================================================
      - name: ✅ Validate proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          LIST="device/xiaomi/spinel/proprietary-files.txt"

          mkdir -p reports

          MISSING_FILE="reports/missing-files.txt"
          INVALID_FILE="reports/invalid-partitions.txt"

          : > "$MISSING_FILE"
          : > "$INVALID_FILE"

          COUNT=0
          MISSING=0
          INVALID=0

          while IFS= read -r entry; do

            [ -z "$entry" ] && continue

            COUNT=$((COUNT + 1))

            SRC="${entry%%:*}"

            # Remove optional source modifiers.
            SRC="${SRC#-}"

            case "$SRC" in
              vendor/*|odm/*|recovery/*)
                ;;
              *)
                echo "$SRC" >> "$INVALID_FILE"
                INVALID=$((INVALID + 1))
                continue
                ;;
            esac

            if [ ! -f "stock_dump/$SRC" ]; then

              echo "$SRC" >> "$MISSING_FILE"
              MISSING=$((MISSING + 1))

            fi

          done < "$LIST"

          sort -u "$MISSING_FILE" -o "$MISSING_FILE"
          sort -u "$INVALID_FILE" -o "$INVALID_FILE"

          echo "===== VALIDATION ====="

          echo "Entries : $COUNT"
          echo "Missing : $MISSING"
          echo "Invalid : $INVALID"

          if [ "$MISSING" -ne 0 ]; then
            echo
            echo "Missing files:"
            cat "$MISSING_FILE"
            exit 1
          fi

          if [ "$INVALID" -ne 0 ]; then
            echo
            echo "Invalid partitions:"
            cat "$INVALID_FILE"
            exit 1
          fi

          echo
          echo "VALIDATION PASS"

      # ============================================================
      # 13. Generate extract-files.py
      # ============================================================
      - name: 📝 Generate extract-files.py
        shell: bash
        run: |
          set -euxo pipefail

          cat > device/xiaomi/spinel/extract-files.py <<'PY'
          #!/usr/bin/env python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )


          def main():
              module = ExtractUtilsModule(
                  "spinel",
                  "xiaomi",
                  check_elf=True,
                  add_firmware_proprietary_file=False,
              )

              utils = ExtractUtils(module)

              utils.run()


          if __name__ == "__main__":
              main()
          PY

          chmod +x device/xiaomi/spinel/extract-files.py

          echo "===== extract-files.py ====="
          cat device/xiaomi/spinel/extract-files.py

      # ============================================================
      # 14. Generate setup-makefiles.py
      # ============================================================
      - name: 📝 Generate setup-makefiles.py
        shell: bash
        run: |
          set -euxo pipefail

          cat > device/xiaomi/spinel/setup-makefiles.py <<'PY'
          #!/usr/bin/env python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )


          def main():
              module = ExtractUtilsModule(
                  "spinel",
                  "xiaomi",
                  check_elf=True,
                  add_firmware_proprietary_file=False,
              )

              utils = ExtractUtils(module)

              utils.run()


          if __name__ == "__main__":
              main()
          PY

          chmod +x device/xiaomi/spinel/setup-makefiles.py

          echo "===== setup-makefiles.py ====="
          cat device/xiaomi/spinel/setup-makefiles.py

      # ============================================================
      # 15. FINAL IMPORT TEST
      #
      # This specifically prevents Run #18's failure.
      # ============================================================
      - name: 🐍 FINAL extract-utils import test
        shell: bash
        run: |
          set -euxo pipefail

          export PYTHONPATH="$EXTRACT_UTILS_ROOT${PYTHONPATH:+:$PYTHONPATH}"

          echo "===== FINAL IMPORT TEST ====="
          echo "EXTRACT_UTILS_ROOT=$EXTRACT_UTILS_ROOT"
          echo "PYTHONPATH=$PYTHONPATH"

          python3 - <<'PY'
          import sys

          print("sys.path:")
          for path in sys.path:
              print("  ", path)

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print()
          print("ExtractUtils import: OK")
          print("ExtractUtilsModule import: OK")
          PY

      # ============================================================
      # 16. Run extract-files.py
      # ============================================================
      - name: 🧬 Run extract-utils
        shell: bash
        run: |
          set -euxo pipefail

          export PYTHONPATH="$EXTRACT_UTILS_ROOT${PYTHONPATH:+:$PYTHONPATH}"

          echo "===== RUNNING EXTRACT-UTILS ====="

          python3 \
            device/xiaomi/spinel/extract-files.py \
            --kang

      # ============================================================
      # 17. Inspect generated tree
      # ============================================================
      - name: 🔎 Inspect generated vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== GENERATED VENDOR TREE ====="

          if [ -d "$VENDOR_PATH" ]; then

            find "$VENDOR_PATH" \
              -maxdepth 4 \
              -type f \
              -printf '%p\n' \
              | sort \
              | head -n 300

            echo
            echo "Generated size:"
            du -sh "$VENDOR_PATH"

          else

            echo "ERROR: $VENDOR_PATH was not generated."
            exit 1

          fi

      # ============================================================
      # 18. Restore manually handled VINTF manifests
      # ============================================================
      - name: 🧩 Restore ODM VINTF manifests
        shell: bash
        run: |
          set -euxo pipefail

          SRC_ROOT="stock_dump/vendor/odm/etc/vintf"
          DST_ROOT="$VENDOR_PATH/proprietary/odm/etc/vintf"

          mkdir -p "$DST_ROOT"

          for FILE in \
            manifest_nonfc_dsds.xml \
            manifest_nonfc_ss.xml
          do

            if [ -f "$SRC_ROOT/$FILE" ]; then

              cp -f \
                "$SRC_ROOT/$FILE" \
                "$DST_ROOT/$FILE"

              echo "Restored: $FILE"

            else

              echo "WARNING: Missing stock VINTF file: $FILE"

            fi

          done

      # ============================================================
      # 19. Copy radio directory if any raw images were found
      # ============================================================
      - name: 📡 Add discovered radio images
        shell: bash
        run: |
          set -euxo pipefail

          if [ -d generated_root/radio ] && \
             find generated_root/radio -type f -print -quit | grep -q .; then

            mkdir -p "$VENDOR_PATH/radio"

            rsync -a \
              generated_root/radio/ \
              "$VENDOR_PATH/radio/"

            echo "Radio files copied:"
            find "$VENDOR_PATH/radio" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort

          else

            echo "No radio images found."
            echo "No radio directory will be added."

          fi

      # ============================================================
      # 20. Generate BoardConfigVendor.mk
      # ============================================================
      - name: 🧩 Generate BoardConfigVendor.mk
        shell: bash
        run: |
          set -euxo pipefail

          cat > "$VENDOR_PATH/BoardConfigVendor.mk" <<'EOF'
          # SPDX-License-Identifier: Apache-2.0

          # ============================================================
          # Xiaomi spinel vendor configuration
          # ============================================================

          # Generated from stock:
          # OS2.0.212.0.VPGMIXM
          # Android 15
          # MT6789
          # Redmi Note 15 4G / spinel

          TARGET_COPY_OUT_VENDOR := vendor
          TARGET_COPY_OUT_ODM := vendor/odm

          # ============================================================
          # Raw firmware images
          #
          # These are included only if discovered from spinel's own
          # Fastboot ROM.
          #
          # DO NOT replace these with another device's firmware.
          # ============================================================

          EOF

          if [ -d "$VENDOR_PATH/radio" ] && \
             find "$VENDOR_PATH/radio" -type f -print -quit | grep -q .; then

            echo "# Discovered spinel firmware images:" \
              >> "$VENDOR_PATH/BoardConfigVendor.mk"

            find "$VENDOR_PATH/radio" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort \
              | while IFS= read -r name; do
                  echo "#   $name" \
                    >> "$VENDOR_PATH/BoardConfigVendor.mk"
                done

          else

            cat >> "$VENDOR_PATH/BoardConfigVendor.mk" <<'EOF'

          # No raw firmware images were present in the supplied stock
          # dump/Fastboot ROM.
          EOF

          fi

      # ============================================================
      # 21. Normalize generated vendor makefile
      # ============================================================
      - name: 🧩 Normalize vendor makefile
        shell: bash
        run: |
          set -euxo pipefail

          MAKEFILE=""

          if [ -f "$VENDOR_PATH/${DEVICE}-vendor.mk" ]; then
            MAKEFILE="$VENDOR_PATH/${DEVICE}-vendor.mk"
          elif [ -f "$VENDOR_PATH/spinel-vendor.mk" ]; then
            MAKEFILE="$VENDOR_PATH/spinel-vendor.mk"
          else
            MAKEFILE="$(
              find "$VENDOR_PATH" \
                -maxdepth 1 \
                -type f \
                -name '*-vendor.mk' \
                -print \
                -quit
            )"
          fi

          if [ -z "$MAKEFILE" ]; then
            echo "ERROR: No generated vendor makefile found."
            exit 1
          fi

          echo "Vendor makefile:"
          echo "$MAKEFILE"

          # Ensure the expected VINTF copies are present.
          if [ -f "$VENDOR_PATH/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml" ] &&
             [ -f "$VENDOR_PATH/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml" ]; then

            cat >> "$MAKEFILE" <<'EOF'

          # Manually restored ODM VINTF manifests.
          PRODUCT_COPY_FILES += \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_dsds.xml \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_ss.xml
          EOF

          fi

          echo
          echo "===== VENDOR MAKEFILE ====="
          cat "$MAKEFILE"

      # ============================================================
      # 22. Flatten generated tree into repository ROOT
      #
      # Final repository must NOT contain:
      # vendor/xiaomi/spinel/
      #
      # The repository itself IS vendor/xiaomi/spinel.
      # ============================================================
      - name: 📁 Flatten vendor tree into repository root
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d "$VENDOR_PATH" ]; then
            echo "ERROR: Generated vendor path does not exist."
            exit 1
          fi

          rm -rf generated_root/final_vendor
          mkdir -p generated_root/final_vendor

          rsync -a \
            "$VENDOR_PATH/" \
            generated_root/final_vendor/

          echo "===== GENERATED ROOT SNAPSHOT ====="

          find generated_root/final_vendor \
            -maxdepth 3 \
            -print \
            | sort \
            | head -n 300

          # ----------------------------------------------------------
          # Preserve repository files that are not generated vendor
          # files, then copy generated tree over them.
          # ----------------------------------------------------------

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            generated_root/final_vendor/ \
            ./

          # ----------------------------------------------------------
          # Remove generated nested vendor path if extract-utils
          # created it inside the repository.
          # ----------------------------------------------------------

          rm -rf vendor/xiaomi/spinel

          # Remove empty parent directories when possible.
          rmdir vendor/xiaomi 2>/dev/null || true
          rmdir vendor 2>/dev/null || true

      # ============================================================
      # 23. Verify final repository layout
      # ============================================================
      - name: 🔍 Verify final repository layout
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== ROOT ====="

          ls -la

          echo
          echo "===== EXPECTED FILES ====="

          for FILE in \
            Android.bp \
            Android.mk \
            BoardConfigVendor.mk \
            proprietary-files.txt \
            extract-files.py \
            setup-makefiles.py
          do

            if [ -f "$FILE" ]; then
              echo "OK: $FILE"
            else
              echo "WARNING: $FILE not found"
            fi

          done

          echo
          echo "===== PROPRIETARY DIRECTORIES ====="

          find proprietary \
            -maxdepth 3 \
            -type d \
            -print \
            2>/dev/null \
            | sort \
            | head -n 100

          echo
          echo "===== NESTED PATH CHECK ====="

          if [ -d vendor/xiaomi/spinel ]; then
            echo "ERROR: Nested vendor/xiaomi/spinel still exists."
            exit 1
          fi

          echo "PASS: vendor/xiaomi/spinel is absent."

      # ============================================================
      # 24. Verify contamination
      # ============================================================
      - name: 🧹 Verify no system/product contamination
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== CONTAMINATION CHECK ====="

          BAD=0

          for DIR in \
            system \
            system_ext \
            product \
            vendor_dlkm \
            odm_dlkm \
            mi_ext
          do

            if [ -d "proprietary/$DIR" ]; then
              echo "ERROR: proprietary/$DIR exists"
              BAD=1
            fi

          done

          if find proprietary \
            -type f \
            \( \
              -path '*/system/*' \
              -o -path '*/system_ext/*' \
              -o -path '*/product/*' \
              -o -path '*/vendor_dlkm/*' \
              -o -path '*/odm_dlkm/*' \
            \) \
            -print \
            | grep -q .; then

            echo "ERROR: forbidden partition content detected."
            BAD=1

          fi

          if [ "$BAD" -ne 0 ]; then
            exit 1
          fi

          echo "PASS: No forbidden partition contamination."

      # ============================================================
      # 25. Final vendor statistics
      # ============================================================
      - name: 📊 Generate final reports
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          echo "===== FINAL STATISTICS =====" \
            > reports/final-summary.txt

          echo >> reports/final-summary.txt

          echo "Repository:" \
            >> reports/final-summary.txt

          echo "$GITHUB_REPOSITORY" \
            >> reports/final-summary.txt

          echo >> reports/final-summary.txt

          echo "Commit:" \
            >> reports/final-summary.txt

          git rev-parse HEAD \
            >> reports/final-summary.txt

          echo >> reports/final-summary.txt

          echo "Vendor tree size:" \
            >> reports/final-summary.txt

          du -sh proprietary 2>/dev/null \
            >> reports/final-summary.txt || true

          echo >> reports/final-summary.txt

          echo "Proprietary file count:" \
            >> reports/final-summary.txt

          find proprietary \
            -type f \
            2>/dev/null \
            | wc -l \
            >> reports/final-summary.txt

          echo >> reports/final-summary.txt

          echo "Root files:" \
            >> reports/final-summary.txt

          find . \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort \
            >> reports/final-summary.txt

          echo
          cat reports/final-summary.txt

      # ============================================================
      # 26. Show git diff
      # ============================================================
      - name: 📝 Show git diff
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== GIT STATUS ====="

          git status --short

          echo
          echo "===== CHANGED FILES ====="

          git status --short \
            | head -n 300

      # ============================================================
      # 27. Commit generated tree
      # ============================================================
      - name: 🚀 Commit generated vendor tree
        if: ${{ inputs.COMMIT_CHANGES }}
        shell: bash
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "spinel: update proprietary vendor blobs"

          git push

      # ============================================================
      # 28. Upload artifacts
      # ============================================================
      - name: 📦 Upload generated vendor tree
        if: ${{ always() && inputs.UPLOAD_ARTIFACTS }}
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree
          path: |
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            proprietary-files.txt
            extract-files.py
            setup-makefiles.py
            spinel-vendor.mk
            proprietary/
            radio/
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 29. Upload reports
      # ============================================================
      - name: 📋 Upload reports
        if: ${{ always() && inputs.UPLOAD_ARTIFACTS }}
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 7

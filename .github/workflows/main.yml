name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVICE: spinel
  VENDOR: xiaomi
  STOCK_DUMP_REPO: https://gitlab.com/mkpromvp/dumber-2-mk.git
  STOCK_DUMP_BRANCH: dump-redmi-spinel-os2.0.212.0.vpgmixm
  STOCK_DUMP_DIR: stock_dump
  EXTRACT_UTILS_REPO: https://github.com/LineageOS/android_tools_extract-utils.git
  EXTRACT_UTILS_BRANCH: lineage-23.2
  EXTRACT_UTILS_DIR: extract-utils
  STAGING_ROOT: staging_android_root

jobs:
  build-vendor:
    name: 🧬 Generate Vendor Tree
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: 🧰 Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            python3 \
            python3-pip \
            python3-venv \
            rsync \
            unzip \
            p7zip-full \
            aria2 \
            wget \
            curl \
            file \
            lz4 \
            brotli \
            zstd \
            cpio \
            gzip \
            xz-utils \
            tar \
            bc \
            libssl-dev \
            libxml2-utils \
            jq

          git lfs install

      # ============================================================
      # GIT NETWORK CONFIG
      # ============================================================
      - name: 🌐 Configure Git
        shell: bash
        run: |
          set -euxo pipefail

          git config --global user.name "MKVenomPro"
          git config --global user.email "mkvenompro@users.noreply.github.com"

          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0

      # ============================================================
      # CLONE STOCK DUMP
      # ============================================================
      - name: 📦 Clone stock dump
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$STOCK_DUMP_DIR"

          export GIT_LFS_SKIP_SMUDGE=1

          for attempt in 1 2 3 4 5; do
            echo
            echo "========================================"
            echo "Stock dump clone attempt $attempt / 5"
            echo "========================================"

            rm -rf "$STOCK_DUMP_DIR"

            if git clone \
              --depth=1 \
              --single-branch \
              --branch "$STOCK_DUMP_BRANCH" \
              "$STOCK_DUMP_REPO" \
              "$STOCK_DUMP_DIR"; then
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: stock dump clone failed after 5 attempts"
              exit 1
            fi

            sleep 10
          done

          cd "$STOCK_DUMP_DIR"

          for attempt in 1 2 3 4 5; do
            echo
            echo "========================================"
            echo "Git LFS fetch attempt $attempt / 5"
            echo "========================================"

            if git lfs fetch --all; then
              git lfs checkout
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: Git LFS fetch failed"
              exit 1
            fi

            sleep 10
          done

          cd "$GITHUB_WORKSPACE"

          echo
          echo "===== STOCK DUMP ====="
          du -sh "$STOCK_DUMP_DIR" || true
          find "$STOCK_DUMP_DIR" -maxdepth 2 -type f | head -100 || true

      # ============================================================
      # LOCATE PROPRIETARY FILE LIST
      # ============================================================
      - name: 🔎 Locate proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          FOUND_LIST=""

          if [ -f "$STOCK_DUMP_DIR/proprietary-files.txt" ]; then
            FOUND_LIST="$STOCK_DUMP_DIR/proprietary-files.txt"
          else
            FOUND_LIST="$(find "$STOCK_DUMP_DIR" \
              -type f \
              -name proprietary-files.txt \
              -print -quit)"
          fi

          if [ -z "$FOUND_LIST" ]; then
            echo "ERROR: proprietary-files.txt not found"
            find "$STOCK_DUMP_DIR" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Found:"
          echo "$FOUND_LIST"

          cp "$FOUND_LIST" proprietary-files.txt

          echo
          echo "===== ORIGINAL LIST ====="
          wc -l proprietary-files.txt
          head -20 proprietary-files.txt

      # ============================================================
      # NORMALIZE PROPRIETARY FILE LIST
      # ============================================================
      - name: 🧹 Normalize proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          cp proprietary-files.txt proprietary-files.original.txt

          python3 <<'PY'
          from pathlib import Path

          src = Path("proprietary-files.txt")
          lines = src.read_text(errors="ignore").splitlines()

          blocked_prefixes = (
              "system/",
              "system_ext/",
              "product/",
              "vendor_dlkm/",
              "odm_dlkm/",
              "mi_ext/",
          )

          blocked_exact = {
              "bin/iwpriv",
              "vendor/odm/etc/vintf/manifest_nonfc_dsds.xml",
              "vendor/odm/etc/vintf/manifest_nonfc_ss.xml",
          }

          output = []
          removed = []

          for line in lines:
              stripped = line.strip()

              if not stripped:
                  output.append(line)
                  continue

              if stripped.startswith("#"):
                  output.append(line)
                  continue

              # Preserve selectors / hashes after the source path.
              source = stripped.split(":", 1)[0]
              source = source.split(";", 1)[0].strip()

              normalized = source.lstrip("-")

              should_remove = False

              for prefix in blocked_prefixes:
                  if normalized.startswith(prefix):
                      should_remove = True
                      break

              if normalized in blocked_exact:
                  should_remove = True

              if should_remove:
                  removed.append(stripped)
                  continue

              # Fix iwpriv location.
              if normalized == "bin/iwpriv":
                  output.append("vendor/bin/iwpriv")
                  continue

              output.append(line)

          src.write_text("\n".join(output) + "\n")

          Path("reports").mkdir(exist_ok=True)

          Path("reports/normalized-removals.txt").write_text(
              "\n".join(removed) + ("\n" if removed else "")
          )

          print(f"Removed entries: {len(removed)}")
          for item in removed:
              print("  -", item)
          PY

          echo
          echo "===== NORMALIZED LIST ====="
          wc -l proprietary-files.txt

          echo
          echo "===== CHECK BLOCKED PARTITIONS ====="

          if grep -E '^(system/|system_ext/|product/|vendor_dlkm/|odm_dlkm/|mi_ext/)' \
              proprietary-files.txt \
              | grep -v '^#'; then
            echo "ERROR: forbidden partition entries remain"
            exit 1
          fi

          echo "PASS"

      # ============================================================
      # VALIDATE SOURCE FILES
      # ============================================================
      - name: 🔍 Validate proprietary source files
        shell: bash
        run: |
          set -euxo pipefail

          python3 <<'PY'
          from pathlib import Path

          dump = Path("stock_dump")
          plist = Path("proprietary-files.txt")

          missing = []
          entries = 0

          for raw in plist.read_text(errors="ignore").splitlines():
              line = raw.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              source = line.split(":", 1)[0]
              source = source.split(";", 1)[0].strip()
              source = source.lstrip("-")

              if not source:
                  continue

              entries += 1

              candidate = dump / source

              if candidate.is_file():
                  continue

              # Some dump layouts contain vendor/odm under a
              # vendor/odm combined path.
              candidates = [
                  dump / source,
                  dump / "vendor" / source.removeprefix("vendor/"),
                  dump / "odm" / source.removeprefix("odm/"),
              ]

              if not any(p.is_file() for p in candidates):
                  missing.append(source)

          print(f"Validated entries: {entries}")
          print(f"Missing files: {len(missing)}")

          if missing:
              print()
              print("Missing:")
              for item in missing:
                  print(item)

              Path("reports/missing-files.txt").write_text(
                  "\n".join(missing) + "\n"
              )

              raise SystemExit(1)
          PY

          echo "Source validation PASS"

      # ============================================================
      # CLONE EXTRACT UTILS
      # ============================================================
      - name: 🛠️ Clone extract-utils
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$EXTRACT_UTILS_DIR"

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$EXTRACT_UTILS_BRANCH" \
            "$EXTRACT_UTILS_REPO" \
            "$EXTRACT_UTILS_DIR"

          echo
          echo "===== EXTRACT UTILS ====="
          git -C "$EXTRACT_UTILS_DIR" log -1 --oneline
          test -f "$EXTRACT_UTILS_DIR/extract_utils/tools.py"
          test -f "$EXTRACT_UTILS_DIR/extract_utils/main.py"

      # ============================================================
      # VERIFY EXTRACT UTILS IMPORT
      # ============================================================
      - name: 🐍 Verify extract-utils import
        shell: bash
        run: |
          set -euxo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR"

          python3 <<'PY'
          import extract_utils
          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print("extract_utils:", extract_utils.__file__)
          print("ExtractUtils:", ExtractUtils)
          print("ExtractUtilsModule:", ExtractUtilsModule)
          PY

      # ============================================================
      # PREPARE STAGING ANDROID ROOT
      # ============================================================
      - name: 🏗️ Prepare Android staging root
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$GITHUB_WORKSPACE/$STAGING_ROOT"

          rm -rf "$WORK_PARENT"

          mkdir -p \
            "$WORK_PARENT/device/xiaomi/spinel" \
            "$WORK_PARENT/tools/extract-utils"

          echo "WORK_PARENT=$WORK_PARENT"

          cp \
            "$GITHUB_WORKSPACE/proprietary-files.txt" \
            "$WORK_PARENT/device/xiaomi/spinel/proprietary-files.txt"

          # IMPORTANT:
          # Do NOT symlink extract-utils.
          # tools.py uses realpath(__file__), so a symlink would
          # resolve back into the GitHub workspace.
          cp -a \
            "$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR/." \
            "$WORK_PARENT/tools/extract-utils/"

          test -d \
            "$WORK_PARENT/device/xiaomi/spinel"

          test -f \
            "$WORK_PARENT/device/xiaomi/spinel/proprietary-files.txt"

          test -f \
            "$WORK_PARENT/tools/extract-utils/extract_utils/tools.py"

          echo
          echo "===== ANDROID ROOT ====="
          echo "$WORK_PARENT"

          echo
          echo "===== DIRECTORY STRUCTURE ====="
          find "$WORK_PARENT" -maxdepth 4 -type d -print

      # ============================================================
      # VERIFY tools.py AND ANDROID ROOT
      # ============================================================
      - name: 🧪 Verify extract-utils Android root
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$GITHUB_WORKSPACE/$STAGING_ROOT"
          TOOLS_FILE="$WORK_PARENT/tools/extract-utils/extract_utils/tools.py"

          test -f "$TOOLS_FILE"

          echo
          echo "===== tools.py ====="
          grep -n "android_root" "$TOOLS_FILE"

          echo
          echo "===== REALPATH TEST ====="

          REAL_EXTRACT_UTILS="$(realpath "$WORK_PARENT/tools/extract-utils")"
          EXPECTED_ROOT="$(realpath "$WORK_PARENT")"

          echo "extract-utils:"
          echo "$REAL_EXTRACT_UTILS"

          echo
          echo "expected Android root:"
          echo "$EXPECTED_ROOT"

          if [ "$REAL_EXTRACT_UTILS" != "$EXPECTED_ROOT/tools/extract-utils" ]; then
            echo "ERROR: extract-utils realpath is wrong"
            exit 1
          fi

          echo
          echo "===== CALCULATING ROOT EXACTLY LIKE tools.py ====="

          CALCULATED_ROOT="$(
            python3 - "$TOOLS_FILE" <<'PY'
          import os
          import sys

          tools_file = os.path.realpath(sys.argv[1])
          script_dir = os.path.dirname(tools_file)
          android_root = os.path.realpath(
              os.path.join(script_dir, "..", "..", "..")
          )

          print(android_root)
          PY
          )"

          echo "calculated root:"
          echo "$CALCULATED_ROOT"

          if [ "$CALCULATED_ROOT" != "$EXPECTED_ROOT" ]; then
            echo
            echo "ERROR: tools.py Android root mismatch"
            echo "Expected: $EXPECTED_ROOT"
            echo "Got:      $CALCULATED_ROOT"
            exit 1
          fi

          echo
          echo "ANDROID ROOT TEST PASS"

      # ============================================================
      # CREATE DEVICE EXTRACTION SCRIPT
      # ============================================================
      - name: 📝 Create extract-files.py
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$GITHUB_WORKSPACE/$STAGING_ROOT"
          DEVICE_DIR="$WORK_PARENT/device/xiaomi/spinel"

          cat > "$DEVICE_DIR/extract-files.py" <<'PY'
          #!/usr/bin/env python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )


          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=True,
              add_firmware_proprietary_file=False,
          )


          if __name__ == "__main__":
              utils = ExtractUtils.device(module)
              utils.run()
          PY

          chmod +x "$DEVICE_DIR/extract-files.py"

          cat "$DEVICE_DIR/extract-files.py"

      # ============================================================
      # EXTRACT PROPRIETARY BLOBS
      # ============================================================
      - name: 🧬 Extract proprietary blobs
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$GITHUB_WORKSPACE/$STAGING_ROOT"
          DEVICE_DIR="$WORK_PARENT/device/xiaomi/spinel"
          EXTRACT_ROOT="$WORK_PARENT/tools/extract-utils"

          cd "$WORK_PARENT"

          export PYTHONPATH="$EXTRACT_ROOT"

          echo
          echo "===== WORKING DIRECTORY ====="
          pwd

          echo
          echo "===== PYTHONPATH ====="
          echo "$PYTHONPATH"

          echo
          echo "===== EXTRACT UTILS IMPORT ====="

          python3 <<'PY'
          import os
          import extract_utils
          from extract_utils.tools import android_root

          print("extract_utils.__file__ =", extract_utils.__file__)
          print("android_root            =", android_root)
          print("expected_root           =", os.path.realpath("."))

          if os.path.realpath(android_root) != os.path.realpath("."):
              raise SystemExit(
                  "ERROR: extract_utils.tools.android_root is incorrect"
              )

          print("android_root PASS")
          PY

          echo
          echo "===== RUNNING EXTRACTION ====="

          python3 \
            "$DEVICE_DIR/extract-files.py" \
            "$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"

      # ============================================================
      # CHECK GENERATED TREE
      # ============================================================
      - name: 🔎 Inspect generated vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$GITHUB_WORKSPACE/$STAGING_ROOT"
          GENERATED="$WORK_PARENT/vendor/xiaomi/spinel"

          echo
          echo "===== GENERATED TREE ====="

          if [ ! -d "$GENERATED" ]; then
            echo "ERROR: generated vendor tree does not exist"
            find "$WORK_PARENT" -maxdepth 5 -type d -print
            exit 1
          fi

          du -sh "$GENERATED"

          echo
          echo "===== FILES ====="
          find "$GENERATED" -maxdepth 3 -type f | head -100

      # ============================================================
      # RESTORE MANUAL VINTF
      # ============================================================
      - name: 🧩 Restore manual ODM VINTF manifests
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$GITHUB_WORKSPACE/$STAGING_ROOT"
          DEST="$WORK_PARENT/vendor/xiaomi/spinel/proprietary/odm/etc/vintf"

          mkdir -p "$DEST"

          for file in \
            manifest_nonfc_dsds.xml \
            manifest_nonfc_ss.xml; do

            SRC="$STOCK_DUMP_DIR/vendor/odm/etc/vintf/$file"

            if [ ! -f "$SRC" ]; then
              SRC="$STOCK_DUMP_DIR/odm/etc/vintf/$file"
            fi

            if [ ! -f "$SRC" ]; then
              SRC="$(find "$STOCK_DUMP_DIR" \
                -type f \
                -name "$file" \
                -print -quit)"
            fi

            if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
              echo "ERROR: cannot find $file"
              exit 1
            fi

            echo "Restoring $file from:"
            echo "$SRC"

            cp "$SRC" "$DEST/$file"
          done

          echo
          echo "===== RESTORED VINTF ====="
          ls -lh "$DEST"

      # ============================================================
      # CREATE VINTF MAKE RULES
      # ============================================================
      - name: 🧾 Add manual VINTF make rules
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$GITHUB_WORKSPACE/$STAGING_ROOT"
          VENDOR_DIR="$WORK_PARENT/vendor/xiaomi/spinel"

          VENDOR_MK="$VENDOR_DIR/spinel-vendor.mk"

          test -f "$VENDOR_MK"

          cat >> "$VENDOR_MK" <<'EOF'

          # Manually restored ODM VINTF manifests.
          PRODUCT_COPY_FILES += \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_dsds.xml \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_ss.xml
          EOF

          tail -30 "$VENDOR_MK"

      # ============================================================
      # COPY RADIO FIRMWARE FROM STOCK DUMP
      # ============================================================
      - name: 📡 Copy device-specific radio firmware
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$GITHUB_WORKSPACE/$STAGING_ROOT"
          VENDOR_DIR="$WORK_PARENT/vendor/xiaomi/spinel"

          mkdir -p "$VENDOR_DIR/radio"

          RADIO_FILES=(
            dpm.img
            gz.img
            lk.img
            mcupm.img
            md1img.img
            pi_img.img
            scp.img
            spmfw.img
            sspm.img
            tee.img
          )

          FOUND=0

          for file in "${RADIO_FILES[@]}"; do
            SRC="$(find "$STOCK_DUMP_DIR" \
              -type f \
              -name "$file" \
              -print -quit)"

            if [ -n "$SRC" ] && [ -f "$SRC" ]; then
              cp "$SRC" "$VENDOR_DIR/radio/$file"
              echo "Copied: $file"
              FOUND=$((FOUND + 1))
            else
              echo "Not found in stock dump: $file"
            fi
          done

          echo
          echo "Radio files copied: $FOUND"

          ls -lh "$VENDOR_DIR/radio" || true

      # ============================================================
      # FLATTEN TREE INTO REPOSITORY ROOT
      # ============================================================
      - name: 📁 Flatten generated vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$GITHUB_WORKSPACE/$STAGING_ROOT"
          GENERATED="$WORK_PARENT/vendor/xiaomi/spinel"

          test -d "$GENERATED"

          echo
          echo "===== GENERATED CONTENT ====="
          find "$GENERATED" -maxdepth 2 -type f -print | sort | head -100

          echo
          echo "===== CLEAR OLD ROOT TREE ====="

          rm -rf \
            Android.bp \
            Android.mk \
            BoardConfigVendor.mk \
            spinel-vendor.mk \
            proprietary \
            extract-files.py \
            setup-makefiles.py

          cp -a "$GENERATED/." "$GITHUB_WORKSPACE/"

      # ============================================================
      # VERIFY FINAL REPOSITORY STRUCTURE
      # ============================================================
      - name: ✅ Verify final vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          echo
          echo "========================================"
          echo "FINAL VENDOR TREE"
          echo "========================================"

          REQUIRED=(
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
            proprietary-files.txt
          )

          for file in "${REQUIRED[@]}"; do
            if [ ! -e "$file" ]; then
              echo "ERROR: missing $file"
              exit 1
            fi

            echo "OK: $file"
          done

          test -d proprietary

          echo
          echo "===== ROOT ====="
          find . -maxdepth 2 -type f \
            ! -path './.git/*' \
            ! -path './stock_dump/*' \
            ! -path './extract-utils/*' \
            ! -path "./$STAGING_ROOT/*" \
            | sort | head -200

          echo
          echo "===== CHECK FOR NESTED VENDOR TREE ====="

          if [ -d "vendor/xiaomi/spinel" ]; then
            echo "ERROR: nested vendor/xiaomi/spinel still exists"
            exit 1
          fi

          echo "PASS: no nested vendor/xiaomi/spinel"

          echo
          echo "===== CHECK FOR FORBIDDEN PARTITION ENTRIES ====="

          if grep -E '^(system/|system_ext/|product/|vendor_dlkm/|odm_dlkm/|mi_ext/)' \
              proprietary-files.txt \
              | grep -v '^#'; then
            echo "ERROR: forbidden partition entries remain"
            exit 1
          fi

          echo "PASS"

          echo
          echo "===== CHECK MANUAL VINTF ====="

          test -f \
            proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml

          test -f \
            proprietary/odm/etc/vintf/manifest_nonfc_ss.xml

          echo "VINTF PASS"

          echo
          echo "===== CHECK RADIO ====="

          if [ -d radio ]; then
            find radio -type f -maxdepth 1 -print | sort
          fi

          echo
          echo "===== FINAL SIZE ====="
          du -sh .

      # ============================================================
      # REMOVE BUILD CONTAMINATION
      # ============================================================
      - name: 🧹 Cleanup build-only directories
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf \
            "$STOCK_DUMP_DIR" \
            "$EXTRACT_UTILS_DIR" \
            "$STAGING_ROOT"

          rm -f proprietary-files.original.txt

          echo
          echo "Cleanup complete."

      # ============================================================
      # GIT STATUS
      # ============================================================
      - name: 📊 Git status
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          git status --short

          echo
          echo "===== FILE COUNT ====="
          find . \
            -type f \
            ! -path './.git/*' \
            | wc -l

      # ============================================================
      # COMMIT
      # ============================================================
      - name: 💾 Commit vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "spinel: regenerate LineageOS vendor tree"

      # ============================================================
      # PUSH
      # ============================================================
      - name: 🚀 Push vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          git push origin HEAD:lineage-23.2

      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: 📦 Package vendor tree
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          mkdir -p artifact

          tar \
            --exclude='.git' \
            --exclude='artifact' \
            -czf \
            "artifact/proprietary_vendor_xiaomi_spinel.tar.gz" \
            .

          ls -lh artifact/

      - name: ⬆️ Upload vendor tree artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proprietary_vendor_xiaomi_spinel
          path: artifact/proprietary_vendor_xiaomi_spinel.tar.gz
          if-no-files-found: warn
          retention-days: 14

name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVICE: spinel
  VENDOR: xiaomi

  DUMP_REPO: https://gitlab.com/mkpromvp/dumber-2-mk.git
  DUMP_BRANCH: dump-redmi-spinel-os2.0.212.0.vpgmixm

  LINEAGE_EXTRACT_UTILS: lineage-23.2

  WORK_DIR: vendor_work
  DUMP_DIR: stock_dump
  EXTRACT_DIR: extract_tree
  REPORT_DIR: reports

jobs:
  build-vendor:
    name: 🧬 Generate LineageOS Vendor Tree
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT TARGET REPOSITORY
      # ============================================================

      - name: 📥 Checkout vendor repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # ============================================================
      # 2. SYSTEM DEPENDENCIES
      # ============================================================

      - name: 🧰 Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            python3 \
            python3-pip \
            python3-venv \
            rsync \
            unzip \
            zip \
            file \
            bc \
            bison \
            flex \
            gperf \
            build-essential \
            clang \
            llvm \
            patchelf \
            libxml2-utils \
            liblz4-tool \
            zstd \
            lzop \
            cpio \
            lzip \
            xz-utils

          git lfs install --system

          python3 --version
          git --version
          git lfs version

      # ============================================================
      # 3. CLEAN WORKSPACE
      # ============================================================

      - name: 🧹 Clean workspace
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$WORK_DIR" \
            "$DUMP_DIR" \
            "$EXTRACT_DIR" \
            "$REPORT_DIR"

          mkdir -p \
            "$WORK_DIR" \
            "$REPORT_DIR"

      # ============================================================
      # 4. CLONE STOCK DUMP
      # ============================================================

      - name: 📦 Clone Xiaomi stock dump
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "📦 Cloning stock dump"
          echo "=========================================="
          echo "Repository: $DUMP_REPO"
          echo "Branch:     $DUMP_BRANCH"
          echo

          git clone \
            --branch "$DUMP_BRANCH" \
            --single-branch \
            --depth 1 \
            "$DUMP_REPO" \
            "$DUMP_DIR"

          cd "$DUMP_DIR"

          git lfs install --local || true
          git lfs pull || true

          echo
          echo "Dump commit:"
          git rev-parse HEAD

          echo
          echo "Dump size:"
          du -sh .

          echo
          echo "Top-level dump:"
          find . -maxdepth 1 -mindepth 1 -printf '%f\n' | sort

      # ============================================================
      # 5. VERIFY DUMP STRUCTURE
      # ============================================================

      - name: 🔎 Verify stock dump
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "🔎 Verifying stock dump"
          echo "=========================================="

          required=(
            "proprietary-files.txt"
            "vendor"
            "system_ext"
            "product"
            "odm_dlkm"
            "vendor_dlkm"
          )

          failed=0

          for item in "${required[@]}"; do
            if [[ ! -e "$DUMP_DIR/$item" ]]; then
              echo "❌ Missing: $item"
              failed=1
            else
              echo "✅ Found:   $item"
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo
            echo "❌ Stock dump structure is incomplete."
            exit 1
          fi

          echo
          echo "✅ Stock dump structure looks valid."

      # ============================================================
      # 6. PREPARE LINEAGE EXTRACT-UTILS TREE
      # ============================================================

      - name: 🛠️ Prepare Lineage extract-utils
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "🛠️ Preparing LineageOS extract-utils"
          echo "=========================================="

          mkdir -p "$EXTRACT_DIR"

          cd "$EXTRACT_DIR"

          git clone \
            --branch "$LINEAGE_EXTRACT_UTILS" \
            --single-branch \
            --depth 1 \
            https://github.com/LineageOS/android_tools_extract-utils.git \
            tools/extract-utils

          mkdir -p \
            "device/$VENDOR/$DEVICE"

          echo "Extract-utils:"
          git -C tools/extract-utils rev-parse HEAD

      # ============================================================
      # 7. IMPORT PROPRIETARY FILE LIST
      # ============================================================

      - name: 📋 Import proprietary-files.txt
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "📋 Importing proprietary-files.txt"
          echo "=========================================="

          cp \
            "$DUMP_DIR/proprietary-files.txt" \
            "$EXTRACT_DIR/device/$VENDOR/$DEVICE/proprietary-files.txt"

          echo "Original entries:"
          grep -Ev '^[[:space:]]*(#|$)' \
            "$EXTRACT_DIR/device/$VENDOR/$DEVICE/proprietary-files.txt" \
            | wc -l

      # ============================================================
      # 8. CLEAN + VALIDATE PROPRIETARY LIST
      #
      # IMPORTANT:
      # A leading '-' is Lineage extract-utils syntax.
      # It MUST NOT be treated as part of the source filename.
      #
      # Example:
      #
      # -system_ext/framework/foo.jar
      #
      # filesystem lookup must use:
      #
      # system_ext/framework/foo.jar
      #
      # but the proprietary-files.txt entry keeps:
      #
      # -system_ext/framework/foo.jar
      # ============================================================

      - name: 🧹 Clean proprietary file list
        shell: bash
        run: |
          set -euo pipefail

          SRC="$EXTRACT_DIR/device/$VENDOR/$DEVICE/proprietary-files.txt"
          TMP="$EXTRACT_DIR/device/$VENDOR/$DEVICE/proprietary-files.txt.tmp"

          MISSING_REPORT="$REPORT_DIR/missing-proprietary-files.txt"
          REMOVED_REPORT="$REPORT_DIR/removed-proprietary-files.txt"

          mkdir -p "$REPORT_DIR"

          : > "$TMP"
          : > "$MISSING_REPORT"
          : > "$REMOVED_REPORT"

          original_count=0
          kept_count=0
          missing_count=0

          while IFS= read -r line || [[ -n "$line" ]]; do

            # Keep blank lines.
            if [[ -z "${line//[[:space:]]/}" ]]; then
              echo "$line" >> "$TMP"
              continue
            fi

            # Keep comments.
            if [[ "$line" =~ ^[[:space:]]*# ]]; then
              echo "$line" >> "$TMP"
              continue
            fi

            original_count=$((original_count + 1))

            # Remove CR if source list came from Windows.
            line="${line%$'\r'}"

            # Preserve the Lineage '-' marker.
            marker=""

            if [[ "$line" == -* ]]; then
              marker="-"
              lookup_line="${line#-}"
            else
              lookup_line="$line"
            fi

            # Strip SHA1 part.
            lookup_line="${lookup_line%%|*}"

            # Source path is before optional destination ':'
            source="${lookup_line%%:*}"

            # Normalize leading './'
            source="${source#./}"

            # Reject absolute paths.
            if [[ "$source" == /* ]]; then
              echo "$line" >> "$REMOVED_REPORT"
              echo "absolute-path: $line" >> "$MISSING_REPORT"
              missing_count=$((missing_count + 1))
              continue
            fi

            source_path="$DUMP_DIR/$source"

            # ======================================================
            # EXISTENCE CHECK
            # ======================================================

            if [[ -e "$source_path" ]]; then
              echo "$line" >> "$TMP"
              kept_count=$((kept_count + 1))
              continue
            fi

            # ======================================================
            # OPTIONAL SYMLINK CHECK
            # ======================================================

            if [[ -L "$source_path" ]]; then
              echo "$line" >> "$TMP"
              kept_count=$((kept_count + 1))
              continue
            fi

            # ======================================================
            # MISSING SOURCE
            # ======================================================

            echo "$line" >> "$MISSING_REPORT"

            missing_count=$((missing_count + 1))

          done < "$SRC"

          mv "$TMP" "$SRC"

          {
            echo "Original entries : $original_count"
            echo "Kept entries     : $kept_count"
            echo "Removed/missing  : $missing_count"
          } | tee "$REPORT_DIR/proprietary-list-summary.txt"

          echo
          echo "=========================================="
          echo "First missing sources:"
          echo "=========================================="

          if [[ -s "$MISSING_REPORT" ]]; then
            sed -n '1,100p' "$MISSING_REPORT"
          else
            echo "None"
          fi

          echo
          echo "=========================================="
          echo "First proprietary entries:"
          echo "=========================================="

          sed -n '1,40p' "$SRC"

          echo
          echo "=========================================="
          echo "Final entry count:"
          echo "=========================================="

          grep -Ev '^[[:space:]]*(#|$)' "$SRC" | wc -l

          # IMPORTANT:
          # Do NOT fail here.
          #
          # Missing files are already removed from the list.
          # They are preserved in the report for later inspection.

      # ============================================================
      # 9. REMOVE KNOWN STOCK-ONLY NON-VENDOR ARTIFACTS
      #
      # Settings.apk is explicitly missing from this Dumber dump.
      # We also protect against it appearing later through LFS.
      #
      # We do NOT remove all system_ext content because MediaTek
      # hardware services may legitimately live there.
      # ============================================================

      - name: 🧹 Remove known non-vendor stock applications
        shell: bash
        run: |
          set -euo pipefail

          LIST="$EXTRACT_DIR/device/$VENDOR/$DEVICE/proprietary-files.txt"
          REPORT="$REPORT_DIR/known-stock-apps-removed.txt"

          : > "$REPORT"

          tmp="${LIST}.tmp"

          while IFS= read -r line || [[ -n "$line" ]]; do
            normalized="${line#-}"
            source="${normalized%%:*}"
            source="${source%%|*}"

            remove="false"

            case "$source" in
              system_ext/priv-app/Settings/Settings.apk)
                remove="true"
                ;;
            esac

            if [[ "$remove" == "true" ]]; then
              echo "$line" >> "$REPORT"
              continue
            fi

            echo "$line" >> "$tmp"
          done < "$LIST"

          mv "$tmp" "$LIST"

          if [[ -s "$REPORT" ]]; then
            echo "Removed known stock-only entries:"
            cat "$REPORT"
          else
            echo "No known stock-only entries required removal."
          fi

      # ============================================================
      # 10. CREATE EXTRACT-FILES.PY
      # ============================================================

      - name: 🐍 Create extract-files.py
        shell: bash
        run: |
          set -euo pipefail

          cat > "$EXTRACT_DIR/device/$VENDOR/$DEVICE/extract-files.py" <<'PY'
          #!/usr/bin/env -S PYTHONPATH=../../../tools/extract-utils python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=False,
          )

          if __name__ == "__main__":
              utils = ExtractUtils.device(module)
              utils.run()
          PY

          chmod +x "$EXTRACT_DIR/device/$VENDOR/$DEVICE/extract-files.py"

          echo "Created:"
          cat "$EXTRACT_DIR/device/$VENDOR/$DEVICE/extract-files.py"

      # ============================================================
      # 11. SANITY CHECK PYTHON IMPORTS
      # ============================================================

      - name: 🐍 Test extract-utils import
        shell: bash
        run: |
          set -euo pipefail

          cd "$EXTRACT_DIR"

          PYTHONPATH="$PWD/tools/extract-utils" \
            python3 - <<'PY'
          from extract_utils.main import ExtractUtils, ExtractUtilsModule

          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=False,
          )

          print("ExtractUtils import: OK")
          print("Device:", module.device)
          print("Vendor:", module.vendor)
          print("Device path:", module.device_path)
          print("Vendor path:", module.vendor_path)
          PY

      # ============================================================
      # 12. RUN EXTRACTION
      # ============================================================

      - name: 🧬 Extract vendor blobs
        shell: bash
        run: |
          set -euo pipefail

          cd "$EXTRACT_DIR"

          echo "=========================================="
          echo "🧬 STARTING EXTRACTION"
          echo "=========================================="
          echo
          echo "Device : $DEVICE"
          echo "Vendor : $VENDOR"
          echo "Source : ../$DUMP_DIR"
          echo

          PYTHONPATH="$PWD/tools/extract-utils" \
            python3 "device/$VENDOR/$DEVICE/extract-files.py" \
            "../$DUMP_DIR"

      # ============================================================
      # 13. VERIFY GENERATED VENDOR TREE
      # ============================================================

      - name: 🔎 Verify generated vendor tree
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$EXTRACT_DIR/vendor/$VENDOR/$DEVICE"

          echo "=========================================="
          echo "🔎 Verifying generated vendor tree"
          echo "=========================================="

          if [[ ! -d "$VENDOR_TREE" ]]; then
            echo "❌ Vendor tree was not generated."
            exit 1
          fi

          required_files=(
            "Android.bp"
            "Android.mk"
            "BoardConfigVendor.mk"
            "$DEVICE-vendor.mk"
          )

          failed=0

          for file in "${required_files[@]}"; do
            if [[ ! -f "$VENDOR_TREE/$file" ]]; then
              echo "❌ Missing generated file: $file"
              failed=1
            else
              echo "✅ Found: $file"
            fi
          done

          if [[ ! -d "$VENDOR_TREE/proprietary" ]]; then
            echo "❌ Missing proprietary directory."
            exit 1
          fi

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

          echo
          echo "Vendor tree size:"
          du -sh "$VENDOR_TREE"

          echo
          echo "File count:"
          find "$VENDOR_TREE" -type f | wc -l

          echo
          echo "Directory count:"
          find "$VENDOR_TREE" -type d | wc -l

          echo
          echo "✅ Vendor tree generated successfully."

      # ============================================================
      # 14. AUDIT DUPLICATE FILE PATHS
      # ============================================================

      - name: 🔍 Audit duplicate paths
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$EXTRACT_DIR/vendor/$VENDOR/$DEVICE"

          echo "=========================================="
          echo "🔍 Duplicate path audit"
          echo "=========================================="

          find "$VENDOR_TREE/proprietary" \
            -type f \
            -printf '%P\n' \
            | sort \
            | uniq -d \
            > "$REPORT_DIR/duplicate-paths.txt"

          if [[ -s "$REPORT_DIR/duplicate-paths.txt" ]]; then
            echo "⚠️ Duplicate paths found:"
            cat "$REPORT_DIR/duplicate-paths.txt"
          else
            echo "✅ No duplicate paths."
          fi

      # ============================================================
      # 15. AUDIT DUPLICATE CONTENT
      # ============================================================

      - name: 🔍 Audit identical blobs
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$EXTRACT_DIR/vendor/$VENDOR/$DEVICE"

          echo "=========================================="
          echo "🔍 Identical-content audit"
          echo "=========================================="

          find "$VENDOR_TREE/proprietary" \
            -type f \
            -print0 \
            | xargs -0 sha256sum \
            | sort \
            > "$REPORT_DIR/all-sha256.txt"

          awk '
          {
              hash=$1
              file=$2

              if (hash == previous_hash) {
                  if (count == 1) {
                      print previous_file
                  }

                  print file
                  count++
              } else {
                  count=1
              }

              previous_hash=hash
              previous_file=file
          }
          ' "$REPORT_DIR/all-sha256.txt" \
            > "$REPORT_DIR/identical-content-files.txt"

          if [[ -s "$REPORT_DIR/identical-content-files.txt" ]]; then
            echo "⚠️ Identical content exists in multiple paths."
            echo "These files are NOT removed automatically."
            echo
            sed -n '1,200p' "$REPORT_DIR/identical-content-files.txt"
          else
            echo "✅ No identical-content duplicates."
          fi

      # ============================================================
      # 16. AUDIT ELF FILES
      # ============================================================

      - name: 🔬 Audit ELF blobs
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$EXTRACT_DIR/vendor/$VENDOR/$DEVICE"

          echo "=========================================="
          echo "🔬 ELF audit"
          echo "=========================================="

          ELF_REPORT="$REPORT_DIR/elf-files.txt"

          : > "$ELF_REPORT"

          while IFS= read -r -d '' file; do
            if file "$file" | grep -qE 'ELF [0-9]+-bit'; then
              echo "$file" >> "$ELF_REPORT"
            fi
          done < <(
            find "$VENDOR_TREE/proprietary" \
              -type f \
              -print0
          )

          elf_count="$(wc -l < "$ELF_REPORT")"

          echo "ELF files: $elf_count"

          echo
          echo "First ELF files:"
          sed -n '1,100p' "$ELF_REPORT"

      # ============================================================
      # 17. AUDIT SYMLINKS
      # ============================================================

      - name: 🔗 Audit symlinks
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$EXTRACT_DIR/vendor/$VENDOR/$DEVICE"

          echo "=========================================="
          echo "🔗 Symlink audit"
          echo "=========================================="

          find "$VENDOR_TREE" \
            -type l \
            -printf '%P -> %l\n' \
            | sort \
            > "$REPORT_DIR/symlinks.txt"

          count="$(wc -l < "$REPORT_DIR/symlinks.txt")"

          echo "Symlink count: $count"

          if [[ "$count" -gt 0 ]]; then
            sed -n '1,200p' "$REPORT_DIR/symlinks.txt"
          fi

      # ============================================================
      # 18. VERIFY PROPRIETARY LIST AGAINST GENERATED TREE
      # ============================================================

      - name: 🧪 Verify extracted files
        shell: bash
        run: |
          set -euo pipefail

          LIST="$EXTRACT_DIR/device/$VENDOR/$DEVICE/proprietary-files.txt"
          VENDOR_TREE="$EXTRACT_DIR/vendor/$VENDOR/$DEVICE"

          MISSING="$REPORT_DIR/extraction-missing.txt"

          : > "$MISSING"

          checked=0
          missing=0

          while IFS= read -r line || [[ -n "$line" ]]; do

            if [[ -z "${line//[[:space:]]/}" ]]; then
              continue
            fi

            if [[ "$line" =~ ^[[:space:]]*# ]]; then
              continue
            fi

            checked=$((checked + 1))

            normalized="${line#-}"

            # Destination is not needed for this check.
            source="${normalized%%:*}"

            # SHA1 is not part of path.
            source="${source%%|*}"

            # extract-utils places files under proprietary/
            # while preserving their original partition path.
            target="$VENDOR_TREE/proprietary/$source"

            if [[ -e "$target" || -L "$target" ]]; then
              continue
            fi

            echo "$line" >> "$MISSING"
            missing=$((missing + 1))

          done < "$LIST"

          echo "Checked: $checked"
          echo "Missing: $missing"

          if [[ "$missing" -gt 0 ]]; then
            echo
            echo "First missing extracted files:"
            sed -n '1,100p' "$MISSING"

            echo
            echo "❌ Extraction verification failed."
            exit 1
          fi

          echo
          echo "✅ Every proprietary entry exists in the generated tree."

      # ============================================================
      # 19. COPY ONLY THE GENERATED VENDOR TREE
      # ============================================================

      - name: 📦 Stage vendor tree
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="$EXTRACT_DIR/vendor/$VENDOR/$DEVICE"
          DEST="$WORK_DIR/vendor/$VENDOR/$DEVICE"

          rm -rf "$DEST"

          mkdir -p "$DEST"

          rsync -a \
            "$SOURCE/" \
            "$DEST/"

          echo "Staged vendor tree:"
          du -sh "$DEST"

      # ============================================================
      # 20. COPY REPORTS
      # ============================================================

      - name: 📝 Generate final report
        shell: bash
        run: |
          set -euo pipefail

          VENDOR_TREE="$WORK_DIR/vendor/$VENDOR/$DEVICE"

          {
            echo "=========================================="
            echo "Redmi Note 15 4G — spinel"
            echo "LineageOS Vendor Tree Report"
            echo "=========================================="
            echo
            echo "Device : $DEVICE"
            echo "Vendor : $VENDOR"
            echo "Dump   : $DUMP_REPO"
            echo "Branch : $DUMP_BRANCH"
            echo "Utils  : $LINEAGE_EXTRACT_UTILS"
            echo
            echo "Vendor tree size:"
            du -sh "$VENDOR_TREE"
            echo
            echo "Files:"
            find "$VENDOR_TREE" -type f | wc -l
            echo
            echo "Directories:"
            find "$VENDOR_TREE" -type d | wc -l
            echo
            echo "Generated files:"
            find "$VENDOR_TREE" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
            echo
            echo "=========================================="
            echo "Missing stock sources"
            echo "=========================================="
            if [[ -s "$REPORT_DIR/missing-proprietary-files.txt" ]]; then
              cat "$REPORT_DIR/missing-proprietary-files.txt"
            else
              echo "None"
            fi
            echo
            echo "=========================================="
            echo "Extraction missing"
            echo "=========================================="
            if [[ -s "$REPORT_DIR/extraction-missing.txt" ]]; then
              cat "$REPORT_DIR/extraction-missing.txt"
            else
              echo "None"
            fi
          } > "$REPORT_DIR/final-report.txt"

          cat "$REPORT_DIR/final-report.txt"

      # ============================================================
      # 21. INSTALL GENERATED TREE INTO REPOSITORY
      # ============================================================

      - name: 📁 Install vendor tree into repository
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "📁 Installing vendor/xiaomi/spinel"
          echo "=========================================="

          rm -rf "vendor/$VENDOR/$DEVICE"

          mkdir -p "vendor/$VENDOR/$DEVICE"

          rsync -a \
            "$WORK_DIR/vendor/$VENDOR/$DEVICE/" \
            "vendor/$VENDOR/$DEVICE/"

          echo
          echo "Installed tree:"
          du -sh "vendor/$VENDOR/$DEVICE"

          echo
          echo "Files:"
          find "vendor/$VENDOR/$DEVICE" -type f | wc -l

      # ============================================================
      # 22. GIT STATUS
      # ============================================================

      - name: 🔎 Show git status
        shell: bash
        run: |
          set -euo pipefail

          git status --short

          echo
          echo "Changed files:"
          git status --short | sed -n '1,200p'

      # ============================================================
      # 23. COMMIT + PUSH
      # ============================================================

      - name: 🚀 Commit and push vendor tree
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "MKVenomPro"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "vendor/$VENDOR/$DEVICE"

          if git diff --cached --quiet; then
            echo "ℹ️ No changes detected."
            exit 0
          fi

          git commit \
            -m "vendor: xiaomi: spinel: generate LineageOS vendor tree"

          git push origin HEAD

      # ============================================================
      # 24. UPLOAD REPORTS
      # ============================================================

      - name: 📤 Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree-reports
          path: |
            reports/
          if-no-files-found: warn

      # ============================================================
      # 25. UPLOAD GENERATED VENDOR TREE
      # ============================================================

      - name: 📦 Upload generated vendor tree
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree
          path: |
            vendor/xiaomi/spinel/
          if-no-files-found: error

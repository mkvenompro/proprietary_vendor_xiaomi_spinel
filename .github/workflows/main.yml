name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVICE: spinel
  VENDOR: xiaomi
  BRANCH: lineage-23.2

  DUMP_REPO: https://gitlab.com/mkpromvp/dumber-2-mk.git
  DUMP_BRANCH: dump-redmi-spinel-os2.0.212.0.vpgmixm

  VENDOR_REPO: https://github.com/mkvenompro/proprietary_vendor_xiaomi_spinel.git

  EXTRACT_UTILS_REPO: https://github.com/LineageOS/android_tools_extract-utils.git
  EXTRACT_UTILS_BRANCH: lineage-23.2

jobs:
  build-vendor:
    name: 🧬 Generate vendor tree
    runs-on: ubuntu-24.04

    steps:
      # ------------------------------------------------------------
      # 1. Checkout vendor repository
      # ------------------------------------------------------------
      - name: 📥 Checkout vendor repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Install dependencies
      # ------------------------------------------------------------
      - name: 🧰 Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            rsync \
            unzip \
            zip \
            lz4 \
            brotli \
            libxml2-utils \
            android-sdk-libsparse-utils \
            file \
            patchelf \
            jq

          python3 --version
          git --version

      # ------------------------------------------------------------
      # 3. Clone stock dump
      # ------------------------------------------------------------
      - name: 📦 Clone stock dump
        run: |
          rm -rf stock_dump

          git clone \
            --depth=1 \
            --branch "${DUMP_BRANCH}" \
            "${DUMP_REPO}" \
            stock_dump

          echo
          echo "========================================"
          echo " STOCK DUMP"
          echo "========================================"
          echo "Repo:   ${DUMP_REPO}"
          echo "Branch: ${DUMP_BRANCH}"
          echo

          find stock_dump -maxdepth 2 -type d | sort | head -100

      # ------------------------------------------------------------
      # 4. Clone Lineage extract-utils
      # ------------------------------------------------------------
      - name: 🧩 Clone extract-utils
        run: |
          rm -rf tools/extract-utils

          git clone \
            --depth=1 \
            --branch "${EXTRACT_UTILS_BRANCH}" \
            "${EXTRACT_UTILS_REPO}" \
            tools/extract-utils

          test -f tools/extract-utils/extract_utils/main.py

          echo
          echo "extract-utils:"
          git -C tools/extract-utils rev-parse HEAD

      # ------------------------------------------------------------
      # 5. Locate proprietary-files list
      # ------------------------------------------------------------
      - name: 🔎 Locate proprietary-files.txt
        run: |
          test -f stock_dump/proprietary-files.txt

          cp \
            stock_dump/proprietary-files.txt \
            proprietary-files.stock.txt

          echo "Original proprietary-files.txt:"
          wc -l proprietary-files.stock.txt

          echo
          echo "First 30 entries:"
          sed -n '1,30p' proprietary-files.stock.txt

      # ------------------------------------------------------------
      # 6. Analyze stock list
      #
      # IMPORTANT:
      # We DO NOT blindly strip '-'.
      # In Lineage proprietary-files.txt, '-' has package/module
      # semantics and must be preserved.
      # ------------------------------------------------------------
      - name: 🧠 Analyze proprietary list
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from collections import Counter

          src = Path("proprietary-files.stock.txt")

          lines = []
          for raw in src.read_text(errors="ignore").splitlines():
              line = raw.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              lines.append(line)

          partitions = Counter()

          for line in lines:
              value = line

              if value.startswith("-"):
                  value = value[1:].strip()

              # Handle source:destination syntax
              value = value.split(":", 1)[0].strip()

              partition = value.split("/", 1)[0]

              partitions[partition] += 1

          print()
          print("========================================")
          print(" STOCK PROPRIETARY LIST ANALYSIS")
          print("========================================")

          for partition, count in sorted(partitions.items()):
              print(f"{partition:20} {count}")

          Path("reports").mkdir(exist_ok=True)

          with open("reports/partition-summary.txt", "w") as f:
              for partition, count in sorted(partitions.items()):
                  f.write(f"{partition}: {count}\n")
          PY

      # ------------------------------------------------------------
      # 7. Validate source files and classify partitions
      #
      # Standard Lineage vendor extraction:
      #   vendor
      #   odm
      #   recovery
      #
      # Explicitly excluded from extract-utils:
      #   system
      #   system_ext
      #   product
      #   vendor_dlkm
      #   odm_dlkm
      #
      # These are NOT deleted from the stock dump.
      # They are only separated from the normal vendor extraction.
      # ------------------------------------------------------------
      - name: 🧹 Prepare Lineage proprietary-files.txt
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from collections import Counter

          src = Path("proprietary-files.stock.txt")

          standard = []
          system_entries = []
          product_entries = []
          system_ext_entries = []
          vendor_dlkm_entries = []
          odm_dlkm_entries = []
          other_entries = []
          missing = []

          root = Path("stock_dump")

          def split_entry(line):
              marker = ""
              value = line.strip()

              if value.startswith("-"):
                  marker = "-"
                  value = value[1:].strip()

              source = value.split(":", 1)[0].strip()

              return marker, value, source

          for raw in src.read_text(errors="ignore").splitlines():
              line = raw.strip()

              if not line or line.startswith("#"):
                  continue

              marker, value, source = split_entry(line)

              partition = source.split("/", 1)[0]

              # --------------------------------------------------
              # Check actual source existence.
              # --------------------------------------------------
              source_path = root / source

              if not source_path.exists():
                  missing.append(line)

              # --------------------------------------------------
              # Partition classification
              # --------------------------------------------------
              if partition == "system":
                  system_entries.append(line)

              elif partition == "system_ext":
                  system_ext_entries.append(line)

              elif partition == "product":
                  product_entries.append(line)

              elif partition == "vendor_dlkm":
                  vendor_dlkm_entries.append(line)

              elif partition == "odm_dlkm":
                  odm_dlkm_entries.append(line)

              elif partition in {
                  "vendor",
                  "odm",
                  "recovery",
              }:
                  # Preserve the original '-' marker.
                  standard.append(line)

              else:
                  other_entries.append(line)

          Path("reports").mkdir(exist_ok=True)

          Path("proprietary-files.txt").write_text(
              "\n".join(standard) + "\n"
          )

          Path("reports/system.txt").write_text(
              "\n".join(system_entries) + "\n"
          )

          Path("reports/system_ext.txt").write_text(
              "\n".join(system_ext_entries) + "\n"
          )

          Path("reports/product.txt").write_text(
              "\n".join(product_entries) + "\n"
          )

          Path("reports/vendor_dlkm.txt").write_text(
              "\n".join(vendor_dlkm_entries) + "\n"
          )

          Path("reports/odm_dlkm.txt").write_text(
              "\n".join(odm_dlkm_entries) + "\n"
          )

          Path("reports/other-partitions.txt").write_text(
              "\n".join(other_entries) + "\n"
          )

          Path("reports/missing-sources.txt").write_text(
              "\n".join(missing) + "\n"
          )

          print()
          print("========================================")
          print(" CLASSIFICATION")
          print("========================================")
          print(f"Standard vendor/odm/recovery : {len(standard)}")
          print(f"system                       : {len(system_entries)}")
          print(f"system_ext                   : {len(system_ext_entries)}")
          print(f"product                      : {len(product_entries)}")
          print(f"vendor_dlkm                  : {len(vendor_dlkm_entries)}")
          print(f"odm_dlkm                     : {len(odm_dlkm_entries)}")
          print(f"other partitions             : {len(other_entries)}")
          print(f"missing source files         : {len(missing)}")

          if other_entries:
              print()
              print("WARNING: unknown partitions:")
              for item in other_entries:
                  print("  " + item)

          if missing:
              print()
              print("WARNING: missing source files:")
              for item in missing:
                  print("  " + item)
          PY

          echo
          echo "========================================"
          echo " STANDARD PROPRIETARY LIST"
          echo "========================================"
          wc -l proprietary-files.txt

          echo
          echo "vendor_dlkm entries:"
          wc -l reports/vendor_dlkm.txt

          echo
          echo "odm_dlkm entries:"
          wc -l reports/odm_dlkm.txt

      # ------------------------------------------------------------
      # 8. Hard validation
      # ------------------------------------------------------------
      - name: 🚦 Validate normalized list
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("proprietary-files.txt")
          bad = []

          forbidden = {
              "system",
              "system_ext",
              "product",
              "vendor_dlkm",
              "odm_dlkm",
          }

          for n, raw in enumerate(p.read_text().splitlines(), 1):
              line = raw.strip()

              if not line or line.startswith("#"):
                  continue

              value = line

              if value.startswith("-"):
                  value = value[1:].strip()

              source = value.split(":", 1)[0].strip()
              partition = source.split("/", 1)[0]

              if partition in forbidden:
                  bad.append((n, line))

          if bad:
              print("ERROR: forbidden partition entries found:")
              for n, line in bad:
                  print(f"{n}: {line}")

              raise SystemExit(1)

          print("PASS: no system/product/system_ext/DLKM entries")
          PY

          test "$(grep -Ec '^(system|system_ext|product|vendor_dlkm|odm_dlkm)/' proprietary-files.txt || true)" = "0"

      # ------------------------------------------------------------
      # 9. Copy stock files into a source tree expected by
      # extract-utils.
      #
      # The proprietary list references:
      #   vendor/...
      #   odm/...
      #   recovery/...
      #
      # So the stock dump itself is the source root.
      # ------------------------------------------------------------
      - name: 📂 Prepare extraction environment
        run: |
          mkdir -p device/xiaomi/${DEVICE}
          mkdir -p vendor/${VENDOR}/${DEVICE}

          cp proprietary-files.txt \
            device/xiaomi/${DEVICE}/proprietary-files.txt

          cp proprietary-files.txt \
            vendor/${VENDOR}/${DEVICE}/proprietary-files.txt

          echo "Extraction root:"
          pwd

      # ------------------------------------------------------------
      # 10. Generate extract-files.py
      #
      # This uses the modern Lineage extract-utils API:
      #
      # from extract_utils.main import (
      #     ExtractUtils,
      #     ExtractUtilsModule,
      # )
      # ------------------------------------------------------------
      - name: 📝 Generate extract-files.py
        shell: bash
        run: |
          cat > device/xiaomi/${DEVICE}/extract-files.py <<'PY'
          #!/usr/bin/env -S PYTHONPATH=../../../tools/extract-utils python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=True,
              add_firmware_proprietary_file=True,
          )

          if __name__ == "__main__":
              utils = ExtractUtils.device(module)
              utils.run()
          PY

          chmod +x device/xiaomi/${DEVICE}/extract-files.py

          echo
          cat device/xiaomi/${DEVICE}/extract-files.py

      # ------------------------------------------------------------
      # 11. Generate setup-makefiles.py
      # ------------------------------------------------------------
      - name: 📝 Generate setup-makefiles.py
        shell: bash
        run: |
          cat > device/xiaomi/${DEVICE}/setup-makefiles.py <<'PY'
          #!/usr/bin/env -S PYTHONPATH=../../../tools/extract-utils python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=True,
              add_firmware_proprietary_file=True,
          )

          if __name__ == "__main__":
              utils = ExtractUtils.device(module)
              utils.run()
          PY

          chmod +x device/xiaomi/${DEVICE}/setup-makefiles.py

      # ------------------------------------------------------------
      # 12. Pre-flight source validation
      #
      # Do NOT run extract-utils yet.
      # First verify every standard source exists.
      # ------------------------------------------------------------
      - name: 🔍 Pre-flight source validation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          dump = Path("stock_dump")
          prop = Path("proprietary-files.txt")

          missing = []

          for raw in prop.read_text().splitlines():
              line = raw.strip()

              if not line or line.startswith("#"):
                  continue

              value = line

              if value.startswith("-"):
                  value = value[1:].strip()

              source = value.split(":", 1)[0].strip()

              if not (dump / source).exists():
                  missing.append(source)

          print(f"Checked entries: {sum(1 for x in prop.read_text().splitlines() if x.strip())}")
          print(f"Missing: {len(missing)}")

          Path("reports/preflight-missing.txt").write_text(
              "\n".join(missing) + ("\n" if missing else "")
          )

          if missing:
              print()
              print("Missing source files:")
              for item in missing:
                  print("  " + item)

              raise SystemExit(1)

          print("PASS: all standard proprietary sources exist.")
          PY

      # ------------------------------------------------------------
      # 13. Run extract-utils
      # ------------------------------------------------------------
      - name: 🧬 Run Lineage extract-utils
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/extract-utils
        shell: bash
        run: |
          cd device/xiaomi/${DEVICE}

          echo
          echo "========================================"
          echo " RUNNING EXTRACT-UTILS"
          echo "========================================"

          python3 extract-files.py \
            --kang \
            "${GITHUB_WORKSPACE}/stock_dump"

      # ------------------------------------------------------------
      # 14. Detect leftover/unsupported files
      # ------------------------------------------------------------
      - name: 🕵️ Inspect generated vendor tree
        shell: bash
        run: |
          mkdir -p reports

          echo "========================================"
          echo " GENERATED TREE"
          echo "========================================"

          find vendor/${VENDOR}/${DEVICE} \
            -type f \
            -o -type l \
            | sort > reports/generated-files.txt

          wc -l reports/generated-files.txt

          echo
          echo "Top-level:"
          find vendor/${VENDOR}/${DEVICE} \
            -maxdepth 3 \
            -print \
            | sort \
            | head -200

      # ------------------------------------------------------------
      # 15. Build a separate DLKM report/tree
      #
      # We intentionally don't feed DLKM entries to extract-utils.
      # MT6789 reference trees use BOARD_VENDOR_KERNEL_MODULES
      # and install them into vendor_dlkm.
      # ------------------------------------------------------------
      - name: 🧩 Prepare DLKM metadata
        shell: bash
        run: |
          mkdir -p vendor/${VENDOR}/${DEVICE}/dlkm
          mkdir -p vendor/${VENDOR}/${DEVICE}/dlkm/vendor_dlkm
          mkdir -p vendor/${VENDOR}/${DEVICE}/dlkm/odm_dlkm

          cp reports/vendor_dlkm.txt \
            vendor/${VENDOR}/${DEVICE}/dlkm/vendor_dlkm/proprietary-files.txt

          cp reports/odm_dlkm.txt \
            vendor/${VENDOR}/${DEVICE}/dlkm/odm_dlkm/proprietary-files.txt

          # Keep a machine-readable inventory of all kernel modules.
          find stock_dump/vendor_dlkm \
            -type f \
            2>/dev/null \
            | sort > reports/vendor_dlkm-files.txt || true

          find stock_dump/odm_dlkm \
            -type f \
            2>/dev/null \
            | sort > reports/odm_dlkm-files.txt || true

          echo
          echo "vendor_dlkm inventory:"
          wc -l reports/vendor_dlkm-files.txt || true

          echo
          echo "odm_dlkm inventory:"
          wc -l reports/odm_dlkm-files.txt || true

      # ------------------------------------------------------------
      # 16. Generate vendor makefile sanity information
      # ------------------------------------------------------------
      - name: 📋 Generate tree report
        shell: bash
        run: |
          {
            echo "========================================"
            echo " spinel vendor tree report"
            echo "========================================"
            echo
            echo "Device: ${DEVICE}"
            echo "Vendor: ${VENDOR}"
            echo "Branch: ${BRANCH}"
            echo "Dump:   ${DUMP_BRANCH}"
            echo
            echo "Generated:"
            find vendor/${VENDOR}/${DEVICE} \
              -maxdepth 2 \
              -type f \
              | sort
            echo
            echo "========================================"
            echo " Partition summary"
            echo "========================================"
            cat reports/partition-summary.txt
            echo
            echo "========================================"
            echo " DLKM"
            echo "========================================"
            echo "vendor_dlkm list:"
            wc -l reports/vendor_dlkm.txt
            echo "odm_dlkm list:"
            wc -l reports/odm_dlkm.txt
          } > reports/vendor-tree-report.txt

          cat reports/vendor-tree-report.txt

      # ------------------------------------------------------------
      # 17. Check generated repository for accidental system blobs
      # ------------------------------------------------------------
      - name: 🚫 Check vendor tree contamination
        shell: bash
        run: |
          bad=0

          for path in \
            vendor/${VENDOR}/${DEVICE}/proprietary/system \
            vendor/${VENDOR}/${DEVICE}/proprietary/system_ext \
            vendor/${VENDOR}/${DEVICE}/proprietary/product
          do
            if [ -e "$path" ]; then
              echo "ERROR: forbidden path exists: $path"
              bad=1
            fi
          done

          if [ "$bad" -ne 0 ]; then
            exit 1
          fi

          echo "PASS: no system/system_ext/product vendor contamination."

      # ------------------------------------------------------------
      # 18. Git status
      # ------------------------------------------------------------
      - name: 📊 Git status
        run: |
          git status --short

          echo
          echo "Tracked files:"
          git ls-files | wc -l

      # ------------------------------------------------------------
      # 19. Commit generated tree
      # ------------------------------------------------------------
      - name: 💾 Commit generated vendor tree
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "vendor: generate spinel blobs from HyperOS 2.0.212.0"
            git push
          fi

      # ------------------------------------------------------------
      # 20. Upload diagnostics
      # ------------------------------------------------------------
      - name: 📦 Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree-reports
          path: |
            reports/
            proprietary-files.stock.txt
            proprietary-files.txt
            device/xiaomi/spinel/extract-files.py
            device/xiaomi/spinel/setup-makefiles.py
          retention-days: 14
          if-no-files-found: warn

      # ------------------------------------------------------------
      # 21. Upload generated vendor tree
      # ------------------------------------------------------------
      - name: 📦 Upload generated vendor tree
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: proprietary_vendor_xiaomi_spinel
          path: |
            vendor/xiaomi/spinel/
          retention-days: 14
          if-no-files-found: error

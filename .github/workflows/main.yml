name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-vendor:
    runs-on: ubuntu-24.04

    env:
      DEVICE: spinel
      BRAND: xiaomi

      DEVICE_PATH: device/xiaomi/spinel
      VENDOR_PATH: vendor/xiaomi/spinel

      STOCK_REPO: https://gitlab.com/mkpromvp/dumber-2-mk.git
      STOCK_BRANCH: dump-redmi-spinel-os2.0.212.0.vpgmixm

      EXTRACT_UTILS_REPO: https://github.com/LineageOS/android_tools_extract-utils.git
      EXTRACT_UTILS_BRANCH: lineage-23.2

      RADIO_DIR: radio

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================

      - name: 🧰 Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            rsync \
            python3 \
            python3-pip \
            python3-venv \
            python3-setuptools \
            python3-wheel \
            file \
            unzip \
            zip \
            cpio \
            lz4 \
            zstd \
            brotli \
            jq

          git lfs install

      # ============================================================
      # 3. PREPARE WORKSPACE
      # ============================================================

      - name: 🧹 Prepare clean workspace
        run: |
          set -euxo pipefail

          rm -rf stock_dump
          rm -rf extract-utils
          rm -rf reports
          rm -rf generated_root
          rm -rf "$DEVICE_PATH"
          rm -rf "$VENDOR_PATH"

          mkdir -p stock_dump
          mkdir -p reports
          mkdir -p generated_root
          mkdir -p "$DEVICE_PATH"

      # ============================================================
      # 4. CLONE STOCK DUMP
      # ============================================================

      - name: 📦 Clone stock dump
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "$STOCK_BRANCH" \
            "$STOCK_REPO" \
            stock_dump

          echo "===== STOCK DUMP ROOT ====="
          find stock_dump -maxdepth 2 -type d | sort

      # ============================================================
      # 5. CLONE EXTRACT UTILS
      # ============================================================

      - name: 🧩 Clone extract-utils
        run: |
          set -euxo pipefail

          git clone \
            --depth=1 \
            --branch "$EXTRACT_UTILS_BRANCH" \
            "$EXTRACT_UTILS_REPO" \
            extract-utils

          python3 - <<'PY'
          import sys

          sys.path.insert(0, "extract-utils")

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print("extract-utils import: PASS")
          PY

      # ============================================================
      # 6. INVENTORY STOCK RADIO
      # ============================================================

      - name: 📡 Detect spinel radio firmware
        run: |
          set -euxo pipefail

          mkdir -p reports/radio

          cat > reports/radio/expected.txt <<'EOF'
          dpm.img
          gz.img
          lk.img
          mcupm.img
          md1img.img
          pi_img.img
          preloader_raw.img
          scp.img
          spmfw.img
          sspm.img
          tee.img
          EOF

          : > reports/radio/found.txt
          : > reports/radio/missing.txt
          : > reports/radio/locations.txt

          echo "===== Searching stock dump for radio images ====="

          while IFS= read -r image; do

            found=""

            # Search exact basename.
            while IFS= read -r candidate; do
              [ -f "$candidate" ] || continue

              # Prefer actual image files.
              if file "$candidate" | grep -Eqi \
                'boot sector|Android|data|image|raw|filesystem'; then
                found="$candidate"
                break
              fi

              # If file command is inconclusive, still accept it.
              if [ -z "$found" ]; then
                found="$candidate"
              fi

            done < <(
              find stock_dump \
                -type f \
                -name "$image" \
                -print \
                | sort
            )

            if [ -n "$found" ]; then
              echo "$image" >> reports/radio/found.txt
              echo "$image -> $found" >> reports/radio/locations.txt
              echo "FOUND  $image"
            else
              echo "$image" >> reports/radio/missing.txt
              echo "MISS   $image"
            fi

          done < reports/radio/expected.txt

          echo
          echo "===== RADIO SUMMARY ====="

          found_count=$(wc -l < reports/radio/found.txt)
          missing_count=$(wc -l < reports/radio/missing.txt)

          echo "Found   : $found_count"
          echo "Missing : $missing_count"

          echo
          cat reports/radio/locations.txt || true

          # We need all radio partitions for a complete vendor tree.
          if [ "$missing_count" -ne 0 ]; then
            echo
            echo "ERROR: spinel stock dump does not contain all expected radio images."
            echo
            echo "Missing:"
            cat reports/radio/missing.txt
            echo
            echo "This is NOT using tanzanite radio blobs."
            echo "The correct spinel firmware images are required."
            echo
            echo "Radio files discovered anywhere in dump:"
            find stock_dump \
              -type f \
              \( \
                -name 'dpm.img' \
                -o -name 'gz.img' \
                -o -name 'lk.img' \
                -o -name 'mcupm.img' \
                -o -name 'md1img.img' \
                -o -name 'pi_img.img' \
                -o -name 'preloader_raw.img' \
                -o -name 'scp.img' \
                -o -name 'spmfw.img' \
                -o -name 'sspm.img' \
                -o -name 'tee.img' \
              \) \
              -print \
              | sort || true

            exit 1
          fi

      # ============================================================
      # 7. COPY RADIO TO STAGING ROOT
      # ============================================================

      - name: 📡 Stage spinel radio images
        run: |
          set -euxo pipefail

          rm -rf generated_root/radio
          mkdir -p generated_root/radio

          while IFS=' -> ' read -r image location; do
            [ -n "$image" ] || continue
            [ -n "$location" ] || continue

            cp -f "$location" \
              "generated_root/radio/$image"

            echo "Copied: $image"

          done < reports/radio/locations.txt

          echo
          echo "===== FINAL RADIO ====="

          ls -lh generated_root/radio

          count=$(find generated_root/radio -type f | wc -l)

          if [ "$count" -ne 11 ]; then
            echo "ERROR: Expected 11 radio images, found $count"
            exit 1
          fi

      # ============================================================
      # 8. BUILD CLEAN PROPRIETARY FILE LIST
      # ============================================================

      - name: 🧹 Normalize proprietary-files.txt
        run: |
          set -euxo pipefail

          RAW_LIST="stock_dump/proprietary-files.txt"
          CLEAN_LIST="$DEVICE_PATH/proprietary-files.txt"

          test -f "$RAW_LIST"

          : > "$CLEAN_LIST"

          removed_system=0
          removed_product=0
          removed_missing=0
          removed_dlkm=0
          removed_mi_ext=0
          removed_unknown=0
          added_iwpriv=0

          while IFS= read -r line || [ -n "$line" ]; do

            case "$line" in
              ""|\#*)
                continue
                ;;
            esac

            original="$line"
            path="${line#-}"

            # ------------------------------------------------------
            # iwpriv
            # ------------------------------------------------------

            if [ "$path" = "bin/iwpriv" ]; then
              found=""

              for candidate in \
                "stock_dump/vendor/bin/iwpriv" \
                "stock_dump/system/bin/iwpriv" \
                "stock_dump/product/bin/iwpriv" \
                "stock_dump/system_ext/bin/iwpriv"
              do
                if [ -f "$candidate" ]; then
                  found="${candidate#stock_dump/}"
                  break
                fi
              done

              if [ -n "$found" ]; then
                echo "$found" >> "$CLEAN_LIST"
                added_iwpriv=$((added_iwpriv + 1))
              else
                echo "bin/iwpriv" >> reports/missing-files.txt
                removed_missing=$((removed_missing + 1))
              fi

              continue
            fi

            # ------------------------------------------------------
            # system
            # ------------------------------------------------------

            case "$path" in
              system/*)
                removed_system=$((removed_system + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # system_ext
            # ------------------------------------------------------

            case "$path" in
              system_ext/*)
                removed_system=$((removed_system + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # product
            # ------------------------------------------------------

            case "$path" in
              product/*)
                removed_product=$((removed_product + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # vendor_dlkm / odm_dlkm
            # ------------------------------------------------------

            case "$path" in
              vendor_dlkm/*)
                removed_dlkm=$((removed_dlkm + 1))
                continue
                ;;
              odm_dlkm/*)
                removed_dlkm=$((removed_dlkm + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # mi_ext
            # ------------------------------------------------------

            case "$path" in
              mi_ext/*)
                removed_mi_ext=$((removed_mi_ext + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # Allowed partitions
            # ------------------------------------------------------

            case "$path" in
              vendor/*|odm/*|recovery/*)
                ;;
              *)
                echo "$original" >> reports/unknown-partitions.txt
                removed_unknown=$((removed_unknown + 1))
                continue
                ;;
            esac

            # ------------------------------------------------------
            # Unsupported VINTF package paths
            # ------------------------------------------------------

            case "$path" in
              vendor/odm/etc/vintf/manifest_nonfc_dsds.xml)
                echo "$path" >> reports/manual-vintf.txt
                continue
                ;;
              vendor/odm/etc/vintf/manifest_nonfc_ss.xml)
                echo "$path" >> reports/manual-vintf.txt
                continue
                ;;
            esac

            # ------------------------------------------------------
            # Source validation
            # ------------------------------------------------------

            source="stock_dump/$path"

            if [ ! -f "$source" ]; then
              echo "$original" >> reports/missing-files.txt
              removed_missing=$((removed_missing + 1))
              continue
            fi

            echo "$original" >> "$CLEAN_LIST"

          done < "$RAW_LIST"

          {
            echo "Removed system/system_ext : $removed_system"
            echo "Removed product           : $removed_product"
            echo "Removed DLKM              : $removed_dlkm"
            echo "Removed mi_ext            : $removed_mi_ext"
            echo "Removed unknown           : $removed_unknown"
            echo "Removed missing           : $removed_missing"
            echo "Added iwpriv              : $added_iwpriv"
            echo
            echo "Final proprietary count:"
            grep -vE '^[[:space:]]*(#|$)' "$CLEAN_LIST" | wc -l
          } | tee reports/normalization.txt

      # ============================================================
      # 9. VALIDATE PROPRIETARY LIST
      # ============================================================

      - name: 🔍 Validate proprietary list
        run: |
          set -euxo pipefail

          LIST="$DEVICE_PATH/proprietary-files.txt"

          test -s "$LIST"

          missing=0
          forbidden=0
          leading_dash=0

          : > reports/validation-missing.txt
          : > reports/validation-forbidden.txt

          while IFS= read -r line || [ -n "$line" ]; do

            case "$line" in
              ""|\#*)
                continue
                ;;
            esac

            path="${line#-}"

            if [[ "$line" == -* ]]; then
              leading_dash=$((leading_dash + 1))
            fi

            case "$path" in
              system/*|system_ext/*|product/*)
                echo "$line" >> reports/validation-forbidden.txt
                forbidden=$((forbidden + 1))
                continue
                ;;
            esac

            case "$path" in
              vendor_dlkm/*|odm_dlkm/*|mi_ext/*)
                echo "$line" >> reports/validation-forbidden.txt
                forbidden=$((forbidden + 1))
                continue
                ;;
            esac

            if [ ! -f "stock_dump/$path" ]; then
              echo "$line" >> reports/validation-missing.txt
              missing=$((missing + 1))
            fi

          done < "$LIST"

          {
            echo "Leading '-' entries : $leading_dash"
            echo "Forbidden entries    : $forbidden"
            echo "Missing source files : $missing"
          } | tee reports/validation.txt

          if [ "$missing" -ne 0 ]; then
            cat reports/validation-missing.txt
            exit 1
          fi

          if [ "$forbidden" -ne 0 ]; then
            cat reports/validation-forbidden.txt
            exit 1
          fi

          echo "Validation: PASS"

      # ============================================================
      # 10. GENERATE EXTRACT-FILES.PY
      # ============================================================

      - name: 📝 Generate extract-files.py
        run: |
          set -euxo pipefail

          cat > "$DEVICE_PATH/extract-files.py" <<'PY'
          #!/usr/bin/env python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=True,
              add_firmware_proprietary_file=False,
          )

          if __name__ == "__main__":
              utils = ExtractUtils.device(module)
              utils.run()
          PY

          chmod +x "$DEVICE_PATH/extract-files.py"

      # ============================================================
      # 11. GENERATE SETUP-MAKEFILES.PY
      # ============================================================

      - name: 📝 Generate setup-makefiles.py
        run: |
          set -euxo pipefail

          cat > "$DEVICE_PATH/setup-makefiles.py" <<'PY'
          #!/usr/bin/env python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=True,
              add_firmware_proprietary_file=False,
          )

          if __name__ == "__main__":
              utils = ExtractUtils.device(module)
              utils.run()
          PY

          chmod +x "$DEVICE_PATH/setup-makefiles.py"

      # ============================================================
      # 12. PYTHON ENVIRONMENT
      # ============================================================

      - name: 🐍 Prepare extract-utils environment
        run: |
          set -euxo pipefail

          echo "$PWD/extract-utils" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$PWD/extract-utils" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import sys

          sys.path.insert(0, "extract-utils")

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print("Lineage extract-utils: PASS")
          PY

      # ============================================================
      # 13. EXTRACT BLOBS
      # ============================================================

      - name: 🧬 Extract spinel proprietary blobs
        run: |
          set -euxo pipefail

          cd "$DEVICE_PATH"

          python3 extract-files.py \
            --kang \
            ../../stock_dump

      # ============================================================
      # 14. CHECK GENERATED VENDOR TREE
      # ============================================================

      - name: 🔎 Check generated vendor tree
        run: |
          set -euxo pipefail

          test -d "$VENDOR_PATH"

          echo "Generated vendor files:"
          find "$VENDOR_PATH" \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -300

          echo
          echo "Total:"
          find "$VENDOR_PATH" -type f | wc -l

      # ============================================================
      # 15. RESTORE MANUAL VINTF
      # ============================================================

      - name: 🛠️ Restore unsupported ODM VINTF manifests
        run: |
          set -euxo pipefail

          mkdir -p \
            "$VENDOR_PATH/proprietary/odm/etc/vintf"

          for file in \
            manifest_nonfc_dsds.xml \
            manifest_nonfc_ss.xml
          do

            src="stock_dump/vendor/odm/etc/vintf/$file"
            dst="$VENDOR_PATH/proprietary/odm/etc/vintf/$file"

            if [ -f "$src" ]; then
              cp -f "$src" "$dst"
              echo "Restored: $file"
            else
              echo "ERROR: Missing $src"
              exit 1
            fi

          done

      # ============================================================
      # 16. PATCH VENDOR MAKEFILE
      # ============================================================

      - name: 🧩 Patch vendor makefile
        run: |
          set -euxo pipefail

          MAKEFILE=""

          if [ -f "$VENDOR_PATH/spinel-vendor.mk" ]; then
            MAKEFILE="$VENDOR_PATH/spinel-vendor.mk"
          elif [ -f "$VENDOR_PATH/${DEVICE}-vendor.mk" ]; then
            MAKEFILE="$VENDOR_PATH/${DEVICE}-vendor.mk"
          else
            MAKEFILE="$(find "$VENDOR_PATH" \
              -maxdepth 1 \
              -type f \
              -name '*-vendor.mk' \
              | head -1 || true)"
          fi

          if [ -z "$MAKEFILE" ] || [ ! -f "$MAKEFILE" ]; then
            echo "ERROR: vendor makefile not found"
            exit 1
          fi

          cat >> "$MAKEFILE" <<'EOF'

          # Manually restored ODM VINTF manifests.
          PRODUCT_COPY_FILES += \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_dsds.xml \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_ss.xml
          EOF

      # ============================================================
      # 17. GENERATE RADIO BOARD CONFIG
      # ============================================================

      - name: 📡 Generate radio BoardConfigVendor.mk
        run: |
          set -euxo pipefail

          RADIO_MK="$VENDOR_PATH/BoardConfigVendor.mk"

          cat > "$RADIO_MK" <<'EOF'
          #
          # Automatically generated file. DO NOT MODIFY
          #

          AB_OTA_PARTITIONS += \
              dpm \
              gz \
              lk \
              mcupm \
              md1img \
              pi_img \
              preloader_raw \
              scp \
              spmfw \
              sspm \
              tee
          EOF

          echo "Generated:"
          cat "$RADIO_MK"

      # ============================================================
      # 18. GENERATE RADIO MAKE RULES
      # ============================================================

      - name: 📡 Generate radio vendor make rules
        run: |
          set -euxo pipefail

          MAKEFILE=""

          if [ -f "$VENDOR_PATH/spinel-vendor.mk" ]; then
            MAKEFILE="$VENDOR_PATH/spinel-vendor.mk"
          else
            MAKEFILE="$(find "$VENDOR_PATH" \
              -maxdepth 1 \
              -type f \
              -name '*-vendor.mk' \
              | head -1 || true)"
          fi

          test -n "$MAKEFILE"
          test -f "$MAKEFILE"

          cat >> "$MAKEFILE" <<'EOF'

          # ==========================================================
          # MediaTek radio / firmware partitions
          # ==========================================================

          PRODUCT_COPY_FILES += \
              vendor/xiaomi/spinel/radio/dpm.img:dpm.img \
              vendor/xiaomi/spinel/radio/gz.img:gz.img \
              vendor/xiaomi/spinel/radio/lk.img:lk.img \
              vendor/xiaomi/spinel/radio/mcupm.img:mcupm.img \
              vendor/xiaomi/spinel/radio/md1img.img:md1img.img \
              vendor/xiaomi/spinel/radio/pi_img.img:pi_img.img \
              vendor/xiaomi/spinel/radio/preloader_raw.img:preloader_raw.img \
              vendor/xiaomi/spinel/radio/scp.img:scp.img \
              vendor/xiaomi/spinel/radio/spmfw.img:spmfw.img \
              vendor/xiaomi/spinel/radio/sspm.img:sspm.img \
              vendor/xiaomi/spinel/radio/tee.img:tee.img
          EOF

      # ============================================================
      # 19. STAGE RADIO INTO FINAL ROOT
      # ============================================================

      - name: 📦 Add radio to final root
        run: |
          set -euxo pipefail

          mkdir -p "$VENDOR_PATH/radio"

          cp -af generated_root/radio/. \
            "$VENDOR_PATH/radio/"

          echo "Radio staged into vendor tree:"
          find "$VENDOR_PATH/radio" \
            -type f \
            -printf '%f\n' \
            | sort

          count=$(find "$VENDOR_PATH/radio" -type f | wc -l)

          if [ "$count" -ne 11 ]; then
            echo "ERROR: radio count is $count"
            exit 1
          fi

      # ============================================================
      # 20. INVENTORY DLKM / MI_EXT
      # ============================================================

      - name: 📊 Inventory unsupported partitions
        run: |
          set -euxo pipefail

          {
            echo "===== vendor_dlkm ====="
            find stock_dump/vendor_dlkm \
              -type f \
              2>/dev/null \
              | sort || true

            echo
            echo "===== odm_dlkm ====="

            find stock_dump/odm_dlkm \
              -type f \
              2>/dev/null \
              | sort || true

            echo
            echo "===== mi_ext ====="

            find stock_dump/mi_ext \
              -type f \
              2>/dev/null \
              | sort || true

          } > reports/unsupported-partitions.txt

      # ============================================================
      # 21. VERIFY VINTF
      # ============================================================

      - name: ✅ Verify VINTF
        run: |
          set -euxo pipefail

          test -f \
            "$VENDOR_PATH/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml"

          test -f \
            "$VENDOR_PATH/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml"

          echo "VINTF restoration: PASS"

      # ============================================================
      # 22. VERIFY RADIO
      # ============================================================

      - name: 📡 Verify radio tree
        run: |
          set -euxo pipefail

          expected=(
            dpm.img
            gz.img
            lk.img
            mcupm.img
            md1img.img
            pi_img.img
            preloader_raw.img
            scp.img
            spmfw.img
            sspm.img
            tee.img
          )

          for file in "${expected[@]}"; do
            test -f "$VENDOR_PATH/radio/$file"
            echo "PASS: $file"
          done

          echo "Radio tree: PASS"

      # ============================================================
      # 23. VERIFY CONTAMINATION
      # ============================================================

      - name: 🧪 Verify vendor tree contamination
        run: |
          set -euxo pipefail

          bad=0

          for dir in \
            system \
            system_ext \
            product \
            vendor_dlkm \
            odm_dlkm \
            mi_ext
          do

            if [ -e "$VENDOR_PATH/$dir" ]; then
              echo "ERROR: forbidden directory:"
              echo "$VENDOR_PATH/$dir"
              bad=1
            fi

          done

          if [ "$bad" -ne 0 ]; then
            exit 1
          fi

          echo "Vendor contamination: PASS"

      # ============================================================
      # 24. STAGE GENERATED TREE
      # ============================================================

      - name: 📦 Stage generated vendor tree
        run: |
          set -euxo pipefail

          rm -rf generated_root/vendor-tree
          mkdir -p generated_root/vendor-tree

          rsync -a \
            "$VENDOR_PATH/" \
            generated_root/vendor-tree/

          echo "Staged vendor tree:"
          find generated_root/vendor-tree \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -300

      # ============================================================
      # 25. INSTALL GENERATED TREE AT REPO ROOT
      # ============================================================

      - name: 📁 Install vendor tree into repository root
        run: |
          set -euxo pipefail

          # Remove previous generated root files.
          rm -f \
            Android.bp \
            Android.mk \
            BoardConfigVendor.mk \
            spinel-vendor.mk \
            proprietary-files.txt \
            extract-files.py \
            setup-makefiles.py

          rm -rf proprietary
          rm -rf radio

          # Copy generated vendor tree directly to ROOT.
          rsync -a \
            generated_root/vendor-tree/ \
            ./

          echo
          echo "===== FINAL ROOT ====="

          ls -lah

      # ============================================================
      # 26. REMOVE NESTED vendor/xiaomi/spinel
      # ============================================================

      - name: 🗑️ Remove nested vendor/xiaomi/spinel
        run: |
          set -euxo pipefail

          rm -rf vendor/xiaomi/spinel 2>/dev/null || true

          find vendor/xiaomi \
            -type d \
            -empty \
            -delete \
            2>/dev/null || true

          find vendor \
            -type d \
            -empty \
            -delete \
            2>/dev/null || true

          if [ -e "vendor/xiaomi/spinel" ]; then
            echo "ERROR: vendor/xiaomi/spinel still exists"
            exit 1
          fi

          echo "Nested vendor/xiaomi/spinel: REMOVED"

      # ============================================================
      # 27. FINAL ROOT VALIDATION
      # ============================================================

      - name: 🔍 Validate final repository layout
        run: |
          set -euxo pipefail

          required=(
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
            proprietary-files.txt
            extract-files.py
            setup-makefiles.py
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: missing root file: $file"
              exit 1
            fi

            echo "PASS: $file"
          done

          test -d proprietary
          test -d radio

          radio_count=$(find radio -type f | wc -l)

          if [ "$radio_count" -ne 11 ]; then
            echo "ERROR: expected 11 radio files, got $radio_count"
            exit 1
          fi

          if [ -e vendor/xiaomi/spinel ]; then
            echo "ERROR: nested vendor/xiaomi/spinel exists"
            exit 1
          fi

          echo
          echo "=========================================="
          echo " FINAL LAYOUT: PASS"
          echo "=========================================="

          echo
          echo "Root:"
          find . \
            -maxdepth 2 \
            -type f \
            ! -path './.git/*' \
            | sort

      # ============================================================
      # 28. FINAL REPORT
      # ============================================================

      - name: 📊 Generate final report
        run: |
          set -euxo pipefail

          {
            echo "=========================================="
            echo " spinel Vendor Tree Build Report"
            echo "=========================================="
            echo
            echo "Device        : spinel"
            echo "Platform      : MT6789"
            echo "Android base  : HyperOS 2 / Android 15"
            echo "Stock branch  : $STOCK_BRANCH"
            echo "Extract utils : $EXTRACT_UTILS_BRANCH"
            echo
            echo "Radio files:"
            find radio \
              -type f \
              -printf '%f\n' \
              | sort
            echo
            echo "Radio count:"
            find radio -type f | wc -l
            echo
            echo "Vendor blobs:"
            find proprietary/vendor \
              -type f \
              2>/dev/null \
              | wc -l || true
            echo
            echo "ODM blobs:"
            find proprietary/odm \
              -type f \
              2>/dev/null \
              | wc -l || true
            echo
            echo "=========================================="

          } | tee reports/final-report.txt

      # ============================================================
      # 29. CLEAN TEMPORARY BUILD DATA
      # ============================================================

      - name: 🧹 Clean temporary directories
        run: |
          set -euxo pipefail

          rm -rf stock_dump
          rm -rf extract-utils
          rm -rf generated_root

          echo "Temporary build data removed."

      # ============================================================
      # 30. GIT STATUS
      # ============================================================

      - name: 📋 Show Git status
        run: |
          set -euxo pipefail

          git status --short

      # ============================================================
      # 31. COMMIT
      # ============================================================

      - name: 🚀 Commit generated vendor tree
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "vendor: generate spinel blobs from HyperOS 2"

          git push

      # ============================================================
      # 32. UPLOAD REPORTS
      # ============================================================

      - name: 📤 Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree-reports
          path: reports/
          if-no-files-found: warn

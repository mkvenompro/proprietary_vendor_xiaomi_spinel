name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVICE: spinel
  VENDOR: xiaomi

  DUMP_REPO: https://gitlab.com/mkpromvp/dumber-2-mk.git
  DUMP_BRANCH: dump-redmi-spinel-os2.0.212.0.vpgmixm

  EXTRACT_UTILS_REPO: https://github.com/LineageOS/android_tools_extract-utils.git
  EXTRACT_UTILS_BRANCH: lineage-23.2

jobs:
  build-vendor:
    name: 🧬 Generate spinel vendor tree
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # ENVIRONMENT
      # ============================================================

      - name: 🧰 Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            python3-venv \
            rsync \
            unzip \
            zip \
            lz4 \
            brotli \
            libxml2-utils \
            android-sdk-libsparse-utils \
            file \
            patchelf \
            jq

          echo
          echo "=============================================="
          echo " ENVIRONMENT"
          echo "=============================================="

          echo "Python:"
          python3 --version

          echo
          echo "Git:"
          git --version

      # ============================================================
      # STOCK DUMP
      # ============================================================

      - name: 📦 Clone stock dump
        run: |
          set -e

          rm -rf stock_dump

          git clone \
            --depth=1 \
            --branch "${DUMP_BRANCH}" \
            "${DUMP_REPO}" \
            stock_dump

          echo
          echo "=============================================="
          echo " STOCK DUMP"
          echo "=============================================="

          echo "Repository : ${DUMP_REPO}"
          echo "Branch     : ${DUMP_BRANCH}"

          echo
          echo "Dump partitions:"

          find stock_dump \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            -printf '%f\n' \
            | sort

      # ============================================================
      # EXTRACT UTILS
      # ============================================================

      - name: 🧩 Clone Lineage extract-utils
        run: |
          set -e

          rm -rf tools/extract-utils

          git clone \
            --depth=1 \
            --branch "${EXTRACT_UTILS_BRANCH}" \
            "${EXTRACT_UTILS_REPO}" \
            tools/extract-utils

          test -f \
            tools/extract-utils/extract_utils/main.py

          echo
          echo "=============================================="
          echo " EXTRACT-UTILS"
          echo "=============================================="

          echo "Branch:"
          git -C tools/extract-utils branch --show-current

          echo
          echo "Commit:"
          git -C tools/extract-utils rev-parse HEAD

      # ============================================================
      # LOAD ORIGINAL LIST
      # ============================================================

      - name: 📋 Load proprietary-files.txt
        run: |
          set -e

          test -f \
            stock_dump/proprietary-files.txt

          cp \
            stock_dump/proprietary-files.txt \
            proprietary-files.stock.txt

          echo
          echo "=============================================="
          echo " ORIGINAL PROPRIETARY LIST"
          echo "=============================================="

          echo "Lines:"
          wc -l proprietary-files.stock.txt

          echo
          echo "First entries:"
          sed -n '1,50p' \
            proprietary-files.stock.txt

      # ============================================================
      # PARTITION ANALYSIS
      # ============================================================

      - name: 🔬 Analyze stock proprietary list
        shell: bash
        run: |
          set -e

          mkdir -p reports

          python3 <<'PY'
          from pathlib import Path
          from collections import Counter

          src = Path("proprietary-files.stock.txt")

          entries = []

          for raw in src.read_text(errors="ignore").splitlines():
              line = raw.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              entries.append(line)

          def get_source(line):
              value = line.strip()

              if value.startswith("-"):
                  value = value[1:].strip()

              return value.split(":", 1)[0].strip()

          partitions = Counter()

          for line in entries:
              source = get_source(line)

              if "/" in source:
                  partition = source.split("/", 1)[0]
              else:
                  partition = "(root)"

              partitions[partition] += 1

          print()
          print("==============================================")
          print(" COMPLETE PARTITION ANALYSIS")
          print("==============================================")

          for partition, count in sorted(partitions.items()):
              print(f"{partition:20} {count}")

          Path(
              "reports/partition-summary.txt"
          ).write_text(
              "\n".join(
                  f"{partition}: {count}"
                  for partition, count in sorted(partitions.items())
              ) + "\n"
          )
          PY

      # ============================================================
      # NORMALIZE PROPRIETARY LIST
      # ============================================================

      - name: 🧹 Normalize proprietary files
        shell: bash
        run: |
          set -e

          mkdir -p reports

          python3 <<'PY'
          from pathlib import Path

          dump = Path("stock_dump")
          source_list = Path("proprietary-files.stock.txt")

          normal = []
          system = []
          system_ext = []
          product = []
          mi_ext = []
          vendor_dlkm = []
          odm_dlkm = []
          unknown = []
          missing = []

          def parse(line):
              marker = ""

              value = line.strip()

              if value.startswith("-"):
                  marker = "-"
                  value = value[1:].strip()

              parts = value.split(":", 1)

              source = parts[0].strip()

              if len(parts) == 2:
                  destination = parts[1].strip()
                  value = source + ":" + destination
              else:
                  value = source

              return marker, value, source

          for raw in source_list.read_text(errors="ignore").splitlines():

              line = raw.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              marker, value, source = parse(line)

              partition = source.split("/", 1)[0]

              # ----------------------------------------------------
              # System
              # ----------------------------------------------------

              if partition == "system":
                  system.append(line)
                  continue

              # ----------------------------------------------------
              # System ext
              # ----------------------------------------------------

              if partition == "system_ext":
                  system_ext.append(line)
                  continue

              # ----------------------------------------------------
              # Product
              # ----------------------------------------------------

              if partition == "product":
                  product.append(line)
                  continue

              # ----------------------------------------------------
              # Xiaomi mi_ext
              # ----------------------------------------------------

              if partition == "mi_ext":
                  mi_ext.append(line)
                  continue

              # ----------------------------------------------------
              # Vendor DLKM
              # ----------------------------------------------------

              if partition == "vendor_dlkm":
                  vendor_dlkm.append(line)
                  continue

              # ----------------------------------------------------
              # ODM DLKM
              # ----------------------------------------------------

              if partition == "odm_dlkm":
                  odm_dlkm.append(line)
                  continue

              # ----------------------------------------------------
              # Standard extract-utils partitions
              # ----------------------------------------------------

              if partition in {
                  "vendor",
                  "odm",
                  "recovery",
              }:

                  source_path = dump / source

                  if source_path.exists():
                      normal.append(line)
                  else:
                      missing.append(line)

                  continue

              # ----------------------------------------------------
              # Unknown
              # ----------------------------------------------------

              unknown.append(line)

          # --------------------------------------------------------
          # Write files
          # --------------------------------------------------------

          Path("proprietary-files.txt").write_text(
              "\n".join(normal) +
              ("\n" if normal else "")
          )

          Path("reports/system.txt").write_text(
              "\n".join(system) +
              ("\n" if system else "")
          )

          Path("reports/system_ext.txt").write_text(
              "\n".join(system_ext) +
              ("\n" if system_ext else "")
          )

          Path("reports/product.txt").write_text(
              "\n".join(product) +
              ("\n" if product else "")
          )

          Path("reports/mi_ext.txt").write_text(
              "\n".join(mi_ext) +
              ("\n" if mi_ext else "")
          )

          Path("reports/vendor_dlkm.txt").write_text(
              "\n".join(vendor_dlkm) +
              ("\n" if vendor_dlkm else "")
          )

          Path("reports/odm_dlkm.txt").write_text(
              "\n".join(odm_dlkm) +
              ("\n" if odm_dlkm else "")
          )

          Path("reports/missing-sources.txt").write_text(
              "\n".join(missing) +
              ("\n" if missing else "")
          )

          Path("reports/unknown-partitions.txt").write_text(
              "\n".join(unknown) +
              ("\n" if unknown else "")
          )

          # --------------------------------------------------------
          # Console
          # --------------------------------------------------------

          print()
          print("==============================================")
          print(" NORMALIZATION")
          print("==============================================")

          print(
              f"Normal vendor/odm/recovery : {len(normal)}"
          )

          print(
              f"system                    : {len(system)}"
          )

          print(
              f"system_ext                : {len(system_ext)}"
          )

          print(
              f"product                   : {len(product)}"
          )

          print(
              f"mi_ext                    : {len(mi_ext)}"
          )

          print(
              f"vendor_dlkm               : {len(vendor_dlkm)}"
          )

          print(
              f"odm_dlkm                  : {len(odm_dlkm)}"
          )

          print(
              f"Missing                   : {len(missing)}"
          )

          print(
              f"Unknown                   : {len(unknown)}"
          )

          if mi_ext:
              print()
              print("MI_EXT entries:")

              for x in mi_ext:
                  print("  " + x)

          if vendor_dlkm:
              print()
              print("VENDOR_DLKM entries:")

              for x in vendor_dlkm:
                  print("  " + x)

          if odm_dlkm:
              print()
              print("ODM_DLKM entries:")

              for x in odm_dlkm:
                  print("  " + x)

          if missing:
              print()
              print("MISSING NORMAL ENTRIES:")

              for x in missing:
                  print("  " + x)

          if unknown:
              print()
              print("UNKNOWN PARTITIONS:")

              for x in unknown:
                  print("  " + x)

          PY

          echo
          echo "Normalized vendor list:"
          wc -l proprietary-files.txt

      # ============================================================
      # RESOLVE iwpriv
      # ============================================================

      - name: 🔧 Resolve malformed root-level blobs
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          prop = Path("proprietary-files.txt")
          report = Path("reports/resolved-paths.txt")

          lines = prop.read_text().splitlines()

          output = []
          resolutions = []

          for line in lines:

              value = line
              marker = ""

              if value.startswith("-"):
                  marker = "-"
                  value = value[1:].strip()

              source = value.split(":", 1)[0].strip()

              if source == "bin/iwpriv":

                  matches = sorted(
                      str(x.relative_to("stock_dump"))
                      for x in Path("stock_dump").rglob("iwpriv")
                      if x.is_file() or x.is_symlink()
                  )

                  print()
                  print("==============================================")
                  print(" RESOLVING iwpriv")
                  print("==============================================")

                  if len(matches) == 0:

                      print(
                          "No iwpriv found in stock dump."
                      )

                      resolutions.append(
                          "bin/iwpriv -> NOT FOUND"
                      )

                      continue

                  if len(matches) > 1:

                      print(
                          "Multiple iwpriv candidates:"
                      )

                      for match in matches:
                          print(
                              "  " + match
                          )

                      raise SystemExit(
                          "Refusing to guess iwpriv location."
                      )

                  resolved = matches[0]

                  print(
                      f"Resolved: {source} -> {resolved}"
                  )

                  if ":" in value:

                      destination = value.split(
                          ":",
                          1
                      )[1]

                      new_value = (
                          resolved +
                          ":" +
                          destination
                      )

                  else:
                      new_value = resolved

                  output.append(
                      marker + new_value
                  )

                  resolutions.append(
                      f"{source} -> {resolved}"
                  )

                  continue

              output.append(line)

          prop.write_text(
              "\n".join(output) +
              ("\n" if output else "")
          )

          report.write_text(
              "\n".join(resolutions) +
              ("\n" if resolutions else "")
          )

          PY

      # ============================================================
      # FINAL SOURCE VALIDATION
      # ============================================================

      - name: 🚦 Validate source files
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          dump = Path("stock_dump")
          prop = Path("proprietary-files.txt")

          missing = []

          entries = []

          for raw in prop.read_text().splitlines():

              line = raw.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              entries.append(line)

              value = line

              if value.startswith("-"):
                  value = value[1:].strip()

              source = value.split(
                  ":",
                  1
              )[0].strip()

              if not (dump / source).exists():
                  missing.append(line)

          Path(
              "reports/final-missing-sources.txt"
          ).write_text(
              "\n".join(missing) +
              ("\n" if missing else "")
          )

          print()
          print("==============================================")
          print(" FINAL SOURCE VALIDATION")
          print("==============================================")

          print(
              f"Entries : {len(entries)}"
          )

          print(
              f"Missing : {len(missing)}"
          )

          if missing:

              print()

              for item in missing:
                  print(
                      "  " + item
                  )

              raise SystemExit(
                  "Missing standard source files."
              )

          print()
          print("PASS")

          PY

      # ============================================================
      # PARTITION VALIDATION
      # ============================================================

      - name: 🛡️ Validate extraction partitions
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          allowed = {
              "vendor",
              "odm",
              "recovery",
          }

          bad = []

          for n, raw in enumerate(
              Path("proprietary-files.txt").read_text().splitlines(),
              1
          ):

              line = raw.strip()

              if not line:
                  continue

              if line.startswith("#"):
                  continue

              value = line

              if value.startswith("-"):
                  value = value[1:].strip()

              source = value.split(
                  ":",
                  1
              )[0].strip()

              partition = source.split(
                  "/",
                  1
              )[0]

              if partition not in allowed:

                  bad.append(
                      (n, line)
                  )

          if bad:

              echo=""

              echo

              print(
                  "Unsupported entries:"
              )

              for n, line in bad:

                  print(
                      f"{n}: {line}"
                  )

              raise SystemExit(1)

          print()
          print(
              "PASS: proprietary-files.txt contains only "
              "vendor/odm/recovery entries."
          )

          PY

      # ============================================================
      # PREPARE DEVICE TREE
      # ============================================================

      - name: 📂 Prepare device tree
        run: |
          set -e

          mkdir -p \
            "device/${VENDOR}/${DEVICE}"

          mkdir -p \
            "vendor/${VENDOR}/${DEVICE}"

          cp \
            proprietary-files.txt \
            "device/${VENDOR}/${DEVICE}/proprietary-files.txt"

      # ============================================================
      # GENERATE extract-files.py
      #
      # IMPORTANT:
      #
      # add_firmware_proprietary_file = FALSE
      #
      # This prevents extract-utils from requiring:
      #
      # device/xiaomi/spinel/proprietary-firmware.txt
      #
      # ============================================================

      - name: 📝 Generate extract-files.py
        shell: bash
        run: |
          set -e

          cat > \
            "device/${VENDOR}/${DEVICE}/extract-files.py" <<'PY'
          #!/usr/bin/env -S PYTHONPATH=../../../tools/extract-utils python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )


          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=True,
              add_firmware_proprietary_file=False,
          )


          if __name__ == "__main__":
              utils = ExtractUtils.device(module)
              utils.run()
          PY

          chmod +x \
            "device/${VENDOR}/${DEVICE}/extract-files.py"

          echo
          echo "=============================================="
          echo " GENERATED extract-files.py"
          echo "=============================================="

          cat \
            "device/${VENDOR}/${DEVICE}/extract-files.py"

      # ============================================================
      # GENERATE setup-makefiles.py
      # ============================================================

      - name: 📝 Generate setup-makefiles.py
        shell: bash
        run: |
          set -e

          cat > \
            "device/${VENDOR}/${DEVICE}/setup-makefiles.py" <<'PY'
          #!/usr/bin/env -S PYTHONPATH=../../../tools/extract-utils python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )


          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=True,
              add_firmware_proprietary_file=False,
          )


          if __name__ == "__main__":
              utils = ExtractUtils.device(module)
              utils.run()
          PY

          chmod +x \
            "device/${VENDOR}/${DEVICE}/setup-makefiles.py"

          echo
          echo "=============================================="
          echo " GENERATED setup-makefiles.py"
          echo "=============================================="

          cat \
            "device/${VENDOR}/${DEVICE}/setup-makefiles.py"

      # ============================================================
      # HARD VERIFY
      #
      # If TRUE appears anywhere, stop immediately.
      # ============================================================

      - name: 🔐 Verify firmware extraction is disabled
        shell: bash
        run: |
          set -e

          echo
          echo "=============================================="
          echo " VERIFY EXTRACT CONFIG"
          echo "=============================================="

          grep \
            -n \
            "add_firmware_proprietary_file" \
            "device/${VENDOR}/${DEVICE}/extract-files.py"

          grep \
            -n \
            "add_firmware_proprietary_file" \
            "device/${VENDOR}/${DEVICE}/setup-makefiles.py"

          if grep -R \
            -n \
            "add_firmware_proprietary_file=True" \
            "device/${VENDOR}/${DEVICE}"
          then
            echo
            echo "ERROR:"
            echo "add_firmware_proprietary_file=True still exists."

            exit 1
          fi

          echo
          echo "PASS:"
          echo "Firmware proprietary-file parsing is disabled."

          if [ -f \
            "device/${VENDOR}/${DEVICE}/proprietary-firmware.txt"
          ]; then

            echo
            echo "WARNING:"
            echo "proprietary-firmware.txt already exists."

          else

            echo
            echo "proprietary-firmware.txt is not required."

          fi

      # ============================================================
      # EXTRACT VENDOR BLOBS
      # ============================================================

      - name: 🧬 Extract vendor blobs
        env:
          PYTHONPATH: ${{ github.workspace }}/tools/extract-utils
        shell: bash
        run: |
          set -e

          cd \
            "device/${VENDOR}/${DEVICE}"

          echo
          echo "=============================================="
          echo " LINEAGE EXTRACT-UTILS"
          echo "=============================================="

          echo
          echo "Working directory:"
          pwd

          echo
          echo "Proprietary list:"
          wc -l proprietary-files.txt

          echo
          echo "Running extraction..."

          python3 \
            extract-files.py \
            --kang \
            "${GITHUB_WORKSPACE}/stock_dump"

      # ============================================================
      # INSPECT GENERATED TREE
      # ============================================================

      - name: 🔍 Inspect generated vendor tree
        if: always()
        shell: bash
        run: |
          mkdir -p reports

          echo
          echo "=============================================="
          echo " GENERATED VENDOR TREE"
          echo "=============================================="

          if [ -d \
            "vendor/${VENDOR}/${DEVICE}"
          ]; then

            find \
              "vendor/${VENDOR}/${DEVICE}" \
              \( -type f -o -type l \) \
              | sort \
              > reports/generated-files.txt

            echo
            echo "Generated file count:"

            wc -l \
              reports/generated-files.txt

            echo
            echo "Top-level tree:"

            find \
              "vendor/${VENDOR}/${DEVICE}" \
              -maxdepth 3 \
              -print \
              | sort \
              | head -300

          else

            echo \
              "Vendor tree was not generated."

            : > \
              reports/generated-files.txt

          fi

      # ============================================================
      # DLKM INVENTORY
      # ============================================================

      - name: 🧩 Inventory DLKM
        if: always()
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo " DLKM INVENTORY"
          echo "=============================================="

          echo
          echo "vendor_dlkm proprietary entries:"

          cat \
            reports/vendor_dlkm.txt \
            2>/dev/null \
            || true

          echo
          echo "vendor_dlkm actual files:"

          find \
            stock_dump/vendor_dlkm \
            \( -type f -o -type l \) \
            2>/dev/null \
            | sort \
            > reports/vendor_dlkm-files.txt \
            || true

          wc -l \
            reports/vendor_dlkm-files.txt \
            2>/dev/null \
            || true

          echo
          echo "odm_dlkm proprietary entries:"

          cat \
            reports/odm_dlkm.txt \
            2>/dev/null \
            || true

          echo
          echo "odm_dlkm actual files:"

          find \
            stock_dump/odm_dlkm \
            \( -type f -o -type l \) \
            2>/dev/null \
            | sort \
            > reports/odm_dlkm-files.txt \
            || true

          wc -l \
            reports/odm_dlkm-files.txt \
            2>/dev/null \
            || true

      # ============================================================
      # MI_EXT INVENTORY
      # ============================================================

      - name: 🧩 Inventory mi_ext
        if: always()
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo " MI_EXT INVENTORY"
          echo "=============================================="

          echo
          echo "mi_ext proprietary entries:"

          cat \
            reports/mi_ext.txt \
            2>/dev/null \
            || true

          echo
          echo "Actual mi_ext files:"

          find \
            stock_dump/mi_ext \
            \( -type f -o -type l \) \
            2>/dev/null \
            | sort \
            > reports/mi_ext-files.txt \
            || true

          wc -l \
            reports/mi_ext-files.txt \
            2>/dev/null \
            || true

      # ============================================================
      # GENERATED TREE CONTAMINATION CHECK
      # ============================================================

      - name: 🚫 Check vendor tree contamination
        if: always()
        shell: bash
        run: |
          bad=0

          for path in \
            "vendor/${VENDOR}/${DEVICE}/proprietary/system" \
            "vendor/${VENDOR}/${DEVICE}/proprietary/system_ext" \
            "vendor/${VENDOR}/${DEVICE}/proprietary/product" \
            "vendor/${VENDOR}/${DEVICE}/proprietary/mi_ext" \
            "vendor/${VENDOR}/${DEVICE}/proprietary/vendor_dlkm" \
            "vendor/${VENDOR}/${DEVICE}/proprietary/odm_dlkm"
          do

            if [ -e "$path" ]; then

              echo
              echo "ERROR: forbidden path:"
              echo "$path"

              bad=1

            fi

          done

          if [ "$bad" -ne 0 ]; then
            exit 1
          fi

          echo
          echo "PASS:"
          echo "No system/system_ext/product/mi_ext/DLKM contamination."

      # ============================================================
      # ANALYZE GENERATED TREE
      # ============================================================

      - name: 📊 Analyze generated vendor tree
        if: always()
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo " GENERATED TREE ANALYSIS"
          echo "=============================================="

          if [ -f \
            reports/generated-files.txt
          ]; then

            echo
            echo "Total generated files:"

            wc -l \
              reports/generated-files.txt

            echo
            echo "By top-level directory:"

            awk -F/ '
              NF >= 1 {
                count[$1]++
              }
              END {
                for (x in count)
                  print count[x], x
              }
            ' \
              reports/generated-files.txt \
              | sort -nr

          fi

      # ============================================================
      # FINAL REPORT
      # ============================================================

      - name: 📊 Generate final report
        if: always()
        shell: bash
        run: |
          mkdir -p reports

          {
            echo "=============================================="
            echo " SPINEL LINEAGE VENDOR TREE REPORT"
            echo "=============================================="

            echo
            echo "Device       : ${DEVICE}"
            echo "Vendor       : ${VENDOR}"
            echo "Dump branch  : ${DUMP_BRANCH}"
            echo "Extract utils: ${EXTRACT_UTILS_BRANCH}"

            echo
            echo "=============================================="
            echo " PARTITIONS"
            echo "=============================================="

            cat \
              reports/partition-summary.txt \
              2>/dev/null \
              || true

            echo
            echo "=============================================="
            echo " NORMALIZED"
            echo "=============================================="

            wc -l \
              proprietary-files.txt \
              2>/dev/null \
              || true

            echo
            echo "=============================================="
            echo " MI_EXT"
            echo "=============================================="

            wc -l \
              reports/mi_ext.txt \
              2>/dev/null \
              || true

            echo
            echo "=============================================="
            echo " VENDOR_DLKM"
            echo "=============================================="

            wc -l \
              reports/vendor_dlkm.txt \
              2>/dev/null \
              || true

            echo
            echo "=============================================="
            echo " ODM_DLKM"
            echo "=============================================="

            wc -l \
              reports/odm_dlkm.txt \
              2>/dev/null \
              || true

            echo
            echo "=============================================="
            echo " MISSING"
            echo "=============================================="

            cat \
              reports/final-missing-sources.txt \
              2>/dev/null \
              || true

            echo
            echo "=============================================="
            echo " RESOLVED PATHS"
            echo "=============================================="

            cat \
              reports/resolved-paths.txt \
              2>/dev/null \
              || true

            echo
            echo "=============================================="
            echo " GENERATED FILES"
            echo "=============================================="

            wc -l \
              reports/generated-files.txt \
              2>/dev/null \
              || true

          } > \
            reports/vendor-tree-report.txt

          echo
          cat \
            reports/vendor-tree-report.txt

      # ============================================================
      # GIT STATUS
      # ============================================================

      - name: 📊 Git status
        if: always()
        run: |
          echo
          echo "=============================================="
          echo " GIT STATUS"
          echo "=============================================="

          git status --short

          echo
          echo "Tracked files:"
          git ls-files | wc -l

      # ============================================================
      # COMMIT GENERATED TREE
      # ============================================================

      - name: 💾 Commit generated tree
        if: success()
        shell: bash
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # --------------------------------------------------------
          # Temporary files must never enter vendor repository
          # --------------------------------------------------------

          rm -rf reports

          rm -f \
            proprietary-files.stock.txt

          git add \
            "device/${VENDOR}/${DEVICE}" \
            "vendor/${VENDOR}/${DEVICE}"

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "vendor: generate spinel blobs from HyperOS 2.0.212.0"

            git push

          fi

      # ============================================================
      # REPORT ARTIFACT
      # ============================================================

      - name: 📦 Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-tree-reports
          path: |
            reports/
            proprietary-files.stock.txt
            proprietary-files.txt
            device/xiaomi/spinel/extract-files.py
            device/xiaomi/spinel/setup-makefiles.py
          retention-days: 14
          if-no-files-found: warn

      # ============================================================
      # VENDOR TREE ARTIFACT
      # ============================================================

      - name: 📦 Upload generated vendor tree
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: proprietary_vendor_xiaomi_spinel
          path: |
            vendor/xiaomi/spinel/
          retention-days: 14
          if-no-files-found: error

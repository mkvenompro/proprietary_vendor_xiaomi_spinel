name: 🧬 Build LineageOS Vendor Tree • spinel

on:
  workflow_dispatch:
    inputs:
      STOCK_FASTBOOT_URL:
        description: "Optional Xiaomi Fastboot ROM URL"
        required: false
        default: "https://bigota.d.miui.com/OS2.0.212.0.VPGMIXM/spinel_global_images_OS2.0.212.0.VPGMIXM_20260311.0000.00_15.0_global_1e7d24d317.tgz"
        type: string

      STOCK_DUMP_URL:
        description: "Stock dump Git repository"
        required: false
        default: "https://gitlab.com/mkpromvp/dumber-2-mk.git"
        type: string

      STOCK_DUMP_BRANCH:
        description: "Stock dump branch"
        required: false
        default: "dump-redmi-spinel-os2.0.212.0.vpgmixm"
        type: string

      EXTRACT_UTILS_URL:
        description: "Lineage extract-utils repository"
        required: false
        default: "https://github.com/LineageOS/android_tools_extract-utils.git"
        type: string

      EXTRACT_UTILS_BRANCH:
        description: "extract-utils branch"
        required: false
        default: "lineage-23.2"
        type: string

      DOWNLOAD_FASTBOOT:
        description: "Download and extract Xiaomi Fastboot ROM for radio firmware"
        required: false
        default: false
        type: boolean

      UPLOAD_ARTIFACTS:
        description: "Upload generated vendor tree artifact"
        required: false
        default: true
        type: boolean

      COMMIT_CHANGES:
        description: "Commit and push generated files"
        required: false
        default: true
        type: boolean


permissions:
  contents: write


jobs:
  generate:
    name: 🧬 Generate Vendor Tree
    runs-on: ubuntu-24.04

    env:
      DEVICE: spinel
      VENDOR: xiaomi
      DEVICE_PATH: device/xiaomi/spinel
      STOCK_DUMP_DIR: stock_dump
      EXTRACT_UTILS_DIR: extract-utils
      ROM_DIR: fastboot_rom
      STAGING_ROOT: staging_android_root

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================
      - name: 🧰 Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-lfs \
            python3 \
            python3-pip \
            python3-venv \
            p7zip-full \
            unzip \
            rsync \
            curl \
            wget \
            file \
            cpio \
            lz4 \
            brotli \
            zstd \
            xz-utils \
            tar \
            gzip \
            bzip2 \
            coreutils \
            findutils \
            sed \
            gawk

          git lfs install --skip-smudge

          python3 --version
          git --version
          git-lfs --version
          7z i | head -n 5

      # ============================================================
      # 3. GIT NETWORK CONFIGURATION
      # ============================================================
      - name: 🌐 Configure Git networking
        shell: bash
        run: |
          set -euxo pipefail

          git config --global http.version HTTP/1.1
          git config --global http.maxRequests 2
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global fetch.parallel 1

          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 600

      # ============================================================
      # 4. CLONE STOCK DUMP
      # ============================================================
      - name: 📦 Clone stock dump
        shell: bash
        env:
          DUMP_URL: ${{ inputs.STOCK_DUMP_URL }}
          DUMP_BRANCH: ${{ inputs.STOCK_DUMP_BRANCH }}
        run: |
          set -euxo pipefail

          rm -rf "$STOCK_DUMP_DIR"

          clone_ok=false

          for attempt in 1 2 3 4 5; do
            echo
            echo "============================================================"
            echo " STOCK DUMP CLONE ATTEMPT $attempt / 5"
            echo "============================================================"

            rm -rf "$STOCK_DUMP_DIR"

            if GIT_LFS_SKIP_SMUDGE=1 git clone \
                --depth 1 \
                --single-branch \
                --no-tags \
                --branch "$DUMP_BRANCH" \
                "$DUMP_URL" \
                "$STOCK_DUMP_DIR"; then

              clone_ok=true
              break
            fi

            echo "⚠️ Clone attempt $attempt failed."

            rm -rf "$STOCK_DUMP_DIR"

            sleep $((attempt * 10))
          done

          if [[ "$clone_ok" != "true" ]]; then
            echo "::error::Unable to clone stock dump after 5 attempts."
            exit 1
          fi

          cd "$STOCK_DUMP_DIR"

          git status
          git rev-parse HEAD
          git branch --show-current

          echo
          echo "===== STOCK DUMP TOP LEVEL ====="
          find . -maxdepth 2 -type f | head -n 100

          echo
          echo "===== STOCK DUMP SIZE ====="
          du -sh .

      # ============================================================
      # 5. FETCH LFS OBJECTS
      # ============================================================
      - name: 📦 Fetch stock dump LFS objects
        shell: bash
        run: |
          set -euxo pipefail

          cd "$STOCK_DUMP_DIR"

          if git lfs ls-files | grep -q .; then
            echo "LFS files detected."

            lfs_ok=false

            for attempt in 1 2 3 4 5; do
              echo
              echo "============================================================"
              echo " LFS FETCH ATTEMPT $attempt / 5"
              echo "============================================================"

              if git lfs pull --include="*"; then
                lfs_ok=true
                break
              fi

              echo "⚠️ LFS attempt $attempt failed."
              sleep $((attempt * 10))
            done

            if [[ "$lfs_ok" != "true" ]]; then
              echo "::error::Unable to fetch stock dump LFS objects."
              exit 1
            fi
          else
            echo "No Git LFS files detected."
          fi

          cd ..

          echo
          echo "===== VERIFY STOCK DUMP ====="

          test -d "$STOCK_DUMP_DIR"
          test -f "$STOCK_DUMP_DIR/proprietary-files.txt"

          echo "Stock dump is valid."

      # ============================================================
      # 6. LOCATE PROPRIETARY LIST
      # ============================================================
      - name: 🔎 Locate proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== SEARCHING PROPRIETARY FILES ====="

          find "$STOCK_DUMP_DIR" \
            -type f \
            -name "proprietary-files.txt" \
            -print

          LIST=""

          if [[ -f "$STOCK_DUMP_DIR/proprietary-files.txt" ]]; then
            LIST="$STOCK_DUMP_DIR/proprietary-files.txt"
          else
            LIST="$(find "$STOCK_DUMP_DIR" \
              -type f \
              -name "proprietary-files.txt" \
              -print -quit)"
          fi

          if [[ -z "$LIST" || ! -f "$LIST" ]]; then
            echo "::error::Could not find proprietary-files.txt."
            exit 1
          fi

          echo "FOUND_LIST=$LIST" >> "$GITHUB_ENV"

          echo
          echo "Using:"
          echo "$LIST"

          wc -l "$LIST"

      # ============================================================
      # 7. NORMALIZE PROPRIETARY LIST
      # ============================================================
      - name: 🧹 Normalize proprietary-files.txt
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          cp "$FOUND_LIST" proprietary-files.stock.txt

          python3 <<'PY'
          from pathlib import Path

          src = Path("proprietary-files.stock.txt")
          dst = Path("proprietary-files.txt")

          blocked_prefixes = (
              "system/",
              "system_ext/",
              "product/",
              "vendor_dlkm/",
              "odm_dlkm/",
              "mi_ext/",
          )

          remove_exact = {
              "vendor/odm/etc/vintf/manifest_nonfc_dsds.xml",
              "vendor/odm/etc/vintf/manifest_nonfc_ss.xml",
              "bin/iwpriv",
          }

          removed = []
          kept = []

          for raw in src.read_text(errors="replace").splitlines():
              line = raw.strip()

              if not line:
                  kept.append(raw)
                  continue

              if line.startswith("#"):
                  kept.append(raw)
                  continue

              # Extract source path only.
              item = line

              if item.startswith("-"):
                  item = item[1:]

              item = item.split(":", 1)[0]
              item = item.split(";", 1)[0]
              item = item.split("|", 1)[0]

              item = item.strip()

              if item in remove_exact:
                  removed.append(item)
                  continue

              if item.startswith(blocked_prefixes):
                  removed.append(item)
                  continue

              kept.append(raw)

          # iwpriv is supplied as a vendor blob.
          iwpriv_entry = "vendor/bin/iwpriv"

          has_iwpriv = False

          for line in kept:
              item = line.strip()

              if item.startswith("-"):
                  item = item[1:]

              item = item.split(":", 1)[0]
              item = item.split(";", 1)[0]
              item = item.split("|", 1)[0]

              if item.strip() == iwpriv_entry:
                  has_iwpriv = True
                  break

          if not has_iwpriv:
              kept.append(iwpriv_entry)

          dst.write_text("\n".join(kept) + "\n")

          Path("reports/removed-files.txt").write_text(
              "\n".join(sorted(set(removed))) + "\n"
          )

          print(f"Removed: {len(removed)}")
          print(f"Final lines: {len(kept)}")
          PY

          echo
          echo "===== NORMALIZED LIST ====="

          wc -l proprietary-files.txt

          echo
          echo "===== CHECK BLOCKED PARTITIONS ====="

          if grep -E '^(system|system_ext|product|vendor_dlkm|odm_dlkm|mi_ext)/' \
              proprietary-files.txt; then
            echo "::error::Forbidden partition entries remain."
            exit 1
          fi

          echo "No forbidden partition entries."

          echo
          echo "===== CHECK MISSING SOURCE FILES ====="

          python3 <<'PY'
          from pathlib import Path

          dump = Path("stock_dump")
          plist = Path("proprietary-files.txt")

          missing = []

          for raw in plist.read_text(errors="replace").splitlines():
              line = raw.strip()

              if not line or line.startswith("#"):
                  continue

              src = line

              if src.startswith("-"):
                  src = src[1:]

              src = src.split(":", 1)[0]
              src = src.split(";", 1)[0]
              src = src.split("|", 1)[0]
              src = src.strip()

              # vendor/bin/iwpriv is a normalized path.
              candidates = [
                  dump / src,
              ]

              if src.startswith("vendor/"):
                  candidates.append(dump / src[len("vendor/"):])

              if not any(p.is_file() for p in candidates):
                  missing.append(src)

          if missing:
              print("Missing files:")
              for item in missing[:200]:
                  print(item)

              print(f"\nTotal missing: {len(missing)}")
              raise SystemExit(1)

          print("All proprietary source files exist.")
          PY

      # ============================================================
      # 8. CLONE EXTRACT UTILS
      # ============================================================
      - name: 🧬 Clone Lineage extract-utils
        shell: bash
        env:
          EXTRACT_URL: ${{ inputs.EXTRACT_UTILS_URL }}
          EXTRACT_BRANCH: ${{ inputs.EXTRACT_UTILS_BRANCH }}
        run: |
          set -euxo pipefail

          rm -rf "$EXTRACT_UTILS_DIR"

          git clone \
            --depth 1 \
            --single-branch \
            --no-tags \
            --branch "$EXTRACT_BRANCH" \
            "$EXTRACT_URL" \
            "$EXTRACT_UTILS_DIR"

          test -d "$EXTRACT_UTILS_DIR/extract_utils"

          echo "EXTRACT_UTILS_ROOT=$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 9. CONFIGURE PYTHONPATH
      # ============================================================
      - name: 🐍 Configure extract-utils Python path
        shell: bash
        run: |
          set -euxo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR${PYTHONPATH:+:$PYTHONPATH}"

          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"

          python3 - <<'PY'
          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          print("extract-utils import: OK")
          print(ExtractUtils)
          print(ExtractUtilsModule)
          PY

      # ============================================================
      # 10. PREPARE REAL ANDROID ROOT
      # ============================================================
      - name: 🏗️ Prepare Android root staging tree
        shell: bash
        run: |
          set -euxo pipefail

          WORK_PARENT="$GITHUB_WORKSPACE/$STAGING_ROOT"

          rm -rf "$WORK_PARENT"

          mkdir -p \
            "$WORK_PARENT/device/xiaomi/spinel" \
            "$WORK_PARENT/tools"

          echo "WORK_PARENT=$WORK_PARENT" >> "$GITHUB_ENV"

          # Link extract-utils into the Android root.
          ln -s \
            "$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR" \
            "$WORK_PARENT/tools/extract-utils"

          # IMPORTANT:
          # Do NOT use a symlink for device/xiaomi/spinel.
          # The previous workflow failed because the symlink target
          # did not exist. This is a REAL directory now.

          cp \
            proprietary-files.txt \
            "$WORK_PARENT/device/xiaomi/spinel/proprietary-files.txt"

          test -f \
            "$WORK_PARENT/device/xiaomi/spinel/proprietary-files.txt"

          echo
          echo "===== STAGING TREE ====="

          find "$WORK_PARENT/device/xiaomi/spinel" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n'

          echo
          echo "===== VERIFY STAGING PATH ====="

          test -d "$WORK_PARENT/device/xiaomi/spinel"
          test -f "$WORK_PARENT/device/xiaomi/spinel/proprietary-files.txt"

          pwd
          ls -ld "$WORK_PARENT"
          ls -ld "$WORK_PARENT/device"
          ls -ld "$WORK_PARENT/device/xiaomi"
          ls -ld "$WORK_PARENT/device/xiaomi/spinel"

      # ============================================================
      # 11. CREATE extract-files.py
      # ============================================================
      - name: 🐍 Create extract-files.py
        shell: bash
        run: |
          set -euxo pipefail

          cat > "$WORK_PARENT/device/xiaomi/spinel/extract-files.py" <<'PY'
          #!/usr/bin/env -S PYTHONPATH=../../../tools/extract-utils python3

          from extract_utils.main import (
              ExtractUtils,
              ExtractUtilsModule,
          )

          module = ExtractUtilsModule(
              "spinel",
              "xiaomi",
              check_elf=True,
              add_firmware_proprietary_file=False,
          )

          if __name__ == "__main__":
              utils = ExtractUtils.device(module)
              utils.run()
          PY

          chmod +x "$WORK_PARENT/device/xiaomi/spinel/extract-files.py"

          test -x "$WORK_PARENT/device/xiaomi/spinel/extract-files.py"

          sed -n '1,120p' \
            "$WORK_PARENT/device/xiaomi/spinel/extract-files.py"

      # ============================================================
      # 12. PREPARE REPORT DIRECTORY
      # ============================================================
      - name: 📝 Prepare reports
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p reports

          cp \
            proprietary-files.txt \
            reports/proprietary-files-final.txt

          {
            echo "Device: $DEVICE"
            echo "Vendor: $VENDOR"
            echo "Dump: ${{ inputs.STOCK_DUMP_URL }}"
            echo "Dump branch: ${{ inputs.STOCK_DUMP_BRANCH }}"
            echo "Extract utils: ${{ inputs.EXTRACT_UTILS_URL }}"
            echo "Extract branch: ${{ inputs.EXTRACT_UTILS_BRANCH }}"
            echo
            echo "Proprietary entries:"
            grep -vE '^[[:space:]]*(#|$)' proprietary-files.txt | wc -l
          } > reports/build-info.txt

      # ============================================================
      # 13. EXTRACT PROPRIETARY BLOBS
      # ============================================================
      - name: 🧬 Extract proprietary blobs
        shell: bash
        run: |
          set -euxo pipefail

          cd "$WORK_PARENT"

          echo
          echo "============================================================"
          echo " STARTING LINEAGE EXTRACT-UTILS"
          echo "============================================================"

          echo "PWD=$(pwd)"
          echo "Source=$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"
          echo "Device tree=$(pwd)/device/xiaomi/spinel"

          test -d device/xiaomi/spinel
          test -f device/xiaomi/spinel/proprietary-files.txt
          test -x device/xiaomi/spinel/extract-files.py

          PYTHONPATH="$GITHUB_WORKSPACE/$EXTRACT_UTILS_DIR" \
            python3 \
            device/xiaomi/spinel/extract-files.py \
            "$GITHUB_WORKSPACE/$STOCK_DUMP_DIR"

          echo
          echo "============================================================"
          echo " EXTRACTION FINISHED"
          echo "============================================================"

          test -d vendor/xiaomi/spinel

          echo
          echo "===== GENERATED VENDOR TREE ====="

          find vendor/xiaomi/spinel \
            -maxdepth 3 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort \
            | head -n 200

          echo
          echo "===== VENDOR TREE SIZE ====="

          du -sh vendor/xiaomi/spinel

      # ============================================================
      # 14. RESTORE MANUAL VINTF FILES
      # ============================================================
      - name: 🛠️ Restore manual ODM VINTF manifests
        shell: bash
        run: |
          set -euxo pipefail

          DEST="$WORK_PARENT/vendor/xiaomi/spinel/proprietary/odm/etc/vintf"

          mkdir -p "$DEST"

          restored=0

          for file in \
            manifest_nonfc_dsds.xml \
            manifest_nonfc_ss.xml; do

            if [[ -f "$STOCK_DUMP_DIR/vendor/odm/etc/vintf/$file" ]]; then
              cp -v \
                "$STOCK_DUMP_DIR/vendor/odm/etc/vintf/$file" \
                "$DEST/$file"

              restored=$((restored + 1))
            else
              echo "⚠️ Missing source VINTF: $file"
            fi
          done

          {
            echo "Manual VINTF restoration"
            echo "Restored: $restored"
            echo
            find "$DEST" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
          } > reports/manual-vintf.txt

          echo
          cat reports/manual-vintf.txt

      # ============================================================
      # 15. COPY VINTF MAKE RULES
      # ============================================================
      - name: 🧩 Add manual VINTF make rules
        shell: bash
        run: |
          set -euxo pipefail

          MK="$WORK_PARENT/vendor/xiaomi/spinel/spinel-vendor.mk"

          if [[ -f "$MK" ]]; then
            cat >> "$MK" <<'EOF'

          # Manually restored ODM VINTF manifests.
          PRODUCT_COPY_FILES += \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_dsds.xml \
              vendor/xiaomi/spinel/proprietary/odm/etc/vintf/manifest_nonfc_ss.xml:$(TARGET_COPY_OUT_VENDOR)/odm/etc/vintf/manifest_nonfc_ss.xml
          EOF
          else
            echo "⚠️ spinel-vendor.mk was not generated."
          fi

      # ============================================================
      # 16. OPTIONAL FASTBOOT ROM
      # ============================================================
      - name: 📦 Download Xiaomi Fastboot ROM
        if: ${{ inputs.DOWNLOAD_FASTBOOT }}
        shell: bash
        env:
          FASTBOOT_URL: ${{ inputs.STOCK_FASTBOOT_URL }}
        run: |
          set -euxo pipefail

          rm -rf "$ROM_DIR"
          mkdir -p "$ROM_DIR"

          FILE_NAME="$(basename "$FASTBOOT_URL")"
          ARCHIVE="$ROM_DIR/$FILE_NAME"

          download_ok=false

          for attempt in 1 2 3 4 5; do
            echo
            echo "============================================================"
            echo " FASTBOOT DOWNLOAD ATTEMPT $attempt / 5"
            echo "============================================================"

            if curl \
              --fail \
              --location \
              --retry 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 0 \
              --continue-at - \
              --output "$ARCHIVE" \
              "$FASTBOOT_URL"; then

              download_ok=true
              break
            fi

            echo "⚠️ Fastboot download attempt $attempt failed."
            sleep $((attempt * 10))
          done

          if [[ "$download_ok" != "true" ]]; then
            echo "::error::Fastboot ROM download failed."
            exit 1
          fi

          test -s "$ARCHIVE"

          echo
          echo "===== FASTBOOT ARCHIVE ====="

          ls -lh "$ARCHIVE"
          file "$ARCHIVE"

      # ============================================================
      # 17. EXTRACT FASTBOOT ROM
      # ============================================================
      - name: 📂 Extract Xiaomi Fastboot ROM
        if: ${{ inputs.DOWNLOAD_FASTBOOT }}
        shell: bash
        run: |
          set -euxo pipefail

          ARCHIVE="$(find "$ROM_DIR" -maxdepth 1 -type f | head -n 1)"

          test -n "$ARCHIVE"
          test -f "$ARCHIVE"

          mkdir -p "$ROM_DIR/extracted"

          7z x \
            "$ARCHIVE" \
            "-o$ROM_DIR/extracted" \
            -y

          echo
          echo "===== FASTBOOT EXTRACTION ====="

          find "$ROM_DIR/extracted" \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -n 300

      # ============================================================
      # 18. COPY RADIO FIRMWARE
      # ============================================================
      - name: 📡 Copy radio firmware
        if: ${{ inputs.DOWNLOAD_FASTBOOT }}
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p radio

          IMAGE_ROOT="$ROM_DIR/extracted"

          mapfile -t RADIO_FILES < <(
            find "$IMAGE_ROOT" \
              -type f \
              \( \
                -name "dpm.img" \
                -o -name "gz.img" \
                -o -name "lk.img" \
                -o -name "mcupm.img" \
                -o -name "md1img.img" \
                -o -name "pi_img.img" \
                -o -name "scp.img" \
                -o -name "spmfw.img" \
                -o -name "sspm.img" \
                -o -name "tee.img" \
              \) \
              | sort
          )

          if [[ "${#RADIO_FILES[@]}" -eq 0 ]]; then
            echo "::error::No radio firmware images were found."
            exit 1
          fi

          for SRC in "${RADIO_FILES[@]}"; do
            BASENAME="$(basename "$SRC")"

            if [[ ! -f "radio/$BASENAME" ]]; then
              cp -v "$SRC" "radio/$BASENAME"
            fi
          done

          echo
          echo "===== RADIO DIRECTORY ====="

          find radio \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            | sort

      # ============================================================
      # 19. CREATE BOARD CONFIG RADIO ENTRIES
      # ============================================================
      - name: 🧩 Create radio BoardConfigVendor.mk
        if: ${{ inputs.DOWNLOAD_FASTBOOT }}
        shell: bash
        run: |
          set -euxo pipefail

          BOARD="$WORK_PARENT/vendor/xiaomi/spinel/BoardConfigVendor.mk"

          mkdir -p \
            "$WORK_PARENT/vendor/xiaomi/spinel"

          {
            echo
            echo "# ============================================================"
            echo "# Xiaomi spinel firmware partitions"
            echo "# ============================================================"

            echo "AB_OTA_PARTITIONS += \\"

            find "$GITHUB_WORKSPACE/radio" \
              -maxdepth 1 \
              -type f \
              -name '*.img' \
              -printf '%f\n' \
              | sed 's/\.img$//' \
              | sort \
              | awk '
                {
                  if (NR > 1) printf "    "
                  printf "%s", $0
                  if (!last) printf " \\\n"
                  last = 1
                }
              '

            echo
          } >> "$BOARD"

      # ============================================================
      # 20. FLATTEN GENERATED VENDOR TREE
      # ============================================================
      - name: 📦 Flatten vendor tree into repository root
        shell: bash
        run: |
          set -euxo pipefail

          GENERATED="$WORK_PARENT/vendor/xiaomi/spinel"

          test -d "$GENERATED"

          echo
          echo "===== GENERATED TREE BEFORE FLATTEN ====="

          find "$GENERATED" \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            | sort \
            | head -n 200

          # Preserve generated files from the actual vendor tree.
          rsync -a \
            --delete \
            "$GENERATED/" \
            "$GITHUB_WORKSPACE/vendor_generated/"

          # Copy generated vendor repository contents to repository root.
          rsync -a \
            "$GENERATED/" \
            "$GITHUB_WORKSPACE/"

          # Copy proprietary-files.txt from staging.
          cp \
            "$WORK_PARENT/device/xiaomi/spinel/proprietary-files.txt" \
            "$GITHUB_WORKSPACE/proprietary-files.txt"

          # Copy extraction scripts.
          cp \
            "$WORK_PARENT/device/xiaomi/spinel/extract-files.py" \
            "$GITHUB_WORKSPACE/extract-files.py"

          # Generate a small setup script matching the repository layout.
          cat > "$GITHUB_WORKSPACE/setup-makefiles.py" <<'PY'
          #!/usr/bin/env python3

          from pathlib import Path

          print("This vendor repository was generated using")
          print("LineageOS android_tools_extract-utils lineage-23.2.")
          print()
          print("The actual extraction script is extract-files.py.")
          print("The proprietary blob list is proprietary-files.txt.")
          print()
          print("Vendor tree root:", Path(__file__).resolve().parent)
          PY

          chmod +x "$GITHUB_WORKSPACE/extract-files.py"

          echo
          echo "===== REPOSITORY ROOT AFTER FLATTEN ====="

          find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            | sed "s#^$GITHUB_WORKSPACE/##" \
            | sort \
            | head -n 300

      # ============================================================
      # 21. REMOVE NESTED CONTAMINATION
      # ============================================================
      - name: 🧹 Remove nested vendor/device contamination
        shell: bash
        run: |
          set -euxo pipefail

          # These are build staging directories only.
          rm -rf \
            "$GITHUB_WORKSPACE/vendor_generated" \
            "$GITHUB_WORKSPACE/vendor" \
            "$GITHUB_WORKSPACE/device" \
            "$GITHUB_WORKSPACE/system" \
            "$GITHUB_WORKSPACE/system_ext" \
            "$GITHUB_WORKSPACE/product" \
            "$GITHUB_WORKSPACE/odm_dlkm" \
            "$GITHUB_WORKSPACE/vendor_dlkm" \
            "$GITHUB_WORKSPACE/mi_ext"

          # The generated vendor tree is expected to be flattened
          # directly into the repository root.
          test -f "$GITHUB_WORKSPACE/Android.bp"
          test -f "$GITHUB_WORKSPACE/Android.mk"
          test -f "$GITHUB_WORKSPACE/BoardConfigVendor.mk"
          test -f "$GITHUB_WORKSPACE/spinel-vendor.mk"
          test -f "$GITHUB_WORKSPACE/proprietary-files.txt"
          test -d "$GITHUB_WORKSPACE/proprietary"

          echo "Repository root layout is valid."

      # ============================================================
      # 22. VERIFY FINAL TREE
      # ============================================================
      - name: 🔍 Verify final vendor tree
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          echo
          echo "============================================================"
          echo " FINAL VENDOR TREE"
          echo "============================================================"

          find . \
            -maxdepth 3 \
            -type f \
            -not -path './.git/*' \
            | sort \
            | head -n 500

          echo
          echo "===== REQUIRED ROOT FILES ====="

          for file in \
            Android.bp \
            Android.mk \
            BoardConfigVendor.mk \
            spinel-vendor.mk \
            proprietary-files.txt \
            extract-files.py \
            setup-makefiles.py; do

            test -f "$file"
            echo "OK: $file"
          done

          echo
          echo "===== PROPRIETARY TREE ====="

          test -d proprietary

          find proprietary \
            -type f \
            | wc -l

          echo
          echo "===== CONTAMINATION CHECK ====="

          forbidden=0

          for dir in \
            vendor \
            device \
            system \
            system_ext \
            product \
            vendor_dlkm \
            odm_dlkm \
            mi_ext; do

            if [[ -e "$dir" ]]; then
              echo "::error::Forbidden nested directory exists: $dir"
              forbidden=1
            fi
          done

          if [[ "$forbidden" -ne 0 ]]; then
            exit 1
          fi

          echo "No nested Android source-tree contamination."

          echo
          echo "===== PROPRIETARY LIST CHECK ====="

          if grep -E \
            '^(system|system_ext|product|vendor_dlkm|odm_dlkm|mi_ext)/' \
            proprietary-files.txt; then

            echo "::error::Forbidden partition entry remains."
            exit 1
          fi

          echo "Partition list is clean."

          echo
          echo "===== VINTF CHECK ====="

          test -f \
            proprietary/odm/etc/vintf/manifest_nonfc_dsds.xml

          test -f \
            proprietary/odm/etc/vintf/manifest_nonfc_ss.xml

          echo "Manual ODM VINTF manifests present."

          echo
          echo "===== RADIO CHECK ====="

          if [[ -d radio ]]; then
            find radio \
              -maxdepth 1 \
              -type f \
              -printf '%f %s bytes\n' \
              | sort
          else
            echo "Radio directory not generated because FASTBOOT download was disabled."
          fi

          echo
          echo "===== FINAL SIZE ====="

          du -sh .

      # ============================================================
      # 23. CREATE BUILD REPORT
      # ============================================================
      - name: 📊 Generate final report
        shell: bash
        run: |
          set -euxo pipefail

          {
            echo "=============================================="
            echo "Xiaomi spinel Vendor Tree"
            echo "=============================================="
            echo
            echo "Device: $DEVICE"
            echo "Vendor: $VENDOR"
            echo "Android base: HyperOS 2 / Android 15"
            echo "Kernel source generation base: 5.10"
            echo
            echo "Stock dump:"
            echo "${{ inputs.STOCK_DUMP_URL }}"
            echo
            echo "Stock branch:"
            echo "${{ inputs.STOCK_DUMP_BRANCH }}"
            echo
            echo "Extract-utils:"
            echo "${{ inputs.EXTRACT_UTILS_URL }}"
            echo
            echo "Extract branch:"
            echo "${{ inputs.EXTRACT_UTILS_BRANCH }}"
            echo
            echo "Fastboot download:"
            echo "${{ inputs.DOWNLOAD_FASTBOOT }}"
            echo
            echo "----------------------------------------------"
            echo "Root files:"
            find . \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
            echo
            echo "Proprietary blob files:"
            find proprietary \
              -type f \
              | wc -l
            echo
            echo "Proprietary list entries:"
            grep -vE '^[[:space:]]*(#|$)' proprietary-files.txt | wc -l
            echo
            echo "Repository size:"
            du -sh .
          } > reports/final-report.txt

          cat reports/final-report.txt

      # ============================================================
      # 24. GIT STATUS
      # ============================================================
      - name: 📋 Git status
        shell: bash
        run: |
          set -euxo pipefail

          git status --short

          echo
          echo "Changed files:"
          git status --short | wc -l

      # ============================================================
      # 25. COMMIT
      # ============================================================
      - name: 💾 Commit generated vendor tree
        if: ${{ inputs.COMMIT_CHANGES }}
        shell: bash
        run: |
          set -euxo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "vendor: generate proprietary blobs for spinel"

      # ============================================================
      # 26. PUSH
      # ============================================================
      - name: 🚀 Push generated vendor tree
        if: ${{ inputs.COMMIT_CHANGES }}
        shell: bash
        run: |
          set -euxo pipefail

          git push origin HEAD:${GITHUB_REF_NAME}

      # ============================================================
      # 27. ARTIFACT
      # ============================================================
      - name: 📤 Upload vendor tree artifact
        if: ${{ inputs.UPLOAD_ARTIFACTS && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: proprietary_vendor_xiaomi_spinel
          path: |
            Android.bp
            Android.mk
            BoardConfigVendor.mk
            spinel-vendor.mk
            proprietary-files.txt
            extract-files.py
            setup-makefiles.py
            proprietary/
            radio/
            reports/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # ============================================================
      # 28. FAILURE ARTIFACT
      # ============================================================
      - name: 📤 Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: spinel-vendor-build-failure
          path: |
            reports/
            proprietary-files.txt
            proprietary-files.stock.txt
          if-no-files-found: ignore
          retention-days: 7

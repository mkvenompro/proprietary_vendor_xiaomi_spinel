name: بناء شجرة الـ vendor من ROM الـ stock لـ VPGMIXM

on:
  workflow_dispatch:
    inputs:
      stock_url:
        description: 'رابط تنزيل Fastboot ROM الـ stock لـ VPGMIXM (OS2.0.212.0.VPGMIXM)'
        required: true
        default: 'https://bigota.d.miui.com/OS2.0.212.0.VPGMIXM/spinel_global_images_OS2.0.212.0.VPGMIXM_20260311.0000.00_15.0_global_1e7d24d317.tgz'
      dump_sha:
        description: 'GitLab dump SHA (لـ proprietary-files.txt)'
        required: false
        default: '51a7d8118db68c9caca33756452bde31f61b9552'

env:
  DEVICE: spinel
  VENDOR: xiaomi

jobs:
  build-vendor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: إعداد البيئة والأدوات
        run: |
          sudo apt-get update
          sudo apt-get install -y curl tar git unzip jq llvm
          mkdir -p $GITHUB_WORKSPACE/root/device/xiaomi
          mkdir -p $GITHUB_WORKSPACE/root/tools
          df -h /

      - name: استنساخ ريبو الجهاز المحلي
        run: |
          cd $GITHUB_WORKSPACE/root/device/xiaomi
          git clone --depth 1 https://github.com/mkvenompro/android_device_xiaomi_spinel.git spinel
          cd spinel
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git checkout -B lineage-23.2

      - name: استنساخ kernel reference
        run: |
          cd $GITHUB_WORKSPACE/root/device/xiaomi
          git clone --depth 1 --branch lineage-23.2 https://github.com/mkvenompro/android_device_xiaomi_spinel-kernel.git spinel-kernel

      - name: استنساخ extract-utils
        run: |
          cd $GITHUB_WORKSPACE/root/tools
          git clone --depth 1 --branch lineage-22.2 https://github.com/LineageOS/android_tools_extract-utils.git extract-utils

      - name: Download ROM الـ stock Fastboot واستخراج أقساط البوتلودر
        run: |
          ROOT=$GITHUB_WORKSPACE/root
          STOCK_URL="${{ github.event.inputs.stock_url }}"
          
          mkdir -p $ROOT/stock
          cd $ROOT/stock
          echo ">>> تنزيل ROM الـ stock..."
          curl -L --fail --retry 3 "$STOCK_URL" -o stock_rom.tgz
          
          echo ">>> استخراج ROM الـ stock..."
          tar -xzf stock_rom.tgz
          
          IMAGES_DIR=$(find "$ROOT/stock" -type d -name "images" | head -n1)
          if [ -z "$IMAGES_DIR" ]; then
            IMAGES_DIR=$(find "$ROOT/stock" -type d -name "spinel_*" | head -n1)/images
          fi
          echo ">>> Images directory: $IMAGES_DIR"
          
          mkdir -p $ROOT/vendor-bootloader
          
          find "$IMAGES_DIR" -type f \( -name "*.img" -o -name "*preloader*.bin" \) | while read f; do
            base=$(basename "$f")
            echo "معالجة $base"
            case "$base" in
              lk_fenrir.img|lk*.img) cp "$f" $ROOT/vendor-bootloader/lk.img ;;
              preloader_spinel.bin|preloader_*.bin) cp "$f" $ROOT/vendor-bootloader/preloader_raw.img ;;
              *) cp "$f" $ROOT/vendor-bootloader/ ;;
            esac
          done
          
          echo ">>> أقساط البوتلودر المستخرجة:"
          ls -la $ROOT/vendor-bootloader/

      - name: استخراج الـ blobs من GitLab dump
        run: |
          ROOT=$GITHUB_WORKSPACE/root
          DUMP_SHA="${{ github.event.inputs.dump_sha }}"
          
          mkdir -p $ROOT/dump
          echo ">>> تنزيل GitLab dump لـ commit: $DUMP_SHA"
          curl -L --retry 3 --fail "https://gitlab.com/api/v4/projects/mkpromvp%2Fdumber-2-mk/repository/archive.tar.gz?sha=$DUMP_SHA" |
            tar -xz --strip-components=1 -C $ROOT/dump
          
          cd $ROOT/device/xiaomi/spinel
          export PYTHONPATH=$ROOT/tools/extract-utils:$PYTHONPATH
          ./extract-files.py $ROOT/dump

      - name: دمج ملفات البوتلودر المستخرجة
        run: |
          ROOT=$GITHUB_WORKSPACE/root
          cd $ROOT/device/xiaomi/spinel
          
          echo ">>> استخراج ملفات البوتلودر من الـ stock Fastboot..."
          
          cat << 'PYEOF' > generate_radio_mk.py
          #!/usr/bin/env python3
          import hashlib
          import os
          
          VENDOR_BOOTLOADER = os.environ.get("ROOT", "") + "/vendor-bootloader"
          RADIO_DIR = "vendor/xiaomi/spinel/radio"
          
          os.makedirs(RADIO_DIR, exist_ok=True)
          
          firmware_files = {
              "lk": "lk.img",
              "scp": "scp.img",
              "spmfw": "spmfw.img",
              "sspm": "sspm.img",
              "preloader_raw": "preloader_raw.img",
              "tee": "tee.img",
              "dpm": "dpm.img",
              "mcupm": "mcupm.img",
              "gz": "gz.img",
          }
          
          entries = []
          for fw_key, fw_file in firmware_files.items():
              src_path = os.path.join(VENDOR_BOOTLOADER, fw_file)
              if os.path.exists(src_path):
                  dest_path = os.path.join(RADIO_DIR, fw_file)
                  with open(src_path, "rb") as src_f:
                      content = src_f.read()
                  with open(dest_path, "wb") as dest_f:
                      dest_f.write(content)
                  sha1 = hashlib.sha1(content).hexdigest()
                  entries.append(f"$(call add-radio-file-sha1-checked,{fw_file},{sha1})")
                  print(f"تم دمج {fw_file} ({sha1})")
              else:
                  print(f"تحذير: {fw_file} غير موجود في vendor-bootloader")
          
          with open(os.path.join(RADIO_DIR, "Android.mk"), "w") as f:
              f.write("# تلقائيًا تم إنشاؤه بواسطة CI. لا تقم بالتعديل.\n\n")
              for entry in entries:
                  f.write(entry + "\n")
          
          print(">>> تم إنشاء Android.mk للـ radio:")
          with open(os.path.join(RADIO_DIR, "Android.mk"), "r") as f:
              print(f.read())
          PYEOF
          ROOT="$ROOT" python3 generate_radio_mk.py

      - name: صياغة vendor tree
        run: |
          ROOT=$GITHUB_WORKSPACE/root
          cd $ROOT/device/xiaomi/spinel
          echo ">>> هيكل vendor tree:"
          find vendor/xiaomi/spinel -maxdepth 2 -type d
          ls -la vendor/xiaomi/spinel/radio/ 2>/dev/null

      - name: Commit والنشر إلى reopository vendor
        run: |
          ROOT=$GITHUB_WORKSPACE/root
          cd $ROOT/device/xiaomi/spinel
          git add vendor/
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          git commit -m "بناء الـ vendor من ROM الـ stock لـ VPGMIXM (OS2.0.212.0) - $TIMESTAMP"
          git remote add vendor https://github.com/mkvenompro/proprietary_vendor_xiaomi_spinel.git
          git push vendor lineage-23.2
          echo "تم النشر إلى: https://github.com/mkvenompro/proprietary_vendor_xiaomi_spinel/tree/lineage-23.2"

#
# Populates this (vendor/xiaomi/spinel) repo by running extract-files.py
# from the device tree repo against the dump on GitLab, then commits and
# pushes whatever it generates (proprietary blobs, Android.bp,
# spinel-vendor.mk, BoardConfigVendor.mk...) straight into this repo.
#
# Put this file at: .github/workflows/extract-vendor.yml  (in the VENDOR repo)
#
# No secrets needed for the dump — it's a public GitLab repo.
# GITHUB_TOKEN (default, automatic) is used to push back into this same
# vendor repo.
#

name: Extract vendor tree from dump

on:
  workflow_dispatch:
    inputs:
      dump_repo:
        description: "GitLab dump repo (owner/name)"
        required: true
        default: "mkpromvp/dumber-2-mk"
      dump_branch:
        description: "Branch on the dump repo to extract from"
        required: true
        default: "dump-redmi-spinel-os2.0.212.0.vpgmixm"
      device_tree_repo:
        description: "GitHub device tree repo (owner/name) — source of extract-files.py"
        required: true
        default: "mkvenompro/android_device_xiaomi_spinel"
      device_tree_ref:
        description: "Branch/tag/ref of the device tree repo"
        required: true
        default: "lineage=23.2"
      extract_utils_ref:
        description: "Branch/tag/ref of LineageOS/android_tools_extract-utils"
        required: true
        default: "lineage-23.2"
      commit_message:
        description: "Commit message for the generated vendor tree"
        required: true
        default: "spinel: initial extract from OS2.0.212.0.VPGMIXM dump"
      stock_rom_url:
        description: "(Optional) Direct download link to the stock fastboot ROM archive — adds preloader/lk/tee/modem/etc. Leave empty to skip."
        required: false
        default: ""

jobs:
  extract-vendor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout vendor repo (this repo)
        uses: actions/checkout@v4
        with:
          path: vendor/xiaomi/spinel
          fetch-depth: 0

      - name: Checkout device tree repo (for extract-files.py)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.device_tree_repo }}
          ref: ${{ github.event.inputs.device_tree_ref }}
          path: device/xiaomi/spinel

      - name: Checkout extract_utils (extract-files.py's python module)
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_tools_extract-utils
          ref: ${{ github.event.inputs.extract_utils_ref }}
          path: tools/extract-utils

      - name: Checkout extract-tools prebuilts (sdat2img, payload dumper, etc.)
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_prebuilts_extract-tools
          path: prebuilts/extract-tools
          continue-on-error: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs python3 python3-pip patchelf
          pip3 install --break-system-packages pyyaml requests
          if [ -f tools/extract-utils/requirements.txt ]; then
            pip3 install --break-system-packages -r tools/extract-utils/requirements.txt
          fi

      - name: Clone the dump from GitLab
        run: |
          set -e
          git clone --depth 1 \
            --branch "${{ github.event.inputs.dump_branch }}" \
            "https://gitlab.com/${{ github.event.inputs.dump_repo }}.git" \
            /tmp/dump

          echo "Dump files: $(find /tmp/dump -type f | wc -l)"

      - name: Download and extract the stock ROM (optional)
        if: ${{ github.event.inputs.stock_rom_url != '' }}
        run: |
          set -e
          sudo apt-get install -y p7zip-full unzip
          mkdir -p /tmp/stock_raw /tmp/stock_extracted

          echo "Downloading stock ROM..."
          curl -L --fail -o /tmp/stock.dl "${{ github.event.inputs.stock_rom_url }}"
          echo "Downloaded: $(du -h /tmp/stock.dl | cut -f1)"

          # Auto-detect the real file type regardless of extension/URL shape.
          FTYPE="$(file -b --mime-type /tmp/stock.dl)"
          echo "Detected type: $FTYPE"

          cd /tmp/stock_raw
          case "$FTYPE" in
            application/gzip|application/x-gzip)
              # Could be a plain .gz of a single file, or a .tar.gz — try tar first.
              if tar tzf /tmp/stock.dl >/dev/null 2>&1; then
                tar xzf /tmp/stock.dl
              else
                gzip -dc /tmp/stock.dl > stock_out.bin
              fi
              ;;
            application/x-tar)
              tar xf /tmp/stock.dl
              ;;
            application/zip)
              unzip -q /tmp/stock.dl
              ;;
            application/x-7z-compressed)
              7z x /tmp/stock.dl
              ;;
            *)
              echo "Unrecognized archive type ($FTYPE) — trying 7z as a universal fallback..."
              7z x /tmp/stock.dl || {
                echo "ERROR: could not extract the stock ROM automatically."
                echo "Downloaded file kept at /tmp/stock.dl for manual inspection."
                exit 1
              }
              ;;
          esac

          # If what we got is itself a zip/tar/7z (nested archive), one more pass.
          find /tmp/stock_raw -maxdepth 2 -iname "*.zip" -exec sh -c 'cd "$(dirname "$1")" && unzip -q -o "$1"' _ {} \;
          find /tmp/stock_raw -maxdepth 2 -iname "*.tar*" -exec sh -c 'cd "$(dirname "$1")" && tar xf "$1"' _ {} \;
          find /tmp/stock_raw -maxdepth 2 -iname "*.7z" -exec sh -c 'cd "$(dirname "$1")" && 7z x -y "$1"' _ {} \;

          find /tmp/stock_raw -type f > /tmp/stock_raw_files.txt
          echo "Stock ROM files after extraction: $(wc -l < /tmp/stock_raw_files.txt)"
          echo "--- sample ---"
          head -30 /tmp/stock_raw_files.txt

      - name: Merge stock firmware partitions into the dump
        if: ${{ github.event.inputs.stock_rom_url != '' }}
        run: |
          set -e
          # Only pull the raw firmware partitions the dump doesn't already have
          # (preloader/lk/tee/modem/etc.) — we don't want to overwrite the
          # already-extracted system/vendor/product from the dump.
          FW_NAMES="preloader lk tee scp sspm mcupm spmfw gz dpm pi_img md1img md1dsp"
          COPIED=0
          for name in $FW_NAMES; do
            match=$(find /tmp/stock_raw -type f -iname "${name}*.img" -o -iname "${name}*.bin" 2>/dev/null | head -1)
            if [ -n "$match" ]; then
              cp "$match" "/tmp/dump/$(basename "$match")"
              echo "Added firmware file: $(basename "$match")"
              COPIED=$((COPIED + 1))
            fi
          done
          echo "Firmware files merged into dump: $COPIED"
          if [ "$COPIED" -eq 0 ]; then
            echo "WARNING: none of the expected firmware partition names were found in the stock ROM archive."
            echo "Check the uploaded 'stock-rom-filelist' artifact to see what's actually in there."
          fi

      - name: Upload stock ROM file listing (for debugging)
        if: ${{ github.event.inputs.stock_rom_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: stock-rom-filelist
          path: /tmp/stock_raw_files.txt
          retention-days: 7

      - name: Run extract-files.py
        run: |
          set -e
          cd device/xiaomi/spinel
          chmod +x extract-files.py
          export PYTHONPATH="$GITHUB_WORKSPACE/tools/extract-utils"
          python3 extract-files.py /tmp/dump

      - name: Show what changed
        working-directory: vendor/xiaomi/spinel
        run: |
          git status --porcelain | head -50
          echo "Total changed/new files: $(git status --porcelain | wc -l)"

      - name: Commit and push to this vendor repo
        working-directory: vendor/xiaomi/spinel
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit — extract-files.py produced no changes."
            exit 0
          fi

          git add -A
          git commit -m "${{ github.event.inputs.commit_message }}"
          git push origin HEAD

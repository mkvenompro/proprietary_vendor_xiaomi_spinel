name: بناء شجرة الـ vendor من ROM الـ stock لـ VPGMIXM

on:
  workflow_dispatch:
    inputs:
      stock_url:
        description: 'رابط تنزيل Fastboot ROM الـ stock لـ VPGMIXM (OS2.0.212.0.VPGMIXM)'
        required: true
        default: 'https://bigota.d.miui.com/OS2.0.212.0.VPGMIXM/spinel_global_images_OS2.0.212.0.VPGMIXM_20260311.0000.00_15.0_global_1e7d24d317.tgz'
      dump_sha:
        description: 'GitLab dump SHA (لـ proprietary-files.txt)'
        required: false
        default: '51a7d8118db68c9caca33756452bde31f61b9552'

env:
  DEVICE: spinel
  VENDOR: xiaomi
  KERNEL_BRANCH: lineage-23.2
  KERNEL_REPO: mkvenompro/android_device_xiaomi_spinel-kernel

jobs:
  build-vendor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: إعداد البيئة
        run: |
          sudo apt-get update && sudo apt-get install -y curl tar git unzip jq coreutils
          df -h /
          free -h

      - name: استنساخ ريبو الجهاز المحلي
        run: |
          git clone --depth 1 https://github.com/mkvenompro/android_device_xiaomi_spinel.git $GITHUB_WORKSPACE/android_device_xiaomi_spinel
          cd $GITHUB_WORKSPACE/android_device_xiaomi_spinel
          git config user.email "action@github.com"
          git config user.name "GitHub Action"

      - name: استنساخ extract-utils
        run: |
          mkdir -p $GITHUB_WORKSPACE/tools
          git clone --depth 1 --branch lineage-22.2 https://github.com/LineageOS/android_tools_extract-utils.git $GITHUB_WORKSPACE/tools/extract-utils
          export PYTHONPATH="$GITHUB_WORKSPACE/tools/extract-utils:$PYTHONPATH"

      - name: Download ROM الـ stock Fastboot واستخراج أقساط الـ bootloader
        run: |
          WORKSPACE="$GITHUB_WORKSPACE"
          STOCK_URL="${{ github.event.inputs.stock_url }}"
          
          mkdir -p "$WORKSPACE/stock"
          cd "$WORKSPACE/stock"
          echo "تنزيل ROM الـ stock: $(basename $STOCK_URL)"
          curl -L --fail --retry 3 "$STOCK_URL" -o stock_rom.tgz
          
          echo "استخراج ROM الـ stock..."
          tar -xzf stock_rom.tgz
          
          # تحديد موقع ROM
          STOCK_DIR=$(find "$WORKSPACE/stock" -maxdepth 1 -type d -name "spinel_global_images*" | head -n1)
          echo "ROM directory: $STOCK_DIR"
          
          mkdir -p "$WORKSPACE/vendor-bootloader"
          
          # استخراج جميع أقساط الـ bootloader المطلوبة
          for f in "$STOCK_DIR"/images/*.img "$STOCK_DIR"/images/*_fenrir.img "$STOCK_DIR"/images/*preloader*.bin "$STOCK_DIR"/*.img "$STOCK_DIR"/*_fenrir.img "$STOCK_DIR"/*preloader*.bin; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            echo "معالجة $base"
            
            # تطبيق الاسم القياسي من proprietary-firmware.txt
            case "$base" in
              lk_fenrir.img)
                mv "$f" "$WORKSPACE/vendor-bootloader/lk.img"
                ;;
              preloader_spinel.bin)
                mv "$f" "$WORKSPACE/vendor-bootloader/preloader_raw.img"
                ;;
              *)
                mv "$f" "$WORKSPACE/vendor-bootloader/$base"
                ;;
            esac
          done
          
          echo "قائمة أقساط الـ bootloader المستخرجة:"
          ls -la "$WORKSPACE/vendor-bootloader/"

      - name: استخراج الـ blobs من GitLab dump
        run: |
          WORKSPACE="$GITHUB_WORKSPACE"
          DUMP_SHA="${{ github.event.inputs.dump_sha }}"
          
          mkdir -p "$WORKSPACE/dump"
          echo "تنزيل GitLab dump لـ commit: $DUMP_SHA"
          curl -L --retry 3 --fail "https://gitlab.com/api/v4/projects/mkpromvp%2Fdumber-2-mk/repository/archive.tar.gz?sha=$DUMP_SHA" |
            tar -xz --strip-components=1 -C "$WORKSPACE/dump"
          
          echo "محتويات dump:"
          ls -la "$WORKSPACE/dump"
          
          # تشغيل extract-files.py مع تعطيل استخراج الـ firmware (لأننا استخرجناه من ROM الـ stock)
          cd "$WORKSPACE/android_device_xiaomi_spinel"
          sed -i 's/add_firmware_proprietary_file=True,/add_firmware_proprietary_file=False,/' extract-files.py
          ./extract-files.py "$WORKSPACE/dump"

      - name: دمج ملفات الـ bootloader المستخرجة من ROM الـ stock
        run: |
          WORKSPACE="$GITHUB_WORKSPACE"
          DEVICE="$DEVICE"
          VENDOR="$VENDOR"
          cd "$WORKSPACE/android_device_xiaomi_spinel"
          
          # استخراج أسماء ملفات الـ SHA1 والـ firmware من proprietary-firmware.txt (من الدالف)
          declare -A fw_shas
          while read -r line; do
            [[ "$line" =~ ^#.*$ ]] && continue
            [[ -z "$line" ]] && continue
            
            # التنسيق: filename;AB أو filename:altname;AB أو filename|sha أو filename:altname|sha
            filename=$(echo "$line" | sed -E 's/.*[;:]([^|;:]+)([;|].*)/\1/' | xargs 2>/dev/null)
            sha=$(echo "$line" | sed -E 's/([0-9a-fA-F]{40}).*/\1/' | xargs 2>/dev/null)
            
            # استخراج الاسم الأساسي قبل الـ : إذا وجد
            if [[ "$line" == *:* ]]; then
              filename=$(echo "$line" | cut -d: -f1 | cut -d; -f1 | xargs 2>/dev/null)
            fi
            
            if [[ -n "$filename" ]]; then
              # إذا لم يتم العثور على sha، جرّب من dump
              if [[ -z "$sha" && -f "$WORKSPACE/dump/proprietary-files.txt" ]]; then
                sha=$(grep "$filename" "$WORKSPACE/dump/proprietary-files.txt" | grep -E '^[0-9a-fA-F]{40}' | head -n1 | xargs 2>/dev/null)
              fi
              fw_shas["$filename"]="$sha"
            fi
          done < "proprietary-firmware.txt"
          
          echo "أقساط الـ firmware المعروفة:"
          for k in "${!fw_shas[@]}"; do echo "  $k -> ${fw_shas[$k]}"; done
          
          # دمج كل قس ط في vendor/$VENDOR/radio/ مع الـ SHA1 الصحيح
          mkdir -p "vendor/$VENDOR/radio"
          
          for fname in "${!fw_shas[@]}"; do
            sha="${fw_shas[$fname]}"
            src_path="$WORKSPACE/vendor-bootloader/$fname"
            
            if [[ -f "$src_path" ]]; then
              actual_sha=$(sha1sum "$src_path" | awk '{print $1}')
              if [[ -z "$sha" ]] || [[ "$actual_sha" == "$sha" ]]; then
                echo "دمج $fname (SHA1: $(echo "$sha" | cut -c1-8)...)"
                cp "$src_path" "vendor/$VENDOR/radio/"
              else
                echo "تحذير: SHA1 غير متطابق لـ $fname"
                echo "المتوقع: $sha"
                echo "الفعلي:   $actual_sha"
              fi
            else
              echo "تحذير: $fname غير موجود"
            fi
          done
          
          # إنشاء Android.mk للـ radio
          cat > "vendor/$VENDOR/radio/Android.mk" <<'EOF'
# تلقائيًا تم إنشاؤه بواسطة CI. لا تقم بالتعديل.

EOF
          for fname in "${!fw_shas[@]}"; do
            sha="${fw_shas[$fname]}"
            if [[ -n "$sha" ]]; then
              echo "\$(call add-radio-file-sha1-checked,$fname,$sha)" >> "vendor/$VENDOR/radio/Android.mk"
            else
              echo "\$(call add-radio-file,$fname)" >> "vendor/$VENDOR/radio/Android.mk"
            fi
          done

      - name: إنشاء BoardConfigVendor.mk
        run: |
          DEVICE="$DEVICE"
          VENDOR="$VENDOR"
          cd "$WORKSPACE/android_device_xiaomi_spinel"
          
          cat > "device/$DEVICE/BoardConfigVendor.mk" <<EOF
#
# تلقائيًا تم إنشاؤه بواسطة CI. لا تقم بالتعديل.
#

AB_OTA_PARTITIONS += \\
    dpm \\
    gz \\
    lk \\
    mcupm \\
    md1img \\
    pi_img \\
    preloader_raw \\
    scp \\
    spmfw \\
    sspm \\
    tee
EOF

      - name: دمج tanzanite-vendor.mk (هيكل vendor tree القياسي)
        run: |
          DEVICE="$DEVICE"
          VENDOR="$VENDOR"
          cd "$WORKSPACE/android_device_xiaomi_spinel"
          
          mkdir -p "vendor/$VENDOR"
          
          # التأكد من وجود Android.mk في vendor/$VENDOR/radio
          if [[ ! -f "vendor/$VENDOR/radio/Android.mk" ]]; then
            echo "# تلقائيًا تم إنشاؤه بواسطة CI. لا تقم بالتعديل." > "vendor/$VENDOR/radio/Android.mk"
          fi
          
          # دمج tanzanite-vendor.mk
          cat > "vendor/$VENDOR/tanzanite-vendor.mk" <<'EOF'
#
# تلقائيًا تم إنشاؤه بواسطة CI. لا تقم بالتعديل.
#

PRODUCT_SOONG_NAMESPACES += \\
    vendor/xiaomi/spinel

PRODUCT_COPY_FILES += \\
EOF
          
          if [[ -f "proprietary-files.txt" ]]; then
            grep -v '^#' proprietary-files.txt | while read -r line; do
              [[ -z "$line" ]] && continue
              src_path="vendor/$VENDOR/${line#vendor/xiaomi/spinel/}"
              dst_path="\$${TARGET_COPY_OUT_VENDOR}etc/${line#vendor/xiaomi/spinel/}"
              echo "    $src_path:\$${dst_path}" >> "vendor/$VENDOR/tanzanite-vendor.mk"
            done
          fi
          
          cat >> "vendor/$VENDOR/tanzanite-vendor.mk" <<'EOF'

EOF

      - name: إعداد .gitattributes لأقساط الـ LFS
        run: |
          DEVICE="$DEVICE"
          VENDOR="$VENDOR"
          cd "$WORKSPACE/android_device_xiaomi_spinel"
          
          cat > .gitattributes <<'EOF'
radio/* filter=lfs diff=lfs merge=lfs -text
EOF

      - name: Commit والنشر إلى reopository vendor
        run: |
          DEVICE="$DEVICE"
          VENDOR="$VENDOR"
          cd "$WORKSPACE/android_device_xiaomi_spinel"
          
          git add .
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          git commit -m "بناء الـ vendor من ROM الـ stock لـ VPGMIXM (OS2.0.212.0)

- أقساط الـ bootloader المستخرجة من ROM الـ stock Fastboot (lk.img، preloader_raw.img، scp.img، spmfw.img، sspm.img، mcupm.img، pi_img.img، dpm.img، gz.img)
- دمج الـ blobs من GitLab dump ($DUMP_SHA) في vendor/$VENDOR/proprietary/
- إنشاء BoardConfigVendor.mk و tanzanite-vendor.mk
- الطابع الزمني: $TIMESTAMP

Co-authored-by: openhands <openhands@all-hands.dev>"
          
          git remote add vendor https://github.com/mkvenompro/proprietary_vendor_xiaomi_spinel.git
          git push vendor lineage=23.2
          
          echo "✅ تم الانتهاء! الناتج موجود في: https://github.com/mkvenompro/proprietary_vendor_xiaomi_spinel/tree/lineage-23.2"
